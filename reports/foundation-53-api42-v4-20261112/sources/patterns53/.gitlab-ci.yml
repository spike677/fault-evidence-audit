# GitCode / GitLab CI
#
# 为什么现在才有 CI（v6.19 引入）：C1–C50 一直在，但**没有任何机制保证它被跑**。实测过的后果——
# 31 个「真实锚」里 11 个不可信（10 个跨仓错用 sha、1 个指向不存在的文件，见 CHANGELOG v6.19），
# 而门禁全绿。门禁不跑，等于没有门禁。
#
# 分工：
#   gates     —— 纯静态门禁，不依赖算子仓，**必须全绿才能合**
#   anchors   —— 需要四个算子仓；CI 里默认不克隆，故设为 allow_failure，
#                本地或专用 runner 上加 --strict-repos 才阻断
#   评测自检（评测集结构 + 判分器自检，不调模型、秒级）—— 无独立 stage，在 gate:all 里
#
# 注意：本仓是知识库而非产品代码，没有编译产物；所有检查都是 Python 脚本。

stages:
  - gates
  - anchors

default:
  image: python:3.11-slim
  before_script:
    - python --version
    - git --version
    # 阻塞项里只有数据流自检需要第三方包（tree-sitter / tree-sitter-cpp），
    # 不装的话 `gate:all` 必红（22/23、退出码 1）。清单见 requirements-ci.txt。
    - python -m pip install --no-cache-dir -r requirements-ci.txt

# ---------------------------------------------------------------- 全量门禁
gate:all:
  stage: gates
  script:
    - python scripts/ci_gate.py --blocking-only
  # 门禁失败时把摘要打出来（ci_gate 自己已逐项打印，这里再兜一次 exit code）
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - "*.json"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------- 锚点存活率
# 需要算子仓在同级目录。CI 默认无仓 → check_anchors 全 SKIP → exit 0（不阻断）。
# 想在 CI 里强制，配置 ASCEND_OPS_REPOS 变量指向已挂载目录，并把 allow_failure 去掉
# 且改用 --strict-repos。
anchor:survival:
  stage: anchors
  script:
    - |
      if [ -n "${ASCEND_OPS_REPOS:-}" ]; then
        echo "[CI] 使用算子仓目录：$ASCEND_OPS_REPOS"
        python scripts/check_anchors.py --repos "$ASCEND_OPS_REPOS" --require-all
      else
        echo "[CI] 未提供 ASCEND_OPS_REPOS —— 锚点检查跳过（本地请务必跑一次）"
        python scripts/check_anchors.py || true
      fi
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'

# ---------------------------------------------------------------- 变异测试（可选）
# 同样依赖算子仓；有仓时跑一个小样本，把 kill rate 打出来作为观测指标。
# 刻意不做成阻断：kill rate 是「能力度量」，不是「本次改动是否合规」。
mutation:sample:
  stage: anchors
  script:
    - |
      if [ -n "${ASCEND_OPS_REPOS:-}" ]; then
        python scripts/mutate_ops.py --run --repos "$ASCEND_OPS_REPOS" --sample 8
      else
        echo "[CI] 未提供 ASCEND_OPS_REPOS —— 变异测试跳过"
        python scripts/mutate_ops.py --self-test
      fi
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
