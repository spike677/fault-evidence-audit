<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>昇腾算子故障模式库 · v6.63</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --panel-2:#fbfcfd;
  --ink:#15181e; --ink-2:#4b525d; --ink-3:#828a96; --ink-4:#a8aeb8;
  --line:#e4e7ec; --line-2:#eef0f3; --line-3:#f4f6f8;
  --accent:#c7000b; --accent-2:#a3000a; --accent-soft:#fdf1f1;
  --side:#101319; --side-2:#171b23; --side-line:#252b35; --side-ink:#e8ebf0; --side-ink-2:#8e97a5;
  --hi:#c7000b; --mid:#b45309; --lo:#52708a;
  --mono:ui-monospace,"Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --sh:0 1px 2px rgba(16,19,25,.05),0 1px 3px rgba(16,19,25,.04);
  --sh-2:0 4px 12px rgba(16,19,25,.07),0 1px 3px rgba(16,19,25,.05);
  --sh-3:0 12px 40px rgba(16,19,25,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums;
}
::selection{background:#ffd9d9;color:#5a0004}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
.side{
  background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;border-right:1px solid #000;
}
.brand{padding:22px 20px 18px;border-bottom:1px solid var(--side-line)}
.brand-top{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.chip-logo{
  width:26px;height:26px;border-radius:6px;background:linear-gradient(145deg,#e00b16,#8d0009);
  display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;letter-spacing:-.5px;
  box-shadow:0 2px 8px rgba(199,0,11,.45);flex:none;
}
.brand h1{font-size:13.5px;font-weight:650;letter-spacing:.2px;line-height:1.35}
.brand .ver{
  display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:10.5px;
  font-family:var(--mono);color:var(--side-ink-2);letter-spacing:.3px;
  border:1px solid var(--side-line);border-radius:4px;padding:2px 7px;background:#0b0e13;
}
.brand .ver b{color:#7dd3a0;font-weight:600}
.nav{padding:14px 10px;flex:1;overflow:auto}
.nav-group{font-size:10px;letter-spacing:1.3px;color:#5b6473;font-weight:600;
  padding:12px 10px 6px;text-transform:uppercase}
.nav a{
  display:flex;align-items:center;gap:9px;padding:7.5px 10px;border-radius:6px;
  font-size:13px;color:#b9c0cb;transition:.13s;margin-bottom:1px;position:relative;
}
.nav a:hover{background:var(--side-2);color:#fff}
.nav a.on{background:#1e2530;color:#fff;font-weight:550}
.nav a.on::before{
  content:"";position:absolute;left:-10px;top:50%;transform:translateY(-50%);
  width:2px;height:16px;background:var(--accent);border-radius:0 2px 2px 0;
}
.nav a .ico{width:15px;text-align:center;opacity:.75;font-size:12.5px;flex:none}
.nav a .cnt{
  margin-left:auto;font-family:var(--mono);font-size:10px;color:#6b7484;
  background:#0b0e13;border:1px solid var(--side-line);padding:0 5px;border-radius:3px;
}
.nav a.on .cnt{color:#a8b3c4;border-color:#333c4a}
.side-foot{padding:12px 16px;border-top:1px solid var(--side-line);font-size:10.5px;color:#5b6473;line-height:1.7}
.side-foot .row{display:flex;justify-content:space-between;gap:6px}
.side-foot b{color:#8e97a5;font-family:var(--mono);font-weight:500}
.dot-ok{display:inline-block;width:5px;height:5px;border-radius:50%;background:#3fb950;margin-right:4px;
  box-shadow:0 0 6px #3fb95090;vertical-align:middle}

/* ---------- main ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.top{
  position:sticky;top:0;z-index:40;background:rgba(246,247,249,.86);backdrop-filter:blur(12px) saturate(1.6);
  border-bottom:1px solid var(--line);padding:0 30px;height:56px;display:flex;align-items:center;gap:16px;
}
.crumb{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px;flex:none}
.crumb b{color:var(--ink);font-weight:600}
.crumb span{color:#c8ccd3}
.search{
  margin-left:auto;position:relative;width:300px;flex:none;
}
.search input{
  width:100%;height:33px;border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:0 30px 0 31px;font-size:12.5px;color:var(--ink);outline:none;transition:.15s;
}
.search input::placeholder{color:var(--ink-4)}
.search input:focus{border-color:#c7ccd4;box-shadow:0 0 0 3px rgba(16,19,25,.045)}
.search .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink-4)}
.search .kbd{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--mono);
  font-size:9.5px;color:var(--ink-4);border:1px solid var(--line);border-radius:3px;
  padding:1px 4px;background:var(--panel-2);pointer-events:none;
}
.wrap{padding:26px 30px 70px;max-width:1480px;width:100%}
.view{display:none}
.view.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- headings ---------- */
.ptitle{display:flex;align-items:baseline;gap:11px;margin-bottom:5px}
.ptitle h2{font-size:21px;font-weight:650;letter-spacing:-.3px}
.ptitle .tag{
  font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);
  padding:1.5px 6px;border-radius:4px;background:#fff;
}
.pdesc{color:var(--ink-2);font-size:13px;max-width:900px;margin-bottom:22px}
.pdesc b{color:var(--ink);font-weight:600}
.sec-h{display:flex;align-items:center;gap:10px;margin:30px 0 13px}
.sec-h h3{font-size:14px;font-weight:640;letter-spacing:-.1px}
.sec-h .line{flex:1;height:1px;background:var(--line)}
.sec-h .note{font-size:11.5px;color:var(--ink-3);font-weight:400}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:8px}
.kpi{background:#fff;padding:15px 16px 14px;position:relative}
.kpi .k{font-size:11px;color:var(--ink-3);letter-spacing:.3px;margin-bottom:7px}
.kpi .v{font-size:26px;font-weight:660;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0;margin-left:3px}
.kpi .s{font-size:11px;color:var(--ink-3);margin-top:7px}
.kpi .s b{color:var(--ink-2);font-weight:600}
.kpi.acc{background:linear-gradient(180deg,#fff,#fffafa)}

/* ---------- matrix ---------- */
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:9px}
.card-h h4{font-size:12.5px;font-weight:640}
.card-h .hint{margin-left:auto;font-size:11px;color:var(--ink-3)}
.card-b{padding:15px 16px}
.mx{display:grid;grid-template-columns:44px repeat(3,1fr);gap:5px;align-items:stretch}
.mx .hd{font-size:10.5px;color:var(--ink-3);text-align:center;padding-bottom:2px;font-family:var(--mono)}
.mx .rl{font-size:10.5px;color:var(--ink-3);font-family:var(--mono);display:flex;align-items:center;justify-content:center}
.cell{
  border-radius:6px;padding:7px 8px;min-height:56px;border:1px solid transparent;
  display:flex;flex-direction:column;gap:4px;transition:.14s;cursor:pointer;
}
.cell:hover{transform:translateY(-1px);box-shadow:var(--sh-2);border-color:rgba(0,0,0,.08)}
.cell .n{font-size:15px;font-weight:660;line-height:1;font-variant-numeric:tabular-nums}
.cell .ids{font-family:var(--mono);font-size:8.5px;line-height:1.45;color:rgba(0,0,0,.5);
  letter-spacing:-.2px;word-break:break-all}
.cell.hi{background:#fbeaea;color:#8f0009}
.cell.hi .ids{color:#b9777b}
.cell.mid{background:#fdf6e8;color:#8a5200}
.cell.mid .ids{color:#c3a173}
.cell.lo{background:#eff3f7;color:#3d556d}
.cell.lo .ids{color:#8fa1b3}
.cell.z{background:#fafbfc;color:#c9ced6}
.cell.z .n{font-size:12px;font-weight:500}

/* ---------- bars ---------- */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:70px 1fr 62px;align-items:center;gap:10px;cursor:pointer}
.bar .lb{font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.bar .lb i{width:6px;height:6px;border-radius:2px;flex:none}
.bar .tr{height:18px;background:var(--line-3);border-radius:4px;overflow:hidden;position:relative}
.bar .fi{height:100%;border-radius:4px;transition:width .5s cubic-bezier(.2,.7,.3,1);min-width:3px}
.bar .vl{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);text-align:right}
.bar .vl b{color:var(--ink);font-weight:600}
.bar:hover .lb{color:var(--ink);font-weight:550}

/* ---------- filter bar ---------- */
.fbar{
  background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
  display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;box-shadow:var(--sh);
}
.fgrp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.fgrp>span{font-size:11px;color:var(--ink-3);margin-right:2px;letter-spacing:.2px}
.pill{
  font-size:11.5px;padding:3.5px 9px;border-radius:5px;border:1px solid var(--line);
  color:var(--ink-2);background:#fff;transition:.12s;white-space:nowrap;
}
.pill:hover{border-color:#cfd4dc;background:#fafbfc}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:550}
.pill.on .c{color:#fff;opacity:.6}
.pill .c{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);margin-left:3px}
.fsep{width:1px;height:18px;background:var(--line);margin:0 3px}
.fright{margin-left:auto;display:flex;align-items:center;gap:8px}
.sel{
  height:29px;border:1px solid var(--line);border-radius:5px;background:#fff;font-size:11.5px;
  color:var(--ink-2);padding:0 6px;outline:none;cursor:pointer;
}
.res{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.res b{color:var(--ink);font-weight:600}

/* ---------- list rows ---------- */
.rows{border:1px solid var(--line);border-radius:9px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.row{
  display:grid;grid-template-columns:74px 1fr 96px 62px 74px 84px;
  align-items:center;gap:14px;padding:11px 15px;border-bottom:1px solid var(--line-3);
  cursor:pointer;transition:.12s;position:relative;
}
.row:last-child{border-bottom:none}
.row:hover{background:#fcfcfd}
.row:hover .rname{color:var(--accent-2)}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:transparent;transition:.12s}
.row:hover::before{background:var(--accent)}
.rid{
  font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink-2);
  border:1px solid var(--line);border-radius:4px;padding:2px 5px;text-align:center;
  background:var(--panel-2);white-space:nowrap;
}
.rname{font-size:13px;font-weight:520;line-height:1.45;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;transition:.12s}
.rcat{font-size:11px;display:flex;align-items:center;gap:5px;color:var(--ink-2);white-space:nowrap}
.rcat i{width:6px;height:6px;border-radius:2px;flex:none}
.risk{font-size:11px;padding:2px 7px;border-radius:4px;display:inline-flex;align-items:center;gap:4px;
  font-weight:550;white-space:nowrap;justify-self:start}
.risk.hi{background:#fbeaea;color:#9b0009}
.risk.mid{background:#fdf6e8;color:#8a5200}
.risk.lo{background:#eff3f7;color:#3d556d}
.risk .sc{font-family:var(--mono);font-size:9.5px;opacity:.68}
.rdepth{font-size:11px;color:var(--ink-3);white-space:nowrap}
.rcase{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:right;white-space:nowrap}
.rcase b{color:var(--ink-2);font-weight:600}
.head-row{
  display:grid;grid-template-columns:74px 1fr 96px 62px 74px 84px;gap:14px;
  padding:8px 15px;font-size:10.5px;color:var(--ink-3);letter-spacing:.5px;
  text-transform:uppercase;background:var(--panel-2);border-bottom:1px solid var(--line);
}
.head-row span:last-child{text-align:right}

/* ---------- case cards ---------- */
.clist{display:grid;gap:10px}
.cc{
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 15px;
  cursor:pointer;transition:.14s;box-shadow:var(--sh);position:relative;overflow:hidden;
}
.cc:hover{border-color:#d5dae2;box-shadow:var(--sh-2);transform:translateY(-1px)}
.cc-h{display:flex;align-items:flex-start;gap:9px;margin-bottom:6px}
.cc-h .fpid{
  font-family:var(--mono);font-size:10px;font-weight:600;padding:1.5px 5px;border-radius:3px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2);flex:none;margin-top:1px;
}
.cc-h .t{font-size:13px;font-weight:540;line-height:1.45;flex:1}
.cc-m{font-size:11.5px;color:var(--ink-3);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.cc-m code{background:var(--panel-2);border:1px solid var(--line-2);border-radius:3px;padding:0 4px;font-size:10px}
.cc-d{font-size:12px;color:var(--ink-2);margin-top:7px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge-v{
  font-size:9.5px;padding:1px 5px;border-radius:3px;background:#eaf7ee;color:#1a7f45;
  border:1px solid #cfe9d8;font-weight:600;flex:none;
}

/* ---------- triage ---------- */
.tri{display:grid;gap:12px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:var(--sh)}
.tcard-h{padding:13px 16px;display:flex;align-items:center;gap:11px;cursor:pointer;
  transition:.12s;border-bottom:1px solid transparent}
.tcard-h:hover{background:var(--panel-2)}
.tcard.open .tcard-h{border-bottom-color:var(--line-2)}
.tid{
  font-family:var(--mono);font-size:11px;font-weight:700;width:32px;height:32px;flex:none;
  display:grid;place-items:center;border-radius:6px;background:#fbeaea;color:#9b0009;
}
.tcard-h h4{font-size:14px;font-weight:620;flex:1}
.tcard-h .cm{font-size:11.5px;color:var(--ink-3)}
.tcard-h .arw{font-size:10px;color:var(--ink-4);transition:.2s}
.tcard.open .arw{transform:rotate(90deg)}
.tintro{padding:10px 16px;font-size:12px;color:var(--ink-2);background:var(--panel-2);
  border-bottom:1px solid var(--line-2);display:none}
.tcard.open .tintro{display:block}
.tbody{display:none}
.tcard.open .tbody{display:block}
.tgrp{padding:0}
.tgrp-h{padding:9px 16px;font-size:11px;color:var(--ink-3);background:#fdfdfe;
  border-bottom:1px solid var(--line-3);letter-spacing:.3px;font-weight:600}
.trow{display:grid;grid-template-columns:1fr 250px;gap:16px;padding:10px 16px;
  border-bottom:1px solid var(--line-3);align-items:start}
.trow:last-child{border-bottom:none}
.trow:hover{background:#fcfcfd}
.sym{font-size:12.5px;color:var(--ink);line-height:1.55}
.sym code{background:var(--panel-2);border:1px solid var(--line-2);padding:0 4px;border-radius:3px;font-size:10.5px}
.cands{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.cand{
  font-size:11px;padding:2.5px 7px;border-radius:4px;border:1px solid var(--line);background:#fff;
  display:inline-flex;align-items:center;gap:5px;transition:.12s;cursor:pointer;white-space:nowrap;
}
.cand:hover{border-color:#c9ced7;background:var(--panel-2)}
.cand .cid{font-family:var(--mono);font-weight:600;font-size:10px}
.cand .cm2{font-family:var(--mono);font-size:9.5px;color:var(--ink-4)}
.cand.hi{border-color:#f0c8c8;background:#fdf3f3}
.cand.hi .cid{color:#9b0009}
.cand.mid{border-color:#eddfc4;background:#fdf9f0}
.cand.mid .cid{color:#8a5200}
.cfirst{font-size:11px;color:var(--ink-3);text-align:right;grid-column:2;margin-top:-2px;line-height:1.5}

/* ---------- drawer ---------- */
.mask{
  position:fixed;inset:0;background:rgba(16,19,25,.32);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:.2s;z-index:80;
}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(880px,94vw);background:var(--bg);
  z-index:90;transform:translateX(101%);transition:transform .26s cubic-bezier(.3,.8,.3,1);
  display:flex;flex-direction:column;box-shadow:var(--sh-3);
}
.drawer.on{transform:none}
.dh{
  padding:16px 24px 14px;background:#fff;border-bottom:1px solid var(--line);flex:none;
  position:relative;
}
.dh-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dh-top .fpid{
  font-family:var(--mono);font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:4px;
  background:var(--ink);color:#fff;
}
.dh-top .cat{font-size:11px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.dh-top .cat i{width:6px;height:6px;border-radius:2px}
.dh h2{font-size:17px;font-weight:650;line-height:1.4;letter-spacing:-.2px;padding-right:44px}
.dh-x{
  position:absolute;right:16px;top:16px;width:28px;height:28px;border-radius:6px;
  display:grid;place-items:center;color:var(--ink-3);font-size:16px;transition:.12s;
}
.dh-x:hover{background:var(--line-2);color:var(--ink)}
.dh-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mchip{
  font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--panel-2);
  border:1px solid var(--line);color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;
}
.mchip b{color:var(--ink);font-weight:600}
.db{flex:1;overflow-y:auto;padding:20px 24px 60px;scroll-behavior:smooth}
.db::-webkit-scrollbar{width:9px}
.db::-webkit-scrollbar-thumb{background:#d6dae1;border-radius:5px;border:2px solid var(--bg)}
.db::-webkit-scrollbar-track{background:transparent}

.fld{margin-bottom:20px}
.fld-h{
  display:flex;align-items:center;gap:8px;margin-bottom:8px;
}
.fld-h .n{
  font-family:var(--mono);font-size:9.5px;color:#fff;background:#a8aeb8;
  width:15px;height:15px;border-radius:3px;display:grid;place-items:center;font-weight:700;flex:none;
}
.fld-h h4{font-size:12.5px;font-weight:640;letter-spacing:.1px}
.fld-h .sub{font-size:10.5px;color:var(--ink-4);margin-left:auto;font-family:var(--mono)}
.fld-b{
  font-size:13px;color:var(--ink-2);line-height:1.78;background:#fff;
  border:1px solid var(--line);border-radius:8px;padding:13px 15px;
}
.fld-b p+p{margin-top:8px}
.fld-b strong{color:var(--ink);font-weight:620}
.fld-b code{
  font-family:var(--mono);font-size:11.5px;background:var(--panel-2);border:1px solid var(--line-2);
  border-radius:3px;padding:.5px 4px;color:#a3000a;white-space:break-spaces;
}
.fld-b ul{margin:6px 0 0 16px}
.fld-b li{margin-bottom:4px}
.fld-b.warm{background:linear-gradient(180deg,#fffdfa,#fff);border-color:#f0e4d4}
.fld-b.cool{background:linear-gradient(180deg,#fbfcfd,#fff)}

错（同型异 dtype，可作横向参照）。**共性特征：算子原型/资料声明支持某 dtype，底层 kernel 未实现该分支，行为既非正确计算也非明确拦截。**","related_text":"[FP-A10](FP-A10.md)、[FP-B01](../FP-B/FP-B01.md)（B01 是该拦不拦的反面：此处是声明支持却未实现，实际被底层报错拦截）。"},"caseCount":0},{"id":"FP-A12","name":"大整数转 fp32 计算精度损失","file":"patterns/FP-A/FP-A12.md","cat":"accuracy","catZh":"精度","s":3,"o":1,"level":"中","score":3,"depth":"标准","status":"active","trigger":"static_cast<float>|static_cast<double>","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["Tiling源码","Kernel源码"],"enabled":true,"evidence":["跨仓扫描 2026-09-05 P1 58 处 int→float（部分归属待复核）"],"tocEvidence":"笔记+扫描","signatures":["static_cast<(float|double)>\\([^)]*\\bint(32|64)","numeric_limits<int"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["大数值场景结果偏差","边界值精度失败"],"detectors":["大整数边界值用例","静态扫描 int → float 转换"],"related":["FP-A18"],"subtypes":[{"id":"A12-1","name":"签名 double、实现 float（属性被 static_cast<float> 收窄：契约不一致，通常不构成精度缺陷）","evidence":"ops-transformer attention 族 57 接口中 53 个 scale 为 double; aclnnBlockSparseAttention aclnn_block_sparse_attention.h:25 double scaleValue → block_sparse_attention.cpp:82 static_cast<float> → tiling.h:64 float"}],"waiver":"","detect":{"axes":["dtype","boundary","content"],"oracle":["golden-utol"],"signal":"golden","lines":["precision"],"min_cases":2,"constructor":"含 2^24±1、INT32_MAX/MIN 边界值的数值用例（重点覆盖「先乘后转」与「先转后乘」的差异区间）。","judge":"大整数边界值结果与标杆逐元素一致。","kill":"若 int64→fp32 未升位或先乘后转，则 2^24±1 附近输入结果偏差而小值正确。","sourced":{"constructor":"测试拦截建议","judge":"故障机理","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（golden-utol），无静态形态判据","priority":9},"secondary":null,"body":{"extras":[{"k":"姊妹型 A12-1「签名 double、实现 float」（v6.27）","v":"与主型**方向相反**——主型是「大整数（≥2^24）转 float 丢低位」，丢的是**整数精度**（错值可达 1 个 ULP 的千万倍）；A12-1 是「属性本来就是 `double`，实现用 `static_cast<float>` 收窄」，丢的是**浮点位宽**（相对误差 ~1.2e-7，**通常小于任何算子的精度容差**）。所以**A12-1 单独不构成精度缺陷**，它的价值在另外两件事：① **契约不一致**——`aclnn` 签名对外承诺 `double`，调用方按 double 传非 float 可表示值，实际按 7 位十进制算；② **可静态枚举**——凡是「签名 `double` 形参 + 实现 `static_cast<float>`」的组合都能机器扫出，不必上板。2026-11-06 实测：`ops-transformer` 的 attention 族 **57 个接口里 53 个的 `scale` 是 `double`**，典型 `aclnnBlockSparseAttention`（`aclnn_block_sparse_attention.h:25` `double scaleValue`）在 `block_sparse_attention.cpp:82` 被 `static_cast<float>(scaleValue)` 送进 `OP_ATTR`，而 tiling 侧 `TILING_DATA_FIELD_DEF(float, scaleValue)`（`block_sparse_attention_tiling.h:64`）也按 float 收——**上下游一致地窄了**。**定级口径**：默认 P2（契约/可观测性），只有能构造出「float 与 double 结果差异超出该接口 ST 容差」的输入时才升 P1。"}],"meta_info":"类别 精度 ｜ 风险 中（S3×O1=3）｜ 状态 活跃 ｜ 来源 团队笔记 + 跨仓扫描","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 Tiling源码,Kernel源码 ｜ 触发 static_cast<float>|static_cast<double> ｜ 默认启用 true","mechanism":"int64/int32 数值超出 float 24 位尾数精确表示范围（|x|>2^24），转换后参与计算产生偏差；先转后乘与先乘后转的结果不同。","conditions":"大数值索引/计数/求和后转 float 参与计算。","manifest":"大数值场景结果偏差。","mapping":"int64→fp32/int32 转换点、乘法前未升位（先乘后转 vs 先转后乘）。","signatures_text":"`grep -rnE \"static_cast<(float|double)>\\([^)]*\\bint(32|64)\"`；`grep -rn \"numeric_limits<int\"` 后检查邻近 float 赋值。 **A12-1 签名（v6.27）**：先取「签名里是 `double <name>`」的形状（`grep -nE \"aclnnStatus\\s+aclnn\\w+GetWorkspaceSize\" ` 后同段内 `double\\s+\\w+`），再在实现里找 `static_cast<float>\\(<name>\\)`；两者同时成立即候选——**不需要上板**。实测基线：`ops-transformer` attention 族 `double scale` 签名 **53 处 / 57 个接口**；但**只有实现了 `static_cast<float>` 的才是 A12-1**（多数接口透传 double 给 tiling），所以必须两步都跑，不能按签名比例推。","intercept":"含 2^24±1、INT32_MAX/MIN 边界值的数值用例。","evidence_text":"2026-09-05 跨仓追溯扫描 P1 命中 58 处 int→float 截断同源风险点（ops-nn 37 / ops-transformer 14 / ops-math 7），其中部分属本型（具体 issue 归属待逐点复核）。","related_text":"[FP-A18](FP-A18.md)（同源不同焦点：A12 关注数值计算损失，A18 关注比较语义偏差）。"},"caseCount":0},{"id":"FP-A13","name":"输入尾数截断才能通过精度标准","file":"patterns/FP-A/FP-A13.md","cat":"accuracy","catZh":"精度","s":3,"o":1,"level":"中","score":3,"depth":"宽浅","status":"active","trigger":"Round|round|Truncate","triggerZh":"宽泛定位","repos":["All"],"sides":["All"],"carriers":["UT与golden资产"],"enabled":true,"evidence":[],"tocEvidence":"未证实（检索无对应）","signatures":["Round|round|Truncate"],"keywo stepKa` 错误初始化；ops-transformer #1246 mxfp8 blockmmad 在 A 转置/B 不转置且 ND 场景下的泛化精度问题（值域拼接处的 K 对齐补零缺失）。**共性特征：缺陷位于 Cube（MMAD）侧的搬运/指令配置/对齐环节，而非 Vector 侧；A14 关注的「同一数学在 FFMA 与 MMAD 两路径结果有差」在四仓 issue 中体现为 Cube 侧配置错误导致的精度失败，属本型的一种呈现形式。**\n**索引类输出不得对标杆**：同 A01，见 [EVIDENCE_DISCIPLINE.md](../../EVIDENCE_DISCIPLINE.md) D11。","related_text":"[FP-A01](FP-A01.md)、[FP-A16](FP-A16.md)、[FP-A08](FP-A08.md)（#1246 的 K 对齐补零缺失与尾块/对齐问题同源）。注：FFMA 为 Vector 融合乘加指令、MMAD 为 Cube 矩阵乘指令。"},"caseCount":4},{"id":"FP-A15","name":"inf/nan 特殊值行为差异","file":"patterns/FP-A/FP-A15.md","cat":"accuracy","catZh":"精度","s":3,"o":3,"level":"高","score":9,"depth":"标准","status":"active","trigger":"isnan|IsNan|NAN|INFINITY|rsqrt|sqrt|E\\[x²\\]","triggerZh":"签名","repos":["All"],"sides":["Kernel"],"carriers":["Kernel源码"],"enabled":true,"evidence":["ops-nn#5562(PR !9773)","2026-11 批次：本簇 9 条；代表 ops-nn#7120（ScaledMaskedSoftmax bool mask 极性反转）、#7121（常量 -10000 代替 -inf）、ops-math#4006（大数取模塌成 0）","特殊值基线（v6.56）：A2 上对 28 个一元算子 × fp32/fp16/bf16 做 nan/inf/±0/次正规/极大值扫描，除 erfc(±FLT_TRUE_MIN=±1.40129846e-45)→NaN（cpu 为 1.0，仅最小次正规点命中，atvoss Vec::Erfc 分支，未提 issue）外全部与 torch CPU 语义一致；tan 在 |x|>65504 返回 inf/nan 属资料“超出范围不保证精度”免责，不计缺陷；二元 fmod/remainder 仅 remainder 见 A03 条目"],"tocEvidence":"1 issue","signatures":["isnan","IsNan","H_ISNAN","== *NaN"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["nan/inf 用例失败","特殊值结果不一致"],"detectors":["inf/-inf/nan 特殊值用例集"],"related":["FP-A01","FP-A04","FP-A09","FP-A18"],"subtypes":[{"id":"A15-1","name":"特殊值输入（nan/inf 进入后比较分支、传播、clamp 与标杆不一致）"},{"id":"A15-2","name":"定义域越界产出（输入全部合法，中间表达式因舍入抵消落到数学定义域外，产出 nan/inf；如 E[x²]-E[x]² 负方差）"},{"id":"A15-3","name":"掩码/布尔语义错位（bool 极性反转、有限大负数代替 -inf）","evidence":"ops-nn#7120/#7121"}],"waiver":"","detect":{"axes":["content","dtype"],"oracle":["golden-utol"],"signal":"golden","lines":["precision"],"min_cases":3,"constructor":"nan/inf 专项矩阵，按「输入携带 / 计算产生 / 输出注入」三类来源分别构造。","judge":"inf/nan 传播、比较分支、clamp 对 nan 的行为与标杆一致。","kill":"若特殊值处理缺失（clamp 对 nan、比较分支），则 nan/inf 用例输出与标杆不一致。","sourced":{"constructor":"测试拦截建议","judge":"源码审查映射点","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（golden-utol），无静态形态判据","priority":27},"secondary":null,"body":{"extras":[{"k":"子型","v":"① **特殊值输入**（nan/inf 进入后比较分支、传播、clamp 行为与标杆不一致——原主干）；② **定义域越界产出**（输入全为有限合法值，但中间表达式因舍入/抵消落到数学定义域之外，产出 nan/inf——v2.18 增补）。"}],"meta_info":"类别 精度 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 团队笔记 + 内部缺陷检视记录；v2.18 增补子型②（现网修复复盘 25-11，2026-11-05）","applicability_text":"仓 All ｜ 侧别 Kernel ｜ 载体 Kernel源码 ｜ 触发 isnan|IsNan|NAN|INFINITY|rsqrt|sqrt|E\\[x²\\] ｜ 默认启用 true\n  - 注：TBE 实现（`ops/built-in/tbe/impl/**/*.py`）同属本模式的检视面，按 Kernel源码 口径检查。","mechanism":"① nan 比较分支结果（如 nan 与阈值比较的判断走向）、inf 传播与标杆不一致；`float == NaN` 恒假类分支写错。② **正常输入算出非法中间值**：典型是「先算平方和再减均值平方」这类数学等价但数值不等价的写法——`E[x²]-E[x]²` 在方差极小时，两个大数相减发生**灾难性抵消**，舍入误差可让结果落到 `-ε`（负方差），再经 `sqrt`/`rsqrt` 变成 **NaN**；同理 `std` 的负数、`log(0)`、`1/x` 除零、`acos` 越界都属于本型。**特征：输入完全合法，缺陷在公式的数值形态，不在输入校验。** ③ **掩码/布尔语义错位（v6.33）**：bool mask 的 `true/false` 语义与资料公式相反（该屏蔽的位置被保留），或用 `-10000`/`-1e4` 等有限大负数代替 `-inf` 做屏蔽——有效位 logits 低于该常量时屏蔽位吃掉全部概率；与 ① 的区别是输入不是 nan/inf，而是**语义方向错了**。","conditions":"① 输入含 nan/inf 或计算过程中产生。② 数值动态范围大、方差/范数接近零、大量零元素、接近 `1e-7` 量级的极小数、`inf - inf` 型中间结果；**提高零元素比例直到旧实现中间方差为负**是最可靠的构造方式。","manifest":"① 特殊值场景结果不一致、nan 用例判断失败。② 输出出现无来源的 nan（追查输入却找不到 nan/inf）、loss 突然变 NaN 且不可复现、同一输入不同 batch 组合下偶发 nan；**关键鉴别点：输入侧查不到 nan/inf，nan 是本地生成的**。","mapping":"① 特殊值处理：inf/nan 传播、比较分支、clamp 对 nan 的行为。② **一切含有减法的「平方和 - 平方的均值」形态**（方差、标准差、RMS、协方差、LayerNorm/IN 类归一化）；`sqrt`/`rsqrt`/`log`/`div` 的**实参是否做过定义域钳制**（`max(x, 0)`、`max(x, eps)`）；归约是「双遍（先均值再偏差）」还是「单遍平方和相减」；是否存在 `rsqrt(0)` 合法路径；`eps` 是加在方差上还是加在 std 上（影响量纲与数值稳定性）。","intercept":"① nan/inf 专项用例矩阵（输入携带/计算产生/输出注入三类来源）。② **定义域探针**：构造使中间结果为负的输入（零元素比例阶梯 0/50%/90%/99%、常数列、极大极小混合、`x` 与 `x+1e-7` 并置）；判据不是「与参考差距小」，而是**「输出有限且定义域内」**——`variance >= 0`、`std >= 0`、`rsqrt` 结果非 inf/nan、`log` 实参 > 0。同时与 CPU 参考的**稳定性**对照（参考实现用双遍或 Welford，不应出现 nan）。③ 修复前后用同一份固化输入 + 固定种子，确认「旧版中间方差为负、新版非负」。","evidence_text":"**子型①**：ops-nn #5562 threshold_grad_v2_d nan 用例判断失败（PR !9773，kernel isnan 分支未对齐标杆）。**子型②**：ops-math `INTrainingUpdateV2`（PR 修复，现网 25-11）——`E[x²]-E[x]²` 单遍算法在舍入抵消下产生**负方差**并传播为 NaN；修复在 `after_v200()` 路径新增 `max(variance, 0)` 下界钳制。**该修复只钳了被开方的一次**，审查同类算子时须同时确认「钳制点是否覆盖所有 `sqrt/rsqrt` 消费方」。 **2026-11 批次（v6.33 反哺）**：本簇 9 条；代表 ops-nn#7120（ScaledMaskedSoftmax bool mask 极性反转）、#7121（常量 -10000 代替 -inf）、ops-math#4006（大数取模塌成 0）。","related_text":"[FP-A09](FP-A09.md)（标杆语义差异）、[FP-A18](FP-A18.md)（整型边界值与舍入）、[FP-A01](FP-A01.md)（近似指令带来的额外误差会放大本型②的抵消）、[FP-A04](FP-A04.md)（本型②常表现为「静默 nan」）。"},"caseCount":0},{"id":"FP-A16","name":"aclop 与 aclnn 编译阶段精度差异","file":"patterns/FP-A/FP-A16.md","cat":"accuracy","catZh":"精度","s":3,"o":3,"level":"高","score":9,"depth":"标准","status":"active","trigger":"aclop|GEIR","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["aclnn源码","IR与图配置"],"enabled":true,"evidence":["ops-transformer#4254(RoPEGrad ACLNN 常量输入优化路径致 dcos 符号反转 MARE=2.0, ACLNN 97/3 FAIL 而 GEIR 10/0 PASS, 编译产物与源码行为不一致)","ops-transformer#4141(FlashAttentionScore aclnn 单算子路径补 pad/消 pad 而 GE 图路径无, GE 图走 48 非对齐触发 kernel 缺陷 27/30 batch 精度异常)"],"tocEvidence":"2 issue（1 仓）","signatures":["aclop|GEIR"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["同一算子两条调用路径精度不同","aclnn 与 GEIR 结果不一致"],"detectors":["aclop / aclnn 双路径对拍"],"related":["FP-A14","FP-D02"],"subtypes":[],"waiver":"","detect":{"axes":["sequence","content"],"oracle":["golden-utol"],"signal":"sequence","lines":["precision"],"min_cases":2,"constructor":"aclop/aclnn 双路径同输入一致性用例（同一 shape/dtype 分别走两条调用路径）。","judge":"两条调用路径同输入结果一致。","kill":"若编译期常量折叠/精度决策或 pad/对齐预处理决策不同，则 aclop 与 aclnn 同输入结果不一致。","sourced":{"constructor":"测试拦截建议","judge":"典型表现","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（golden-utol），无静态形态判据","priority":27},"secondary":{"kind":"cross-path","why":"aclnn 与 aclop 的精度差异，本身就是因为两条路径实现不同；这正是天然的差分对。","relations":[{"id":"A16-X1","name":"双通路逐位对照","statement":"同一输入分别走 aclnn 与 aclop/GEIR，输出须在声明容差内一致。","kill":"编译期常量折叠、pad 对齐预处理只在一条路径发生，差分立即暴露。","how":"同 shape/dtype 跑两条通路，比较最大绝对/相对误差与不一致元素数。"}]},"body":{"extras":[],"meta_info":"类别 精度 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 团队笔记 + CANN issue 检索（2026-09-16）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码,IR与图配置 ｜ 触发 aclop|GEIR ｜ 默认启用 true","mechanism":"两条调用路径编译期常量折叠/精度决策不同，同一算子同输入结果不同。","conditions":"同一算子分别经 aclop 与 aclnn 调用（实证中对应 aclnn 单算子与 GE 图/GEIR 两条路径）。","manifest":"同一算子两条调用路径精度不同。","mapping":"编译期常量折叠/精度决策差异点；调用路径间补 pad/对齐等预处理决策差异。","intercept":"aclop/aclnn 双路径同输入一致性用例。","evidence_text":"ops-transformer #4254 RotaryPositionEmbeddingGrad 同一 kernel 两条调用路径结果不同——ACLNN 单算子路径 97/3 FAIL（仅 mode=2 + **常量输入** + cos 全 broadcast 的 3 例，output[1] dcos 输出符号反转、MARE=2.0），GEIR 图路径 10/0 PASS；根因为 **ACLNN API 对常量输入触发优化路径，编译产物行为与源码不一致**（源码正确用原始 x 算 dcos，产物却用 rotate(x)），而 GEIR 经 GE 图框架直接调 kernel 不经过该优化；ops-transformer #4141 FlashAttentionScore aclnn 单算子路径含 V 尾轴非对齐的补 pad/消 pad 预处理（PadAiCore 48→64 → FA → Slice 64→48），GE 图路径 dense_v 直连无 pad，GE 图走 48 非对齐触发 kernel 缺陷致 27/30 batch 精度异常，而 aclnn 单算子同输入精度正常。**共性特征：同一算子经不同调用路径时，编译期常量优化与对齐/预处理决策不同，同输入结果不同；修复方向均为路径行为对齐而非单侧修数。**","related_text":"[FP-A14](FP-A14.md)、[FP-D02](../FP-D/FP-D02.md)。"},"caseCount":0},{"id":"FP-A17","name":"A1 与 A2 硬件代际精度差异","file":"patterns/FP-A/FP-A17.md","cat":"accuracy","catZh":"精度","s":3,"o":1,"level":"中","score":3,"depth":"宽浅","status":"active","trigger":"GetSocVersion|SOC_VERSION|socVersion","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["Tiling源码","Kernel源码"],"enabled":true,"evidence":[],"tocEvidence":"未证实（检索无对应）","signatures":["GetSocVersion|SOC_VERSION|socVersion"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["跨代芯片精度不一致"],"detectors":["跨代平台同用例对拍"],"related":["FP-A01","FP-C06"],"subtypes":[],"waiver":"定位型：代际分支每算子都有，须逐代核对称性与精度硬编码","detect":{"axes":["dtype","content"],"oracle":["golden-utol"],"signal":"golden","lines":["precision"],"min_cases":2,"constructor":"多代芯片同用例精度基线对比（同 shape/dtype 跨 SOC 各跑一遍）。","judge":"跨代平台同用例精度基线可比且无劣化。","kill":"若 SOC 代际分支有精度相关硬编码，则同一用例在两代芯片上偏差显著不同。","sourced":{"constructor":"测试拦截建议","judge":"典型表现","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（golden-utol），无静态形态判据","priority":9},"secondary":null,"body":{"extras":[{"k":"必须声明的对照能力（v6.30）","v":"判定前先确认实验室是否具备「**同 CANN 版本、不同芯片**」或「**同芯片、不同 CANN 版本**」的对照环境。两者都没有时，任何差异都**不可归因**，该模式应落 `unknown` 而不是 `hit`。这一条是被实测打出来的：曾同时换芯片（910B2→910B3）与 CANN（9.3.0→26.1.1），得到的 1 例「跨代差异」无法归因，只能记待定。"}],"meta_info":"类别 精度 ｜ 风险 中（S3×O1=3）｜ 状态 活跃 ｜ 来源 团队笔记","evidence_status":"未证实（2026-10-17 复核：检索无确认对应；来源为团队笔记 / 静态观察）——按 O1 计档；**v6.30 起有了反向实证（96/101 bit 一致），状态改为「已证伪常见形态」**，引用时须标注「跨代 bit 差异在正常用例上未复现」，不得表述为已确认缺陷","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 Tiling源码,Kernel源码 ｜ 触发 GetSocVersion|SOC_VERSION|socVersion ｜ 默认启用 true","mechanism":"SOC 代际间指令精度规格/默认路径不同，代际分支含精度相关硬编码遗漏一侧。","conditions":"跨代芯片（A1/A2/A5 等）部署同一算子。","manifest":"跨代芯片精度不一致。","mapping":"SOC 代际分支中的精度相关硬编码。","intercept":"（v6.30 补判据分层）**先做 bit 一致基线，再做容差对比，不做无容差的数值比较**。三档：\n  ① **bit 一致（默认档）**：同一探针源、同一输入、同版本编译，两代芯片输出逐字节相同 ⇒ **不成立**。\n   实测 2026-11-06：101 个在两代机器上均有有效输出的接口中，**96 个签名逐字节一致**，另 3 个差异经归因   **全部落在用例侧**（TopK 全并列选索引未定义 / 一侧 baseline 失败 / 输入含重复索引）。\n  ② **容差一致**：bit 不同但落在资料声明的误差界内 ⇒ 不成立，记「跨代数值路径不同但精度达标」。\n  ③ **超容差**：只有这一档才是缺陷。\n  ⚠️ **只报「bit 不同」而不给容差判据，会把不同 kernel 实现造成的正常末位差异当成缺陷**——若判据是「数值是否 1 ulp 内一致」，96 个全算差异，等于该模式对绝大多数算子恒成立，**没有判别力**。","evidence_text":"**v6.30 补反向实证**——**2026-11-06 跨代三机专项**——442 接口中 101 个在两代（A2 + CANN 9.3.0 / A3 + CANN 26.1.1）上均有有效输出，**96 个输出签名逐字节完全相同**，3 个差异经逐条归因全部落在用例侧（`aclnnBSASelectBlockMask` 输入 q/k 全为 `0.1f`、score 完全并列，两代选不同索引；`aclnnNsaCompressAttention` 全为常数 `1.0`，差异全落在 `topkIndicesOut`；另一例一侧 baseline 失败）。即**该模式下跨代 bit 差异在正常用例上未复现**。**结论按「风险 中」维持不变**，但把判据改成上述三档分层——原「待补充」状态同时解除（有了反向实证，比继续挂着「未证实」更有用：它明确了「什么不算」）。\n  **原检索记录（保留）**：2026-09-16 gitcode CANN 组织 12 仓约 1.4 万条 issue 全量关键词检索，命中多为 cubeMathType 降精度模式口径分歧（ops-nn #5655）、cast 舍入口径 1 ulp 分歧（ops-nn #5656）、跨代性能咨询（ops-nn #3436、ops-transformer #1574）等异机理条目，无「跨代芯片同算子精度不一致」的确认对应实证）。\n**索引类输出不得比 bit**：输出含 TopK/ArgMax/排序置换时，输入并列则选择不唯一，该输出不参与跨代 bit 比对——见 [EVIDENCE_DISCIPLINE.md](../../EVIDENCE_DISCIPLINE.md) D11。","related_text":"[FP-A01](FP-A01.md)、[FP-C06](../FP-C/FP-C06.md)。"},"caseCount":0},{"id":"FP-A18","name":"int32 边界值转 float 舍入致比较语义偏差","file":"patterns/FP-A/FP-A18.md","cat":"accuracy","catZh":"精度","s":3,"o":2,"level":"高","score":6,"depth":"标准","status":"active","trigger":"numeric_limits<int32_t>|INT32_MAX|INT32_MIN","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["Tiling源码","Kernel源码"],"enabled":true,"evidence":["ops-nn#5562(PR !9773)","跨仓扫描 2026-09-05 P1 58 处：ops-nn 37/ops-transformer 14/ops-math 7"],"tocEvidence":"1 issue+58 处扫描","signatures":["static_cast<(float|double)>\\(\\s*std::numeric_limits<(int32_t|int64_t)>::(min|max)","constexpr\\s+(float|double)\\s+\\w*(Min|Max)\\w*As(Float|Double)"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["边界值用例精度失败","分支选择错误"],"detectors":["int32 边界值用例","静态扫描类型转换"],"related":["FP-A12","FP-A15","FP-E01"],"subtypes":[],"waiver":"","detect":{"axes":["boundary","dtype"],"oracle":["golden-utol"],"signal":"golden","lines":["precision"],"min_cases":2,"constructor":"int32 边界值用例集：2^24 两侧、INT32_MAX/MIN（重点覆盖整型极值被隐式转 float 的舍入区间）。","judge":"整数域比较语义不被浮点提升破坏。","kill":"若整型极值被隐式转 float 舍入，则 ±2^31 附近两个不同整数被判为相等。","sourced":{"constructor":"测试拦截建议","judge":"源码审查映射点","kill":"故障机理"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（golden-utol），无静态形态判据","priority":18},"secondary":null,"body":{"extras":[],"meta_info":"类别 精度 ｜ 风险 高（S3×O2=6）｜ 状态 活跃 ｜ 来源 ops-nn #5562 + 内部缺陷检视记录 2026-09-05","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 Tiling源码,Kernel源码 ｜ 触发 numeric_limits<int32_t>|INT32_MAX|INT32_MIN ｜ 默认启用 true","mechanism":"`int32` 大整数（>2^24）转 `float` 时尾数位不足，舍入后比较/索引语义偏差。","conditions":"int32 输入接近或超过 2^24；参与比较、索引、阈值判断。","manifest":"边界值用例精度失败或分支选择错误。","mapping":"int32→float 的隐式转换点；比较/索引前的类型提升；`static_cast<float>/<double>(std::numeric_limits<int32_t/int64_t>::min()/max())` 等整型极值转换点；整型值与浮点阈值直接比较；混合 int/float 表达式的隐式提 用例；同 shape 跨平台验证是否命中同一 `tilingKey`。","evidence_text":"ops-nn `norm/rms_norm_grad` 跨分支核验（2026-09-13）——`RmsNormGradBigMTiling`（优先级 100）在 **9.1.0 才引入**，8.5.0 无此文件；其 `IsCapable()` 要求 `rows_ >= 64×aivCoreNum/2`（950 上即 **M ≥ 2048**）且 `rows_ >= 2×cols_`。该路径的 dgamma 采用 `SyncAll()` + 0 核跨核 `ReduceSum<RA>`（非确定），而常规 `RmsNormGradRegbaseTiling`（优先级 200）按列切分、核间无交叉归约（数值确定）。**若测试 shape 的 M 全部 < 2048，则 big_m 路径 0 覆盖**。另：`9.1.0 → 9.2.0` 该文件 diff 全为格式化改动，阈值自引入起未变——说明**阈值稳定但版本引入点明确**，覆盖缺口不会随版本自然消失。","related_text":"[FP-A06](FP-A06.md)（新路径的非确定性正是 A06 的一个具体来源）、[FP-A07](FP-A07.md)（阈值边界写错 = A07）、[FP-A08](FP-A08.md)（切块粒度致归约分组不同）、[FP-B02](../FP-B/FP-B02.md)（阈值依赖芯片核数、跨平台不一致）。"},"caseCount":4},{"id":"FP-A20","name":"确定性等级未分级标注（二元描述掩盖条件确定性）","file":"patterns/FP-A/FP-A20.md","cat":"accuracy","catZh":"精度","s":2,"o":3,"level":"高","score":6,"depth":"深度","status":"active","trigger":"SyncAll|AtomicAdd|ReduceSum","triggerZh":"签名","repos":["All"],"sides":["Tiling","Kernel"],"carriers":["Tiling源码","Kernel源码"],"enabled":true,"evidence":["ops-nn norm/rms_norm_grad 跨分支核验 2026-09-13（950 平台）","同一算子内 dx 严格确定 / 常规 dgamma 数值确定 / big_m dgamma 非确定，三级并存","big_m dgamma 证据：SyncAll() + blockIdx!=0 return + 0 核跨核 ReduceSum<RA>（srcShape 含 usedCoreNum 维度）","ops-nn#4890(六算子 A5 确定性声明与代码行为不符, 实际默认确定且开关不生效, 另收录于 FP-F03)"],"tocEvidence":"2 实证（#4890 + rms_norm_grad 跨分支核验）","signatures":["SyncAll\\(\\)[\\s\\S]{0,200}?blockIdx_?\\s*!=\\s*0[\\s\\S]{0,80}?return","srcShape\\[2\\]\\s*=\\s*\\{[\\s\\S]{0,220}?dgammaUsedCoreNum","dgammaUsedCoreNum"],"keywords":[],"absence":[],"broad":[],"logSig":[],"symptoms":["缺陷被容差吞掉","flaky 误报","两次运行结果不同","无法复现"],"detectors":["按输出 × 路径 × shape 三级矩阵设比对策略","bitwise 判定复核","定序原语（SetScheduleMode/SyncAll）**与归约调用的配对**（当前无自动判据，文件级规则命中率 65% 不可用）"],"related":["FP-A06","FP-A02","FP-A19","FP-C05","FP-F03"],"subtypes":[],"waiver":"","detect":{"axes":["bitwise","shape","sequence"],"oracle":["bitwise","golden-utol"],"signal":"bitwise","lines":["determinism","precision"],"min_cases":3,"constructor":"按「输出 × 路径 × shape 区间」三级矩阵设定比对策略；严格确定的输出用 torch.equal 重复 100 次全等。","judge":"确定输出 bitwise 全等；非确定输出容差比对且结论显式标注触发 shape 区间。","kill":"若确定性被二元描述掩盖，则被判「确定」的输出在重复执行中出现 bit 不一致。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"典型表现"}},"detectability":{"d":3,"level":"D3","why":"M12 删 SetScheduleMode：0/10（组内无其他非零同伴，无法建基线）","priority":18},"secondary":{"kind":"idempotence","why":"确定性等级问题：非确定性只在重复执行与不同切核下显现，静态判据完全看不到。","relations":[{"id":"A20-I1","name":"确定性开关双向验证","statement":"确定性开：同输入连跑 N 次必须逐位一致；确定性关：允许差异但需可解释。","kill":"原子加未消除、跨核归约未定序时，确定性开启状态下仍会抖动。","how":"两种开关各跑 N=10，确定性开时逐位比对，关时统计分布。"},{"id":"A20-I2","name":"切核维度不变性","statement":"同输入在不同 blockDim 下，确定性开启时结果必须逐位一致。","kill":"切核维度参与归约分组时，改变核数会改分组，破坏确定性。","how":"blockDim 1/2/4/8 × 确定性开，比较输出位模式。"}]},"body":{"extras":[],"meta_info":"类别 精度 ｜ 风险 高（S2×O3=6，2026-10-02 复评：废除表达型降档例外——表达型已由 S2 体现，#4890 与 rms_norm_grad 核验独立实证支撑 O3）｜ 状态 活跃 ｜ 来源 rms_norm_grad 跨分支核验（2026-09-13）+ CANN issue 检索（2026-09-16）","applicability_text":"仓 All ｜ 侧别 Tiling,Kernel ｜ 载体 Tiling源码,Kernel源码 ｜ 触发 SyncAll|AtomicAdd|ReduceSum ｜ 默认启用 true","mechanism":"算子文档/测试结论仅以「确定性算子」「非确定性算子」二元标注，但实际存在**条件确定性**——同一算子不同 tiling 路径、不同输出（如 `dx` 与 `dgamma`）、不同 shape 区间的确定性等级不同。二元描述使测试用例的比对策略（`torch.equal` 严格比对 vs 容差比对）选错：对严格确定的输出用了容差比对 → **掩盖真实缺陷**（假阴性）；对非确定的输出用了 bitwise 比对 → 误报。","conditions":"算子含多条 tiling 路径；同一 kernel 内不同输出走不同归约实现；跨核归约与核内归约混用；测试用例的比对策略按「算子级」而非「输出级 + 路径级」设定。","manifest":"① 该 bitwise 的没 bitwise，缺陷被容差吞掉；② 不该 bitwise 的做了 bitwise，长期误报导致用例被标记为 flaky 后关停；③ 测试结论写「该算子非确定」但线上抱怨「同样输入两次结果不同」而无法复现，实际是特定 shape 才走非确定路径。","mapping":"① 逐**输出**（非逐算子）确定归约方式；② 区分「核内归约」（`ReduceSum<AR/RA>`、二叉树折叠、`WholeReduceSum`）与「跨核归约」（`SyncAll()` 后单核累加、原子加 float、workspace 二次归约）；③ 归约顺序是否依赖**运行时平台参数**（核数、`blockDim`、`vlFp32`）——依赖则非确定；④ 归约切分维度：按**输出不重叠维度**（如 N 轴列切分）切核 = 确定，按**归约维度**（M 轴行切分）切核 = 非确定。","signatures_text":"搜索 kernel 中的 `SyncAll()` + 后续 `if (blockIdx != 0)` 单核累加模式；搜索 `ReduceSum` 的 `srcShape` 是否包含核数维度（如 `{usedCoreNum, ...}`）；搜索原子加 float 路径。","intercept":"**按「输出 × 路径 × shape 区间」三级矩阵设定比对策略**；严格确定用 `torch.equal`（重复 100 次全等）；数值确定用同 tiling 多次比对 + 跨 tiling 容差；非确定只能容差并**在结论中显式标注触发 shape 区间**；对判定为「确定」的输出，建议在回归中保留 bitwise 用例作看护（一旦失效即暴露实现变更）。","evidence_text":"ops-nn `norm/rms_norm_grad`（950，2026-09-13）——**同一算子内三种等级并存**：`dx` 两条路径（`RegbaseDxFullLoad` / `RegbaseDxSplitD`）分别用 `ReduceSum<AR>` 与 `ReduceSumImpl`，均**严格确定**；常规 `dgamma` 按 N 轴列切分、核间无交叉归约，**数值确定**；`big_m` `dgamma`（tilingKey 9000/9010）用 `SyncAll()` + 0 核跨核 `ReduceSum<RA>`，且核内累加顺序随 `BasicBlockLoop` 动态变化、参与核数随 M 变化，属**非确定**。若按算子级二元标注为「确定」并对全部输出做 bitwise 比对，big_m 路径用例将误报；反之标注为「非确定」则 dx 的严格确定性看护丢失。补充实证：ops-nn #4890（closed）BatchNorm/BatchNormElemt/BatchNormBackward/GroupNormBackward/RmsNormGrad/RmsNormGradQuant 六算子 A5 文档声明「默认非确定、支持 aclrtCtxSetSysParamOpt 开启」，代码核查实际默认确定性且 tiling 不读取该开关——声明面与行为面整体错位（另收录于 FP-F03）。","related_text":"[FP-A06](FP-A06.md)（A06 是「确定性开关失效」的缺陷型，本型是「确定性等级描述不足」的表达型，二者互补）、[FP-A02](FP-A02.md)（归约顺序差异）、[FP-A19](FP-A19.md)（多路径是分级的载体）、[FP-C05](../FP-C/FP-C05.md)（确定性场景性能劣化，其前提也是先分清哪些算子是确定的）、[FP-F03](../FP-F/FP-F03.md)（#4890 声明面与行为面整体错位已另录 F03——二元标注掩盖条件确定性，属「文档/声明面与实现面不一致」）。"},"caseCount":4},{"id":"FP-A21","name":"tiling 可重入性缺失致跨调用/跨线程污染（TU 级可变全局）","file":"patterns/FP-A/FP-A21.md","cat":"accuracy","catZh":"精度","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"TilingData|tilingKey|namespace","triggerZh":"签名","repos":["All"],"sides":["Tiling","Host"],"carriers":["Tiling源码","aclnn源码"],"enabled":true,"evidence":["ops-transformer #3758 连续执行 TND→BNSD 时 4D 输入被按 TND 解析（PR #8705 修复赋值位置，未换载体，2026-10-19 复核）","代码锚 rope_half_grad_tiling.cpp:57/150、rope_interleaved_grad_tiling.cpp:80/248；全局 tiling 对象 half:56 / inter:106（后者外链接）","四仓静态扫描 2026-10-19：ops-transformer 1482 文件命中生产侧 3 个（0.2%）、ops-math 2393 命中 4 个（0.17%），成簇分布（rope 前向+后向 / tril+triu）","同型未立案锚：rotary_position_embedding/op_host/rope_interleaved_tiling.cpp:47、ops-math tril_tiling.cpp:45-56、triu_tiling.cpp:50-62","ops-math #3709/#3710（2026-10-21）：tril/triu tiling 的 11 个全局标量在连续调用两次时 matrixNum 累乘放大、kernel 循环越界——正是 2026-10-19 静态扫描列出的 tril_t tiling","DoOpTiling 首尾 atomic 计数证明并发","静态扫描匿名 namespace 可变全局 + 全局 TilingData","Host/aclnn 层：grep 行首非 const 可变标量（匿名 namespace / 文件作用域）"],"related":["FP-A07","FP-A19","FP-G02","FP-A05","FP-E01"],"subtypes":[{"id":"A21-1","name":"时序耦合（串行残留）——前一次调用写入的 per-call 状态被后一次调用读到","evidence":"ops-math#3709/#6860"},{"id":"A21-2","name":"数据竞争（并发串味）——多线程并发 tiling 在同一全局/静态状态上读改写","evidence":"静态扫描 ops-transformer/ops-math 成簇（2026-10-19）"}],"waiver":"","detect":{"axes":["sequence","concurrency"],"oracle":["golden-utol","bitwise"],"signal":"sequence","lines":["determinism","multithread-fuzz"],"min_cases":4,"constructor":"序列化用例：3D→4D / 带可选输入 x→不带 x / fp16→fp32 / 新路径→旧路径 四种顺序；--gtest_shuffle --gtest_repeat=50；多线程只调 GetWorkspaceSize 交替 layout/dtype。","judge":"连续/乱序/并发调用后每次输出与单独跑一致；打桩证明 peak>1 才认并发结论。","kill":"若匿名 namespace 可变全局未被每路径赋值，则换顺序调用后输出与单独跑不一致，而单跑通过。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（bitwise/golden-utol），无静态形态判据","priority":27},"secondary":{"kind":"idempotence","why":"tiling 跨调用/跨线程污染，本质是状态残留——只有交错重放能暴露。","relations":[{"id":"A21-I1","name":"shape 交错不污染","statement":"A→B→A 序列中首末两次 A 输出必须逐位一致。","kill":"tiling 可变全局未按路径赋满，第二次 A 会用到 B 留下的字段。","how":"同 executor 上 A(小)→B(大)→A(小)，比对两次 A。"},{"id":"A21-I2","name":"并发隔离","statement":"两个线程各自跑不同 shape，输出必须与串行执行时逐位一致。","kill":"TU 级可变全局被并发写，会互相覆盖。","how":"两线程各跑 100 轮不同 shape，与串行基线比对。"}]},"body":{"extras":[{"k":"Host/aclnn 层补充（v6.13，暂无机器签名）","v":"人工 grep `^(?:bool|int|float|double|uint64_t|int64_t|uint32_t|std::string)\\s+\\w+_\\s*(?:=|;)`（行首无缩进锚，排除类成员），再按映射点 ⑥ 核查写点覆盖与并发窗口。实证 `aclnn_threshold_backward.cpp:33` 的 `float thresholdVal_ = 0.0;`。"}],"meta_info":"类别 精度 ｜ 风险 高（S3×O3=9，2026-10-19 新增：串行路径稳定可复现为静默错算 S3，#3758 + 四仓扫描两路独立实证支撑 O3；并发变体可升 S4，待实测坐实；2026-10-21 扩 Host/aclnn 载体并回填 5 仓实证）｜ 状态 活跃 ｜ 来源 rope_grad PR #8705 根因复核 + 四仓静态扫描（2026-10-19）+ 2026-10-21 issue 批次","applicability_text":"仓 All ｜ 侧别 Tiling,Host ｜ 载体 Tiling源码,aclnn源码 ｜ 触发 TilingData|tilingKey|namespace ｜ 默认启用 true","mechanism":"tiling（以及 2026-10-21 扩展的 **aclnn/host 层**）里有一部分状态**语义上是 per-call 的**（本次输入的 layout、dtype、由 shape 推导出的切分参数、本次选定的 tilingKey、本次的阈值/可选输入开关），却被放进**per-process 的容器**——文件作用域或匿名 `namespace` 内的可变全局变量、全局 `XxxTilingData` 对象。两者**生命周期不匹配**，产生两类后果：**① 时序耦合（串行残留）**——前一次调用写入的值被后一次调用读到；若某条分支（如 4D 路径）压根没有写操作，该分支就永远读到上一次留下的值，不存在「该更新了所以自动复位」这回事；**② 数据竞争（并发串味）**——多线程并发 tiling 时各方在同一块内存上读改写，A 线程 `SaveToBuffer` 时可能把 B 线程刚写进去的字段一并写进自己的 tiling data。它不是「某一行写错了」，而是**「状态该归谁」的设计错误**：C++ 里静态存储期变量的复位只有两个时机——静态初始化（模块加载时一次）、或显式赋值语句真的被执行。 **两个子型（v6.33 机读化）**：**A21-1 时序耦合（串行残留）**——前一次调用写入的 per-call 状态被后一次调用读到；**A21-2 数据竞争（并发串味）**——多线程并发 tiling 在同一全局/静态状态上读改写。","conditions":"tiling 源码或 aclnn/host 源码在匿名 `namespace` / 文件作用域声明了**非 `constexpr` 的可变全局**（`bool` 标志位、`uint64_t tilingKey/dtypeSize/seqLen/headDim/bufferSize`、`XxxTilingData tiling` 对象）；同一进程内**先后调用同一算子的不同 shape**（尤其「新增路径在前、旧路径在后」，如 3D TND → 4D BNSD/BSND）；**多线程 / 多流并发调用**同一算子（每线程独立 stream，host 侧 tiling 无锁进入）；图模式一次编译含多个该算子节点。**注意：单算子用例天然凑不齐「前导状态」，结构上无法复现序列型变体**——一进程一 shape，全局每次都是初值。","manifest":"① **静默错算**——D 维取到原 S 维的值、batch/head 互换，输出与 golden 偏差但无任何报错（最常见，最易被当成普通精度问题排查）；② **tiling failed**——污染后落入 `else` 分支返回 `GRAPH_FAILED`，报 `xxx do tiling failed`（只有少数形状会走到）；③ **偶发精度失败**——并发下时对时错，单跑通过、压测失败、复跑轮换；④ **越界**——`tilingKey` 与 `dtypeSize` 是两个独立全局，可组合出「key=fp16 但 dtypeSize=4」这种真实 dtype 永不产生的错配，kernel 按错误 stride 访问 buffer，或切分参数串味导致 UB 搬运越界（`aicore does not support it` / device 侧非法地址）。**关键识别特征：缺陷随「调用顺序」或「并发度」变化，与 shape 本身无因果关系。**","mapping":"① 文件作用域 / 匿名 `namespace` 内是否存在**非 `constexpr` 的可变变量**（`constexpr` 与 `static const` 安全，唯独「可变」不安全）；② 这些变量是否**在每条路径上都被赋值**——只要有一个分支不写，该分支就读到上一次的值（`isTndLayout` 旧代码的 4D 分支正是这种情况）；③ `TilingData` 对象是**全局**还是**类成员**；全局则 `set_*` 与 `SaveToBuffer` 之间的空隙越大越易串写；④ 声明位置——匿名 `namespace` 内是内链接（每 TU 一份，仍进程常驻），`namespace optiling` 内是**外链接**（更暴露）；⑤ 同一算子的**前向 / 反向 / 镜像实现**是否复制了同一写法（本型成簇传播，查一个必须连带查其成对实现）；⑥ **载体下沉到 aclnn/host 层**——`op_api/aclnn_*.cpp` 顶层匿名 `namespace` 的 `float/bool/std::string` 标量（如 `thresholdVal_`）在 `GetWorkspaceSize` 里写入、在 `GetDtypeSupportList()` / l0op 选择处读取，窗口跨函数且无锁。判据同 ②：写点是否在每条路径上执行、并发进入 `GetWorkspaceSize` 时是否互踩。","signatures_text":"`(?m)^[A-Za-z_][\\w:]*TilingData\\s+tiling\\s*;`（顶层 TilingData 对象）；`(?m)^bool\\s+\\w*(?:[Ff]lag|[Ll]ayout)\\w*\\s*=\\s*false\\s*;`（顶层可变布尔标志）；`(?m)^(?:uint64_t|int64_t|uint32_t|int32_t)\\s+(?:tilingKey|dtypeSize|seqFrontLen|seqTailLen|wholeBufferNum|maxElementNum|alignHeadDim)\\s*;`（顶层切分参数 / tilingKey）。三条均以**行首无缩进**为锚：`scripts/scan_fp.py` 逐行匹配，因此**顶层定义（列 0）命中，函数内局部变量与类成员（有缩进）自动排除**——实测 `posembedding` 500 个文件得 **11 候选全部真阳**，与 `rope_half_grad_tiling.cpp:56/57`、`rope_interleaved_grad_tiling.cpp:80/106` 及 6 个切分标量一一对应；同目录 4 个 `rope_*` 算子的 `TilingData tiling;` 写在函数内或作类成员，被正确排除（反证：`rope_rotate_half_tiling.cpp:131-136` 全部在 class body 内）。**负向排除**：`constexpr` / `const` / `static const` 修饰；`thread_local`；类成员（`isTndLayout_` 这类带下划线后缀且在 class body 内）；UT fixture 的 `CompileInfo` 全局（无跨调用语义）。**注意签名必须单行**——`scan_fp.py` 按行 `search`，含 `[\\s\\S]` 的跨行签名永不命中。","keywords_text":"`全局变量|静态变量|文件作用域`；`状态残留|跨调用|顺序依赖|串味|污染`；`可重入|reentrant|线程安全|thread.?safe`；`匿名 namespace`；`tilingKey.*串|dtypeSize.*串`；`SaveToBuffer`；`ubLoopGap|seqFrontLen|wholeBufferNum`；`静态初始化|static storage duration`；`aclnn 层可变全局|GetWorkspaceSize 共享状态`；`thresholdVal_|optionalUbNum|BENCHMARK_TILING_KEY`。","intercept":"① **序列化用例**（比并发易落地，且必须做）——同一个 `main` 内连续调用，覆盖「3D→4D」「带可选输入 x → 不带 x」「fp16→fp32」「新路径→旧路径」四种顺序，断言每次输出与单独跑一致；② **UT 顺序检查**——`--gtest_shuffle --gtest_repeat=50` 打乱既有用例顺序，撞到「新增路径在前」的组合即红（既有用例按「4D 在前 3D 在后」声明序编写，天然掩盖缺陷，全绿不代表覆盖）；③ **并发压测**——多线程、每线程独立 stream，只调 aclnn 第一段 `GetWorkspaceSize`（它就是 tiling 入口，host 侧同步，无需跑 kernel），交替不同 layout/dtype，判据取「返回码异常」与「输出与串行参考不一致」；④ **打桩自证**——`DoOpTiling` 首尾加 `atomic` 进入计数，`peak > 1` 才能证明并发真的发生，否则「未复现」的结论无效；⑤ **静态扫描**——扫匿名 `namespace` 内可变全局 + 全局 TilingData，命中即列入审查清单（候选 ≠ 缺陷）；⑥ **aclnn/host 层并发压测**——多线程只调 `aclnnXxxGetWorkspaceSize`，交替不同 `threshold` / 可选输入开关，判据为返回码异常、崩溃或输出与串行参考不一致（#7007/#7026 即此形态）。","evidence_text":"`cann/ops-transformer` #3758（`RotaryPositionEmbeddingGrad` 连续执行 TND → BNSD 时 4D 输入被按 TND 解析，报 tiling failed 或静默错算；PR #8705 修复，做法是把 `isTndLayout = true` 从 3D 分支内提到分支外做无条件求值）。代码锚：`posembedding/rotary_position_embedding_grad/op_host/rope_half_grad_tiling.cpp:57`（`bool isTndLayout = false;`）、`:150`（唯一写点）；`rope_interleaved_grad_tiling.cpp:80`、`:248`；全局 `tiling` 对象见 `rope_half_grad_tiling.cpp:56`、`rope_interleaved_grad_tiling.cpp:106`（后者在 `namespace optiling` 内、匿名 namespace 之外，属**外链接**）。**同型代码锚（静态扫描命中，未逐条立案）**：`posembedding/rotary_position_embedding/op_host/rope_interleaved_tiling.cpp:47`（前向算子同款全局 TilingData）；`ops-math experimental/conversion/tril/op_host/tril_tiling.cpp:45-56`（11 个全局标量，`key_value` 为事实上的 tilingKey，`:160-178` 反复改写）、`triu_tiling.cpp:50-62`（镜像副本）。扫描基线：ops-transformer 1482 个 `op_host/*.cpp` 命中生产侧 3 个（0.2%）、ops-math 2393 个命中生产侧 4 个（0.17%）——**稀有但成簇**（rope 前向+后向、tril+triu 各成一对）。 **2026-11 批次（v6.33 反哺）**：本簇 9 条；代表 ops-math#3709（tril tiling 11 个全局标量连续调用累乘放大）、ops-nn#6860（AddN 同进程二次调用 EXEC 561103 + 堆破坏）。 **v6.55 四仓复扫（2026-11-08）**：按「namespace 顶层、非 const、非测试、非全大写」口径重扫四仓，命中 95 条声明；**复核结论**——① 生产侧仍只有既有两簇：`tril/triu`（`triu_tiling.cpp:56` 的 `matrix_Num` 在 `:159` 累乘且全文无复位，`:231` 落盘、内核 `triu.h:170/193` 以其为循环上界 ⇒ 与 open 的 ops-math#3710/#3818 **同型，属已立案，不重复提**）与 `rope_interleaved`（`:64-80`，各分支字段集一致）；② **12 个 TilingData/Params 类候选为负控**：`mse_loss_v2` 入口显式清零、`cross_entropy_loss(_grad)`/`apply_fused_ema_adam`/`rope_half_grad`/`tsqr` 成功路径全字段必写、`rope_interleaved` 三模板字段互斥、QBMM/GroupedQMM Info 工厂按线程隔离且构造即 Reset、`masked_scale` 全局指针每次先赋值、`mc2` 五个 StorageShape 仅构造即返回、`layer_norm_v3` 为 hash 缓存、`top_k_v2`/`apply_rotary` 的 compile-info 在 TilingParse 一次写入；③ 两个「有写入但不致错」的观察：`Triu` 的 `ub_Sharing_Num`（`:53` 初值 2、仅两分支写 4）——只影响模板/性能；`AddRmsNormQuant` 的 `optionalUbNum_0/1`（`:51-52` 声明、仅 hasScales2‖hasBeta 时写，注释明写“否则不做改变”）——**即本卡已登记的 ops-nn#7006**，属已立案，不重复提。\n\n  **2026-10-21 回填（本型从静态扫描到实际立案）**：① `ops-math` **#3709/#3710**——`tril`/`triu` 同进程连续调用两次即产出错误 tiling（`matrixNum` 累乘放大、kernel 循环越界），正是上段两个「未逐条立案」代码锚；② `ops-nn` **#7006**——`AddRmsNormQuant` 的 `optionalUbNum_0/_1` 写点全在 `if (hasScales2 > 0 || hasBeta > 0)` 内且无 else 复位，tiling 模板与 `ubFactor` 随调用历史漂移；③ `ops-transformer` **#6417**——`PromptFlashAttention` 的全局 `BENCHMARK_TILING_KEY` 残留，同输入 `tilingKey` 漂移并触发 AICore MTE 越界；④ `ops-nn` **#7026**——`aclnnThresholdBackward` 的 `float thresholdVal_ = 0.0;`（`op_host/op_api/aclnn_threshold_backward.cpp:33`，匿名 namespace）被多线程 `GetWorkspaceSize` 互相覆盖，走错 `ReluGrad`/`ThresholdGradV2D` 分支；⑤ `ops-nn` **#7007**——`ThnnFusedLstmCell` 8 线程并发出现失配 / `561103` / 段错误，issue 列出全局 `TilingData` 与全局 `info` 两个候选共享状态，但未打桩坐实，按并发候选记录（验证方式见测试建议 ④）。","related_text":"[FP-A07](FP-A07.md)（tiling 分支边界写错，走错分支但状态来源正确；本型条件是对的、状态是别人的）、[FP-A19](FP-A19.md)（多 tiling 路径覆盖盲区，缺陷在新路径未被测到；本型单路径即可复现）、[FP-G02](../FP-G/FP-G02.md)（race 检测方法与 racecheck 用法可复用，但该条针对 device/kernel 侧同步原语配对，本型是 host 侧变量生命周期、无同步边可缺）、[FP-A05](FP-A05.md)（脏数据/数据踩踏是其结果面表征，本型给出可扫描的机理判据）、[FP-E01](../FP-E/FP-E01.md)（UT 用例按错误实现或错误顺序编写，使序列型缺陷长期不可见）。"},"caseCount":3},{"id":"FP-A22","name":"kernel dtype 分派/模板映射错配（特定 dtype 静默走错分支）","file":"patterns/FP-A/FP-A22.md","cat":"accuracy","catZh":"精度","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"必须触发","triggerZh":"必须触发","repos":["All"],"sides":["Kernel","Tiling"],"carriers":["Kernel源码","Tiling源码"],"enabled":true,"evidence":["ops-math #3747（2026-10-21）：aclnnTril 在 uint32/int64 下两段接口返回 0，但约一半输出一个字节都没写；同为 4 字节的 int32 与同为 8 字节的 uint64 均正确，排除单一宽度搬运解释，指向 dtype→执行模板映射表条目错配","ops-math #3748（2026-10-21）：aclnnTril 在 bool 下全量写出但掩码边界错位，3×3 错 4/9、4×4 错 12/16、8×8 错 42/64","2026-11 批次：本簇 23 条；代表 ops-math#3881（BitwiseXorTensor out dtype 未校验）、ops-nn#7556（AscendAntiQuant 空张量+INT4 非连续放行）、ops-nn#7679（Hardshrink lambd dtype 未校验）","输出 dtype 未校验（v6.55）：ops-nn#8386（Unique valueOut COMPLEX64 放行并按 self 宽度写）、ops-math#3921（open，ArgMax out 传 UINT8 时索引 299/288 截成 43/32；aclnn_argmax.cpp:64 CheckDtypeValid 只校验 self，:211/:218/:223 用 out->GetDataType() 写回；资料 :111 限 INT32/INT64、:172 的 161002 含 out）、ops-math#4618（MaxDim indices）；负控：argmin 已校验 out，ops-cv 仅 NonMaxSuppression 漏检但 A2 不支持","出参 dtype 白名单缺口的同族扩展（v6.61）：ops-math#4618（open）的机理在 aclnnArgMax 上复现。资料 `math/arg_max_v2/docs/aclnnArgMax.md:111` 规定 out 仅 INT32/INT64，`:171-172` 明写「self、out 的数据类型不在支持范围内」应返回 161002；A2 实测 out=FLOAT：第一段/第二段/同步均 0，索引被当成 float 写回 [1.0,2.0]（缓冲区仅改 2 个 float、无越界），对照 INT64 → [1,2]。同批负控（反证是漏项而非整仓不校验）：`aclnnSort.indicesOut=FLOAT` → 161002、`aclnnTopk.valuesOut` 与 self 类型不一致 → 161002、`aclnnGather.index=FLOAT` → 161002；`aclnnSort.valuesOut=FLOAT16`（self=FLOAT）→ 0 但只写声明区 12 字节且资料 :133 的 dtype 列表本就含 FLOAT16 ⇒ 不算缺陷。判据（新增）：核对出参 dtype 必须**逐个出参**对照资料参数表，不能只看 self；同一接口族里「一个出参有校验、另一个没有」时，缺的那个几乎必是漏项（已见 `MaxDim.indices`、`ArgMax.out`）。扫法：用 C++ 两段式把每个出参的 aclDataType 依次换成 FLOAT/INT8/BOOL 等非法值，看第一段是否 161002，再用 guard 缓冲区确认即便放行也没有越界（区分「静默接受」与「写穿」）。"],"tocEvidence":"2 issue（ops-math #3747/#3748）","signatures":[],"keywords":["dtype 分派|type dispatch|TILING_KEY.*dtype|dtype.*template","模板映射表|dispatch table|GetTypeSize|sizeof","部分输出未写|输出覆盖率|canary 预填"],"absence":[],"broad":[],"logSig":[],"symptoms":["特定 dtype 返回 0 但输出部分未写","同算子其他 dtype 正确、个别 dtype 错","掩码/布尔结果边界错位"],"detectors":["dtype × shape 全组合矩阵（含 uint32/int64/bool）","输出 buffer 预填魔数，统计残留比例","同宽度兄弟 dtype 对照（int32 vs uint32、int64 vs uint64）"],"related":["FP-A19","FP-B01","FP-B07","FP-A05","FP-E01","FP-B12"],"subtypes":[{"id":"A22-1","name":"dtype→执行模板映射表条目错配（同宽度兄弟 dtype 表现不同）"},{"id":"A22-2","name":"类型特化路径缺失（bool / 无符号类型走默认或错误模板）"},{"id":"A22-3","name":"分派后输出覆盖不全（部分元素未写却返回 SUCCESS）"},{"id":"A22-4","name":"输出 dtype 被误当计算 dtype（用输出存储位宽推导容量/尺寸，实际计算类型更宽）","sig":["GetSizeByDataType\\s*\\(\\s*(outDataType|outputDtype|outDtype)\\s*\\)"]},{"id":"A22-5","name":"出参 dtype 未纳入白名单/一致性校验（self/out dtype 不一致被放行）","evidence":"ops-math#3881; ops-nn#7556; ops-nn#7679"}],"waiver":"","detect":{"axes":["dtype","shape"],"oracle":["golden-canary","golden-utol"],"signal":"canary","lines":["precision","valid-fuzz"],"min_cases":4,"constructor":"dtype × shape 全组合矩阵（每受支持 dtype 至少「1 元素 / 非整除行宽 / 带 diagonal 边界」三档）；输出 buffer 预填魔数 0x7FC07FC0；同宽度兄弟 dtype 成对对照。","judge":"返回码 + 输出全量正确；魔数残留比例为 0（禁止只断言返回码）。","kill":"若 dtype→模板映射条目错配，则同宽度兄弟 dtype（int32 vs uint32）结果不同，或输出部分未写致魔数残留。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"M08 dtype 映射错配：0/10（映射表是数据内容，形态与正确表一致）","priority":27},"secondary":{"kind":"cross-path","why":"dtype 分派/模板映射错配的特征是「同宽度兄弟 dtype 结果不同」，天然是横向差分。","relations":[{"id":"A22-X1","name":"同宽度兄弟 dtype 对照","statement":"int32 vs uint32、fp16 vs bf16 等语义相近的兄弟 dtype，同输入应给出可解释的一致/差异。","kill":"映射表条目错配会让某个 dtype 静默走另一分支。","how":"同输入分别以兄弟 dtype 跑，比较「应当一致」的位置是否真一致。"},{"id":"A22-S1","name":"输出全写","statement":"输出 buffer 预填魔数后跑，残留比例必须为 0。","kill":"只断言返回码会漏掉「部分未写」。","how":"预填 0x7FC07FC0，统计残留元素数。"}]},"body":{"extras":[{"k":"子型","v":"① **映射表条目错配**；② **类型特化路径缺失**；③ **分派后输出覆盖不全**；④ **输出 dtype 被误当计算 dtype**（v2.18 增补——dtype 本身没派错，但**取错了 dtype 的位宽**去算容量/尺寸）。"},{"k":"参考实现前置（v6.30）","v":"判 aclnn 层必须用 `golden.py` 的 `__golden__[\"aclnn\"]` 入口；只有 `kernel` 入口时**不得**用于 aclnn 层判定（层间 dtype/校验/布局差异会被误判成算子缺陷）；连 `aclnn` 入口都没有时记「判据不成立」而非「未覆盖」。实测 `ops-nn` 全仓 362 个 `golden.py` 仅 **80 个（22.1%）**含 `aclnn` 键——见 [EVIDENCE_DISCIPLINE.md](../../EVIDENCE_DISCIPLINE.md) D12/D13。"}],"meta_info":"类别 精度 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 ops-math #3747/#3748（2026-10-21，aclnnTril 的 dtype 全组合实测，同算子两条独立实证）；v2.18 增补子型④（现网修复复盘 26-01，2026-11-05）","applicability_text":"仓 All ｜ 侧别 Kernel,Tiling ｜ 载体 Kernel源码,Tiling源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"kernel 按 dtype 把计算派发到不同的**执行模板 / TilingKey / 类型特化分支**，而 `dtype ↔ 模板` 的**映射表条目缺失或错配**时，某个 dtype 会静默落到**默认分支、错误模板或部分覆盖的循环上界**，函数照常返回 `ACLNN_SUCCESS`，但输出只被写入了部分元素，或掩码/边界按错误的类型语义计算。它不是「数值近似差一点」（FP-A01/A02/A03），也不是「路径没被测到」（FP-A19）——**派发表本身是错的，任何输入只要落到该 dtype 就必现**。五个子型：① **映射表条目错配**（同宽度的兄弟 dtype 表现不同，可排除单一宽度搬运解释）；② **类型特化路径缺失**（bool / 无符号类型走默认或错误模板，掩码边界按有符号/位宽语义计算）；③ **分派后输出覆盖不全**（部分元素未写却返回成功，未写区域保留调用方预填值）；④ **输出 dtype 被误当计算 dtype**（用 `GetSizeByDataType(outDataType)` 推容量/临时 buffer 尺寸，而该算子实际在更宽类型上计算——如 BF16/INT8 输出、FP32 中间计算。**位宽差 2~4 倍，容量估算系统性偏小或偏大**，表现为 tiling 分块数错、单次处理量错、workspace 不足；与 ①的区别是「dtype 都对，但用错了**哪个** dtype」）。 ⑤ **出参 dtype 未纳入白名单/一致性校验（v6.33）**：`out` 只做了 `CheckNotNull`，没有 `OP_CHECK_DTYPE_NOT_SUPPORT(out, ...)`，也没有 `self/out dtype` 一致性检查；非法 out dtype 被放行后由 kernel 按错误位宽写，表现为部分输出未写或结果错。","conditions":"kernel 用 `dtype` / `sizeof(T)` / `TILING_KEY` / 函数指针表做模板派发，且映射表是**手写枚举**而非 `if constexpr` 全覆盖；同一算子支持 ≥5 种 dtype（尤其同时含 `int32/uint32`、`int64/uint64`、`bool`、`uint8`）；输出 shape 非 1 元素且按行/块写入。**单 dtype 用例无法暴露**——必须跑 dtype 全组合矩阵，并与同宽度兄弟 dtype 对照。","manifest":"① **特定 dtype 返回 0 但输出部分未写**——`out` 预填魔数后回读，未写区域原样保留（#3747：`uint32`/`int64` 后 `ceil(n/2)` 个元素一个字节都没写）；② **掩码/布尔结果边界错位**——全量写出但保留/置零边界算错，误差随规模放大（#3748：3×3 错 4/9、4×4 错 12/16、8×8 错 42/64）；③ **同宽度兄弟 dtype 对照分裂**——`int32` 对而 `uint32` 错、`uint64` 对而 `int64` 错，这一条是排除「按字节宽度搬运」解释的关键判据。**关键识别特征：缺陷只随 dtype 变化，与 shape、数值范围、调用顺序无关。**","mapping":"① 找到 dtype → 模板/TilingKey 的**映射表**（`switch (dtype)`、`if (dtype == ...)` 链、`std::unordered_map`、函数指针数组），逐项核对枚举值是否**每个受支持 dtype 都有条目**且指向正确模板；② 每个模板的**输出循环上界**是否取自该 dtype 自身的元素数/字节数，而非由其他 dtype 推导（漏写一半常见于「按 8 字节元素数算 4 字节 dtype」或反过来的复用）；③ `bool` 的存储宽度与掩码语义——按位还是按字节、`true` 的表示、边界 `i + diagonal >= j` 的比较是否在正确类型域；④ 是否存在 `default:` 静默兜底（兜底到某模板而不报错 = 高危）；⑤ **同接口其他 dtype 与同族算子**（前向/反向、`tril`/`triu`）是否复制了同一张表。**子型④（v2.18）额外查**：所有 `GetSizeByDataType(...)` / `GetTypeSize(...)` 的实参——是 `outDataType`/`outputDtype`（输出存储）还是 `calcDataType`（实际计算）？该尺寸喂给谁（临时 buffer 容量 / 每核元素数 / 单次处理量 / 循环次数）？**只要该尺寸用于计算容量而非输出分配，就必须用计算 dtype**；查是否已有 `calcDtype` 映射表（BF16/INT32→FP32、INT8/UINT8/INT16→FP16 这类），以及该映射是否覆盖算子支持的全部输出 dtype。","signatures_text":"子型④ 可机器定位：`GetSizeByDataType\\s*\\(\\s*(outDataType|outputDtype|outDtype)\\s*\\)`（配置内比对，同一文件若存在 `calcDataType` 却未用于该处即高危）。其余子型**暂无机器签名**（新增签名须重跑 `scripts/sig_yield.py` 重建产出基线，避免与既有 ops-math 语料基线不可比）。人工核查命令：\n  ```bash\n  git grep -nE \"switch\\s*\\(\\s*(dtype|dataType|DT_)\" -- <op>/op_kernel/\n  git grep -nE \"TILING_KEY|tilingKey|GetTypeSize|sizeof\\(\" -- <op>/op_kernel/\n  git grep -nE \"default\\s*:\" -- <op>/op_kernel/\n  ```\n  ```bash\n  # 子型④：输出 dtype 被拿去算容量\n  git grep -nE \"GetSizeByDataType\\s*\\(\\s*(outDataType|outputDtype)\" -- <op>/op_host/\n  git grep -nE \"calcDataType|calcDtype|computeDtype\" -- <op>/op_host/\n  ```\n  先列出受支持 dtype 全集（`def.cpp` 的 `DataType(dtypeList)` / `binary.json`），再与映射表条目做**差集**——差集非空且落到 `default` 即候选。","keywords_text":"`dtype 分派|type dispatch|dtype.*template`；`模板映射表|dispatch table`；`GetTypeSize|sizeof`；`default:`；`bool|uint32|uint64|int64`；`输出覆盖率|canary 预填`。","intercept":"① **dtype × shape 全组合矩阵**——对每个受支持 dtype 至少跑「1 元素 / 非整除行宽 / 带 diagonal 边界」三档，断言返回码 + 输出全量正确；② **输出 buffer 预填魔数**（如 `0x7FC07FC0` 重复），跑后统计残留比例，任何非零残留即失败——这是发现「部分未写」最快的判据，禁止只断言返回码；③ **同宽度兄弟 dtype 成对对照**（`int32` vs `uint32`、`int64` vs `uint64`、`bool` vs `uint8`），两者结果必须各自正确，不能互相替代；④ CI 里把「映射表条目集合 == `def.cpp` 支持的 dtype 集合」做成静态差集门禁。**子型④ 额外测**：对每个「输出 dtype ≠ 计算 dtype」的组合（BF16、INT8、UINT8、INT16、INT32）分别跑单次 + **连续多次**调用，断言返回码、输出数值与 tiling 分块数一致；把「输出元素数跨 tiling 分块边界」的 shape 纳入矩阵（位宽算错时该边界最先暴露）；用 tiling UT 直接断言 `CalcMaxOutNum`/每核元素数的返回值，比端到端更快定位。","evidence_text":"`cann/ops-math` **#3747**（`aclnnTril`，2026-10-21）——`self` 为 `uint32` 或 `int64` 时两段接口均返回 0，但 4×4 输出后 8/16 个元素一个字节都没写（预填值 `0x7FC07FC0` 原样保留），已写部分掩码也错；未写元素数恒为 `ceil(n/2)`（3×3 4/9、4×8 16/32）。同为 4 字节的 `int32` 与同为 8 字节的 `uint64` 全部正确，issue 据此排除「按字节宽度搬运」的单一解释，指向 `dtype → 执行模板` 映射表条目错配。`cann/ops-math` **#3748**（同算子，2026-10-21）——`bool` 下全量写出但掩码边界错位（3×3 错 4/9、4×4 错 12/16、8×8 错 42/64），与其它 dtype 走同一条按字节宽度分派路径却只错在掩码，属类型特化语义错误。两条同日、同算子、不同 dtype，构成 O3。**子型④ 实证（v2.18 增补，现网修复复盘 26-01）**：`cann/ops-math` `aclnnLinSpace`（issue #1004）——tiling 的 `CalcMaxOutNum` 用 `ge::GetSizeByDataType(outDataType)` 取宽度做容量推导，而 LinSpace 对 BF16/INT32 实际在 **FP32** 上计算、对 INT8/UINT8/INT16 在 **FP16** 上计算；位宽差 2~4 倍 → 尺寸估算错 → 连续调用报错。修复引入 `calcDataType` 映射后取宽度。修复后形态锚：`math/lin_space/op_host/lin_space_tiling.cpp:122-132`（@ops-math HEAD `9a37afe`，2026-11-05 本地核验）。**注意**：该修复只改了这一处尺寸推导，未清理任何跨调用状态——原单标题写「连续调用」，但 diff 里没有状态复位，故本案**不能**按 FP-A21 跨调用残留定根因。 **2026-11 批次（v6.33 反哺）**：本簇
