<style>
:root{--ink:#172c38;--muted:#60717c;--line:#dbe3e7;--blue:#175a77;--pale:#ecf4f6;--green:#196747;--amber:#865c19}*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:var(--ink);font:15px/1.65 system-ui,'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button,a,input,select,summary{outline-offset:4px}a{color:var(--blue)}header{background:#142c39;color:#fff;padding:28px max(24px,calc((100vw - 1320px)/2));border-bottom:4px solid #48b5a6}.eyebrow{font-size:12px;letter-spacing:2px;color:#9bd0ce}h1{font-size:28px;font-weight:650;margin:5px 0 10px}header p{color:#d3e3e8;max-width:1050px;margin:0}nav{display:flex;gap:5px;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:10px max(20px,calc((100vw - 1320px)/2));position:sticky;top:0;z-index:4}nav button{border:0;background:none;padding:9px 15px;border-radius:5px;color:var(--muted);cursor:pointer}nav button[aria-selected=true]{background:var(--blue);color:#fff}main{max-width:1360px;margin:0 auto;padding:24px}.panel{display:none}.panel.active{display:block}h2{font-size:22px;margin:0 0 5px}h3{margin:0 0 8px;font-size:18px}.muted{color:var(--muted)}.note{background:#eaf2f5;border-left:3px solid #2f879e;padding:12px 16px;margin:15px 0}.warn{background:#fff8e9;border-left-color:#b68528}.stats{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin:18px 0}.stat{background:#fff;border:1px solid var(--line);padding:18px;border-radius:7px}.stat strong{display:block;font-size:30px;line-height:1.2;letter-spacing:-1px}.stat small{color:var(--muted)}.columns{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:18px;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0;align-items:center}.toolbar input{flex:1;min-width:220px}input,select{border:1px solid #becbd1;border-radius:5px;background:#fff;padding:8px 10px}.btn{border:1px solid #b6c8d1;border-radius:5px;background:#fff;padding:7px 12px;cursor:pointer;color:var(--blue)}.btn:hover{background:var(--pale)}.tags{display:flex;flex-wrap:wrap;gap:5px}.tag{display:inline-block;border:1px solid #c9d7de;border-radius:4px;padding:1px 7px;font:12px/1.8 ui-monospace,monospace;background:#f4f7f8;color:#3a5362;margin:2px 3px 2px 0}.l2{color:var(--green);background:#edf7f0;border-color:#bedbc7}.l3{color:#325d92;background:#eef3fb}.l4{color:#754e84;background:#f4edf7}.pending{color:var(--amber);background:#fff8e9}.row{border:1px solid var(--line);border-radius:6px;background:#fff;margin:9px 0;overflow:hidden}summary{cursor:pointer;padding:14px 16px;font-weight:600}summary:hover{background:#f4f8fa}.body{padding:0 18px 18px;border-top:1px solid #edf0f2}.body p{margin:10px 0}table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0}th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--muted);background:#eef2f4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f5f7;padding:12px;border-radius:5px;font:12px/1.65 ui-monospace,monospace}.source{font-size:12px;color:#687b86;overflow-wrap:anywhere}.mini{font-size:13px}.empty{padding:24px;color:var(--muted);border:1px dashed #b9cbd4;background:#fff}.theme{display:inline-block;margin:3px}.bar{height:8px;border-radius:6px;background:#e5ecef;overflow:hidden}.bar span{display:block;height:100%;background:#3c8993}.tree{margin:12px 0;padding:12px;background:#fff;border:1px solid var(--line)}.tree summary{padding:3px 0}.metric-table td:first-child{font-weight:600}.countline{font-size:13px;color:var(--muted);margin:8px 0}footer{border-top:1px solid var(--line);padding:18px 25px;font-size:12px;color:var(--muted)}@media(max-width:800px){main{padding:15px}.columns{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}nav{position:static;padding:8px}nav button{padding:7px 10px}.toolbar input{min-width:100%}table{font-size:13px}th,td{padding:7px}.stat strong{font-size:26px}}@media print{nav,.toolbar{display:none}.panel{display:block!important}details{break-inside:avoid}header{background:#fff;color:#111}header p{color:#333}.body{display:block}}
</style></head><body>
<header><div class="eyebrow">CANN · ORIGINAL 30 REVIEW · 2026.11.11</div><h1>原30条模式：API42 / V4逐条说明</h1><p>以历史事实建立稀疏关联，分开技术相关、历史代表、测试设计和运行验证。42与55独立计数；没有代表不是不适用，分类也不等于根因已证实。</p></header>
<div role="note" class="note warn" style="max-width:1320px;margin:14px auto">__UI_VERIFICATION__</div>
<nav role="tablist" aria-label="报告视图"><button data-tab="overview" role="tab" aria-selected="true">概览</button><button data-tab="api" role="tab" aria-selected="false">42项API条件</button><button data-tab="v4" role="tab" aria-selected="false">55种V4情形</button><button data-tab="modes" role="tab" aria-selected="false">30条模式比较</button><button data-tab="gaps" role="tab" aria-selected="false">覆盖缺口</button><button data-tab="review" role="tab" aria-selected="false">关联与证据审查</button><button data-tab="discussion" role="tab" aria-selected="false">最新讨论更新</button><button data-tab="handoff" role="tab" aria-selected="false">Init与续跑清单</button></nav>
<main><section id="overview" class="panel active" role="tabpanel"></section>
<section id="api" class="panel" role="tabpanel"></section><section id="v4" class="panel" role="tabpanel"></section><section id="modes" class="panel" role="tabpanel"></section><section id="gaps" class="panel" role="tabpanel"></section><section id="review" class="panel" role="tabpanel"></section><section id="discussion" class="panel" role="tabpanel"></section><section id="handoff" class="panel" role="tabpanel"></section></main>
<footer>讨论更新版 · 原Init和现有来源资料按用户要求附包 · 未自动入库 / ACCEPT / 冻结 · 运行覆盖为0 · HTML离线自包含，无网络请求</footer>
<script id="coverage-data" type="application/json">__COVERAGE_DATA__</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('coverage-data').textContent);
const names={L1:'技术相关',L2:'历史代表',L3:'测试设计',L4:'实测验证'};
const esc=x=>String(x??'UNKNOWN').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const has=(v,q)=>!q||JSON.stringify(v).toLowerCase().includes(q.toLowerCase());
const tags=values=>values.map(v=>`<span class="tag">${esc(v)}</span>`).join('');
const levels=c=>Object.keys(names).filter(l=>c[l]).map(l=>`<span class="tag ${l.toLowerCase()}">${l} ${names[l]}</span>`).join('')||'<span class="tag pending">无已知代表</span>';
const link=(system,id)=>`<button class="btn mini" data-condition-system="${esc(system)}" data-condition-id="${esc(id)}">${esc(id)}</button>`;
const fact=f=>`<p><strong>${esc(f.field||f.basis)}</strong> · ${esc(f.evidence_id)}<br>${esc(f.text)}<br><span class="source">${esc(f.source_id)}</span></p>`;
const ref=r=>`<div class="source">${esc(r.document_id)} / ${esc(r.path)} · L${r.line_start}–${r.line_end} · chars ${r.char_start}–${r.char_end} · ${esc(r.source_id)}</div>`;
function mapping(r){return `<details class="row"><summary>${esc(r.mode_id)} ↔ ${esc(r.condition_system)} ${esc(r.condition_id)} ${tags(r.coverage_levels)}</summary><div class="body"><p><strong>理由：</strong>${esc(r.reason)}</p><p><strong>限制：</strong>${esc(r.limitation)}</p><p>${esc(r.basis)} · ${esc(r.relation_status)} · 类范围 ${esc(r.condition_class_scope.join(', ')||'原42本项')}</p>${r.original_facts.map(fact).join('')}${r.source_reference.map(ref).join('')}${r.test_design_ids.map(design).join('')}</div></details>`}
function design(id){const d=DATA.designs.find(x=>x.design_id===id);return `<details class="row"><summary>${esc(d.design_id)} · 设计，未运行</summary><div class="body"><p><strong>目标：</strong>${esc(d.target)}</p><p><strong>输入：</strong>${esc(d.inputs)}</p><p><strong>参考：</strong>${esc(d.reference)}</p><p><strong>预期异常：</strong>${esc(d.expected_failure)}</p><p><strong>验收：</strong>${esc(d.acceptance)}</p><p>${esc(d.environment_requirements.join('；'))}</p><p>${esc(d.limitations)}</p><p><a href="${esc(d.api_contract_source)}" target="_blank" rel="noreferrer">官方API契约</a>，不代表NPU路径已经核验</p><pre>${esc(d.code)}</pre></div></details>`}
function external(e){return `<details class="row"><summary>${esc(e.evidence_id)} · ${esc(e.status)}</summary><div class="body"><p><a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.url)}</a></p><p>${esc(e.repo)} · ${esc(e.pr_issue_commit)} · ${esc(e.captured_date)}</p><p><strong>原问题：</strong>${esc(e.original_problem)}</p><p><strong>输入条件：</strong>${esc(e.input_conditions)}</p><p><strong>实现及修复：</strong>${esc(e.implementation_defect)}；${esc(e.fix)}</p><p><strong>文件/函数：</strong>${esc(e.modified_files.join('；'))} / ${esc(e.functions.join('；'))}</p><p><strong>测试：</strong>${esc(e.tests)}</p><p><strong>与原模式：</strong>${esc(e.mode_relation)} · 同一历史事件 ${esc(e.same_historical_event)}</p><p>${esc(e.limitations)}</p></div></details>`}
function condition(c){const led=c.condition_system==='API42'?DATA.api42:DATA.v4;const rs=DATA.relations.filter(r=>r.condition_system===c.condition_system&&r.condition_id===c.condition_id);const bad=DATA.rejected.filter(r=>r.condition_system===c.condition_system&&r.condition_id===c.condition_id);const defs=c.condition_system==='API42'?`<p><strong>项Requires：</strong>${esc(c.requires.join('；')||'见族/全局约束')}</p><p><strong>项Skip：</strong>${esc(c.skip_if.join('；')||'见族/全局约束')}</p><pre>${esc(c.family_source.source_quote)}</pre>`:c.original_class_predicates.map(p=>`<details class="row"><summary>${esc(p.id)} ${esc(p.name)} · 原始前提</summary><div class="body"><p>${esc(p.definition)}</p><p><strong>Requires：</strong>${esc(p.original_requires.join('；'))}</p><p><strong>Skip/能力限制：</strong>${esc(p.original_skip_if.join('；'))}</p></div></details>`).join('');return `<details class="row condition-row" data-condition="${esc(c.condition_id)}"><summary>${esc(c.condition_id)} · ${esc(c.name)}<br>${levels(c.coverage)}</summary><div class="body"><p><strong>原始定义：</strong>${esc(c.definition)}</p><p class="source">SHA ${esc(c.source_sha256)} · ${esc(c.source_file||c.original_source_occurrences?.[0]?.source_file)} · ${esc(c.line_start||c.original_source_occurrences?.[0]?.line_start)}</p>${defs}${DATA.discussions.filter(d=>d.v4_scenario_ids?.includes(c.condition_id)&&c.condition_system==="V4").map(d=>discussionCard(d,d.mode_id)).join("")}<p><strong>逐项审查：</strong>${esc(c.gap_review)}</p><p><strong>适用性：</strong>UNKNOWN，依目标接口与完整前提判断；没有代表不等于不适用。</p><p><strong>原30历史代表：</strong>${esc(c.historical_representative_mode_ids.join(', ')||'暂无')}</p>${rs.map(mapping).join('')}${c.weekly_candidates.length?'<h4>周报候选（不计原30覆盖）</h4>'+c.weekly_candidates.map(w=>`<p>${esc(w.wb_id)} ${esc(w.description)}<br>${esc(w.reason)}<br><span class="source">${esc(w.source_id)}</span></p>`).join(''):`<p class="muted">${esc(c.weekly_review_note)}</p>`}${c.external_reference_ids.map(id=>external(DATA.external.find(e=>e.evidence_id===id))).join('')}${bad.length?'<h4>拒绝的候选</h4>'+bad.map(rejected).join(''):''}${c.condition_system==='V4'?`<details class="row"><summary>所属条件类的指导案例（非逐情形审定，非实测）</summary><div class="body">${DATA.v4.guidance.filter(g=>c.guidance_ids.includes(g.guide_id)).map(g=>`<p><strong>${esc(g.guide_id)} ${esc(g.title)}</strong><br>${esc(g.text)}</p>`).join('')}</div></details>`:''}</div></details>`}
function rejected(r){return `<details class="row"><summary>${esc(r.candidate_id)} ${esc(r.mode_id)} ↛ ${esc(r.condition_system)} ${esc(r.condition_id)}</summary><div class="body"><p>${esc(r.reason)}</p><p class="muted">不认可当前历史代表主张，不表示此条件全局不适用。</p>${r.counterexample_or_boundary.map(fact).join('')}${r.source_reference.map(ref).join('')}</div></details>`}
function navigate(tab){document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab));}
function focusCondition(system,id){const tab=system==='API42'?'api':'v4';navigate(tab);document.getElementById(tab+'-q').value=id;document.getElementById(tab+'-level').value='ALL';renderConditions(tab);const row=document.querySelector('#'+tab+' .condition-row');if(row){row.open=true;row.scrollIntoView({block:'start',behavior:'smooth'})}}
function metrics(){return `<table class="metric-table"><thead><tr><th>独立体系</th>${Object.keys(names).map(l=>`<th>${l} ${names[l]}</th>`).join('')}</tr></thead><tbody>${[[DATA.api42,42],[DATA.v4,55]].map(([l,den])=>`<tr><td>${l.system}</td>${Object.keys(names).map(k=>`<td data-metric="${l.system}-${k}"><strong>${l.coverage_counts[k]}/${den}</strong></td>`).join('')}</tr>`).join('')}</tbody></table>`}
function overview(){document.getElementById('overview').innerHTML=`<h2>数据完成，覆盖分层</h2><p class="muted">30条已初始化模式 · 97条条件逐项审查 · 不继承旧555案的覆盖率</p><div class="stats"><div class="stat"><strong>30/30</strong><small>模式侧分析完成</small></div><div class="stat"><strong>42 + 55</strong><small>完整条件账本</small></div><div class="stat"><strong>${DATA.summary.sparse_relation_count}</strong><small>有解释的稀疏关联</small></div><div class="stat"><strong>0</strong><small>设备执行记录</small></div></div>${metrics()}<div class="note">分子按唯一条件ID去重。L1不等于历史覆盖；L2来自已记录历史摘要，不是本轮原文核验；L3是新设计；L4必须有执行记录。层次可重叠，不能相加或自动升级。</div><div class="columns"><div class="card"><h3>历史代表究竟有哪些？</h3><p><strong>API42：</strong>${DATA.api42.conditions.filter(c=>c.coverage.L2).map(c=>link('API42',c.condition_id)).join(' ')}</p><p><strong>V4：</strong>${DATA.v4.conditions.filter(c=>c.coverage.L2).map(c=>link('V4',c.condition_id)).join(' ')}</p><p class="muted">包括M017符合精度标准的跨配置变化，不能把所有历史代表都说成已证实Bug。</p></div><div class="card"><h3>测试设计与待执行</h3><p>${DATA.designs.map(d=>esc(d.target)).join(' · ')}</p><p>3份完整输入、参考、验收及代码片段。仅语法检查；硬件运行和目标路径验证仍为0。</p><p>E1–E5在模式详情独立展示，不进入55分母。</p></div></div><div class="note warn"><strong>补证后的纠正：</strong>GitHub12123最终patch的容差断言是上下文行，不能仅凭旧评论认定最终改了标准。2026-11-10原30审查时的读取状态保留；后续19条公开代码案例单列在另一份报告，不反填原30历史事件。</div><details class="row"><summary>定义版本与统计来源</summary><div class="body"><p>API42 ${esc(DATA.api42.source_file)}<br><span class="source">${esc(DATA.api42.source_sha256)}</span></p><p>V4 ${esc(DATA.v4.source_file)}<br><span class="source">${esc(DATA.v4.source_sha256)}</span></p><p>仅原始Requires/Skip。旧V3.2借鉴展示与同情景边界，不导入555案标签。未创建2910格语义判断。</p></div></details>`}
function setupConditions(tab,system){const l=system==='API42'?DATA.api42:DATA.v4;document.getElementById(tab).innerHTML=`<h2>${system==='API42'?'42项API输入构造条件':'55种V4具体构造情形'}</h2><p class="muted">${system==='API42'?'35项数据条件 + 7项API控制；严格保留原始族级硬前提。':'6主题、31条件类、55唯一情形、64次挂载；E1–E5独立。'}</p>${system==='V4'?`<details class="tree"><summary>查看6主题 / 31条件类导航</summary>${DATA.v4.themes.map(t=>`<div><h3>${esc(t.id)} ${esc(t.name)}</h3>${DATA.v4.classes.filter(c=>c.family_id===t.id).map(c=>`<details><summary>${esc(c.id)} ${esc(c.name)}</summary><p>${esc(c.definition)}</p><p>Requires：${esc(c.original_requires.join('；'))}</p><p>Skip：${esc(c.original_skip_if.join('；'))}</p><div>${c.construction_ids.map(id=>link('V4',id)).join(' ')}</div></details>`).join('')}</div>`).join('')}</details>`:''}<div class="toolbar"><input id="${tab}-q" aria-label="${system}搜索" placeholder="搜索ID、模式、定义或缺口"><select id="${tab}-level" aria-label="${system}覆盖层筛选"><option value="ALL">全部条件</option><option value="L1">L1 技术相关</option><option value="L2">L2 历史代表</option><option value="L3">L3 测试设计</option><option value="L4">L4 实测验证</option><option value="NO_L2">没有历史代表</option><option value="NO_L3">没有具体设计</option></select><button class="btn" data-clear="${tab}">清除筛选</button></div><div id="${tab}-count" class="countline"></div><div id="${tab}-list"></div>`;document.getElementById(tab+'-q').addEventListener('input',()=>renderConditions(tab));document.getElementById(tab+'-level').addEventListener('change',()=>renderConditions(tab));renderConditions(tab)}
function renderConditions(tab){const l=tab==='api'?DATA.api42:DATA.v4;const q=document.getElementById(tab+'-q').value;const lev=document.getElementById(tab+'-level').value;const exact=l.conditions.find(c=>c.condition_id.toLowerCase()===q.trim().toLowerCase());const found=l.conditions.filter(c=>(exact?c===exact:has(c,q))&&(lev==='ALL'||(lev.startsWith('NO_')?!c.coverage[lev.slice(3)]:c.coverage[lev])));document.getElementById(tab+'-count').textContent=`显示 ${found.length} / ${l.conditions.length} 个唯一条件；全局覆盖分母保持 ${l.conditions.length}`;document.getElementById(tab+'-list').innerHTML=found.length?found.map(condition).join(''):'<div class="empty">没有匹配的条件；筛选为空不表示条件不适用。</div>'}
function modeCard(m){return `<details class="row mode-row"><summary>原第${esc(m.original_order)}条／${esc(m.mode_id)} ${esc(m.mode_name)}<br>${tags([m.init_status,m.mode_definition_status])}</summary><div class="body">${discussionCard(m.discussion_classification,m.mode_id)}<p><strong>原定义：</strong>${esc(m.original_definition)}</p><p><strong>CANN失效机理：</strong>${esc(m.failure_mechanism.text)}</p><p><strong>对象：</strong>${esc(m.fault_object.text)}</p><p><strong>输入：</strong>${esc(m.input_trigger_conditions.text)}</p><p><strong>执行：</strong>${esc(m.execution_trigger_conditions.text)}</p><p><strong>dtype/数值域：</strong>${esc(m.fact_inventory.dtype_and_numeric_domain)}</p><p><strong>shape/layout/stride：</strong>${esc(m.fact_inventory.shape_layout_stride)}</p><p><strong>实现路径：</strong>${esc(m.fact_inventory.implementation_path_and_control)}</p><div>${m.api42_ids.map(id=>link('API42',id)).join(' ')} ${m.v4_scenario_ids.map(id=>link('V4',id)).join(' ')}</div><p>${esc(m.analysis_note)}</p>${DATA.relations.filter(r=>r.mode_id===m.mode_id).map(mapping).join('')}${m.execution_method_ids.length?'<h4>独立执行维度（设计方向，未验收/运行）</h4>'+m.execution_method_ids.map(id=>{const e=DATA.v4.execution_methods.find(e=>e.method_id===id);return `<details class="row"><summary>${esc(e.name)}</summary><div class="body"><p>${esc(e.definition)}</p><p class="muted">技术测试指导，不据此确认同步根因。</p></div></details>`}).join(''):''}<p><strong>缺口：</strong>${esc(m.unresolved_gaps.join('；'))}</p></div></details>`}
function setupModes(){document.getElementById('modes').innerHTML=`<h2>原30条逐条说明与分类理由</h2><p class="muted">按原表顺序展示，保留M编号。讨论暂记与既有L1–L4统计分别显示；共享标签不自动合并模式。</p><div class="toolbar"><input id="modes-q" aria-label="模式搜索" placeholder="mode_id、算子、机理、shape"><button class="btn" data-clear="modes">清除</button></div><div id="modes-count" class="countline"></div><div id="modes-list"></div>`;document.getElementById('modes-q').addEventListener('input',renderModes);renderModes()}
function renderModes(){const q=document.getElementById('modes-q').value;const found=DATA.modes.filter(m=>has(m,q));document.getElementById('modes-count').textContent=`显示 ${found.length} / 30 条模式`;document.getElementById('modes-list').innerHTML=found.map(modeCard).join('')||'<div class="empty">没有匹配模式</div>'}
function setupGaps(){document.getElementById('gaps').innerHTML=`<h2>覆盖缺口</h2><p class="muted">未知、不适用、缺少历史代表、能力阻塞和未执行保持区别。</p><div class="toolbar"><input id="gaps-q" aria-label="缺口搜索" placeholder="搜索条件与具体缺口"><select id="gap-kind" aria-label="缺口类型"><option value="NO_L2">无历史代表</option><option value="L1_ONLY">仅技术相关、无历史代表</option><option value="HISTORY_NO_DESIGN">有历史、无具体设计</option><option value="DESIGN_NO_RUN">有设计、未实测</option><option value="ALL">全部97项</option></select></div><div id="gaps-count" class="countline"></div><div id="gaps-list"></div><h3>根因与来源冲突</h3><div class="note warn">M004摘要内部归因冲突；M015/W08证据错位；M023权限元信息；M010/M014/M019缺历史链接。它们已完成数据Init，仍保留未确认。模式视图可查原定义和缺口。</div>`;document.getElementById('gaps-q').addEventListener('input',renderGaps);document.getElementById('gap-kind').addEventListener('change',renderGaps);renderGaps()}
function renderGaps(){const kind=document.getElementById('gap-kind').value,q=document.getElementById('gaps-q').value;const found=[...DATA.api42.conditions,...DATA.v4.conditions].filter(c=>has(c,q)&&(kind==='ALL'||kind==='NO_L2'&&!c.coverage.L2||kind==='L1_ONLY'&&c.coverage.L1&&!c.coverage.L2||kind==='HISTORY_NO_DESIGN'&&c.coverage.L2&&!c.coverage.L3||kind==='DESIGN_NO_RUN'&&c.coverage.L3&&!c.coverage.L4));document.getElementById('gaps-count').textContent=`${found.length} 个唯一条件；不是模式数或关系数`;document.getElementById('gaps-list').innerHTML=found.map(c=>`<div class="card"><strong>${esc(c.condition_system)} ${link(c.condition_system,c.condition_id)} ${esc(c.name)}</strong><p>${esc(c.gap_review)}</p>${levels(c.coverage)}</div>`).join('')}
function setupReview(){document.getElementById('review').innerHTML=`<h2>关联与证据审查</h2><p class="muted">按mode_id、condition_id、WB ID或PR编号查询；确认与拒绝的理由都可展开。</p><div class="toolbar"><input id="review-q" aria-label="证据搜索" placeholder="例如 M015、minus_one、WB-036、12123"><select id="review-kind" aria-label="审查记录类型"><option value="ALL">全部记录</option><option value="MAP">稀疏关联</option><option value="REJECT">拒绝候选</option><option value="EXT">定向补证</option><option value="SOURCE">原文档证据索引</option></select><button class="btn" data-clear="review">清除</button></div><div id="review-count" class="countline"></div><div id="review-list"></div>`;document.getElementById('review-q').addEventListener('input',renderReview);document.getElementById('review-kind').addEventListener('change',renderReview);renderReview()}
function sourceCard(e){return `<details class="row"><summary>${esc(e.evidence_id)} · ${esc(e.basis)} · 原文未独立核验</summary><div class="body">${Object.entries(e.fields).map(([k,v])=>`<p><strong>${esc(k)}：</strong>${esc(v)}</p>`).join('')}<p class="source">${esc(e.source_ids.join(', '))}</p>${e.url?`<a href="${esc(e.url)}" target="_blank" rel="noreferrer">来源链接</a>`:''}</div></details>`}
function renderReview(){const q=document.getElementById('review-q').value,kind=document.getElementById('review-kind').value;const groups=[['MAP',DATA.relations,mapping],['REJECT',DATA.rejected,rejected],['EXT',DATA.external,external],['SOURCE',DATA.evidence_index,sourceCard]];let count=0,html='';for(const [type,rows,draw] of groups){if(kind!=='ALL'&&kind!==type)continue;const found=rows.filter(r=>has(r,q));count+=found.length;if(found.length)html+=`<h3>${esc({MAP:'稀疏关联',REJECT:'拒绝候选',EXT:'本轮补证',SOURCE:'文档记录'}[type])} · ${found.length}</h3>`+found.map(draw).join('')}document.getElementById('review-count').textContent=`找到 ${count} 条记录（单位按记录类型，不能作为覆盖率）`;document.getElementById('review-list').innerHTML=html||'<div class="empty">没有匹配记录；不是不相关的证据。</div>'}

function discussionCard(d,mid){if(!d)return '';return `<div class="note warn" data-discussion="${esc(mid)}"><strong>${esc(mid)} · 2026-11-11讨论更新</strong><p>${esc(d.note||d.mechanism_refinement)}</p>${d.v4_scenario_ids?.length?'<p>暂记V4构造：'+d.v4_scenario_ids.map(id=>link('V4',id)).join(' ')+'</p>':''}${d.v4_class_candidates?.length?'<p>条件类待核对方向：'+esc(d.v4_class_candidates.join(', '))+'；尚未指定新的55构造。</p>':''}${d.input_dependency?'<p>输入依赖：'+esc(d.input_dependency)+'；复现概率：'+esc(d.reproduction_status)+'</p>':''}${d.fix_version?'<p>修复版本线索：'+esc(d.fix_version.value)+'（用户提供，未取得合入证明）</p>':''}<p class="mini">来源：用户讨论；具体条件/修复证据待确认，未实测。不据此增加L2历史代表或L4设备覆盖，也未产生人工ACCEPT。</p></div>`}
function setupDiscussion(){document.getElementById('discussion').innerHTML='<h2>最新讨论更新</h2><p>保留原声明和先前证据状态，记录用户对原第2、3、4条的补充。M006暂记minus_one；M026保留待补证；M004补充缓冲区模式参数传播机理。</p>'+DATA.discussions.map(d=>discussionCard(d,d.mode_id)).join('')+'<p>既有覆盖：API42 L1 18/42、L2 3/42；V4 L1 21/55、L2 6/55。讨论暂记不静默并入这些分子。</p>'}
function setupHandoff(){const a=DATA.availability;document.getElementById('handoff').innerHTML=`<h2>Init与续跑清单</h2><div class="note">30/30已完成数据Init和本份稀疏分类整理；没有完成或冻结现场A1–A5工作流。JSON中的COMPLETE限于DATA_INITIALIZATION_ONLY。</div><div class="card"><h3>已提供</h3><p>原始数据Init、来源清单、两份已脱敏Markdown转录、原42与V4文件：<a href="original_init_and_sources.zip">原始Init与来源包</a></p><p>0.1.17原30条预检数据库与完整任务目录：<a href="legacy_original30_preflight.zip">历史预检state包</a>。每run有30条记录、30个请求、0个完成结果，不能标为已完成工作流。</p><p><a href="README.md">逐条Markdown说明</a> · <a href="CHAMBER_HANDOFF.md">OpenChamber续接说明</a> · <a href="archive_manifest.json">原文件逐项SHA-256</a></p></div><div class="card"><h3>本机查找结果与缺失</h3><p>可读C/D目录命中${a.matching_init_or_baseline_files}个相关文件，读取${a.sqlite_databases_read}份数据库；部分系统目录无权限，不能称全盘无遗漏。</p><p>现场run：${esc(a.onsite_run.run_id)} · ${esc(a.onsite_run.status)}。原始cann_modes.xlsx和28份原始网页采集文件未找到。Markdown转录与原网页快照不同。</p><p>已有init_frozen_baseline旧文件对应15类INF模式，不能当作这30条基线。</p><pre>${esc(JSON.stringify(a,null,2))}</pre></div><div class="note warn">现场保留原run并先备份state。历史预检包只供核对，不能覆盖现场数据库。任务需按当前策略生成，先核对代表记录，再连续推进全部30条；不每10条申请，不自动ACCEPT或冻结，不启动设备测试。</div>`}

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)navigate(b.dataset.tab)});
document.addEventListener('click',e=>{const c=e.target.closest('[data-condition-id]');if(c){focusCondition(c.dataset.conditionSystem,c.dataset.conditionId);return}const clear=e.target.closest('[data-clear]');if(clear){const t=clear.dataset.clear;document.getElementById(t+'-q').value='';if(t==='api'||t==='v4'){document.getElementById(t+'-level').value='ALL';renderConditions(t)}else if(t==='modes')renderModes();else{document.getElementById('review-kind').value='ALL';renderReview()}}});
overview();setupConditions('api','API42');setupConditions('v4','V4');setupModes();setupGaps();setupReview();setupDiscussion();setupHandoff();
</script></body></html>
