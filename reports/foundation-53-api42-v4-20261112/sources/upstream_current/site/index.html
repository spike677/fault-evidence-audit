绿","rule":"san 符号数必须实测为 0，否则 racecheck 同样假绿"},{"id":"K28","fail":"假绿","rule":"AICPU 算子的插桩是空跑，「0 告警」不等于无竞争"},{"id":"K590","fail":"假绿","rule":"真检判据看 per-case 日志有无本算子 kernel，不是 started 计数"},{"id":"K977","fail":"假绿","rule":"只拦到预热算子时该算子结论为空"}],"error-code":[{"id":"K24","fail":"误判","rule":"ACCEPTED 必须是 phase1==0 && phase2==0，单看首段会大批误报"},{"id":"K583","fail":"假 FAIL","rule":"inplace 接口「广播变宽」是 161002 正确拒绝，纯 doc 基线会成片假 FAIL"},{"id":"K679","fail":"流程错","rule":"错误码负例不能与数值用例放同一份 cases.selected.json"},{"id":"K866","fail":"漏检","rule":"dtype 变异只改张量不改 aclScalar → 结构上抓不到标量 dtype 不校验"},{"id":"K990","fail":"假 FAIL","rule":"CanCast 三条禁令须先读：float→int / →bool 被拒是正确行为"},{"id":"K780","fail":"假 FAIL","rule":"整型 self 配浮点标量必被 CanCast 拒，按「支持形态」造数会成片假 FAIL"}],"bitwise":[{"id":"K79","fail":"误判","rule":"多线程位模式不一致先做串行 digest 对照，原地张量尤其必做"},{"id":"K553","fail":"假结论","rule":"夹具 0 产物且单进程 99% CPU → 判挂死，不能记「确定性无问题」"},{"id":"K638","fail":"假 FAIL","rule":"+inf 的 log-sigmoid 输出是 -0.0：按位比对必须先归一符号零"},{"id":"K1189","fail":"假 FAIL","rule":"mtfuzz 的 none 腿对重叠累加算子刷出上千假 FAIL，判据只看 acl 腿"}],"watchdog":[{"id":"K855","fail":"假结论","rule":"run_precision 只在正常退出落盘：timeout 到点 SIGTERM 后结论全丢，只能写「已执行未判定」"},{"id":"K606","fail":"假 HANG","rule":"负向探针成本在子进程 import 不在算子：一例一进程会被冷启动超时判成假 HANG"},{"id":"K1046","fail":"预算白烧","rule":"0 维输入在 --isolate 子进程路径挂死 → 整条精度/确定性线被 SIGTERM"},{"id":"K1061","fail":"静默漏判","rule":"子进程超时口径大于外层预算 → 子进程白跑、结果不落盘"},{"id":"K1023","fail":"假 HANG","rule":"随机 shape 生成器不设元素上限，夹具自身被当成算子 HANG"},{"id":"K523","fail":"假通过","rule":"started>0 且无 finished ≠ 通过（大 kernel 被 SIGKILL）"},{"id":"K794","fail":"无结论","rule":"memcheck 单例 40-60s：预算不够时到点熔断拿不到 verdict"}],"symbol-resolve":[{"id":"K291","fail":"假 BLOCKED","rule":"--op aclnn:<小写> 只在 precision 线能跑，其余五线按 normalize_op 找符号 → undefined symbol"},{"id":"K412","fail":"假 BLOCKED","rule":"自定义算子符号只在 libcust_opapi.so；loader 命中 libopapi.so 就 break"},{"id":"K122","fail":"静默假 PASS","rule":"--focus 之外五条线必须显式注入 PYTHONPATH，否则「未注册算子」静默 rc=2"},{"id":"K15","fail":"假 PASS","rule":"register_spec 冲突被 except 吞掉 → 精度线空跑判 PASS"},{"id":"K854","fail":"假 PASS","rule":"六份 OpSpec 字段不同步时 autoload 静默失败，整条线在测另一个配置"},{"id":"K963","fail":"假 BLOCKED","rule":"现网 CANN 包可能没有新接口，须按仓内源码自建且对齐 libstdc++ ABI"}],"memory-peak":[{"id":"K1211","fail":"无结论","rule":"--scale all 跑全量必超时，到点即无结论"},{"id":"K523","fail":"假通过","rule":"started>0 且无 finished ≠ 通过"},{"id":"K371","fail":"误归因","rule":"cce 子编译被 SIGKILL、.o 全不产出：先跑对照算子再怀疑被测算子"},{"id":"K417","fail":"误归因","rule":"子编译 SIGKILL 的真正根因是主机守护进程每 2s pkill bisheng（承 K371）"}],"log-field":[{"id":"K1084","fail":"误判归因","rule":"平台闸排在参数校验之前时，161002 无法区分「参数非法」与「平台不支持」"},{"id":"K718","fail":"假缺陷","rule":"CONSTRUCT_FAIL 是夹具失败不是缺陷；判据看 note 里是否说找不到输入 tensor 名"},{"id":"K51","fail":"假 PASS","rule":"「校验代码存在」≠「校验生效」，必须确认它在所有可达路径上被调用"},{"id":"K144","fail":"误读","rule":"_DTYPE_ACL_NAME 漏登记被误读成「ACL 不支持」"}],"perf-baseline":[{"id":"K480","fail":"假 PASS","rule":"设计门禁 G6/G16 是字面量匹配，params 缺约定串会静默不判"},{"id":"K154","fail":"假 FAIL","rule":"基线只取属性不取形状：属性依赖 rank，会造出成批非法组合"},{"id":"K1039","fail":"假 FAIL","rule":"「out 缩维」接口的自动基线把 out 造成与 self 同形，基线自检必败"},{"id":"K205","fail":"假 BLOCKED","rule":"同接口同时注册 L1/L2 双标杆，fp16/bf16 整批 BLOCKED，一条缺陷都判不出"}]}},"detectVocab":{"axes":{"dtype":"数据类型轴（同宽兄弟 dtype、低精度/高精度）","shape":"形状轴（尾块、非对齐、退化、大 shape）","layout":"布局/步长/格式轴（ND/transposed/sliced）","boundary":"数值边界轴（INT32_MAX、2^24、2^31、2^32 两侧）","content":"内容敏感输入轴（功能特化：全同/单点差异/离群值/特殊值）","input-validity":"非法入参组合轴（预期被拒）","attr":"属性/枚举/默认值轴","sequence":"调用序列轴（A→B→A、顺序调换、图模式与直调）","bitwise":"重复执行位模式轴","concurrency":"并发/多核/多流轴","golden":"标杆对照轴（与参考实现逐元素比对）","memory":"内存边界轴（越界、未初始化、峰值）","contract":"契约面轴（返回码、错误码、错误信息字段）","perf":"性能轴（跨版本/跨 dtype/跨板型/跨代际基线）","doc":"文档与声明面轴（README/proto/def 三方一致性）"},"axes_to_category":{"dtype":"DT","shape":"SH","layout":"LY","boundary":"BV","attr":"BV","content":"FS","input-validity":"NV","contract":"CT","sequence":"EX","bitwise":"EX","concurrency":"EX","memory":"EX","golden":"SH","perf":"PF","doc":"DC"},"oracle":{"golden-utol":"与标杆逐元素 utol 比对（有数值输出）","golden-canary":"输出 buffer 预填魔数，跑后统计残留比例（查「部分未写/整块未写」）","bitwise":"N 轮重复执行逐 bit 比对（查确定性）","error-code":"断言返回码 + 错误信息关键字段（不满足于 rc!=0）","sanitizer-memcheck":"mssanitizer memcheck（未初始化读/越界写/泄漏）","sanitizer-racecheck":"mssanitizer racecheck（WAW/RAW hazard，零告警为门禁）","watchdog":"单用例硬超时熔断，超时转失败并 dump 栈（查挂死）","log-field":"日志字段/级别/条数基线（查维测与误报）","struct-invariant":"结构不变量（无数组件的替代判据：前缀连续、区间无重叠等）","symbol-resolve":"dlsym 符号可解析 / torch.ops 可访问且不回退","perf-baseline":"性能基线比值（profiler 聚合，含可比性四要素校验）","memory-peak":"峰值内存打点（torch.npu.memory_allocated / profiler）"},"signal":{"note":"与 aclnn-bug-hunt references/hunt-model.md §3 的 signal 取值同源，便于直接转假设。","values":["null-input","canary","legal-accept","hang","golden","memory","bitwise","sequence","concurrency","error-code","doc","perf","symbol"]},"line":{"note":"aclnn-bug-hunt 六线 + 第七静态线。L2 不再用 category 粗映射，改由每模式显式声明。","values":["error-scenario","valid-fuzz","precision","determinism","memory","multithread-fuzz","static-absence","none"]}},"secondary":{"schema":"ascend-op-fault-patterns/secondary-oracle@1","version":"1.0","updated":"2026-11-04","purpose":"为每条模式补「第二个独立判据」。单点 oracle 的根本问题不是不准，而是错了没人知道——返回码对但错误码选错、racecheck 零告警但连接口都没进 kernel，这类「正确且错误」在单点判据下不可见。第二判据要求在**不同失效机制**上独立成立：任一侧报异常即升级为必须实测，两侧都过才算判据有效。","kinds":{"metamorphic":"蜕变关系：不需要 golden，只依赖输入输出之间的必然关系（如 tril(d=-1) ⊇ tril(d=0)）。无标杆算子的唯一可用判据。","cross-path":"双通路差分：同一算子走两条独立实现路径（aclnn vs aclop/GEIR、单算子 vs 图模式），结果须逐位/逐容差一致。对应 compiler testing 的 EMI 思路。","invariant":"结构不变量：与数值无关的性质（前缀连续、区间无重叠、索引单调、输出范围界）。values 不是唯一来源时可判。","idempotence":"幂等/重放：同输入重复执行结果一致（区分确定性与状态污染）；或「执行 N 次 = 执行 1 次」的累积性检验。","conservation":"守恒量：总和/计数/非零元数在变形前后守恒（如 reduce 沿轴的子结果求和 == 全局求和）。","symbolic":"符号/契约层：符号可解析、类型签名与文档一致、注册表项齐全。查「接线」而非数值。"},"patterns":{"FP-A01":{"kind":"idempotence","why":"硬件近似指令的精度问题，单靠 utol 只能证明「与标杆有差」，无法区分「差得合理」与「差得离谱」，更无法发现「补偿分支根本没被走到」。用确定性与结构性质从侧面锁死。","relations":[{"id":"A01-I1","name":"同输入重放位一致","statement":"同一输入连跑 N 次，输出必须逐位一致（近似指令若有可变中间状态，重放会漂移）。","kill":"级数迭代次数依赖未初始化变量、或共享 scratch buffer 未清零时，重放会出现 bit 级抖动。","how":"N=10 连跑，逐位比对；抖动按尾数位位置聚类。"},{"id":"A01-S1","name":"补偿分支可达性","statement":"对 softplus/log1p 类，构造 x 使 1+x 恰在 half-ULP 边界（1e-8 量级），输出必须走补偿分支且非零。","kill":"朴素 log(1+e) 在 e 极小时 1+e 舍入为 1，输出恒 0——utol 可能因参考值也是 0 而通过。","how":"取 x ∈ {-1e-8,-1e-7,-1e-6}，断言输出严格递减且 >0；为零即补偿链缺失。"}]},"FP-A02":{"kind":"idempotence","why":"归约顺序差异在 utol 阈值内可能被掩盖；而「顺序是否稳定」是数值判据看不见的维度。","relations":[{"id":"A02-I1","name":"重放与核数无关性","statement":"同一输入在不同核数（1/2/4/8 核）下执行，结果须在容差内一致；同核数连跑须逐位一致。","kill":"多核分组顺序若依赖运行时核数，改变核数会改变归约树形状，暴露出顺序耦合。","how":"固定 shape，blockDim 取 1/2/4/8 各跑一次，比较输出离散度；同核数重放比位。"},{"id":"A02-S1","name":"累加顺序敏感度界","statement":"构造量级差异极大的数据（如 1e8 个 1e-8 与一个 1e8），结果必须与理论值在声明容差内。","kill":"串行累加会丢失小量，树形归约不会；两者的差异在此构造下被放大到容差外。","how":"按「大数 + 大量小数」构造，与 high-precision 参考比对。"}]},"FP-A05":{"kind":"invariant","why":"脏数据/踩踏的本质是「读了不该读的内存」，utol 只看最终值，被踩的值可能恰好落在容差内。","relations":[{"id":"A05-S1","name":"越界哨兵","statement":"输出 buffer 前后各留 N 字节哨兵，执行后哨兵必须不变。","kill":"越界写会破坏哨兵，即使被踩区域不在断言范围内。","how":"分配 size+2*margin，margin 区填 0xDEADBEEF，执行后逐字节比对。"},{"id":"A05-S2","name":"未初始化读检测","statement":"同一算子在「workspace 预填 NaN」与「预填 0」两种初始状态下，输出必须一致。","kill":"若某路径读了未初始化的 workspace，两种初值会给出不同结果；预填 0 时可能碰巧正确。","how":"两轮执行，首轮前用 NaN 毒化全部 workspace，比较两轮输出是否逐位一致。"}]},"FP-A06":{"kind":"idempotence","why":"确定性/状态污染只在重复执行或换进程时暴露，单次静态判据完全看不到。","relations":[{"id":"A06-I1","name":"重放一致","statement":"同输入同 executor 连跑 N 次，输出必须逐位一致；换新进程首调也必须一致。","kill":"tiling 状态残留、事件 ID 未释放、buffer 未清零都会在第 2 次或新进程首调暴露。","how":"N=10 连跑 + 1 次新进程，逐位比对；差异按 bit 位置聚类定位。"},{"id":"A06-I2","name":"shape 交错不污染","statement":"先跑 shape A 再跑 shape B 再跑 shape A，两次 A 输出必须一致。","kill":"跨调用 tiling 污染（FP-A21 同源）会让第二次 A 走上次的残留参数。","how":"A→B→A 序列，比对首末两次 A。"}]},"FP-A16":{"kind":"cross-path","why":"aclnn 与 aclop 的精度差异，本身就是因为两条路径实现不同；这正是天然的差分对。","relations":[{"id":"A16-X1","name":"双通路逐位对照","statement":"同一输入分别走 aclnn 与 aclop/GEIR，输出须在声明容差内一致。","kill":"编译期常量折叠、pad 对齐预处理只在一条路径发生，差分立即暴露。","how":"同 shape/dtype 跑两条通路，比较最大绝对/相对误差与不一致元素数。"}]},"FP-A19":{"kind":"cross-path","why":"多 tiling 路径覆盖盲区：只测一条模板等于没测其他模板。","relations":[{"id":"A19-X1","name":"模板等价","statement":"同一输入在不同 tiling 模板下（强制指定 IsCapable 命中不同分支）结果必须等效。","kill":"某条模板漏改、边界计算错，只有强制走该模板才暴露。","how":"用 tiling key 覆盖矩阵驱动，逐模板跑同输入，比较输出与模板间的离散度。"}]},"FP-A22":{"kind":"cross-path","why":"dtype 分派/模板映射错配的特征是「同宽度兄弟 dtype 结果不同」，天然是横向差分。","relations":[{"id":"A22-X1","name":"同宽度兄弟 dtype 对照","statement":"int32 vs uint32、fp16 vs bf16 等语义相近的兄弟 dtype，同输入应给出可解释的一致/差异。","kill":"映射表条目错配会让某个 dtype 静默走另一分支。","how":"同输入分别以兄弟 dtype 跑，比较「应当一致」的位置是否真一致。"},{"id":"A22-S1","name":"输出全写","statement":"输出 buffer 预填魔数后跑，残留比例必须为 0。","kill":"只断言返回码会漏掉「部分未写」。","how":"预填 0x7FC07FC0，统计残留元素数。"}]},"FP-B07":{"kind":"invariant","why":"索引/偏移越界的后果是被踩区域，单看输出值可能完全正确（踩的是 padding）。","relations":[{"id":"B07-S1","name":"边界哨兵","statement":"输出与相邻 buffer 的哨兵区必须不被修改。","kill":"越界写落在相邻 tensor 上，输出本身可能正确。","how":"多 tensor 连续分配，首尾填哨兵，执行后全量扫描。"},{"id":"B07-M1","name":"尺寸阶梯单调","statement":"shape 在 2^k ± 1 阶梯上变化时，输出应连续变化，不得在某个尺寸突然劣化。","kill":"尾块/对齐边界算错会在特定 size 处出现阶跃。","how":"取 63/64/65、127/128/129 等阶梯，比较相邻点输出差异幅度。"}]},"FP-B04":{"kind":"invariant","why":"判空只看返回码，错误码选错、校验晚于解引用都看不出来。用「进程不得崩溃」这一结构不变量独立佐证。","relations":[{"id":"B04-S1","name":"崩溃面与错误面互斥","statement":"置空任一必选参数，进程不得以 SIGSEGV/rc=139 退出，只能是返回错误码。","kill":"校验晚于解引用时先崩后校验；返回码再「正确」也掩盖不了崩溃。","how":"子进程隔离跑每个参数位置 × 两段式阶段，检查退出码与是否产生 core。"},{"id":"B04-S2","name":"错误码与参数位置不相干性","statement":"所有必选参数置空后应返回同一族错误码（161001）；若不同参数返回不同错误码，说明校验路径不一致。","kill":"部分参数走 CheckParams、部分靠解引用时崩溃或返回内部错误，分布会不均匀。","how":"逐参数置空，统计错误码直方图；出现 >1 种即标记待核。"}]},"FP-B14":{"kind":"cross-path","why":"图模式与单算子通路未同步适配，本质是两条通路契约差异，天然差分。","relations":[{"id":"B14-X1","name":"双通路契约一致","statement":"同一算子分别走 GEIR/aclGraph 与 aclnn 单算子，输出与错误面必须一致。","kill":"属性默认值、format 白名单只在一侧补齐，差分立即暴露。","how":"同输入两通路各跑一遍，比较输出与错误码；属性缺省场景单独成组。"}]},"FP-G01":{"kind":"idempotence","why":"挂死/超时的静态判据只能看循环结构，动态才见真章。","relations":[{"id":"G01-I1","name":"看门狗硬熔断","statement":"每个用例独立进程 + 硬超时，超时即失败并 dump 栈。","kill":"死循环/回绕长循环只有在超时机制下才被判定为缺陷，而非「跑得慢」。","how":"子进程 + timeout，超时 SIGABRT 取 py-spy/gdb 栈。"},{"id":"G01-S1","name":"迭代次数上界","statement":"循环的实际迭代次数必须有可测上界，与理论值一致。","kill":"loopTimes 写错导致重复调度，单次耗时正常但总次数爆炸。","how":"插桩计数或 profiler 统计 kernel 下发次数，与理论值比对。"}]},"FP-G02":{"kind":"cross-path","why":"racecheck 零告警可能是空跑（L3 已实测：AICPU 插桩空跑、san 符号数 0 导致假绿）。必须用结果层判据独立佐证。","relations":[{"id":"G02-X1","name":"racecheck 有效性自证","statement":"racecheck 报告的 san 符号数必须 > 0，否则「0 告警」不成立。","kill":"K2/K28 实测：AICPU 算子插桩空跑，0 告警被误读为无竞争。","how":"解析 racecheck 输出中的 san 符号计数；为 0 则判「判据无效」而非「无缺陷」。"},{"id":"G02-I1","name":"跨流位模式一致","statement":"同输入在单流与跨流交错调度下，输出必须逐位一致。","kill":"同步缺失只在跨流时序下暴露；单流永远正确。","how":"两流交错重放 3 轮，逐轮比较原始位模式。"}]},"FP-A08":{"kind":"idempotence","why":"切块粒度差异导致的离群点问题，utol 是聚合判据（max/mean 相对误差），少量离群点会被平均掉。","relations":[{"id":"A08-I1","name":"块数无关性","statement":"同输入在不同切块粒度（tileSize 取 3 档）下结果须在容差内一致，且离群点位置不随粒度漂移。","kill":"尾块覆盖不全或 padding 中性元错，只在特定粒度下产生尾部离群点；粒度无关性会暴露。","how":"固定 shape，tileSize 取 max/2 与默认，逐元素比较差异位置分布。"},{"id":"A08-S1","name":"尾部元素单独断言","statement":"输出最后 ceil(shape % tile) 个元素必须与非尾部元素同精度，不得显著劣化。","kill":"尾块处理错时误差集中在尾部；聚合 utol 会把它摊薄到看不见。","how":"分段统计头部/尾部误差，比较两段 p99 相对误差比值。"}]},"FP-A14":{"kind":"cross-path","why":"FFMA 与 MMAD 是两条硬件指令路径，语义差只有双路径直接对照才能定位。","relations":[{"id":"A14-X1","name":"双指令路径对照","statement":"同矩阵乘分别走 MMAD 与 FFMA（或参考实现），结果差异须能用 K 对齐/pad 解释，不得出现结构性偏差。","kill":"stepK 步长错、K 对齐补零缺失，会在特定 K 非 8 倍数时出现固定模式的偏差。","how":"K 取 8 的倍数与 ±1，成对比较，观察偏差是否随 K 模数变化。"},{"id":"A14-S1","name":"pad 区域中性性","statement":"K 对齐补的零必须在结果中保持中性（不引入非零贡献）。","kill":"补零处若填了脏数据而非真零，结果会带固定偏移。","how":"对比「真实 K」与「pad 到 K_aligned」两种输入，结果应完全相同。"}]},"FP-A20":{"kind":"idempotence","why":"确定性等级问题：非确定性只在重复执行与不同切核下显现，静态判据完全看不到。","relations":[{"id":"A20-I1","name":"确定性开关双向验证","statement":"确定性开：同输入连跑 N 次必须逐位一致；确定性关：允许差异但需可解释。","kill":"原子加未消除、跨核归约未定序时，确定性开启状态下仍会抖动。","how":"两种开关各跑 N=10，确定性开时逐位比对，关时统计分布。"},{"id":"A20-I2","name":"切核维度不变性","statement":"同输入在不同 blockDim 下，确定性开启时结果必须逐位一致。","kill":"切核维度参与归约分组时，改变核数会改分组，破坏确定性。","how":"blockDim 1/2/4/8 × 确定性开，比较输出位模式。"}]},"FP-A21":{"kind":"idempotence","why":"tiling 跨调用/跨线程污染，本质是状态残留——只有交错重放能暴露。","relations":[{"id":"A21-I1","name":"shape 交错不污染","statement":"A→B→A 序列中首末两次 A 输出必须逐位一致。","kill":"tiling 可变全局未按路径赋满，第二次 A 会用到 B 留下的字段。","how":"同 executor 上 A(小)→B(大)→A(小)，比对两次 A。"},{"id":"A21-I2","name":"并发隔离","statement":"两个线程各自跑不同 shape，输出必须与串行执行时逐位一致。","kill":"TU 级可变全局被并发写，会互相覆盖。","how":"两线程各跑 100 轮不同 shape，与串行基线比对。"}]},"FP-B06":{"kind":"invariant","why":"空 tensor 分支问题：返回码可能正确但输出未写/平台不对称，数值判据对空输出无从下手。","relations":[{"id":"B06-S1","name":"零元素输出确定性","statement":"numel==0 时输出 tensor 必须存在且其属性（shape/dtype/format）与声明一致；不得是未初始化指针。","kill":"早退路径直接 return 而不写输出，会导致下游读到脏指针。","how":"构造各维为 0 的 shape，检查输出 tensor 元数据与可读性。"},{"id":"B06-X1","name":"平台对称","statement":"同一空输入在 A2/A3/A5 各平台的行为（返回码 + 输出元数据）必须一致。","kill":"某平台走了不同早退路径，会出现平台间不对称。","how":"跨平台矩阵跑同一组空 shape，比对返回码与输出元数据。"}]},"FP-B08":{"kind":"cross-path","why":"属性在某一跳被丢弃，只有把同一属性从入口追到 kernel 才能定位；单点判据只能看最终值。","relations":[{"id":"B08-X1","name":"属性透传链路","statement":"在入口设置非默认属性，kernel 侧读取到的值必须与入口一致（逐跳记录）。","kill":"fallback 回调/前端插件/fusion pass 任一跳丢弃属性，末端会回到默认值。","how":"注入哨兵属性值，在 kernel 打点回读；不一致即定位断点。"},{"id":"B08-X2","name":"三载体行为一致","statement":"同一属性经 aclnn 单算子、图模式、fallback 三条载体，最终行为必须一致。","kill":"某载体未适配该属性时，行为分叉。","how":"同参数三载体各跑一次，比对输出与日志中的属性值。"}]},"FP-B09":{"kind":"invariant","why":"动态 shape 哨兵值（-1/-2）被当实数用，返回码可能正常但 shape 推导错。","relations":[{"id":"B09-S1","name":"哨兵不外泄","statement":"含 -1/-2 的输入，其哨兵值不得出现在任何输出的 shape/dim 中。","kill":"GetDims 未判哨兵直接参与运算，会把 -1 带进输出 shape。","how":"构造含哨兵输入，检查所有输出 tensor 的 dim 是否含负值。"},{"id":"B09-X1","name":"静态/动态一致","statement":"同一 shape 以静态指定与动态 range 指定两种方式输入，最终输出 shape 必须一致。","kill":"GetShapeRange 前未 MakeUpRange，动态路径会退化。","how":"同 shape 两路输入，比对输出 shape。"}]},"FP-B10":{"kind":"invariant","why":"集合通信的拓扑/通信域问题，返回值往往成功而数据错乱，需要结构判据。","relations":[{"id":"B10-S1","name":"收发一致性","statement":"AllReduce/AllGather 等操作后，各 rank 结果必须与单机参考计算逐位/容差一致。","kill":"拓扑下标越界、通信域未初始化时，部分 rank 收到错数据但调用返回成功。","how":"小规模多 rank，逐 rank 与单机参考比对。"},{"id":"B10-S2","name":"同族对称性","statement":"同族算子（AllReduce vs ReduceScatter 等）在同一输入下的语义关系必须成立。","kill":"同族某成员 infershape 未 SetDim，会导致维度不一致。","how":"构造族内语义等价输入，交叉验证关系。"}]},"FP-B11":{"kind":"invariant","why":"参数契约校验缺失：非法输入被放行，返回码可能成功直到下游才炸。","relations":[{"id":"B11-S1","name":"非法输入必须被拒","statement":"rank 不匹配、长度不等、值域越界的输入，必须在第一段返回参数错误，不得进入执行。","kill":"缺少契约校验时非法输入会被放行，错误延迟到下板阶段。","how":"逐类构造非法输入，断言返回参数错误族错误码。"},{"id":"B11-S2","name":"前后段一致性","statement":"第一段（GetWorkspaceSize）与 InferShape 对同一输入的可接受性判断必须一致。","kill":"两段各写一套校验，会出现一段过一段不过。","how":"同一输入分别走两段，比对判决。"}]},"FP-B12":{"kind":"cross-path","why":"早退路径未写非空输出时，返回 SUCCESS 但输出未初始化——golden-canary 只看残留比例，若恰好「写了一半」可能蒙过。用双路径差分独立佐证。","relations":[{"id":"B12-X1","name":"双路径早退一致","statement":"同一早退场景（空/退化输入）经 aclnn 单算子与图模式两条路径，输出内容与元数据必须一致。","kill":"某条路径补了写回、另一条漏了，是 B12 最常见的形态（只修一侧）。","how":"矩阵化跑早退场景 × 两条路径，逐位比对输出与 shape/dtype。"},{"id":"B12-X2","name":"平台对称","statement":"同一早退场景在 A2/A3/A5 各平台的行为（返回码 + 输出是否被写）必须一致。","kill":"平台分支里早退实现不同，某平台不写输出。","how":"跨平台矩阵跑同一组空 shape，比对输出状态。"}]},"FP-C01":{"kind":"invariant","why":"性能问题的静态判据只能看代码形态，量化劣化必须靠基线差分；且需排除「重复调度」这类结构性浪费。","relations":[{"id":"C01-S1","name":"下发次数守恒","statement":"单次调用对应的 kernel 下发次数必须有上界，且与理论值一致（不得因循环上界写错而重复调度）。","kill":"host 侧循环上界写错会导致同一 kernel 被下发 N 倍，耗时线性放大但单次耗时正常。","how":"profiler 统计 kernel 下发次数，与理论值比对。"},{"id":"C01-X1","name":"形状缩放律","statement":"耗时随规模缩放应符合声明的复杂度（线性/平方），偏离即异常。","kill":"实现层冗余或调度膨胀会破坏缩放律。","how":"取 4 档规模，拟合耗时-规模曲线，检查指数。"}]},"FP-B15":{"kind":"cross-path","why":"容量越界的三条后果里，「尾部静默丢弃」与「kernel fault」在不同平台/不同通路表现不同（实测 A5 是 507035 fault、910C 是静默不写）。单看返回码两边都是 0，必须靠双通路对拍才能定位到「容器容量」这个根因，而不是误判成精度问题。","relations":[{"id":"B15-X1","name":"双通路容量一致","statement":"同一列表长度 n（超过容量 N）在 aclnn 单算子与图模式两条路径上的行为必须一致：要么都拒绝，要么都正确算完。","kill":"只修一条路径的容量校验是常见形态；两条路径对同一 n 给出不同结论即证明校验缺失而非「设计如此」。","how":"n ∈ {N-1, N, N+1} × 两条路径矩阵，比对返回码 + 输出内容 + sync 返回码。"},{"id":"B15-X2","name":"族内兄弟对拍","statement":"同一族的接口（如 foreach_*）对同一 n 的处理必须一致：兄弟报错的，本接口也必须报错。","kill":"族内只有少数接口缺 OP_CHECK_IF(x > N) 时，本接口 n>N 仍返回 0 即暴露「漏拦截」；这条不依赖任何外部契约。","how":"族内逐个接口跑 n=N+1，统计「报错 / 返回 0」的分布；返回 0 的那批即候选。"}]},"FP-B16":{"kind":"cross-path","why":"主判据是「出参预填哨兵 + 按 stride 读回」——它依赖**按 stride 读**这一步本身写对，一旦读回逻辑把 stride 用错（或构造时 stride 与 storage 记反），会把正确的算子判成缺陷。第二判据换成**布局差分**：同一份输入、同一份语义结果，分别用「连续出参」和「非连续出参」两条布局跑，把非连续结果按 view 语义摊平后与连续基线的逻辑顺序**逐位比对**。两者的失效机制完全分离——主判据怕构造错，本判据怕语义摊平错；且本判据**不需要知道 stride 是否被算子使用**，只看「同一批逻辑值是否出现在同一批逻辑位置」。","relations":[{"id":"B16-X1","name":"连续/非连续双布局差分","statement":"同一输入分别用连续出参与非连续出参（view/stride/storage 带空洞）各跑一次；非连续结果**按 view 索引摊平**后，必须与连续基线逐位（FP32）或按混合容差一致。两条路径的返回码都应为 0。","kill":"若算子忽略出参 stride，非连续路径会把结果连续写到 storage 基址，摊平后只有前 numel(view) 个吻合，其余是哨兵；而连续路径完全正确——同一算子两条布局给出不同逻辑结果，即为缺陷，**无需预填哨兵**也能判定。","how":"同一进程内先后跑两次（先连续后非连续），用同一份输入 buffer；摊平公式 out_logical[i] = storage[Σ idx_k * stride_k]，与基线 out_logical 逐元素比；报告「不一致元素数 / numel(view)」——恒等于 1/stride比 即本条特征。"},{"id":"B16-I1","name":"写入位置集合不变量","statement":"出参每次调用**实际被写过的物理位置**，必须恰好等于 view 覆盖的位置集合 { Σ idx_k * stride_k | 0 <= idx_k < view.shape[k] }，且该集合之外一个字节都不许变。这是与数值无关的结构性性质：不管算子算出什么值，位置集合都必须对。","kill":"忽略 stride 时，被写位置集合退化为连续区间 [0, numel(view))，与 view 覆盖集合的差集非空（典型恰为一半）——集合不等即缺陷，不依赖任何 golden 值。","how":"出参 buffer 预填哨兵 → 跑算子 → 扫描全 storage 标记「值已变化」的物理下标 → 与按 stride 生成的期望下标集合做对称差；差集为空才算通过。**这一条同时能区分 B07**：B07 会写到 view 集合之外（越界），本条只写到集合内的错误子集。"}]}}},"compositions":[{"id":"COMP-A05-A21","members":["FP-A05","FP-A21"],"rationale":"跨调用 tiling 状态残留可能把上一次调用的长度或偏移带到下一次调用，单独检查脏数据或全局状态都不足以区分；需要在同一 executor 上换 shape 重放并用毒化 workspace 观察陈旧读写。","next_experiment":{"schema_version":"deep-experiment/v1","experiment_id":"EXP-COMP-A05-A21","operation":"aclnn:<operator>","initial_state":{"executor":"fresh","workspace":"uninitialized","stream":"s0"},"actions":[{"id":"size","type":"GetWorkspaceSize","executor_ref":"e0"},{"id":"poison","type":"PoisonWorkspace","workspace_ref":"w0","value":165},{"id":"reuse","type":"ReuseExecutor","executor_ref":"e0"},{"id":"execute-a","type":"Execute","executor_ref":"e0","case_ref":"shape-a","output_ref":"out-a"},{"id":"execute-b","type":"Execute","executor_ref":"e0","case_ref":"shape-b","output_ref":"out-b"},{"id":"free","type":"Free","workspace_ref":"w0","executor_ref":"e0"}],"schedule":{"mode":"serial","sequence":["shape-a","shape-b","shape-a"]},"observations":["比较两次 shape-a 输出及 out-b 的哨兵残留，区分状态污染与独立脏写"],"oracle":{"type":"golden-canary","expect":"同 shape 同输入结果一致，且输出边界外哨兵不变"},"provenance":{"source":"COMP-A05-A21","coverage_state":"designed"}}},{"id":"COMP-A06-G02","members":["FP-A06","FP-G02"],"rationale":"事件或流水同步缺失可表现为跨流执行时序变化，进而造成同输入位模式不稳定；仅重复执行或仅数同步原语都无法建立二者的因果关系，必须跨流重放并同时保留 bitwise 与 race 观测。","next_experiment":{"schema_version":"deep-experiment/v1","experiment_id":"EXP-COMP-A06-G02","operation":"aclnn:<operator>","initial_state":{"executor":"fresh","workspace":"allocated","stream":"s0"},"actions":[{"id":"size","type":"GetWorkspaceSize","executor_ref":"e0"},{"id":"reuse","type":"ReuseWorkspace","workspace_ref":"w0"},{"id":"produce","type":"Execute","executor_ref":"e0","stream_ref":"s0","output_ref":"out-0"},{"id":"record","type":"RecordEvent","event_ref":"ev0","stream_ref":"s0"},{"id":"switch","type":"SwitchStream","from_stream_ref":"s0","stream_ref":"s1"},{"id":"wait","type":"WaitEvent","event_ref":"ev0","stream_ref":"s1"},{"id":"consume","type":"Execute","executor_ref":"e0","stream_ref":"s1","output_ref":"out-1"},{"id":"free","type":"Free","workspace_ref":"w0","event_ref":"ev0"}],"schedule":{"mode":"stream_interleave","streams":["s0","s1"],"repeat":3},"observations":["逐轮比较输出原始位模式，并保存 racecheck 对 ev0 与共享 workspace 的记录"],"oracle":{"type":"bitwise+sanitizer-racecheck","expect":"同步基线与跨流重放均逐位一致且无 WAW/RAW 告警"},"provenance":{"source":"COMP-A06-G02","coverage_state":"designed"}}},{"id":"COMP-B07-A05","members":["FP-B07","FP-A05"],"rationale":"错误索引或偏移首先造成越界写，随后表现为相邻 tensor、workspace 或输出尾部被踩踏；只查整数偏移会漏掉可见后果，只查脏数据又难以定位源头，需将边界尺寸阶梯与哨兵取证放在同一实验。","next_experiment":{"schema_version":"deep-experiment/v1","experiment_id":"EXP-COMP-B07-A05","operation":"aclnn:<operator>","initial_state":{"executor":"fresh","workspace":"allocated","stream":"s0"},"actions":[{"id":"size","type":"GetWorkspaceSize","executor_ref":"e0"},{"id":"poison","type":"PoisonWorkspace","workspace_ref":"w0","value":165},{"id":"reuse","type":"ReuseWorkspace","workspace_ref":"w0"},{"id":"execute-boundary","type":"Execute","executor_ref":"e0","case_ref":"boundary-index","output_ref":"out-0"},{"id":"free","type":"Free","workspace_ref":"w0","executor_ref":"e0"}],"schedule":{"mode":"serial","case_sequence":["aligned-minus-one","aligned","aligned-plus-one"]},"observations":["记录输出与前后 guard 区的原始字节，并将首次哨兵变化对应到边界索引"],"oracle":{"type":"golden-canary+sanitizer-memcheck","expect":"输出符合标杆，guard 区不变且无越界访问"},"provenance":{"source":"COMP-B07-A05","coverage_state":"designed"}}}]};</script>
<script>/* ============ 昇腾算子故障模式库 · 前端应用 ============ */
(function () {
"use strict";

const D = window.__FP__;
const P = D.patterns;
const C = D.cases;
const M = D.meta;

const CAT_COLOR = {
  accuracy: "#c7000b",
  compatibility: "#b45309",
  performance: "#0d7490",
  reliability: "#6d28d9",
  resource: "#1f6f43",
  test_effectiveness: "#a16207",
  engineering: "#475569"
};
const LVL_CLS = { "高": "hi", "中": "mid", "低": "lo" };
const TRIG_ORDER = ["必须触发", "签名", "宽泛定位", "关键词", "无代码触发特征"];

const byId = {};
P.forEach(p => { byId[p.id] = p; });

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function md(s) {
  if (!s) return "";
  let t = esc(s);
  t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/(^|[^\w])(#\d{3,5})/g, '$1<span class="iss">$2</span>');
  t = t.replace(/\n/g, "<br>");
  return t;
}
function catDot(cat) {
  return `<i style="background:${CAT_COLOR[cat] || "#888"}"></i>`;
}
function riskBadge(p) {
  return `<span class="risk ${LVL_CLS[p.level]}">${p.level}<span class="sc">S${p.s}×O${p.o}</span></span>`;
}
function toast(msg) {
  let el = $("#toast");
  if (!el) {
    el = document.createElement("div");
    el.id = "toast";
    el.style.cssText = "position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(10px);background:#15181e;color:#fff;font-size:12px;padding:7px 15px;border-radius:6px;z-index:200;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)";
    document.body.appendChild(el);
  }
  el.textContent = msg;
  requestAnimationFrame(() => { el.style.opacity = "1"; el.style.transform = "translateX(-50%) translateY(0)"; });
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = "0"; el.style.transform = "translateX(-50%) translateY(10px)"; }, 1400);
}

/* ---------------- state ---------------- */
const S = {
  view: "overview",
  q: "",
  cat: "all",
  lvl: "all",
  depth: "all",
  trig: "all",
  so: null,
  sort: "risk",
  caseFp: "all",
  caseQ: ""
};

/* ---------------- computed stats ---------------- */
const stats = (() => {
  const byCat = {}, byLvl = {}, byDepth = {}, byTrig = {};
  let sigTotal = 0, kwTotal = 0, broadTotal = 0, absenceTotal = 0;
  P.forEach(p => {
    byCat[p.cat] = (byCat[p.cat] || 0) + 1;
    byLvl[p.level] = (byLvl[p.level] || 0) + 1;
    byDepth[p.depth] = (byDepth[p.depth] || 0) + 1;
    byTrig[p.triggerZh || "—"] = (byTrig[p.triggerZh || "—"] || 0) + 1;
    sigTotal += (p.signatures || []).length;
    kwTotal += (p.keywords || []).length;
    broadTotal += (p.broad || []).length;
    absenceTotal += (p.absence || []).length;
  });
  const matrix = {};
  P.forEach(p => {
    const k = `S${p.s}O${p.o}`;
    (matrix[k] = matrix[k] || []).push(p.id);
  });
  const withCases = P.filter(p => p.caseCount > 0).length;
  const mustTrig = P.filter(p => p.triggerZh === "必须触发").length;
  return { byCat, byLvl, byDepth, byTrig, sigTotal, kwTotal, broadTotal, absenceTotal, matrix, withCases, mustTrig };
})();

/* ---------------- router ---------------- */
const TITLES = {
  overview: "总体概览", patterns: "故障模式", cases: "实证案例",
  triage: "症状分诊", layers: "判据分层", secondary: "第二判据",
  compositions: "组合故障", method: "库标准"
};
function go(view) {
  if (!TITLES[view]) view = "overview";
  S.view = view;
  document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
  const el = $("#v-" + view);
  if (el) el.classList.add("on");
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === view));
  $("#crumb").innerHTML = view === "overview"
    ? `<span>库首页</span><b>总体概览</b>`
    : `<span>库首页</span><span>›</span><b>${TITLES[view]}</b>`;
  if (!el.dataset.done) { render[view](); el.dataset.done = "1"; }
  window.scrollTo({ top: 0, behavior: "instant" });
  if (view === "patterns") applyFilters();
  if (view === "cases") applyCaseFilters();
}
window.addEventListener("hashchange", () => go((location.hash || "#/overview").replace("#/", "")));

/* ---------------- overview ---------------- */
const render = {};

render.overview = function () {
  const hi = stats.byLvl["高"] || 0, mid = stats.byLvl["中"] || 0, lo = stats.byLvl["低"] || 0;
  const pct = n => Math.round(n / P.length * 100);

  /* risk matrix */
  const rows = [4, 3, 2, 1], cols = [3, 2, 1];
  let mx = `<div class="mx"><div></div>`;
  cols.forEach(o => { mx += `<div class="hd">O${o}</div>`; });
  rows.forEach(s => {
    mx += `<div class="rl">S${s}</div>`;
    cols.forEach(o => {
      const ids = stats.matrix[`S${s}O${o}`] || [];
      const score = s * o;
      const cls = !ids.length ? "z" : score >= 6 ? "hi" : score >= 3 ? "mid" : "lo";
      mx += `<div class="cell ${cls}" data-so="${s}-${o}" title="S${s}×O${o}｜风险 ${score}${ids.length ? "｜" + ids.join(" ") : ""}">
        <div class="n">${ids.length || "·"}</div>
        <div class="ids">${ids.slice(0, 5).join(" ") || "—"}</div>
      </div>`;
    });
  });
  mx += `</div>`;

  /* category bars */
  let bars = `<div class="bars">`;
  M.cats.forEach(c => {
    const n = stats.byCat[c] || 0;
    bars += `<div class="bar" data-cat="${c}">
      <div class="lb">${catDot(c)}${M.catZh[c]}</div>
      <div class="tr"><div class="fi" style="width:${n / P.length * 100}%;background:${CAT_COLOR[c]}"></div></div>
      <div class="vl"><b>${n}</b> 条</div>
    </div>`;
  });
  bars += `</div>`;

  /* trigger distribution */
  let tbars = `<div class="bars">`;
  TRIG_ORDER.forEach(t => {
    const n = stats.byTrig[t] || 0;
    if (!n) return;
    const col = t === "必须触发" ? "#c7000b" : t === "签名" ? "#0d7490" : t === "宽泛定位" ? "#b45309" : "#8a93a0";
    tbars += `<div class="bar" data-trig="${t}">
      <div class="lb"><i style="background:${col}"></i>${t}</div>
      <div class="tr"><div class="fi" style="width:${n / P.length * 100}%;background:${col}"></div></div>
      <div class="vl"><b>${n}</b></div>
    </div>`;
  });
  tbars += `</div>`;

  /* top risk */
  const top = P.slice().sort((a, b) => b.score - a.score || b.caseCount - a.caseCount || a.id.localeCompare(b.id)).slice(0, 7);
  let topRows = "";
  top.forEach(p => {
    topRows += `<div class="row" data-fp="${p.id}" style="grid-template-columns:58px 1fr 84px 58px">
      <div class="rid">${p.id}</div>

      <div class="rcase"><b>${p.caseCount}</b></div>
    </div>`;

  /* L2 axes coverage */
  const axCount = {};
  P.forEach(p => {
    const d = p.detect;
    if (d && d.axes) d.axes.forEach(a => { axCount[a] = (axCount[a] || 0) + 1; });
  });
  const axSorted = Object.keys(axCount).sort((a, b) => axCount[b] - axCount[a]).slice(0, 8);

  /* 可检出性 D 分布（v6.21） */

      <div class="vl"><b>${n}</b> 条</div>

  });
  dBars += `</div>`;

  /* priority = S×O×D 最高的模式 */
  const withD = P.filter(p => p.detectability && p.detectability.priority != null);
  const prioTop = withD.slice().sort((a, b) =>
    b.detectability.priority - a.detectability.priority || a.id.localeCompare(b.id)).slice(0, 7);
  let prioRows = prioTop.map(p => `<div class="row" data-fp="${p.id}"
      style="grid-template-columns:66px 1fr 62px 70px;border-radius:0">

  $("#v-overview").innerHTML = `
  <div class="ptitle"><h2>昇腾算子故障模式库</h2><span class="tag">v${M.version}</span><span class="tag">${M.updated}</span></div>
  <p class="pdesc">把算子源码检视、跨版本核验与测试集失败分析中反复出现的<b>故障机理</b>，沉淀为「一模式一卡片」的可检索条目。
    每条包含八要素卡片、判别性检测签名、三层判据（L1 机理 / L2 怎么测 / L3 观测手段自身失效）与真实 issue 实证。</p>

  <div class="kpis">
    <div class="kpi acc"><div class="k">故障模式</div><div class="v">${P.length}<small>条</small></div>
      <div class="s">7 类 · <b>${stats.withCases}</b> 条含案例</div></div>
    <div class="kpi"><div class="k">实证案例</div><div class="v">${C.length}<small>条</small></div>
      <div class="s"><b>${M.caseStats.with_issue || 0}</b> 关联真实 issue</div></div>
    <div class="kpi"><div class="k">高危模式</div><div class="v">${hi}<small>条</small></div>
      <div class="s">占 <b>${pct(hi)}%</b> · 中 ${mid} · 低 ${lo}</div></div>
    <div class="kpi"><div class="k">检测签名</div><div class="v">${stats.sigTotal}<small>条</small></div>
      <div class="s">+ 关键词 <b>${stats.kwTotal}</b> / 宽泛 ${stats.broadTotal}</div></div>
    <div class="kpi"><div class="k">L3 判据失效</div><div class="v">${M.nL3}<small>条</small></div>
      <div class="s">跨 <b>${Object.keys(D.l3.by_oracle).length}</b> 类 oracle</div></div>
    <div class="kpi"><div class="k">第二判据</div><div class="v">${M.nSecondary}<small>条</small></div>
      <div class="s">覆盖 ${Math.round(M.nSecondary / P.length * 100)}% 模式</div></div>
  </div>
  <div class="mono-sm" style="margin-bottom:22px">数据源 · ${esc(M.layout || "")} ｜ 门禁 ${esc(M.gates || "")} ｜ 软件签名实扫脚本 scripts/scan_fp.py</div>

  <div class="grid2">
    <div class="card">
      <div class="card-h"><h4>风险矩阵</h4><span class="hint">S 严重度 × O 发生度 · 点击筛选</span></div>
      <div class="card-b">${mx}
        <div class="mono-sm" style="margin-top:11px;line-height:1.8">
          高 ≥6（含 S4×O2=8、S4×O3=12）｜ 中 3/4 ｜ 低 1/2<br>
          S4 致命 = 崩溃 / 挂死 / 数据静默损坏，共同特征是「<b style="color:#9b0009">没有结果</b>」

    <div class="card">

    </div>

  <div class="sec-h"><h3>入口形态与判据覆盖</h3><div class="line"></div></div>
  <div class="grid2">
    <div class="card">
      <div class="card-h"><h4>触发形态</h4><span class="hint">决定扫描器怎么用这条模式</span></div>

        <div class="mono-sm" style="margin-top:11px">每条模式的 L2 判据给出 axes / oracle / signal / judge / kill —— 见「判据分层」</div>

    <div class="head-row" style="grid-template-columns:58px 1fr 84px 58px">

    </div>

};

/* ---------------- patterns ---------------- */
/* 签名既可能是纯字符串，也可能是 {re, files} / {must, files} 等结构化对象 */
function sigText(s) {
  if (typeof s === "string") return s;
  if (!s || typeof s !== "object") return String(s || "");
  const pat = s.re || s.must || s.func || s.pattern || "";
  const scope = [s.files, s.branch, s.when].filter(Boolean).join(" · ");
  return scope ? `${pat}  ⟨${scope}⟩` : pat;
}
function sigKind(s) {
  if (typeof s !== "object" || !s) return "";
  if (s.must) return "must";
  if (s.re) return "re";
  return "";
}
function sigHay(s) {
  if (typeof s === "string") return s;
  if (!s || typeof s !== "object") return "";
  return [s.re, s.must, s.func, s.pattern, s.files, s.branch, s.when, s.note, s.level].filter(Boolean).join(" ");
}
function arrOf(v) { return Array.isArray(v) ? v : []; }

function patternMatches(p, q) {
  if (!q) return true;
  const hay = [
    p.id, p.name, p.catZh,
    p.body && p.body.mechanism, p.body && p.body.conditions,
    p.body && p.body.manifest, p.body && p.body.mapping,
    p.body && p.body.intercept, p.body && p.body.evidence_text,
    arrOf(p.signatures).map(sigHay).join(" "),
    arrOf(p.broad).map(sigHay).join(" "),
    arrOf(p.absence).map(sigHay).join(" "),
    arrOf(p.logSig).map(sigHay).join(" "),
    arrOf(p.keywords).map(sigHay).join(" "),
    arrOf(p.symptoms).join(" "), arrOf(p.detectors).join(" "),
    arrOf(p.repos).join(" "), arrOf(p.sides).join(" "), arrOf(p.carriers).join(" "),
    arrOf(p.subtypes).map(s => (s.name || "") + " " + (s.id || "")).join(" "),
    C.filter(c => c.fp === p.id).map(c => [c.title, c.trigger, c.root, c.evidence, (c.issues || []).join(" ")].join(" ")).join(" ")
  ].join(" ").toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}

render.patterns = function () {
  const catPills = [{ k: "all", t: "全部", n: P.length }]
    .concat(M.cats.map(c => ({ k: c, t: M.catZh[c], n: stats.byCat[c] || 0 })));
  const lvlPills = ["高", "中", "低"].map(l => ({ k: l, t: l, n: stats.byLvl[l] || 0 }));
  const depthPills = ["深度", "标准", "宽浅"].map(d => ({ k: d, t: d, n: stats.byDepth[d] || 0 }));

  $("#v-patterns").innerHTML = `
  <div class="ptitle"><h2>故障模式</h2><span class="tag">${P.length} 条</span></div>
  <p class="pdesc">按机理建条、编号永不复用。点击任一行查看八要素卡片、检测签名、L2 判据与实证案例。</p>

  <div class="fbar">
    <div class="fgrp"><span>类别</span>
      ${catPills.map(c => `<button class="pill ${S.cat === c.k ? "on" : ""}" data-fcat="${c.k}">${c.t}<span class="c">${c.n}</span></button>`).join("")}
    </div>
    <div class="fsep"></div>
    <div class="fgrp"><span>风险</span>
      ${lvlPills.map(c => `<button class="pill ${S.lvl === c.k ? "on" : ""}" data-flvl="${c.k}">${c.t}<span class="c">${c.n}</span></button>`).join("")}
    </div>
    <div class="fsep"></div>
    <div class="fgrp"><span>负载</span>
      ${depthPills.map(c => `<button class="pill ${S.depth === c.k ? "on" : ""}" data-fdepth="${c.k}">${c.t}<span class="c">${c.n}</span></button>`).join("")}
    </div>
    <div class="fright">
      <select class="sel" id="sortSel">
        <option value="risk">按风险</option>
        <option value="id">按编号</option>
        <option value="cases">按案例数</option>
        <option value="name">按名称</option>
      </select>
      <button class="pill" id="resetF">重置</button>
    </div>
  </div>
  <div class="res" style="margin:-4px 0 10px" id="pRes"></div>
  <div id="pList"></div>`;

  $("#v-patterns").addEventListener("click", e => {
    const b = e.target.closest("[data-fcat],[data-flvl],[data-fdepth]");
    if (b) {
      if (b.dataset.fcat !== undefined) S.cat = S.cat === b.dataset.fcat ? "all" : b.dataset.fcat;
      if (b.dataset.flvl !== undefined) S.lvl = S.lvl === b.dataset.flvl ? "all" : b.dataset.flvl;
      if (b.dataset.fdepth !== undefined) S.depth = S.depth === b.dataset.fdepth ? "all" : b.dataset.fdepth;
      render.patterns(); $("#v-patterns").dataset.done = "1";
      applyFilters();
      return;
    }
    if (e.target.closest("#resetF")) {
      S.cat = "all"; S.lvl = "all"; S.depth = "all"; S.trig = "all"; S.so = null; S.q = "";
      $("#q").value = "";
      render.patterns(); $("#v-patterns").dataset.done = "1";
      applyFilters();
    }
  });
  $("#sortSel").addEventListener("change", e => { S.sort = e.target.value; applyFilters(); });
};

function currentPatterns() {
  // 有关键词时：筛选让位，全局搜索，避免「搜不到」的假空结果
  if (S.q) {
    const hit = P.filter(p => patternMatches(p, S.q));
    const cmpS = {
      risk: (a, b) => b.score - a.score || b.caseCount - a.caseCount || a.id.localeCompare(b.id),
      id: (a, b) => a.id.localeCompare(b.id),
      cases: (a, b) => b.caseCount - a.caseCount || b.score - a.score,
      name: (a, b) => a.name.localeCompare(b.name, "zh")
    };
    return hit.sort(cmpS[S.sort] || cmpS.risk);
  }
  let arr = P.filter(p =>
    (S.cat === "all" || p.cat === S.cat) &&
    (S.lvl === "all" || p.level === S.lvl) &&
    (S.depth === "all" || p.depth === S.depth) &&
    (S.trig === "all" || p.triggerZh === S.trig) &&
    (!S.so || (`S${p.s}O${p.o}` === S.so))
  );
  const cmp = {
    risk: (a, b) => b.score - a.score || b.caseCount - a.caseCount || a.id.localeCompare(b.id),
    id: (a, b) => a.id.localeCompare(b.id),
    cases: (a, b) => b.caseCount - a.caseCount || b.score - a.score,
    name: (a, b) => a.name.localeCompare(b.name, "zh")
  };
  return arr.sort(cmp[S.sort] || cmp.risk);
}

function applyFilters() {
  const arr = currentPatterns();
  const res = $("#pRes"), list = $("#pList");
  if (!res || !list) return;
  const chips = [];
  if (S.so) chips.push(`S${S.so.replace("-", "×O")}`);
  if (S.trig !== "all") chips.push(S.trig);
  if (S.q) {
    res.innerHTML = `全局搜索 <b>${arr.length}</b> / ${P.length} 条 ｜ 关键词 “<b>${esc(S.q)}</b>”` +
      `<span style="color:var(--ink-4)"> ｜ 筛选条件已让位</span>`;
  } else {
    res.innerHTML = `命中 <b>${arr.length}</b> / ${P.length} 条${chips.length ? " ｜ " + chips.join(" · ") : ""}`;
  }
  if (!arr.length) {
    // 搜不到时给反向引导：从分诊表的症状词反查
    const q = (S.q || "").toLowerCase();
    const sug = [];
    if (q) {
      D.triage.entries.forEach(e => e.groups.forEach(g => g.rows.forEach(r => {
        if (r.symptom.toLowerCase().includes(q) && !sug.includes(r.fp)) sug.push(r.fp);
      })));
    }
    list.innerHTML = `<div class="empty"><div class="big">∅</div><p>没有模式正文命中 “${esc(S.q)}”</p>
      <div class="hint2">换个说法试试（如 <b>OOM</b> / <b>racecheck</b> / <b>161001</b> / <b>图模式</b>），或从症状分诊进入</div>
      ${sug.length ? `<div style="margin-top:18px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        ${sug.map(f => `<span class="cand" data-fp="${f}"><span class="cid">${f}</span></span>`).join("")}
      </div><div class="hint2" style="margin-top:8px">分诊表里含该症状词的候选</div>` : ""}
    </div>`;
    return;
  }
  list.innerHTML = `<div class="rows">
    <div class="head-row"><span>编号</span><span>模式名称</span><span>类别</span><span>风险</span><span>负载</span><span style="text-align:right">案例</span></div>
    ${arr.map(p => `<div class="row" data-fp="${p.id}">
      <div class="rid">${p.id}</div>
      <div class="rname">${markHits(esc(p.name), S.q)}</div>
      <div class="rcat">${catDot(p.cat)}${p.catZh}</div>
      <div>${riskBadge(p)}</div>
      <div class="rdepth">${p.depth}</div>
      <div class="rcase"><b>${p.caseCount || "—"}</b></div>
    </div>`).join("")}
  </div>`;
}

/* ---------------- cases ---------------- */
render.cases = function () {
  const fps = [...new Set(C.map(c => c.fp))].sort();
  $("#v-cases").innerHTML = `
  <div class="ptitle"><h2>实证案例</h2><span class="tag">${C.length} 条</span></div>
  <p class="pdesc">每条案例对应真实 issue 或跨仓核验，含触发条件、根因、最小复现、可执行判据与修复范式。
    <b>${M.caseStats.with_verified_anchor || 0}</b> 条带真实修复锚点（文件 + 行号 + commit）。</p>
  <div class="fbar">
    <div class="fgrp"><span>模式</span>
      <button class="pill ${S.caseFp === "all" ? "on" : ""}" data-cfp="all">全部<span class="c">${C.length}</span></button>
      ${fps.map(f => `<button class="pill ${S.caseFp === f ? "on" : ""}" data-cfp="${f}">${f}<span class="c">${C.filter(c => c.fp === f).length}</span></button>`).join("")}
    </div>
  </div>
  <div class="res" style="margin:-4px 0 10px" id="cRes"></div>
  <div class="clist" id="cList"></div>`;
  $("#v-cases").addEventListener("click", e => {
    const b = e.target.closest("[data-cfp]");
    if (b) {
      S.caseFp = S.caseFp === b.dataset.cfp ? "all" : b.dataset.cfp;
      render.cases(); $("#v-cases").dataset.done = "1"; applyCaseFilters();
    }
  });
};

function currentCases() {
  const q = (S.caseQ || S.q || "").toLowerCase();
  return C.filter(c => {
    if (!q && S.caseFp !== "all" && c.fp !== S.caseFp) return false;
    if (!q) return true;
    const hay = [c.id, c.fp, c.title, c.trigger, c.root, c.repro, c.evidence, (c.issues || []).join(" "),
      (c.code || ""), (c.criteria ? JSON.stringify(c.criteria) : ""),
      (c.anchors || []).map(a => a.file + " " + a.note).join(" ")].join(" ").toLowerCase();
    return q.split(/\s+/).every(w => hay.includes(w));
  });
}

function markHits(html, q) {
  if (!q) return html;
  const words = q.split(/\s+/).filter(Boolean).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!words.length) return html;
  const re = new RegExp("(" + words.join("|") + ")", "gi");
  // 只对纯文本片段加高亮，避免破坏已有标签
  return html.replace(/(<[^>]*>)|([^<]+)/g, (m, tag, text) =>
    tag ? tag : text.replace(re, '<mark class="hit">$1</mark>'));
}

function applyCaseFilters() {
  const arr = currentCases();
  const res = $("#cRes"), list = $("#cList");
  if (!res || !list) return;
  res.innerHTML = S.caseQ || S.q
    ? `全局搜索 <b>${arr.length}</b> / ${C.length} 条 ｜ 关键词 “<b>${esc(S.caseQ || S.q)}</b>”`
    : `命中 <b>${arr.length}</b> / ${C.length} 条`;
  if (!arr.length) {
    list.innerHTML = `<div class="empty"><div class="big">∅</div><p>没有符合条件的案例</p>

          <div class="dbox"><div class="dh2">constructor</div><div class="dv">${md(det.constructor)}</div></div>
          <div class="dbox"><div class="dh2">judge</div><div class="dv">${md(det.judge)}</div></div>
          <div class="dbox" style="grid-column:1/-1;background:#fffdfa;border-color:#e6d9c3"><div class="dh2">kill — 缺陷成立的判据</div><div class="dv">${md(det.kill)}</div></div>
        </div>
        ${dt ? `<div class="prio">
          <span class="pl">可检出性</span>
          <span class="pv">${esc(dt.level || "")} · D${esc(dt.d || "")}</span>
          <span class="pf">priority = S${p.s}×O${p.o}×D${esc(dt.d || "")} = ${esc(dt.priority != null ? dt.priority : "—")}</span>
        </div>
        ${dt && dt.why ? `<div style="margin-top:7px;font-size:11.5px;color:var(--ink-3)">${md(dt.why)}</div>` : ""}` : ""}
      </div>
    </div>`;
  }

  let secHtml = "";
  if (p.secondary) {
    const s = p.secondary;
    const kinds = (M.secondaryKinds || {});
    secHtml = `<div class="fld">
      <div class="fld-h"><span class="n">⊘</span><h4>第二判据</h4><span class="sub">${esc(s.kind || "")}</span></div>
      <div class="fld-b" style="padding:12px">
        ${kinds[s.kind] ? `<div style="font-size:11px;color:#5b3d8f;font-family:var(--mono);margin-bottom:8px">${esc(s.kind)} · ${esc(kinds[s.kind]).slice(0, 60)}</div>` : ""}
        ${s.why ? `<div class="why">${md(s.why)}</div>` : ""}
        ${(s.relations || []).map(r => `<div class="rel-item">
          <div class="rh"><span class="rid3">${esc(r.id || "")}</span><span class="rnm">${esc(r.name || "")}</span></div>
          ${r.statement ? `<div class="rv">${md(r.statement)}</div>` : ""}
          ${r.kill ? `<div class="rk"><b>能杀死什么</b> · ${md(r.kill)}</div>` : ""}
          ${r.how ? `<div class="rhw">怎么测 · ${md(r.how)}</div>` : ""}
        </div>`).join("")}
      </div>
    </div>`;
  }

  let caseHtml = "";
  if (cases.length) {
    caseHtml = `<div class="fld">
      <div class="fld-h"><span class="n">❐</span><h4>实证案例</h4><span class="sub">${cases.length} 条 · 点击展开</span></div>
      ${cases.map((c, i) => `<div class="dcase" data-dcase="${c.id}">
        <div class="dcase-h">
          <span class="cid2">${String(i + 1).padStart(2, "0")}</span>
          <span class="t2">${esc(c.title)}</span>
          ${(c.anchors || []).length ? `<span class="badge-v">锚点</span>` : ""}
          <span class="arw2">▶</span>
        </div>
        <div class="dcase-b">
          ${c.trigger ? `<div class="kv"><div class="kk">触发条件</div><div class="vv">${md(c.trigger)}</div></div>` : ""}
          ${c.root ? `<div class="kv"><div class="kk">根因</div><div class="vv">${md(c.root)}</div></div>` : ""}
          ${c.repro ? `<div class="kv"><div class="kk">最小复现</div><div class="vv">${md(c.repro)}</div></div>` : ""}
          ${c.criteria && c.criteria.check && c.criteria.check.length ? `<div class="kv"><div class="kk">可执行判据</div><div class="vv"><ul>${c.criteria.check.map(x => `<li>${md(x)}</li>`).join("")}</ul></div></div>` : ""}
          ${c.code ? `<div class="kv"><div class="kk">修复范式</div><pre class="code">${esc(c.code)}</pre></div>` : ""}
          ${(c.anchors || []).length ? (c.anchors || []).map(a => `<div class="kv"><div class="kk">真实锚点 · ${esc(a.repo || "")} @ ${esc(a.commit || "")}</div>
            <div class="vv"><code>${esc(a.file || "")}${a.lines ? ":" + esc(a.lines) : ""}</code><br>${md(a.note || "")}</div></div>`).join("") : ""}
          ${c.evidence ? `<div class="kv"><div class="kk">实证</div><div class="vv">${md(c.evidence)}</div></div>` : ""}
        </div>
      </div>`).join("")}
    </div>`;
  }

  let relHtml = "";
  if (arrOf(p.related).length) {
    relHtml = `<div class="fld">
      <div class="fld-h"><span class="n">↔</span><h4>关联模式</h4></div>
      <div class="rel-wrap">${arrOf(p.related).map(r => {
        const q = byId[r];
        return `<span class="rel" data-fp="${r}"><span class="rid2">${r}</span>${q ? `<span style="color:var(--ink-3);font-size:11px">${esc(q.name).slice(0, 18)}</span>` : ""}</span>`;
      }).join("")}</div>
    </div>`;
  }

  const sigBlock = (arrOf(p.signatures).length || arrOf(p.keywords).length || arrOf(p.broad).length || arrOf(p.absence).length || arrOf(p.logSig).length) ? `
    <div class="fld">
      <div class="fld-h"><span class="n">⌕</span><h4>检测签名与关键词</h4><span class="sub">点击复制</span></div>
      <div class="fld-b" style="padding:12px">
        ${arrOf(p.signatures).length ? `<div class="kk" style="font-size:10.5px;color:#9b0009;font-weight:600;margin-bottom:6px">判别性指纹 · 命中即候选（${arrOf(p.signatures).length}）</div>${sigList(p.signatures)}` : ""}
        ${arrOf(p.broad).length ? `<div class="kk" style="font-size:10.5px;color:#8a5200;font-weight:600;margin:11px 0 6px">宽泛签名 · 仅定位（${arrOf(p.broad).length}）</div>${sigList(p.broad)}` : ""}
        ${arrOf(p.absence).length ? `<div class="kk" style="font-size:10.5px;color:#2c5282;font-weight:600;margin:11px 0 6px">缺失型签名 · 找「该有却没有」（${arrOf(p.absence).length}）</div>${sigList(p.absence)}` : ""}
        ${arrOf(p.logSig).length ? `<div class="kk" style="font-size:10.5px;color:#5b3d8f;font-weight:600;margin:11px 0 6px">日志签名（${arrOf(p.logSig).length}）</div>${sigList(p.logSig)}` : ""}
        ${arrOf(p.keywords).length ? `<div class="kk" style="font-size:10.5px;color:#6b5b33;font-weight:600;margin:11px 0 6px">审查关键词 · 命中不产生候选，仅提示人审（${arrOf(p.keywords).length}）</div>${sigList(p.keywords, "kw")}` : ""}
        ${p.waiver ? `<div style="margin-top:11px;font-size:11px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:9px">产出豁免 · ${esc(p.waiver)}</div>` : ""}
      </div>
    </div>` : "";

  const evHtml = arrOf(p.evidence).length ? `
    <div class="fld">
      <div class="fld-h"><span class="n">✓</span><h4>实证索引</h4><span class="sub">${arrOf(p.evidence).length} 条</span></div>
      <div class="ev-list">${arrOf(p.evidence).map((e, i) => `<div class="ev"><span class="num">${i + 1}</span><div class="tx">${md(e)}</div></div>`).join("")}</div>
    </div>` : `<div class="fld"><div class="fld-h"><span class="n">✓</span><h4>实证状态</h4></div>
      <div class="fld-b warm">检索无对应实证 —— 属方法学型条目，证据待补充；风险评级已如实标注。</div></div>`;

  dh.innerHTML = `
    <div class="dh-top">
      <span class="fpid">${p.id}</span>
      <span class="cat">${catDot(p.cat)}${p.catZh}</span>
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
        ${riskBadge(p)}
      </span>
    </div>
    <h2>${esc(p.name)}</h2>
    <div class="dh-meta">
      <span class="mchip">负载 <b>${p.depth}</b></span>
      <span class="mchip">触发 <b>${esc(p.triggerZh || p.trigger)}</b></span>
      <span class="mchip">侧别 <b>${esc(arrOf(p.sides).join(" / "))}</b></span>
      <span class="mchip">仓 <b>${esc(arrOf(p.repos).join(" / "))}</b></span>
      <span class="mchip">载体 <b>${esc(arrOf(p.carriers).join(" / "))}</b></span>
      <span class="mchip">案例 <b>${cases.length}</b></span>
    </div>
    <button class="dh-x" id="dx">✕</button>`;

  db.innerHTML = `
    ${fld(1, "故障机理", b.mechanism)}
    ${fld(2, "触发条件", b.conditions)}
    ${fld(3, "典型表现", b.manifest, "warm")}
    ${p.trigger ? `<div class="fld"><div class="fld-h"><span class="n">⌗</span><h4>适用声明</h4></div>
      <div class="fld-b cool">${esc(b.applicability_text || "")}</div></div>` : ""}
    ${subtypesHtml}
    ${fld(4, "源码审查映射点", b.mapping)}
    ${sigBlock}
    ${detHtml}
    ${secHtml}
    ${fld(5, "测试拦截建议", b.intercept, "cool")}
    ${caseHtml || evHtml}
    ${relHtml}
    <div class="fld"><div class="fld-h"><span class="n">i</span><h4>元数据</h4></div>
      <div class="fld-b" style="font-size:12px">${esc(b.meta_info || "")}
        ${p.file ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:10.5px;color:var(--ink-4)">${esc(p.file)}</div>` : ""}
        ${p.tocEvidence ? `<div style="margin-top:5px;font-size:11.5px;color:var(--ink-3)">总览表实证列 · ${esc(p.tocEvidence)}</div>` : ""}
      </div></div>`;

  drawer.classList.add("on");
  mask.classList.add("on");
  document.body.style.overflow = "hidden";
  db.scrollTop = 0;

  $("#dx").onclick = closeDrawer;
  db.querySelectorAll(".dcase-h").forEach(h => {
    h.addEventListener("click", () => h.parentElement.classList.toggle("open"));
  });
}

function openCase(cid) {
  const c = C.find(x => x.id === cid);
  if (!c) return;
  const p = byId[c.fp];
  dh.innerHTML = `
    <div class="dh-top">
      <span class="fpid">${c.fp}</span>
      <span class="cat">${p ? catDot(p.cat) + p.catZh : ""}</span>
      <span style="margin-left:auto;display:flex;gap:6px">${p ? riskBadge(p) : ""}</span>
    </div>
    <h2>${esc(c.title)}</h2>
    <div class="dh-meta">
      <span class="mchip">案例 <b>${c.id}</b></span>
      ${c.subtype ? `<span class="mchip">子型 <b>${esc(c.subtype)}</b></span>` : ""}
      ${(c.issues || []).map(i => `<span class="mchip iss">${esc(i)}</span>`).join("")}
      ${(c.anchors || []).length ? `<span class="mchip" style="background:#eaf7ee;border-color:#cfe9d8;color:#1a7f45">真实锚点 ${c.anchors.length}</span>` : ""}
    </div>
    <button class="dh-x" id="dx">✕</button>`;
  db.innerHTML = `
    ${c.trigger ? `<div class="fld"><div class="fld-h"><span class="n">1</span><h4>触发条件</h4></div><div class="fld-b">${md(c.trigger)}</div></div>` : ""}
    ${c.root ? `<div class="fld"><div class="fld-h"><span class="n">2</span><h4>根因</h4></div><div class="fld-b warm">${md(c.root)}</div></div>` : ""}
    ${c.repro ? `<div class="fld"><div class="fld-h"><span class="n">3</span><h4>最小复现</h4></div><div class="fld-b cool">${md(c.repro)}</div></div>` : ""}
    ${c.criteria && c.criteria.check && c.criteria.check.length ? `<div class="fld"><div class="fld-h"><span class="n">4</span><h4>可执行判据</h4></div>
      <div class="fld-b"><ul>${c.criteria.check.map(x => `<li>${md(x)}</li>`).join("")}</ul></div></div>` : ""}
    ${c.code ? `<div class="fld"><div class="fld-h"><span class="n">5</span><h4>修复范式</h4></div><pre class="code">${esc(c.code)}</pre></div>` : ""}
    ${(c.anchors || []).length ? `<div class="fld"><div class="fld-h"><span class="n">6</span><h4>真实修复锚点</h4><span class="sub">文件 + 行号 + commit</span></div>
      ${c.anchors.map(a => `<div class="fld-b" style="margin-bottom:8px">
        <div class="mono-sm" style="margin-bottom:5px">${esc(a.repo || "")} @ ${esc(a.commit || "")} ｜ ${esc(a.issue || "")}</div>
        <code>${esc(a.file || "")}${a.lines ? ":" + esc(a.lines) : ""}</code>
        <div style="margin-top:7px">${md(a.note || "")}</div></div>`).join("")}</div>` : ""}
    ${c.evidence ? `<div class="fld"><div class="fld-h"><span class="n">7</span><h4>实证</h4></div><div class="fld-b">${md(c.evidence)}</div></div>` : ""}
    ${c.skill ? `<div class="fld"><div class="fld-h"><span class="n">8</span><h4>对应 skill</h4></div><div class="fld-b"><code>${esc(c.skill)}</code></div></div>` : ""}
    <div class="fld"><div class="fld-h"><span class="n">↔</span><h4>所属模式</h4></div>
      <div class="rel-wrap"><span class="rel" data-fp="${c.fp}"><span class="rid2">${c.fp}</span>${p ? `<span style="color:var(--ink-3);font-size:11px">${esc(p.name).slice(0, 24)}</span>` : ""}</span></div></div>`;
  drawer.classList.add("on");
  mask.classList.add("on");
  document.body.style.overflow = "hidden";
  db.scrollTop = 0;
  $("#dx").onclick = closeDrawer;
}

/* ---------------- global delegation ---------------- */
document.addEventListener("click", e => {
  const t = e.target;

  const fpEl = t.closest("[data-fp]");
  if (fpEl) { openPattern(fpEl.dataset.fp); return; }

  const caseEl = t.closest("[data-case]");
  if (caseEl) { openCase(caseEl.dataset.case); return; }

  const copyEl = t.closest("[data-copy]");
  if (copyEl) {
    const v = copyEl.dataset.copy;
    if (navigator.clipboard) navigator.clipboard.writeText(v).then(() => toast("已复制签名")).catch(() => toast("复制失败"));
    else toast("当前环境不支持剪贴板");
    return;
  }

  const soEl = t.closest("[data-so]");
  if (soEl) {
    const ids = stats.matrix[soEl.dataset.so] || [];
    if (!ids.length) { toast("该组合下没有模式"); return; }
    S.so = soEl.dataset.so; S.cat = "all"; S.lvl = "all"; S.depth = "all"; S.trig = "all"; S.q = "";
    $("#q").value = "";
    go("patterns"); render.patterns(); $("#v-patterns").dataset.done = "1"; applyFilters();
    return;
  }

  const catEl = t.closest("[data-cat]");
  if (catEl) {
    S.cat = catEl.dataset.cat; S.lvl = "all"; S.depth = "all"; S.so = null; S.trig = "all";
    go("patterns"); render.patterns(); $("#v-patterns").dataset.done = "1"; applyFilters();
    return;
  }

  const trigEl = t.closest("[data-trig]");
  if (trigEl) {
    S.trig = trigEl.dataset.trig; S.cat = "all"; S.lvl = "all"; S.depth = "all"; S.so = null;
    go("patterns"); render.patterns(); $("#v-patterns").dataset.done = "1"; applyFilters();
    return;
  }

  const jumpEl = t.closest("[data-jump]");
  if (jumpEl) {
    const card = document.querySelector(`.tcard[data-t="${jumpEl.dataset.jump}"]`);
    if (card) {
      document.querySelectorAll(".tcard").forEach(c => c.classList.remove("open"));
      card.classList.add("open");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    }
    return;
  }

  const tHead = t.closest(".tcard-h");
  if (tHead) { tHead.parentElement.classList.toggle("open"); return; }

  const l2 = t.closest("[data-l2] .dcase-h");
  if (l2) { l2.parentElement.classList.toggle("open"); return; }

  const secH = t.closest("[data-sec] .sec-h2");
  if (secH) { secH.parentElement.classList.toggle("open"); return; }
});

/* ---------------- search ---------------- */
const qEl = $("#q");
let qTimer;
qEl.addEventListener("input", () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    const v = qEl.value.trim();
    S.q = v; S.caseQ = v;
    if (S.view === "patterns") applyFilters();
    else if (S.view === "cases") applyCaseFilters();
    else {
      go("patterns"); render.patterns(); $("#v-patterns").dataset.done = "1"; applyFilters();
    }
  }, 120);
});
document.addEventListener("keydown", e => {
  if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
  if (e.key === "Escape") {
    if (drawer.classList.contains("on")) closeDrawer();
    else if (document.activeElement === qEl) { qEl.blur(); qEl.value = ""; S.q = ""; S.caseQ = ""; if (S.view === "patterns") applyFilters(); if (S.view === "cases") applyCaseFilters(); }
  }
});

/* ---------------- boot ---------------- */
window.__FP_APP__ = { patterns: P, cases: C, meta: M, openPattern, openCase };
const h = (location.hash || "#/overview").replace("#/", "");
go(TITLES[h] ? h : "overview");
})();
</script>
</body>
</html>
