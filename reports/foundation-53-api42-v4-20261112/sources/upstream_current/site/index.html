151/#1103/#1004/#2224 等"},{"id":"F02-2","name":"dump 类调试产物为空或路径错误","evidence":"ops-nn#1151"},{"id":"F02-3","name":"错误码/报错信息不规范、跨仓不一致","evidence":"ops-nn#143"},{"id":"F02-4","name":"异常被静默吞掉（该报不报）","evidence":"多 issue"},{"id":"F02-5","name":"日志级别误用——可预期降级被按 error 上报（不该报却报），制造误报与虚假告警淹没真实故障","evidence":"canndev#1660 / canndev#1837"}],"waiver":"","detect":{"axes":["contract","doc"],"oracle":["log-field","error-code"],"signal":"error-code","lines":["error-scenario"],"min_cases":3,"constructor":"负向用例断言「返回码 + 错误信息关键字段」；跨仓同源算子同一非法输入的返回码对照矩阵；配置 dump/日志开关后检查产物非空；正常用例统计 error 日志条数基线。","judge":"错误码与错误类别匹配（161001 / 161002 / INNER_* 不混用）；日志文案合规且含上下文；降级路径不出 error 级日志。","kill":"若错误分支不上报或上报为非 fatal 级别，则同因不同码，或可预期降级路径出现 error 级日志（误报）。","sourced":{"constructor":"测试拦截建议","judge":"源码审查映射点","kill":"源码审查映射点"}},"detectability":{"d":2,"level":"D2","why":"oracle 部分静态可判（error-code/log-field）","priority":6},"secondary":null,"body":{"extras":[{"k":"测试集失败语料补充（v2.13，2026-09-19，具体 issue 编号待核）","v":"ErrMsg/错误码整改是**规模化**问题——QSFA/SFA/LI/QLI/FA 算子族在 layout 错误时拦截所用**错误码不对**（**子型 ③-b**）、FIA dtype 格式需统一大小写、MlaProlog shape 约束描述有误。结合已入库的 canndev **#1837**（单模块 721 处日志不规范）与 **#1660**（日志级别误用），本型的体量已超出「逐条人工评审」的可承受范围 ⇒ **子型 ③-b 必须做成静态检查项而非文档约定**。"},{"k":"子型 ③-b 的错误码选择矩阵（v2.13 新增，供源码审查直接对照）","v":"| 实际异常类型 | 应报错误码 | 常见误用 |\n|---|---|---|\n| 指针为 `nullptr` | `ACLNN_ERR_PARAM_NULLPTR`(161001) | 误报 `PARAM_INVALID` |\n| dtype / layout / format 不匹配 | `ACLNN_ERR_PARAM_INVALID`(161002) | 与 161001 互换 |\n| shape / 属性取值非法（维数、维度值、属性长度） | `ACLNN_ERR_PARAM_INVALID`(161002) | 误报 `INNER_*`（把用户侧错误报成内部错误） |\n| 平台 / SoC 不支持该能力 | `ACLNN_ERR_PARAM_INVALID`(161002) 或按支持面约定 | 误报 `INNER_*` |\n| CANN 内部状态、资源异常（非用户输入所致） | `ACLNN_ERR_INNER_*` | 误报 `PARAM_INVALID`（把内部缺陷推给用户） |"},{"k":"备注","v":"本类为 v2.5 新开的 **FP-F 工程/交付** 类别；**FP-F01「构建/工程配置不一致致编译与产物缺陷」已于 v2.7 正式录入（原编号预留）**，FP-F03「文档/声明面与实现面不一致」同批新增。"}],"meta_info":"类别 工程/交付 ｜ 风险 中（S1×O3=3）｜ 状态 活跃 ｜ 来源 四仓 issue 全量语料对照（2026-09-14：维测/日志类 110 条 + 报错信息/错误码类 90 条）+ canndev 仓检索增补（2026-09-16：#1660 日志级别误用、#1837 日志规范 721 处）","applicability_text":"仓 All ｜ 侧别 Tiling,Kernel,Host ｜ 载体 Tiling源码,Kernel源码,Host源码 ｜ 触发 OP_LOGE|ACLNN_ERR ｜ 默认启用 true","mechanism":"算子/接口的**可观测性产物**缺失或错误，使缺陷无法定位甚至被误导：① 日志与维测信息不打印、打印时机错误（编译/执行结束才输出）、内容缺字段或拼写错误；② dump 类调试产物（`--dump_cce` 的 `kernel_meta`、tiling/日志开关）为空或路径错误；③ **错误码/报错信息不规范**（**v2.13 拆显为两个可独立判定的子面**）：**③-a 跨仓/跨接口不一致**——同一非法输入在不同仓/不同接口返回不同错误码；**③-b 错误码选择错误**——拦截**确实存在**但所选错误码与场景不匹配，典型为 `ACLNN_ERR_PARAM_INVALID`(161002) / `ACLNN_ERR_PARAM_NULLPTR`(161001) / `ACLNN_ERR_INNER_*` 三者混用（如 layout/dtype 不匹配误报为 PARAM_INVALID、空输入误报为 INVALID 而非 NULLPTR）；两子面之外另含缺少上下文（算子名/参数名/实际值）；④ 异常被静默吞掉（日志级别过低、错误分支直接 `return` 未上报）；⑤ **日志级别误用（反向问题）**——**设计内的正常降级/可预期分支被按 error 级别上报**，制造大量误报 error 日志与虚假监控告警，反而**掩盖真实故障**（与 ④ 方向相反：④ 是该报不报，⑤ 是不该报却报，二者共同后果都是真实故障被淹没）。根因多为模板/复制导致的维测宏漏插、错误分支未上报、**降级分支的日志级别未与「是否 fatal」对齐**、跨仓错误码约定未统一。","conditions":"任一异常分支（参数非法、shape/dtype 不支持、内存不足、属性非法）；构建或运行期启用 dump/日志开关；**同源算子在两仓之间的同一非法输入对照**；错误信息巡检（人工阅读）；**规范化工具全量扫描**（如 `cann-log-evaluation` 类工具）；**可预期的降级路径被走通**（如查询类接口返回异常值，而设计上仅回退默认行为并继续执行）。","manifest":"报错信息与真实根因不符 → 排查跑偏；同一输入在 ops-nn 与 ops-math 返回**不同错误码**（如 561002 vs 调用成功）；`--dump_cce` 产物目录为空导致无法复现定位；日志晚于失败点输出，无法定位到具体算子；维测信息缺字段（如 Shape 少一个 `]`）致下游解析失败；**正常降级场景刷出 error 级日志**，使日志中 error 密度失真、依赖 error 级别告警/监控的环境产生**虚假告警**，真实故障被淹没；**日志文案不符合规范且规模化存在**（单模块可达数百处，含拼写错误、语法错误、描述不完整），人工评审无法覆盖。","mapping":"每个错误分支是否上报且携带上下文（`OP_LOGE_FOR_INVALID_*` 系列 vs 裸 `OP_LOGE`）；错误码与错误类别是否匹配（`ACLNN_ERR_PARAM_INVALID`(161002) / `ACLNN_ERR_PARAM_NULLPTR`(161001) / `ACLNN_ERR_INNER_*` 不可混用）；`return ge::GRAPH_FAILED;` / `return ACLNN_ERR_*;` 之前是否已有日志；维测宏（`OP_LOGD`、`DUMP_*`、`--dump_cce`、tiling dump 开关）是否插入且级别正确；**同源算子在四仓的返回码是否一致**；是否存在「校验到了但静默返回 SUCCESS」；**每个 `OP_LOGE` 所在分支是否真的 fatal**（可预期降级应按 `OP_LOGW`/`OP_LOGI` 上报，否则制造误报）；**日志文案是否符合《CANN 日志规范》**（语法完整性、拼写正确、错误描述含上下文、含度量单位）；是否存在**含义相反的拼写**（如 `Excepted` 与 expected 反义）导致语义完全反转。","signatures_text":"`OP_CHECK_[A-Z_]+` 覆盖率统计（错误分支数 vs 上报数）；`OP_LOGE(_FOR_[A-Z_]+)?\\(`；`return\\s+(ge::GRAPH_FAILED|ACLNN_ERR_[A-Z_]+)\\s*;` 前一行是否有日志；`DUMP_(SCENES|TENSOR)|dump_cce|TILING_?DUMP`；`ACLNN_ERR_(PARAM|INNER)_[A-Z_]+` 与场景匹配性；**`OP_LOGE` 与 `return (false|SUCCESS|GRAPH_SUCCESS)` 同现于同一分支**（降级分支误用 error 级别的高危形态）；**`INT32_MAX|UINT32_MAX` 等异常返回值与 `OP_LOGE` 同现**（异常返回值常被当 fatal 误报）；日志文案规范扫描工具输出（`cann-log-evaluation` 类）。","intercept":"负向用例断言「返回码 + 错误信息关键字段」而不仅 `rc != 0`；对跨仓同源算子做**同一非法输入的返回码对照矩阵**（把不一致本身当缺陷提）；CI 增加「配置了 dump/日志开关但产物为空」的产物检查；错误码文档化并纳入审查（避免同因不同码）；错误信息做拼写/字段完整性巡检。**增补**：① 引入**日志规范自动化评测工具**（如 `cann-log-evaluation`）做**全量模块扫描并纳入 CI 门禁**，把「文案规范」从人工评审转为机器拦截（这是能把数百处问题一次暴露的唯一可行手段）；② 用例侧对**可预期降级路径**增加断言——断言「**该场景不应出现 error 级别日志**」，把误报本身当缺陷；③ 跑正常业务用例时**统计 error 日志条数基线**，异常增幅即告警（过滤误报噪音）。","evidence_text":"ops-nn **#143** `HardSwish` 在 ops-nn 库 aclnn 调用报 **561002**，而在 ops-math 库 aclnn 调用**成功**（跨仓错误码/行为不一致，最易误导定位）；**#1151** 编译指定 `--dump_cce` 后 `kernel_meta` 文件夹为空；**#1103** kernel 编译日志只在实际编译结束后才打印（失败时看不到过程信息）；**#1004** DLQBMM 异常拦截维测信息 Shape 少一个 `]`；**#2224** GroupNormGrad 日志打印文本拼写错误；**#1283** tbmm warning 报错信息待修复。语料统计（2026-09-14，四仓缺陷类）：「维测/dump/日志缺失或错误」110 条 + 「报错信息/错误码不规范或不一致」90 条。**canndev 仓增补实证（2026-09-16）**：**#1660**（closed）gemm tiling 中 `GetCloseKShiftFlag()` 经 `context->GetDeterministicLevel()` 判断是否关闭 K-shift，当该接口返回异常值 `INT32_MAX` 时实现**打印 error 级别日志**（`OP_LOGE(nodeName, \"GetDeterministicLevel() failed.\")`）——而该场景表示「无法获取确定性级别」，函数**按设计回退 `false` 并继续执行，属可预期降级，不应按 error 上报**；issue 明列三条后果：① 日志被大量误报 error 干扰真实故障排查；② 依赖 error 级别告警/监控的环境产生**虚假告警**；③ 与函数实际行为（正常 `return false`，非 fatal）不一致（MatMul/BatchMatMul 等算子 tiling 路径，属**子型 ⑤ 日志级别误用**的教科书案例，同时是 **FP-A20** 的实证）；**#1837**（open）用 CANN 日志规范评测工具（`cann-log-evaluation`）对 `ops/built-in/aicpu` 运行时日志做**全量扫描**，发现 **721 处**不符合《CANN 日志规范》——语法错误 525、拼写错误 109、错误描述不完整 86、缺少度量单位 1；典型拼写 `succcess`/`ouput`/`memeset_s`/`shoule`/**`Excepted`（与 expected 含义相反）**/`dismatch`/`invlaid`/`argumengt`/`verfication`/`Poissonon`/`NonZeroe`/`Copyview`/`Ranperm`，语法问题如 `not support`→`is not supported`、`must greater than`→`must be greater than`、`need be same`——**单模块 721 处的规模化实证，且附带了可行的工具化拦截方案**。","related_text":"[FP-B04](../FP-B/FP-B04.md)（空指针校验缺失——常与\"未上报\"伴生）、[FP-B05](../FP-B/FP-B05.md)（校验覆盖度参差——同源，均为范差不齐）、[FP-B01](../FP-B/FP-B01.md)（误拦截时错误信息质量决定排查成本）、[FP-E01](../FP-E/FP-E01.md)（测试只断言 rc 不校验错误信息会导致此类漏检）、[FP-A20](../FP-A/FP-A20.md)（确定性等级未分级标注，亦属「信息未暴露给使用者」的可观测性问题；**#1660 同时是 A20 的实证**——确定性接口异常返回值的语义未与调用方对齐，致调用方把可预期降级当 fatal）；[FP-B08](../FP-B/FP-B08.md)（属性/配置读取失败后**静默降级 return false** 且以 `OP_LOGE` 上报，与本型子型 ⑤ 同属「降级路径日志级别与 fatal 语义不对齐」）。**子型 ④ 与子型 ⑤ 构成完整对称面：④ 该报不报（静默吞掉）→ 故障无痕；⑤ 不该报却报（误报 error）→ 故障被淹没。**。"},"caseCount":0},{"id":"FP-F03","name":"文档/声明面与实现面不一致","file":"patterns/FP-F/FP-F03.md","cat":"engineering","catZh":"工程/交付","s":1,"o":3,"level":"中","score":3,"depth":"宽浅","status":"active","trigger":"README|AddConfig|TensorType::(Real)?NumberType\\(\\)","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["文档与支持矩阵","IR与图配置"],"enabled":true,"evidence":["ops-nn#4890(BatchNorm 等 6 算子 A5 确定性声明「默认非确定支持开关」与代码实际默认确定且不读开关不符)","ops-nn#4504(index 目录 15 算子 README 支持表声明 3~6 个产品而 def AddConfig 仅注册 ascend950)","ops-cv#567(resize_bilinear_v2 文档产品表 Atlas 全标支持而开源仓无 Atlas kernel)","ops-cv#570(普通 bilinear/bicubic 上采样 def 未注册 ascend950 而 _aa 变体已注册, 同族不对称)","ops-math#2922(rsqrt_grad README 与 geir 示例整体复制自 sqrt_grad, 公式/dtype/Op名/链接全错且示例编译失败)","ops-fft#42(build.sh 帮助文本声称仅支持 950 与 get_soc_version 实际 6 型号矛盾)","ops-nn#6892(open, SegmentSum): Proto 用 TensorType::NumberType() 声明 x/y 含 INT8, 而 README/OpDef/Ascend 950/350 tiling 只支持 7 种类型, INT8 通过 Proto 声明却在执行端被拒","ops-nn#6790(open, BNLL): Proto dtype 范围与实现不一致","ops-nn#6793/#6795/#6836(open, L2Loss/EluGrad/FusedBiasLeakyReluGrad): Proto 声明了未实现的 DOUBLE 类型","ops-nn#6791(open, DeformableOffsetsGrad): Proto 反向拒绝实现已支持的 BF16 输出","ops-nn#6870(open, AvgPool3D): Proto ceil_mode 宽度公式把 in_width 重复使用且遗漏 pad_left, 与同仓 infershape 实际公式不一致","ops-transformer#6314(open, GenericBlockSparseAttentionGrad): ACLNN 文档把约束写成 N1 > N2, 错误排除合法 MHA 配置 N1=N2","ops-transformer#6126/#6127(closed+resolved, SwinTransformerLnQKV): OpProto 用 REQUIRED_ATTR 声明 head_num/head_dim/seq_length, 注释却写成可选","ops-transformer#5952(closed+resolved, NsaSelectedAttentionInfer): 四个必须非空的参数在文档中被说明为可省略","ops-cv#1214(closed+resolved, Rasterizer): README 把可选输入 d 误标为属性","2026-11-06 五仓 25 案一轮：21 条文档类 issue 主体是 F03-7（实现有上限、文档不提），且高度成族——foreach 七连、aclnnInplace 五连、AvgPool2d 两连","ops-math#4581(aclnnInplaceMul 8 维上限未披露, 而成对接口 aclnnMuls 资料已写「不大于8」——成对不对称是最强缺口证据)","ops-transformer#7171(aclnnNsaCompressAttention headDim 上限 768 未披露, 报错文案却写 512, 自相矛盾)","ops-nn#8269(aclnnForeachLog1p TensorList 上限 128 未披露, 同族其它接口是 256——族内上限值不同, 不可按族推广)"],"tocEvidence":"6 issue（3 仓，30+ 算子）","signatures":["TensorType::(Real)?NumberType\\(\\)"],"keywords":["README 支持表与 AddConfig\\(\\\"([a-z0-9_]+)\\\" 注册清单差集","README 首行 Op 名与本目录名不一致(复制残留检测)","Proto 端口 dtype 集合与 op_host 的 dtypeList / README 支持表三方差集","README 或 Proto 声明的 rank 上界与 InferShape 实际接受集合不一致"],"absence":[],"broad":[],"logSig":[],"symptoms":["README 声明支持但调用报未适配","示例编译失败","支持矩阵与注册不符"],"detectors":["README 支持表与 AddConfig 差集扫描","复制残留检测（首行 Op 名 ≠ 目录名）"],"related":["FP-F01","FP-A20","FP-B01"],"subtypes":[{"id":"F03-1","name":"支持矩阵与注册面脱节（README 产品表 vs AddConfig/binary.json）","evidence":"ops-nn#4504; ops-cv#567/#570"},{"id":"F03-2","name":"文档公式/约束/参数表与实现不符","evidence":"ops-nn#6870; ops-transformer#6314"},{"id":"F03-3","name":"整体复制自兄弟算子的残留（公式/dtype/Op名/链接全错）","evidence":"ops-math#2922"},{"id":"F03-4","name":"Proto/IR 声明面与 OpDef/README 三方 dtype 或 rank 集合不一致","evidence":"ops-nn#6892/#6790/#6793/#6795/#6836/#6791（v6.1 扩面）"},{"id":"F03-5","name":"脚本 help 文本与代码映射表矛盾"},{"id":"F03-6","name":"可选/必选/属性归属标注与执行端注册不一致","evidence":"ops-transformer#6126/#6127/#5952; ops-cv#1214（均 closed+resolved）"},{"id":"F03-7","name":"实现有数值上限而文档未披露（维度/TensorList 长度/headDim/padding 比例）","evidence":"ops-nn#8269/#8272/#8274-8280/#8285/#8286/#8287; ops-math#4578-#4583; ops-transformer#7171（2026-11-06 批量清查，21 条文档类 issue 主体）"},{"id":"F03-8","name":"文档主张的证据强度分级（L1 同 opdir 两份接口级资料相反 / L2 资料 vs 注册面 / L3 资料 vs README，L3 单独不提）","evidence":"2026-11-06 一轮 43 格最初全按 L3 判 found，复核后仅 4 组按 L1 成立、5 组重复、5 组只剩 L3 不提；实例 layer_norm_v4 同 opdir 两份 md 对 950 结论相反"}],"waiver":"","detect":{"axes":["doc","dtype"],"oracle":["error-code"],"signal":"doc","lines":["static-absence"],"min_cases":3,"constructor":"README 支持表 vs def 注册 静态门禁；Proto ↔ OpDef ↔ README 三方 dtype 一致性静态门禁。","judge":"三处 dtype 集合逐项一致；禁止 NumberType() / RealNumberType() 兜底（确需兜底须登记豁免理由）。","kill":"若 Proto 用 NumberType 兜底或 README 与 AddConfig 差集非空，则资料声明支持的 dtype 实际被拒。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（error-code），无静态形态判据","priority":9},"secondary":null,"body":{"extras":[{"k":"数值披露三分法（F03-7 专用判据，v6.26）","v":"判「实现有上限、文档没写」之前，先按本表定位文档形态，再决定算不算缺口。**这张表是防口径分裂用的**——同一份资料被两个人判出相反结论，几乎都是因为跳过了\"只靠错误码表算不算披露\"这一步：\n\n  | 文档形态 | 判定 | 理由 |\n  |---|---|---|\n  | 维度/参数列写明 `0-8` / `1-8` / `2-8` / 「不大于 8」/「任意维」 | **算披露** | 给了可判定的边界 |\n  | 只在错误码表里写「维度范围超过 8」 | **也算披露** | 读者能从错误码项反推上限，不构成信息缺失 |\n  | 维度列写 `-`，且全篇无任何数值 | **缺口** | 无法从资料反推边界 |\n  | 实现是**降级不拒绝**（reshape 后继续算，如 `aclnnInplaceSelu` / `aclnnSelu`） | **不算缺口** | 没有硬上限，无边界可披露 |\n  | **文档比实现严**（Svd 资料 2-8 维而 impl 允许 1 维；`ScaledMaskedSoftmax` 资料 4096 而 regbase 放宽到 8192） | **不算缺口**，属 F03 反向口径 | 实现比文档宽松，用户按文档用不会被拒 |\n\n  三条使用纪律：① **同一族接口横向对齐**——若兄弟接口的资料已写同一上限（如 `aclnnMuls` 写「不大于8」而 `aclnnInplaceMul` 只写 `-`），这条对齐本身就是最强的缺口证据，优先找它；② **报错文案与上限自相矛盾**优先于\"没写\"（如 `NsaCompressAttention` 上限 768 而报错文案写 512）；③ **上限必须来自实现可指认的常量或分支**，写不出 `[文件]:[行号]` 的一律记「未核实」。"},{"k":"证据强度三级（F03-8，v6.27）","v":"判「文档与实现/声明不一致」时，**必须写清主张属于哪一级**。这不是分类洁癖，而是被一次实战打出来的——2026-11-06 一轮最初把 43 格判成 found，主张形如「`docs/aclnnXxx.md` 说产品 P 不支持，而同算子 `README.md` 说 √」，结果**这一层几乎全部不成立**：\n\n  | 级 | 主张 | 强度 | 能否独立成立 |\n  |---|---|---|---|\n  | **L1** | 同 opdir 内**两份接口级资料**对同一产品结论相反，且共用同一份 `*_def.cpp` | **最强** | ✅ 可独立提，不依赖 README、不依赖实测 |\n  | **L2** | 接口级资料 vs **OpDef 注册面**（`AddConfig` / `AddConfigByArch`），且同 opdir 其余接口都支持 | 中 | ⚠️ 可提，但维护方可答「注册 ≠ 发布宣称」 |\n  | **L3** | 接口级资料 vs **README 产品表** | **弱** | ❌ **单独不提**，只能作辅助证据 |\n\n  **为什么 L3 不成立（这是最贵的一课）**：`README.md` 的产品表是**算子级**（整个 Op），`docs/aclnnXxx.md` 的产品表是**接口级**。同一算子下 V1/V2/V4 支持 P 而 V3 不支持 P 是**合法设计**——此时 README 写 √ 完全正确，资料写「V3 不支持」也正确，**两边都没错**。实测例：`norm/layer_norm_v4/docs/aclnnFastLayerNorm.md` 对 Ascend 950PR&950DT 写「不支持」，而同目录 `aclnnLayerNorm&aclnnLayerNormWithImplMode.md` 写「支持」，两者共用同一份 `layer_norm_v4_def.cpp`（`AddConfig(\"ascend950\", regbaseCfg)` 在 `:171`）——这是 **L1**（两份接口级资料相反），**不是**「README 与资料矛盾」。同一批 43 格里最终只有 4 组按 L1 成立，5 组判重复/兄弟，**5 组只剩 L3 → 不提**。\n\n  **落地要求**：`signatures` 里把「资料产品表 vs README」这条**降级为辅助证据**；found 必须由 L1 或 L2 支撑；写 Bug 卡时在「证据」段首行标注 `[L1]` / `[L2]`；L3 证据只能写进「补充说明」，**不得作为 found 的唯一依据**。"}],"meta_info":"类别 工程/交付 ｜ 风险 中（S1×O3=3）｜ 状态 活跃 ｜ 来源 gitcode CANN issue 检索（2026-09-16）+ ops-nn/ops-transformer Proto 声明面实证（v6.1 扩面）","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 文档与支持矩阵,IR与图配置 ｜ 触发 README|AddConfig|TensorType::(Real)?NumberType\\(\\) ｜ 默认启用 true","mechanism":"README/产品支持矩阵/确定性声明/参数约束等**声明面**与代码实际（`AddConfig` 注册面、kernel 行为面、公式与 dtype 定义）脱节，误导用户接入与测试判定：① 支持矩阵声明支持某产品而 def 仅注册单一 soc（或反向，开源仓无对应 kernel）；② 确定性描述与代码实际行为不符（声明支持开关实际不支持、声明非确定实际确定）；③ 文档整体复制自兄弟算子，公式/dtype/Op 名/链接全错；④ 脚本 help 文本声称的支持面与代码映射表矛盾；⑤ **Proto / IR 声明面与 OpDef / README 三方不一致**（v6.1 扩面）——Proto 端口的 dtype 集合用 `TensorType::NumberType()` / `RealNumberType()` 兜底，**宽于** OpDef 的 `DataType(dtypeList)` 与 README 支持表（#6892 SegmentSum 声明含 INT8 而实现只支持 7 种；#6790 BNLL；#6793/#6795/#6836 L2Loss/EluGrad/FusedBiasLeakyReluGrad 声明未实现的 DOUBLE），或**反向窄于**实现（#6791 DeformableOffsetsGrad Proto 拒绝已支持的 BF16 输出），或 Proto 注释里的公式/约束与同仓 infershape 不一致（#6870 AvgPool3D `ceil_mode` 公式重复使用 `in_width` 并遗漏 `pad_left`；#6314 文档把约束写成 `N1 > N2` 而实现只需 `N1 % N2 == 0`）；⑥ **可选/必选/属性归属标注与执行端不一致**（v6.13）——Proto 的 `OPTIONAL_INPUT` / `REQUIRED_ATTR` 与 README 参数表、ACLNN 文档、`CheckNotNull`/InferShape 实际要求三者不一致：把必填写成可选（调用方省略后必然失败）、把可选写成必填（合法缺省调用被拒）、把可选输入写成属性（构图侧直接找不到该字段）。**同一契约在 Proto / OpDef / README 三处各写一遍**是该型的结构性诱因。 **⑦ 数值上限「未披露」的口径争议（F03-7，v6.26）**——实现里有硬上限（`dim > 8` 报错、TensorList 长度 >256 拒绝、`headDim > 768` 拒绝、`padding > kernel/2` 拒绝），而文档的**维度列写 `-`、或全篇没有任何数值**。这是本型里**最容易争议、也最容易批量出单**的一类：它没有\"文档说 A、实现做 B\"的显式矛盾，只有\"实现有边界、文档不提\"的缺失，所以必须先按下表把\"算什么、不算什么\"钉死，否则同一份资料会被不同人判出相反结论。","conditions":"兄弟算子复制创建、新平台（如 ascend950）接入后文档未同步、产品矩阵人工维护滞后于注册代码变更。","manifest":"用户按 README 在声明支持的产品上调用报「未适配」；确定性开关不生效与文档矛盾；geir 示例 include/REG_OP 名指向兄弟算子编译失败；误判平台支持范围放弃或误用。","mapping":"README 产品支持表 × `*_def.cpp` 中 `AddConfig` 注册清单比对；确定性描述 × kernel `GetDeterministic()`/`SetAtomicAdd`/同步机制核查；文档公式 × kernel 注释/golden 实现一致性；文档 dtype 清单 × def/binary.json 注册 dtype 一致性；**注册面双形式（v6.27，实测成立）**：`def.cpp` 里注册产品有**两种写法**——字面 `this->AICore().AddConfig(\"ascend950\", cfg)` 与 `opbase::ArchConfigHelper::AddConfigByArch(this->AICore(), Ops::Base::DAV_3510, cfg)`。**只按字面 `AddConfig\\(\"` grep 会把后者判成「未注册」**。实测：`ops-nn` **上游 master** 有 **18 个文件**用 `AddConfigByArch`（含 `matmul/flat_quant/op_host/flat_quant_def.cpp`），而本地检出 `b27fda2` **一处都没有**——所以这条判据还要绑定 commit，否则同一个文件在两个版本上得出相反结论。扫描口径：`grep -rnE \"AddConfig\\(|AddConfigByArch\\(\" <op>/op_host/*def*.cpp`，并把 `DAV_3510` 之类的 arch 常量按 `opbase` 头文件的映射表翻译成 soc 名，**不要凭记忆对应**。**Proto 端口集合三方比对**（v6.1）：`op_graph/*_proto.h` 每个 `.INPUT/.OUTPUT` 的 `TensorType(...)` 集合 ↔ `op_host/*_def.cpp` 的 `DataType(dtypeList)` ↔ `README` 参数表 dtype 三处逐项对齐，出现 `TensorType::NumberType()` / `RealNumberType()` 兜底即高危（该集合宽于任何算子的实际支持面，等于用最宽集合兜底）。**可选/必选/归属三方比对**（v6.13）：`op_graph/*_proto.h` 的 `.OPTIONAL_INPUT`/`.INPUT`/`.REQUIRED_ATTR` ↔ README 参数表「必选/可选」列 ↔ `op_api/aclnn_*.cpp` 的 `CheckNotNull` 与 `*_infershape.cpp` 的实际读取方式；三者任一不一致即命中（典型：Proto 标 OPTIONAL 而 `CheckNotNull` 要求非空）。","signatures_text":"README 支持表行与 `AddConfig\\\\(\\\"([a-z0-9_]+)\\\"` 的自动差集扫描；文档标题/Op 名与本目录名比对（复制残留检测：`README.md` 首行 Op 名 ≠ 目录名）。 **Proto dtype 兜底扫描**（v6.1）：`TensorType::(Real)?NumberType\\(\\)` 命中即候选（索引 `signatures` 已收录该指纹），再与同算子 OpDef 的 `DataType(dtypeList)` / README 参数表做差集；差集非空且无豁免理由 ⇒ 命中本型。 **数值上限缺口扫描（F03-7，v6.26）**：`grep` 实现侧上限常量与校验分支（`MAX_DIM|MAX_RANK|MAX_TENSOR_NUM|>\\s*8\\b|headDim\\s*>` 等）取出 `[文件]:[行号]`，再在该接口的 `docs/aclnn*.md` 里检索同一常量/同一数字的**任何出现**（含错误码表）；两边都不出现且文档维度列为 `-` ⇒ 缺口候选。**必须同时跑同族对拍**：把同目录/同前缀兄弟接口的 md 一起扫，兄弟写了我没写即为高置信缺口。 **枚举清单 × 错误码谓词差集扫描（F03-7b，v6.37）**：对同一份 `docs/aclnn*.md` 的**参数说明节**抽「仅支持…取值 a、b、c」类枚举，对**错误码表节**抽同一属性的谓词（`不是…的整数倍` / `大于` / `小于` / `取值范围`），把枚举外的边界值（`0` / 负数 / 最大整除候选）代入谓词，能通过却不在枚举内 ⇒ 缺口候选，再到实现侧确认未拦截。","intercept":"将「README 支持表 vs def 注册」纳入 CI 静态门禁（与 FP-F01 的 binary.json 门禁同源）；算子复制创建类 PR 强制 diff 审查文档改名完整性（标题/公式/dtype/示例/链接五件套）；确定性声明变更须附 kernel 侧代码依据。 **Proto ↔ OpDef ↔ README 三方 dtype 一致性静态门禁**（v6.1）：凡 OpDef 显式列出 `DataType(dtypeList)` 的算子，校验 Proto 每个端口的 `TensorType` 集合与之**逐项一致**，并禁止 Proto 以 `NumberType()` / `RealNumberType()` 兜底（确需兜底须登记豁免理由）；同一门禁顺带覆盖 README 参数表 dtype 列。该族在 KaranocaVe 的 ops-nn 语料中**成批出现**（#6790~#6795 连发、#6836、#6892），完全可由脚本一次扫清，属「投入产出比最高」的一类。 **F03-7 的拦截方式（v6.26）**：把「文档上限 ↔ 实现常量」做成 CI 静态门禁——对每个接口抽实现侧上限常量（含 `MAX_*` 与字面量比较），断言该数字在 md 中出现过**至少一次**（表格或错误码表均可）；不出现则要求新增一行「参数上限」说明。**这条门禁的价值不在判缺陷，而在阻止新接口继续漏写**——2026-11-06 一轮的 21 条文档类 issue 里，**绝大多数是同一族批量漏写**（foreach 七连、Inplace 五连），一次门禁即可止住。","evidence_text":"ops-nn #4890（closed）BatchNorm/BatchNormElemt/BatchNormBackward/GroupNormBackward/RmsNormGrad/RmsNormGradQuant 六算子文档统一声明「默认非确定、支持 aclrtCtxSetSysParamOpt 开启」，而 A5 arch35 kernel 实际默认确定性且不读取该开关（regbase tiling 不检查 `GetDeterministic()`）；ops-nn #4504（closed）index 目录 15 个算子 README 产品支持表声明支持 A3/A2/推理/训练等（3~6 个产品），def `AddConfig` 仅注册 `ascend950`；ops-cv #567（closed）resize_bilinear_v2/resize_nearest_neighbor_v2 文档产品表对 Atlas 全标 √ 而开源仓无 Atlas kernel、#570（closed）普通 bilinear/bicubic 上采样 def 未注册 ascend950 而 `_aa` 变体已注册（同族不对称）；ops-math #2922（open）rsqrt_grad README 与 geir 示例整体复制自 sqrt_grad——标题、公式（`z=dy*0.5/y` 应为 `-0.5*y^3*dy`）、dtype 清单、950 支持标记、proto 链接、示例文件名与 `op::SqrtGrad` 构造全错，示例无法编译；ops-fft #42（closed）build.sh 帮助文本声称「仅支持 Ascend950」而 `get_soc_version()` 实际映射 6 种型号。 **v6.1 扩面补（子型 ⑤ Proto 声明面，共 6 条同机理实证）**：**ops-nn #6892**（open）SegmentSum Proto 用 `TensorType::NumberType()` 声明 `x`/`y` 含 INT8，而 README、OpDef 与 Ascend 950/350 tiling 只支持 FLOAT32/FLOAT16/BFLOAT16/INT32/INT64/UINT32/UINT64，**INT8 通过 Proto 声明却在执行端被拒**；**#6790**（open）BNLL Proto dtype 范围与实现不一致；**#6793**（open）L2Loss、**#6795**（open）EluGrad、**#6836**（open）FusedBiasLeakyReluGrad **Proto 声明了未实现的 DOUBLE 类型**（与本库 FP-A11「AiCore 不支持 double」互为表里）；**#6791**（open）DeformableOffsetsGrad Proto **反向**拒绝实现已支持的 BF16 输出；**#6870**（open）AvgPool3D Proto `ceil_mode` 宽度公式把 `in_width` 重复使用且遗漏 `pad_left`，与同仓 `*_infershape.cpp` 的实际公式不一致。另 **ops-transformer #6314**（open）GenericBlockSparseAttentionGrad 的 ACLNN 文档把约束写成 `N1 > N2`，错误排除合法 MHA 配置 `N1=N2`——README/ACLNN 文档、Torch API 文档、Host 校验、官方示例四处都只要求 `N1 % N2 == 0`，同属「声明面各方不一致」。 **v6.13 补（子型 ⑥，全部 closed+resolved）**：**ops-transformer #6126/#6127** SwinTransformerLnQKV —— `head_num`/`head_dim`/`seq_length` 在 OpProto 用 `.REQUIRED_ATTR` 声明为必填，注释却写成可选，按注释省略即构图失败；**#5952** NsaSelectedAttentionInfer —— `blockTableOptional`/`actualQSeqLenOptional`/`actualKvSeqLenOptional`/`layoutOptional` 四项实际要求非空指针，文档却说明为可省略；**ops-cv #1214** Rasterizer —— README 把可选输入 `d` 误标为属性，构图侧按属性名找不到该字段。三条均由维护者确认并关闭。 **v6.26 补（子型 ⑦，2026-11-06 五仓 25 案一轮，21 条文档类 issue 的主体）**：这一轮把「实现有上限、文档不提」**做成了一次批量清查**，结论是它**高度成族**——同族接口要么全写、要么全不写：\n\n  | 族 | 漏写率 | 代表单 |\n  |---|---|---|\n  | foreach TensorList 上限 256 | 七连全漏（同族 `aclnnForeachLog1p` 上限是 **128**，更易踩） | ops-nn #8269 / #8272 / #8274–#8280 |\n  | `aclnnInplace*` 8 维上限 | 五连全漏，而**成对 out-of-place 接口的资料已写「不大于8」** | ops-math #4581 / #4582 / #4583 / #4578 / #4579 |\n  | Conv/Pool 类 padding 与 kernel 的比例约束 | `AvgPool2d` / `AvgPool2dBackward` 漏，而兄弟 `AvgPool3dBackward` 已写 | ops-nn #8285 / #8286 |\n  | 反向算子三维上限（200000 / 8180 / 1000） | 全漏 | ops-nn #8287（`aclnnCtcLossBackward`） |\n  | attention 类 `headDim` 上限 | 漏，且**报错文案与上限矛盾**（写 512 实际 768） | ops-transformer #7171（`aclnnNsaCompressAttention`） |\n\n  **两条可复用的判定结论**：① 「成对接口一个写一个不写」是本型性价比最高的证据形态，无需论证上限合理性即可定缺口；② 同一族上限值**可能不同**（foreach 有 128 与 256 两种），不得按族内一例推广到全族。\n  **v6.37 补（子型 ⑦ 变体：枚举取值清单与错误码表口径空白，`F03-7b`）**：F03-7 原判据只覆盖「数值上限没披露」，**漏了同族的另一半——取值集合的边界值落在两份资料的夹缝里**。ops-transformer #7234（open，documentation）实证：`aclnnNsaCompressWithCache` 的 `docs/aclnnNsaCompressWithCache.md` 参数说明写「仅支持 compressStride 取值 16、32、48、64」，错误码表 561002 子项只写「compress_block_size、compress_stride 不是 16 的整数倍」——`compressStride=0` **满足 `0 % 16 == 0`、不满足枚举清单**，两份资料谁都没管它；实测两段接口均返回 0（910B2，master 自编包），且 0 直接进入 `set_compressStride()`（`nsa_compress_with_cache_tiling_general.cpp:398`）与 `(value[i] - compressBlockSize) % compressStride`（`:243`）的除零表达式。**判据（与 F03-7 并列，优先级更高）**：① 从文档抽出属性的**枚举清单** `{v1,v2,...}`；② 抽错误码表里该属性的**谓词**（`% 16 == 0`、`> 0`、`<= 64` 等）；③ 取两集合的**差集**——枚举外却能通过谓词的取值（本例 `0`；同族还有负数、超上限但整除的值）即候选；④ 再去实现侧确认该差集**确实未被拦截**（本例 `:123-126` 只有 `%16` 与 `blockSize < stride` 两条），四步齐备才算缺口。**与 F03-7 的分界**：F03-7 是「实现有上限、文档一个数都不写」，本型是「文档写了两个数、但它们互不覆盖」，后者有**文档内部自相矛盾**的硬证据，不必论证实现合理性即可提，故强度高于 F03-7。**易漏点**：只扫「文档 vs 实现」会漏掉它——实现侧看起来「按错误码表写的就是对的」，矛盾藏在同一份文档的两节之间。","related_text":"[FP-F01](FP-F01.md)（支持声明 vs binary.json 产物面同源）、[FP-A20](../FP-A/FP-A20.md)（确定性等级未分级标注是「确定性声明」维度的特化）、[FP-B01](../FP-B/FP-B01.md)（声明面与校验面不一致的镜像：B01 是校验拦截声明外输入，本型是文档声明实现外能力）。"},"caseCount":0},{"id":"FP-F04","name":"算子接口交付面缺失（符号未导出/原型未注册/未纳入商分）","file":"patterns/FP-F/FP-F04.md","cat":"engineering","catZh":"工程/交付","s":2,"o":3,"level":"高","score":6,"depth":"标准","status":"active","trigger":"undefined symbol|dlsym|AddConfig","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["构建配置与日志","aclnn源码","IR与图配置"],"enabled":true,"evidence":["ops-transformer#4967(closed, ascend950 sanitizer 选择性打包时 liboptiling.so: undefined symbol: _ZTIN8optiling24GroupedQmmBasicApiTilingE(typeinfo for optiling::GroupedQmmBasicApiTiling), asc_opc 加载失败打 4 行 ERROR 但构建最终返回 0、target 显示 Done/Built target 且继续生成 .o/.json => 仅检查顶层退出码无法发现)","ops-transformer#5434(closed, compressor 的 PTA 公开算子名 cann_ops_transformer::compressor 未注册, torch.ops.cann_ops_transformer.compressor 不可用)","Ascend/op-plugin#242(closed, EXEC_NPU_CMD(aclnnScatterReduce,...) 经 dlsym 查找 aclnnScatterReduce/aclnnScatterReduceGetWorkspaceSize 返回 nullptr => CANN 发布的 libopapi.so 未导出 ScatterReduce 家族 aclnn API; sum/amax/amin 三 mode 稳定报同一错)","Ascend/op-plugin#416(closed, aclnnRepeatInterleaveTensor 未注册 pta, dynamo 时静默 fall back 到 CPU)","ops-transformer#5104(closed, moe_init_routing_v4 复用 v3 的 tiling/kernel, v3 新增 tilingkey 而 v4 的 apt 未适配, 报未注册 tilingkey; ascend950/cann9.2.0)","ops-transformer#5337(closed, MoeInitRoutingV4 部分用例超时挂死, 备注商分未合入)","测试集失败语料补充(2026-09-19, 「算子接口仓迁移/发布遗漏」18 条: 询问 aclnn 接口是否有遗漏跳转源码至 ops-math 仓、接口从 dev 仓迁移到开源仓; 具体编号待核)"],"tocEvidence":"6 issue（3 仓）","signatures":["dlsym","fall\\s*back|fallback.*cpu","m\\.def\\(|TORCH_LIBRARY|register_op"],"keywords":["未注册\\s*tilingkey","内部仓与开源仓同名 aclnn 接口清单双向差集","docs 内仓内跳转链接存在性扫描"],"absence":[],"broad":[],"logSig":["undefined symbol","libopapi\\.so|liboptiling\\.so"],"symptoms":["undefined symbol","接口不存在","torch.ops 不可用","未注册 tilingkey","静默 fallback 到 CPU","构建成功但加载失败"],"detectors":["构建日志正则(非退出码)","dlsym 符号可解析冒烟","torch._dynamo 图断点检查","导出符号表差集扫描"],"related":["FP-F01","FP-F03","FP-B01","FP-G01","FP-B10"],"subtypes":[{"id":"F04-1","name":".so 符号未导出（libopapi/liboptiling 缺 aclnn 接口或 typeinfo）","evidence":"ops-transformer#4967 / Ascend/op-plugin#242"},{"id":"F04-2","name":"公开算子名未注册（PTA/框架侧，torch.ops.<ns>.<op> 不可用）","evidence":"ops-transformer#5434"},{"id":"F04-3","name":"派发表/tilingkey 未同步注册","evidence":"ops-transformer#5104"},{"id":"F04-4","name":"适配层注册缺失致 dynamo 静默 fallback 到 CPU","evidence":"Ascend/op-plugin#416"},{"id":"F04-5","name":"商分清单未合入（能力缺失或用例挂死）","evidence":"ops-transformer#5337"},{"id":"F04-6","name":"接口/源码未同步至开源仓、文档跳转缺失（发布面遗漏）","evidence":"测试集失败语料 18 条（2026-09-19，编号待核）"}],"waiver":"","detect":{"axes":["contract","doc"],"oracle":["symbol-resolve"],"signal":"symbol","lines":["static-absence"],"min_cases":3,"constructor":"构建门禁解析日志而非退出码（正则 undefined symbol / lib*.so 加载失败）；每个 aclnn 接口跑 dlsym；torch.ops.<ns>.<op> 可访问且在 torch._dynamo 下不回退。","judge":"符号可解析；框架侧注册可访问且不回退 CPU；export 符号表与接口清单双向差集为空。","kill":"若 .so 符号未导出或算子名未注册，则退出码 0 + Built target，但 dlsym 失败或 torch.ops 不可用。","sourced":{"constructor":"测试拦截建议","judge":"源码审查映射点","kill":"典型表现"}},"detectability":{"d":1,"level":"D1","why":"oracle 全为静态可判类（symbol-resolve）","priority":6},"secondary":null,"body":{"extras":[],"meta_info":"类别 工程/交付 ｜ 风险 高（S2×O3=6）｜ 状态 活跃 ｜ 来源 gitcode CANN + Ascend 组织 issue 检索（2026-09-19，6 条确认对应，覆盖 3 仓）","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 构建配置与日志,aclnn源码,IR与图配置 ｜ 触发 undefined symbol|dlsym|AddConfig ｜ 默认启用 true","mechanism":"算子的**实现已经完成**，但在「把接口交付到用户手里」的清单上漏项，使接口在用户侧不可用、或被**静默降级**。五种独立成因：① **`.so` 符号未导出**——`libopapi.so` / `liboptiling.so` 中缺少 aclnn 接口或 typeinfo 符号，框架侧 `dlsym` 返回 `nullptr`；② **公开算子名未注册**——PTA / 框架侧公开名（如 `cann_ops_transformer::compressor`）未注册，`torch.ops.<ns>.<op>` 不可用；③ **派发表未同步注册**——算子跨版本复用兄弟实现（v4 复用 v3 的 tiling/kernel）时，上游新增的 tilingkey 未同步适配，走到该模板即报「未注册 tilingkey」；④ **适配层注册缺失致静默降级**——算子未在 torch_npu 注册，dynamo 时**静默 fall back 到 CPU**（不报错，仅性能与行为变化）；⑤ **商分清单未合入**——代码已进社区主干但未进商业发行分支，表现为能力缺失或用例挂死；⑥ **接口/源码未同步至开源仓、文档跳转缺失（发布面遗漏，v2.16 增补）**——接口本体只存在于内部 dev 仓、未随发布同步到开源仓，或资料中的「跳转源码」链接指向不存在的路径，用户按文档接入时找不到实现。**与 FP-B03 的边界**：B03 是「迁移时把**防御代码**漏掉」（机理 = 防御逻辑漏迁），本成因是「**接口本体**没迁、或跳转没配」（机理 = 交付清单漏项），二者不同源。**共同特征：交付面缺失，而构建 / 调用链不报错、或只打 `ERROR` 日志仍返回成功。**","conditions":"新增算子或新增接口后未同步更新导出符号表 / 公开名注册 / `binary.json` / apt 派发表；算子跨版本复用且上游新增 tilingkey；**选择性打包**（sanitizer、商分裁剪、形态裁剪）；跨 toolkit 版本发布；框架侧适配层（torch_npu）未同步算子清单；**接口从内部 dev 仓向开源仓同步时遗漏**、文档「跳转源码」链接未随仓迁移更新（v2.16 增补）。","manifest":"`undefined symbol: ...`（如加载 `liboptiling.so` 失败）而**构建退出码仍为 0**、target 显示 `Done` / `Built target`、且继续产出 `.o` / `.json` 产物；`dlsym` 返回 `nullptr`（`EXEC_NPU_CMD` 查不到 aclnn API）；`torch.ops.<ns>.<op>` 不存在；「未注册 tilingkey」报错；dynamo 静默 fallback 到 CPU；同一算子族的多个 mode 稳定报同一错（同根因）。按文档「跳转源码」链接点进去**路径不存在或指向兄弟算子**；开源仓接口清单与内部清单不一致（内网能调通、开源包内找不到该接口）（v2.16 增补）。**仅检查顶层构建退出码无法发现本型。**","mapping":"导出符号表（version script / `*_symbol.txt`）与 aclnn 接口清单的**双向差集**；PTA / 框架侧公开名注册表与算子清单差集；`op_host/config/<soc>/*_binary.json` 与 `.def` `AddConfig` 的差集（**与 FP-F01 共用同一门禁但关注面不同**：F01 看配置是否**一致**，本条看导出/注册清单是否**覆盖**）；apt / 派发表中复用兄弟版本的 tilingkey 清单是否覆盖上游新增项；torch_npu 适配层映射表覆盖率；商分裁剪清单与社区算子清单差集；`asc_opc` 类编译工具在符号解析失败时是否仍返回成功；**内部 dev 仓接口清单 × 开源仓同名接口清单的双向差集**、**文档跳转链接 × 目标仓实际路径的存在性校验**（v2.16 增补）。","signatures_text":"`undefined symbol`（**构建日志中出现即应判失败，不得只查退出码**）；`dlsym` 返回值是否有 `nullptr` 校验；`libopapi\\.so|liboptiling\\.so` 加载失败日志；导出符号清单（`*_symbol\\.txt` / version script）与 `aclnn[A-Za-z]+` 接口名的差集；公开名注册（`m\\.def\\(|TORCH_LIBRARY|register_op`）与算子清单差集；`未注册\\s*tilingkey|tilingkey.*not\\s*register`；`fall\\s*back|fallback.*cpu`（静默降级的观测点）；**接口清单差集扫描**（内部仓 vs 开源仓的同名 aclnn 接口）；**文档跳转链接存在性扫描**（`docs/**/*.md` 中的仓内跳转路径是否真实存在）。","intercept":"① **构建门禁必须解析日志而非退出码**——实证证明「退出码 0 + `Built target` + 日志若干行 ERROR」是常态，CI 需对构建日志做 `undefined symbol` 与 `lib*\\.so` 加载失败的正则断言；② **接口可用性冒烟**——每个 aclnn 接口发布前跑一次 `dlsym`（或直接调用），断言符号可解析；③ **框架侧注册矩阵**——对每个算子断言 `torch.ops.<ns>.<op>` 可访问**且不回退**（在 `torch._dynamo` 下检查图是否被打断）；④ **商分与社区算子清单差集**纳入发布门禁；⑤ **选择性打包 / 裁剪场景单测**（sanitizer、商分、跨 toolkit）；⑥ 本型与 FP-F01 的 binary.json 门禁可合并实现，但**断言方向相反**（F01 断言「注册了就必须有产物」、本条断言「产物里必须有符号」）。","evidence_text":"ops-transformer **#4967**（closed）在 `master` 分支执行 Ascend 950 sanitizer 多算子选择性打包时，构建命令**最终返回 0**、相关 target 显示 `Done` / `Built target`，但完整日志中存在 `asc_opc` 加载 `liboptiling.so` 失败的错误——`liboptiling.so: undefined symbol: _ZTIN8optiling24GroupedQmmBasicApiTilingE`（解码为 `typeinfo for optiling::GroupedQmmBasicApiTiling`），共 4 行 `[ERROR]`，对应 `lightning_indexer_v2_ascend950_0` / `_1` 两个编译任务各重复打印同一错误，**错误发生后 `asc_opc` 仍返回成功并继续生成 `.o` 与 `.json` 产物，因此仅检查顶层构建退出码无法发现**（CANN 9.2.0 / Linux x86_64 Docker）——**「交付面缺失 + 静默成功」的教科书案例**；ops-transformer **#5434**（closed）`compressor` 的 **PTA 公开算子名 `cann_ops_transformer::compressor` 未注册**，`torch.ops.cann_ops_transformer.compressor` 不可用（Ascend950 / CANN 9.2.0 / Python 3.10；同 issue 另含 VF reduce 非整除精度问题）——**量化算子接口未注册的原型案例**；Ascend/op-plugin **#242**（closed）在 NPU 上跑上游 `test/test_ops.py` 的 scatter_reduce 用例时，运行时通过 `EXEC_NPU_CMD(aclnnScatterReduce, ...)` 走 `dlsym` 查找 `aclnnScatterReduce` / `aclnnScatterReduceGetWorkspaceSize` 时**返回 `nullptr`**，即**当前 CANN 发布的 `libopapi.so` 并未导出 ScatterReduce 家族的 aclnn API**——3 个失败 test 命中 sum / amax / amin 三种 reduction mode 但根路径完全一致（**同一家族多入口同根因**）；Ascend/op-plugin **#416**（closed）`aclnnRepeatInterleaveTensor` 算子**未注册 pta**，导致 dynamo 时 **fall back 到 CPU**（静默降级，无报错）；ops-transformer **#5104**（closed）`moe_init_routing_v4` 复用 v3 的 tiling 与 kernel，v3 新增 tilingkey 而 **v4 的 apt 未适配**，走到该模板时 v4 报**未注册 tilingkey**（ascend950 / cann9.2.0）；ops-transformer **#5337**（closed）MoeInitRoutingV4 部分用例超时挂死，备注明确指出「**商分未合入**」（挂死后果见 FP-G01）。**测试集失败语料补充（v2.16，2026-09-19，具体 issue 编号待核）**：一批归类中「算子接口仓迁移 / 发布遗漏」**18 条**（询问\"aclnn 接口是否有遗漏跳转源码至 ops-math 仓\"\"接口从 dev 仓迁移到开源仓\"）——即本成因 ⑥ 的语料支撑。**共性特征：实现已完成，缺的只是\"把接口交付出去\"那一步；且失败多为静默（退出码 0 / 不报错 / 静默回退）。**","related_text":"[FP-F01](FP-F01.md)（**边界**：F01 是配置**不一致**致编译/链接失败或产物静默跳过；本条是交付面**清单缺失**致接口不可用。两者缺口方向相反、可共用同一套 def × binary.json 门禁）、[FP-F03](FP-F03.md)（文档声明支持而接口实际不可用属两型复合）、[FP-B01](../FP-B/FP-B01.md)（校验过严误拦截的镜像：本条是接口根本没走到校验层）、[FP-G01](../FP-G/FP-G01.md)（#5337 商分未合入直接表现为用例挂死）、[FP-B10](../FP-B/FP-B10.md)（HCCL 侧的注册/导出类问题同源）。"},"caseCount":0},{"id":"FP-G01","name":"执行挂死与调度超时（死循环/回绕长循环/通信等待/kernel 超时）","file":"patterns/FP-G/FP-G01.md","cat":"reliability","catZh":"执行可靠性","s":4,"o":3,"level":"高","score":12,"depth":"深度","status":"active","trigger":"必须触发","triggerZh":"必须触发","repos":["All"],"sides":["Tiling","Kernel"],"carriers":["Tiling源码","Kernel源码"],"enabled":true,"evidence":["ops-transformer#5032(closed, bash build.sh --PR_UT 时 PromptFlashAttentionTiling310P.PromptFlashAttention_310p_tiling_0 卡死 CPU 空转 90%+; CheckArgsLegal 失败且不置 updateDivRect 致 AdjustCVTiling 的 while(true) 不推进; 修复 PR#11411 在 !updateDivRect 时 return GRAPH_FAILED 仅一行; 依赖 FASG 前置用例的单例污染, 单独跑不复现)","ops-cv#933(closed, experimental NMSWithMask InferShape 对 rank-0 输入做 size_t 的 x-1 回绕为 SIZE_MAX, 后续按该上限循环, Host 线程长时间不返回, 3s 超时退出码 124; 修复 MR!1571, 与 #946/#938/#925/#923/#935/#915 同族 6 条同日关闭)","ops-transformer#5337(closed, MoeInitRoutingV4 部分用例超时导致 aic error, 日志 vector core excution timed out; arch35(Ascend950)+quant+mode=0(静态量化)+fulllo "why":"挂死/超时的静态判据只能看循环结构，动态才见真章。","relations":[{"id":"G01-I1","name":"看门狗硬熔断","statement":"每个用例独立进程 + 硬超时，超时即失败并 dump 栈。","kill":"死循环/回绕长循环只有在超时机制下才被判定为缺陷，而非「跑得慢」。","how":"子进程 + timeout，超时 SIGABRT 取 py-spy/gdb 栈。"},{"id":"G01-S1","name":"迭代次数上界","statement":"循环的实际迭代次数必须有可测上界，与理论值一致。","kill":"loopTimes 写错导致重复调度，单次耗时正常但总次数爆炸。","how":"插桩计数或 profiler 统计 kernel 下发次数，与理论值比对。"}]},"body":{"extras":[{"k":"控制变量（v6.30）","v":"**必须固定**——超时阈值、用例规模、机器负载三项固定；挂死判定必须配 `--minutes` 硬熔断与精确计时 ｜ **允许变动**——被测用例本身（一次只加一个可疑输入） ｜ **多变量同变的典型误判**——把「慢退出」当「挂死」——实测 62s 慢退出曾被写成「仅调 GWS 即挂死」的假 P0；换机器/换负载后同一用例可能不挂"}],"meta_info":"类别 执行可靠性 ｜ 风险 高（S4×O3=12）｜ 状态 活跃 ｜ 来源 团队缺陷检视记录（2026-09-07/09-17）+ gitcode issue 检索（2026-09-19，5 条确认对应，覆盖 4 仓）","applicability_text":"仓 All ｜ 侧别 Tiling,Kernel ｜ 载体 Tiling源码,Kernel源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"任务**无法完成**——进程存活但永不返回，或被超时强制中断。五种独立成因（编号与五子型一一对应）：① **迭代求解循环不推进**——host tiling 的 `while(true)` 迭代求解在异常分支下不更新推进变量（如 `updateDivRect` 未置位）且无「不推进即退出」防护，CPU 空转死循环；② **集合通信与流同步等待超时**——多卡训练 `rank_table` 配置无误仍随机出现初始化连接超时、个别 rank 掉线，等待时长由 `HCCL_CONNECT_TIMEOUT` / `HCCL_EXEC_TIMEOUT` / `HCCL_RETRY_CNT` / `HCCL_DFS_CONFIG` 等超时与重传配置项决定，配置缺失或换算错误致等待无界/超时；③ **循环上界由回绕值得出**——rank-0 / 空输入经 `size_t` 下溢回绕成 `SIZE_MAX`，后续按该上限循环，Host 线程长时间不返回；④ **设备侧算子执行超时**——kernel 长时间不返回，报 `vector core execution timed out` 并升级为 `aic error`；⑤ **资源泄漏累积**——内存申请-释放不成对，长期调用致设备内存耗尽，把正常算子推向挂死/闪退。另有**横切成因（独立于①~⑤、不单独成子型）：超时机制自身错误/死代码**——超时判定代码的溢出检查是**死代码**（`double` 先截断为 `u32` 后，`u32` 不可能大于 `UINT32_MAX`），大超时值被截断反而**误超时**，横切于②④（通信等待与设备超时）的超时判定面。**共性：缺陷不是「算错了」，而是「永远算不完」；且在没有单用例超时熔断的框架里表现为卡死而非失败，掩盖真实失败点。**","conditions":"host tiling / infershape 中的迭代求解循环（`while(true)` / `for(;;)`）遇到异常输入或异常中间状态；整数下溢 / 回绕值被用作循环上界；rank-0、空 tensor、退化 shape；分核 / 切分参数使循环不收敛；设备侧大 shape 或异常模板致 kernel 长时占用；超时值配置超过 `uint32_t`；长期高频调用累积资源泄漏；**测试框架缺单用例超时熔断**（卡死会一直等下去）。","manifest":"进程存活但 CPU 空转（90%+）或 0% 占用、长时间无任何输出；CI 单用例长时间不动（**不是失败，是\"不动\"**）；`Exit code 124`（超时）；`vector core execution timed out` / `aic error`；日志停在进入某函数之前（如实测需先看现象才知道根因是 `GetSoftMaxMinTmpSize` 返回 0）；挂死是否复现**依赖用例执行顺序**（前序用例造成的单例污染）；设备内存随调用次数持续上涨。**关键识别特征：日志完全无进展。**","mapping":"host 侧迭代求解循环（`AdjustC*Tiling`、`AdjustNTiling` 类）**循环体内是否有更新推进变量的语句**、异常分支是否「不推进即 `return GRAPH_FAILED`」；循环上界的来源类型（`size_t` / `uint32_t` 参与减法是否可能回绕，`x - 1` 在 `x == 0` 时的行为）；设备侧 kernel 是否有超时相关日志与早退路径；超时判定代码中的溢出 / 截断检查**是否可达**（先截断再比较即必然为假的死代码）；资源申请与释放是否成对（**异常分支 `return` 前是否释放**）；测试框架是否具备单用例超时熔断；全局单例（`PlatformAscendCManager` 等）是否有 fixture 级重置。","signatures_text":"`while\\s*\\(\\s*(true|1)\\s*\\)`（**须人工确认循环体内是否含推进变量更新与不推进退出**；hccl 实测命中 **9 处**，含 `examples/05_custom_ops_allgather/aiv/inc/aiv_communication_base_v2.h:245`）；`for\\s*\\(\\s*;\\s*;\\s*\\)`；`Exit code 124|execution timed out|vector core`（超时 / 设备侧超时日志信号）；`malloc|new\\s` 与多分支 `return` 同现且无统一释放（泄漏致内存耗尽）；`setTimeout|SetTimeout|TIME_S_TO_US`。","keywords_text":"`static_cast<size_t>|\\(size_t\\)` 与 `-` 同现（下溢回绕嫌疑，hccl 实测 31 处——正常转换占绝大多数，必须逐个看是否用作循环上界）；`UINT32_MAX|numeric_limits<u32>::max\\(\\)` 之前的溢出判断（**须人工确认是否为死代码**：先截断再比较必然为假；hccl 实测 34 处）。","intercept":"① **单用例超时熔断（最高优先级）**——CI 对每个用例设硬超时（如 10 分钟），超时**转失败**并 dump 堆栈；否则卡死只表现为「任务不动」，是全库最贵的排查成本来源；② **断言「不返回」而不仅断言精度**——挂死类缺陷根本走不到数值比较步，现有精度用例天然漏检；③ **UT 执行顺序随机化**——顺序依赖造成的单例污染只有固定顺序才会被掩盖；④ **fixture 强制重置全局单例**并在每个 tiling 用例显式 `SetSocVersion`，禁止依赖前序用例状态；⑤ **边界输入探针**——rank-0 / 空 tensor / 退化 shape 单独成类（覆盖下溢与回绕路径）；⑥ 对迭代求解循环加**静态门禁**（循环体内必须有推进语句与不推进退出）；⑦ **超时配置边界**（超过 2^32 微秒、负值）与**长稳看护**（设备内存持续上涨即告警）。","evidence_text":"**ops-transformer #5032**（closed）`bash build.sh --PR_UT` 时 `PromptFlashAttentionTiling310P.PromptFlashAttention_310p_tiling_0` **卡死（CPU 空转 90%+）**；技术根因：`CheckArgsLegal` 失败且不置 `updateDivRect` → `AdjustCVTiling` 的 `while(true)` 循环**无法推进**；修复 **PR #11411**（2026-09-07 17:26 合入）在 `!updateDivRect` 时直接 `return GRAPH_FAILED`，**产品代码 1 行防御修复**；触发依赖 FASG 前置用例（`FlashAttentionScoreGrad_tiling_1/2`）造成的单例污染，单独跑不复现——**「死循环 + 无防护 + 无超时熔断」三件套叠加，卡死掩盖了真实失败点**。**ops-cv #933**（closed）experimental NMSWithMask InferShape 对 rank-0 输入直接做 `size_t` 的 `x - 1` → **回绕为 `SIZE_MAX`** → 后续按该上限循环，**Host 线程长时间不返回（3s 超时退出码 124）**；修复 MR `!1571`（与 #946 / #938 / #925 / #923 / #935 / #915 同族 6 条，同一基线 commit 同日关闭）。**ops-transformer #5337**（closed）MoeInitRoutingV4 部分用例**超时导致 `aic error`**，日志为 `vector core excution timed out`；复现条件 arch35(Ascend950) + quant + mode=0（静态量化）+ fullload **可复现挂死**。**cann/hccl #567**（closed）`src/ops/op_common/template/aiv/hccl_aiv_utils.cc` 第 368-374 行 `GetAivTimeout` 的**整数溢出检查是死代码**——`timeoutUs = execTimeOut * TIME_S_TO_US`（`double` 先截断为 `u32`），第 369 行再判断 `timeoutUs > UINT32_MAX` 必然为假，**大超时值被截断致误超时**。**cann/hccl #141**（closed）`BatchSendRecvOutPlace` 动态申请堆内存后**异常分支未释放**，长期高频调用致设备内存持续上涨，**最终内存耗尽报错、任务卡死/闪退**（资源泄漏 → 挂死的完整链条）。**cann/hccl #147**（closed）多卡分布式训练 `rank_table` 配置无误但**随机出现初始化连接超时、个别 rank 掉线**；超时/重传相关配置项为 `HCCL_CONNECT_TIMEOUT`（rank 初始化建链超时）/ `HCCL_EXEC_TIMEOUT`（通信执行超时）/ `HCCL_RETRY_CNT` / `HCCL_DFS_CONFIG`。**静态扫描基线**：2026-09-07 日报的 **F5 指纹（「无退出条件循环」）在四仓命中 36 处**（ops-transformer 28 / ops-nn 5 / ops-math 2 / ops-cv 1），已列入待人工确认清单——**说明本型的产品代码风险面远比已报 issue 数量大**。","subtypes_text":"① 死循环 / 迭代求解不推进（#5032）；② 集合通信与流同步等待超时（#147、hccl 超时配置面）；③ 循环上界由回绕值得出致长循环不返回（#933）；④ 设备侧 kernel 执行超时（#5337）；⑤ 资源泄漏累积致内存耗尽后挂死（#141）。","related_text":"[FP-C01](../FP-C/FP-C01.md)（**最易混淆项**：C01 是「慢但能完成」，本条是「根本没完成」；耗时呈非整数倍阶跃是 C01 的特征，**日志完全无进展**是本条的特征）、[FP-B10](../FP-B/FP-B10.md)（**边界约定**：集合通信的等待超时归本条子型 ②，功能/精度/兼容面归 B10）、[FP-B07](../FP-B/FP-B07.md)（越界也会致异常终止，但本条的特征是「不终止」）、[FP-B06](../FP-B/FP-B06.md)（空/0 元素输入是回绕路径的高发形态）、[FP-D01](../FP-D/FP-D01.md)（资源泄漏致内存耗尽，D01 管容量、本条管后果）、[FP-F04](../FP-F/FP-F04.md)（#4967 构建静默成功与本条同属「退出码不可信」家族：一个是不报错地失败、一个是不返回地卡住）、[FP-E01](../FP-E/FP-E01.md)（golden/UT 只断言数值时天然漏检本型）。"},"caseCount":6},{"id":"FP-G02","name":"核间/流水同步缺失或配对不完整（SetFlag/WaitFlag 未配平 / 流水同步遗漏 / 事件 ID 冲突 / 跨核覆盖不全）","file":"patterns/FP-G/FP-G02.md","cat":"reliability","catZh":"执行可靠性","s":4,"o":3,"level":"高","score":12,"depth":"深度","status":"active","trigger":"必须触发","triggerZh":"必须触发","repos":["All"],"sides":["Kernel","Host","Tiling"],"carriers":["Kernel源码","Host源码","Tiling源 |RAW|hazard","SetScheduleMode|schedule_mode","workspace.*清零|清零.*workspace"],"absence":[],"broad":[],"logSig":[],"symptoms":["racecheck 报 WAW/RAW hazard","偶现精度失败（批跑轮换/单跑新进程首调易触发）","输出整段为 0 或错值","WaitFlag 永久等待/同步卡死","同步超时 aic error","结果不固定","VerifyResult 通过但存在隐患"],"detectors":["mssanitizer racecheck 零告警门禁","同步原语配对完整性静态统计（set/wait 配平）","事件 ID 池审计（Alloc/Release 成对、非常量重复）","跨核覆盖核查（双 AIV/mode+flagId 全覆盖）","批跑轮换 + 新进程首调","scan_sync.py 孤儿原语扫描","scan_sync_scope.py 作用域审计（四件套被分支独占）"],"related":["FP-G01","FP-A06","FP-A05","FP-A04","FP-C05","FP-B10"],"subtypes":[{"id":"G02-1","name":"同步原语配对失衡/不完整（SetFlag/WaitFlag 未配平或放错位置）","evidence":"ops-transformer#5611 / ops-nn#385 / ops-nn#1606 / ops-transformer#5477 / ops-nn#647","pair":{"a":"SetFlag<\\s*(AscendC::)?HardEvent::","b":"(?<!Set)WaitFlag<\\s*(AscendC::)?HardEvent::","scope":"file","max_diff":0,"strict":true,"id_re":">\\s*\\(([^)]*)\\)"}},{"id":"G02-2","name":"跨流水同步遗漏或用错同步边（同管线 barrier 覆盖不到跨管线依赖）","evidence":"ops-nn#5960 / ops-nn#5513 / ops-nn#3802 / ops-transformer#5836 / ops-math#3604 / ops-math#2868 / asc-devkit#1762 / asc-devkit#1131"},{"id":"G02-3","name":"事件 ID/flagId 冲突、越界、泄漏","evidence":"ops-transformer#3798 / ops-transformer#2555 / ops-transformer#6123","pair":{"a":"AllocEventID","b":"ReleaseEventID<\\s*(AscendC::)?HardEvent::","scope":"file","max_diff":0}},{"id":"G02-4","name":"跨核同步覆盖不全（mode+flagId 只覆盖部分核）","evidence":"asc-devkit#1723 / hccl#797","sig":["CrossCoreSetFlag","CrossCoreWaitFlag"]},{"id":"G02-5","name":"同步与调度约束缺失（SyncAll 未配 SetScheduleMode）","evidence":"ops-nn#3937 / ops-transformer#598","sig":["SyncAll\\s*<","SetScheduleMode\\s*\\(\\s*1\\s*\\)"]},{"id":"G02-6","name":"同步原语的作用域与消费者不匹配（四件套齐全配平，但整体被某一业务分支独占，另一分支复用同一 buffer 却无等价同步）","evidence":"ops-transformer#5836 / ops-transformer#12772 / ops-transformer#12555 / ops-transformer#13398"}],"waiver":"必须触发型：5 子型靠 skill 清单逐项核查，候选=定位清单（同步原语在 kernel 里本就密集），不做裁剪","detect":{"axes":["concurrency","sequence","memory"],"oracle":["sanitizer-racecheck","bitwise"],"signal":"concurrency","lines":["memory","multithread-fuzz","determinism"],"min_cases":4,"constructor":"mssanitizer racecheck 零告警门禁；同步原语 set/wait 配平静态统计；事件 ID 池审计（Alloc/Release 成对、申请不在循环体内、常量互异）；双 AIV/多核共享 workspace 单独成类；批跑轮换 + 新进程首调。","judge":"racecheck 零告警；set/wait 次数与分支都配平；AllocEventID 与 ReleaseEventID 成对且 ID 两两互异。","kill":"若 SetFlag/WaitFlag 未配平或跨核覆盖不全，则 racecheck 报 WAW/RAW，或批跑轮换下偶现结果错而单跑首次通过。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":1,"level":"D1","why":"M04 删 PipeBarrier 10/10、M13 删 CrossCoreSetFlag 10/10（配对判据有效）","priority":12},"secondary":{"kind":"cross-path","why":"racecheck 零告警可能是空跑（L3 已实测：AICPU 插桩空跑、san 符号数 0 导致假绿）。必须用结果层判据独立佐证。","relations":[{"id":"G02-X1","name":"racecheck 有效性自证","statement":"racecheck 报告的 san 符号数必须 > 0，否则「0 告警」不成立。","kill":"K2/K28 实测：AICPU 算子插桩空跑，0 告警被误读为无竞争。","how":"解析 racecheck 输出中的 san 符号计数；为 0 则判「判据无效」而非「无缺陷」。"},{"id":"G02-I1","name":"跨流位模式一致","statement":"同输入在单流与跨流交错调度下，输出必须逐位一致。","kill":"同步缺失只在跨流时序下暴露；单流永远正确。","how":"两流交错重放 3 轮，逐轮比较原始位模式。"}]},"body":{"extras":[{"k":"控制变量（v6.30）","v":"**必须固定**——kernel 源码版本、编译选项、核数三项固定；只改**一处** SetFlag/WaitFlag 的配对（删一个 wait、或把 set 移到分支外）；事件 token 必须归一（去 `AscendC::` 命名空间）后配对计数 ｜ **允许变动**——单个同步点 ｜ **多变量同变的典型误判**——`WaitFlag<AscendC::HardEvent::MTE1_MTE3>` 与 `SetFlag<MTE1_MTE3>` 被算成两个事件 → 误报 18 格 found(4.5%)；同名前缀函数（`SetFlagToFFN()`）被当同步原语 → 凭空多 8 格假阳"},{"k":"子型⑥ 专项判据（v6.15 新增，作用域而非计数）","v":"前五子型都在问「配不配平 / 方向对不对 / ID 冲不冲突」，全部是**计数与方向**问题；子型⑥ 问的是「**这对同步定义了哪条路径归它管**」，是**作用域**问题。判别三步：① 取同步四件套（`AllocEventID` / `SetFlag` / `WaitFlag` / `ReleaseEventID`），求其**共同最内层块**；② 若该块是 `if/else` 分支，则该边只覆盖此分支；③ 检查**作用域外**是否还有对同一 buffer 的访问——有则成立。**关键在于：四件套配平、ID 不冲突、方向也对，单纯\"计数配对\"检查会全部放行。**#5836 即为典型：`eventIdPseDropVToMte2B` 的申请/Set/Wait/Release 各一次、ID 相同、完全配平，但因全部包在 `!this->pseInfo.pseEndogenous` 内，内源 PSE 路径（走 `PseSlopeCopyIn`）完全丢失该 V→MTE2 边。机检脚本见 `scripts/scan_sync_scope.py`（作用域审计，与 `scan_sync.py` 的配对审计互补）。"},{"k":"⚠️ 同管线同址也必须显式串行（v6.15 补正）","v":"本条正文强调「`PipeBarrier<PIPE_X>` 只保证**同一管线内部**顺序，跨管线须用事件同步」，这句话容易被反向误读为「**同管线天然安全**」——**不成立**。同一 `PIPE_V` 上对**同一 UB 地址**的两次访问，若在指令队列中可能乱序执行（尤其是 `Duplicate` / `Muls` / `PSE` 这类写与 `SoftmaxFlashV2` 这类读交替出现时），仍需显式 `PipeBarrier<PIPE_V>()` 建立顺序；`stage1PingBuf` 一类固定复用 buffer 是重灾区（实证 #12772 / #12555 / #13398：`ProcessVec1()` 的前序 PSE / Muls / AttenMask 写与 `SoftMaxCompute()` 内 `Duplicate()`、`SoftmaxFlashV2()` 重叠，补 `PipeBarrier<PIPE_V>()` 修复）。**判据：同一 pipe、同一地址、两条访问之间没有 barrier 也没有事件 → 候选 WAW/RAW，不可用「同管线」当豁免理由。**"},{"k":"⚠️ racecheck 假阳性四分类（v6.63 新增，判「报出来的 hazard 到底是不是缺陷」）","v":"本模式把 racecheck 当作「最深一类 bug 的唯一自动化抓手」，\n  但实测（2026-11-09，Ascend950PR + CANN 9.2.0-beta.2，27 个探针 / 273 个 kernel）表明：**报出的 hazard 绝大多数不是缺陷**——\n  5 类 kernel 共 7000+ 处告警，逐条查源码后**可提交缺陷 0 个**。落本模式前必须先按下表把告警归档，否则会把「自己的造数问题」和「工具的识别盲区」\n  当成算子缺陷提上去。\n  | 形态 | 大概率是 | 验证动作 | 本次实例 |\n  |---|---|---|---|\n  | WAW，写地址相同，写方**不同 block** | ①原子累加（设计）②输入索引重复（自造） | 查源码有无 `SetAtomicAdd` / `GetTensorC(..., enAtomic=1)`；把索引类输入改成互不相同的值重跑 | `Conv3DBackpropFilterV2` 28 处 = 原子累加；`QkvRmsNormRopeCacheWithKScale` 6734→61、`UndGenQkvRmsNormRopeCache` 56→**0**、`MoeFinalizeRoutingV2Grad` 6→**0** = 索引重复 |\n  | WAR，同 block，serialNo **相邻**，地址相同 | 屏障未被 sanitizer 识别 | 回源码搜 `SetFlag/WaitFlag<HardEvent::S_MTE2\\|MTE3_S\\|V_S\\|S_V>` 或 `PipeBarrier<PIPE_X>`，确认屏障覆盖该依赖 | `LayerNormQuant` 1 处，源码 `layer_norm_quant_regbase_normal.h:280-281` 有 `S_MTE2` 正好阻断 |\n  | RAW/WAW，**单一方块内**两个 pipe（如 `PIPE_FIX Write` → `PIPE_MTE2 Read`） | 需读 kernel 源码才能定性 | 源码在仓内则查同步对；**框架闭源（如 blaze）且二进制无法反汇编时记「未定」，不得提缺陷** | `FlatQuant` 194 处 RAW，A5 走 blaze 框架（不在四仓内）、装包 `.o` 无 A5 指令表 ⇒ 记未定 |\n  | 相邻 block（如 26/27）间的 RAW/WAR | AIV/AIC 协作对（`AIV_PER_AIC=2`），可能已有 CrossCore 同步 | 查 `CrossCoreSetFlag/WaitFlag` 是否用 `AIV1_FLAG_OFFSET` 做了双 AIV 隔离 | `QkvRmsNormRopeCacheWithKScale` 余下 61 处 |\n  **三条硬纪律**：① **数量不是严重性**——6734 处里 6733 处可由同一个错误输入解释；1 处也可能是真缺陷，先看形态再看数量。\n  ② **稳定性 ≠ 真实性**——三连跑都报同一处只能证明「确定性复现」，不能证明「确定性缺陷」（本例 61 处三跑一致，仍全是假阳性）。\n  ③ **报 hazard 的 kernel 未必是探针调用的接口**——`Conv3DBackpropFilterV2` 是 `aclnnConvolution` 内部下沉的 kernel，\n  归因要用「探针实际调了哪个 aclnn 接口」，不能拿 kernel 名当接口名。"},{"k":"⚠️ 已 closed 缺陷在新版本上的回归，按「版本落差」记录而非新开 issue（v6.63）","v":"本次在 CANN 9.2.0-beta.2 上，\n  `Conv3DBackpropFilterV2` 的 `ClearWorkspace` 场景仍稳定复现 **28 处 GM WAW**——与本库子型②记录的 ops-nn **#5513**（closed）\n  「同接口、同 kernel、同数量、偏移不含 `GetSubBlockIdx()`」**逐项吻合**。处理口径：\n  ① 先查该 issue 状态；已 closed 且形态吻合 ⇒ 判为**回归/版本落差**，不作为新缺陷提交；\n  ② 若要提交，必须给出「与 #5513 的差异证据」（如修复代码在 master 存在但发布件不含、或修复不完整的新证据段），\n  否则与「拿发布件行为反驳已修 issue」同属无效单；\n  ③ 记录时写明实测版本与源码版本（本次：CANN 9.2.0-beta.2 + ops-nn master `2338134`），供后续判断是发布件落后还是修复失效。"},{"k":"⚠️ 版本落差与源码定位的两条易错点（v6.63）","v":"① **`__NPU_ARCH__` 不等于 SoC 型号**——判断某个 `#if __NPU_ARCH__ == 3510`\n  分支是否生效，不能只看「950PR 是 A5」，要确认它在 arch35 路径下的 arch 值就是 3510（本轮据 `rms_norm_dynamic_mx_quant_apt.cpp:35`\n  的 `== 3510 || == 9201 || == 9202` 并列关系确认，9201/9202 是 960 系列）。判错这一条会把「守卫生效」误读成「守卫不编译」，\n  进而把设计行为当成缺陷。② **同一算子按 arch 分目录、同步逻辑可能只在一个 arch 下**——`conv3d_backprop_filter_v2` 的\n  `ClearWorkspace` 只在 `arch35/` 有，`arch22/` 完全没有；读源码定位同步时必须按实际执行的 arch 目录读，跨 arch 张冠李戴会得出反向结论。"}],"meta_info":"类别 执行可靠性 ｜ 风险 高（S4×O3=12）｜ 状态 活跃 ｜ 来源 gitcode issue 检索与工具检测（2026-10-18，20+ 条确认对应，覆盖 ops-nn / ops-math / ops-transformer / asc-devkit / hccl 五仓）","applicability_text":"仓 All ｜ 侧别 Kernel,Host,Tiling ｜ 载体 Kernel源码,Host源码,Tiling源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"缺陷不是「算错了」，而是**「没按序」**——同一块 buffer / 地址上的生产者与消费者之间，缺少一条**以等待方为视角**的同步边，导致「读先于写」或「写覆盖了尚未被读的数据」。它属于**遗漏型缺陷**：出错的代码行本身语法正确、单看无异常，只有把「生产者—消费者」当成一对一起看才暴露，因此常规逐行审查与静态扫描（扫「错误行」）天然漏检。五种独立成因（编号与五子型一一对应）：① **同步原语配对失衡/不完整**——`SetFlag`/`WaitFlag` 次数不配平（只 set 不 wait、wait 个数多于 set、发起侧与等待侧计数不一致），或同步对被放在错误语句之后（先搬运后置同步），导致某方**永久等待**或搬运先于计算执行；② **跨流水同步遗漏或用错同步边**——`PipeBarrier<PIPE_X>` 只保证**同一管线内部**顺序，跨管线（V→MTE2 / V→MTE3 / MTE3→S / S→MTE3 / MTE2→V 等）必须用 `SetFlag/WaitFlag<HardEvent::…>` 显式事件同步；只写同管线 barrier、或用错方向的事件（如用 `SToMTE3Sync` 去护 V→MTE3），覆盖不到真实依赖；③ **事件 ID / flagId 冲突、越界、泄漏**——两个不同事件常量共用同一 ID（如 `FIX_MTE2_EVENT` 与 `S_MTE3_EVENT` 同为 `6`）、`id % N` 取模而 buffer 数 > N 致 ID 重复、循环内 `AllocEventID` 申请后从不 `ReleaseEventID` 致事件池（`MTE2_V` 仅 8 个）耗尽、缺失同步引发行为回退；④ **跨核同步覆盖不全**——`CrossCoreSetFlag/CrossCoreWaitFlag` 的 mode+flagId 映射只让等待方感知到**部分**核（如双 AIV 只覆盖 AIV0），另一核的写未被等待方感知，构成核间 RAW/WAW；⑤ **同步与调度约束缺失**——kernel 用 `SyncAll` 合并各核结果，但 host 侧未 `SetScheduleMode(1)`，无法保证所有参与核**同时驻留**，`SyncAll` 语义失效致卡死。**共性：单看每一行都「没错」，错在两条指令之间的**依赖顺序**；且这类缺陷**时隐时现**——双 AIV 冗余写结果逐字节一致时 `VerifyResult` 照样通过、新进程首次调用才触发、批跑轮换复现，使「偶现精度失败/偶发卡死」长期无解。**","conditions":"手写同步的 kernel（`SetFlag` / `WaitFlag` / `PipeBarrier` / `CrossCore*` 出现在源码中）；双缓冲 / 流水复用**固定 UB / L1 / GM buffer**；同一物理核的**双 AIV 并行**（Ascend950 / arch35，`__NPU_ARCH__ == 3510`）；多核共享同一 workspace 或同一 GM 地址；事件 ID 池有限（`AllocEventID<HardEvent::MTE2_V>` 仅 8 个）且循环内反复申请；同步对落在**条件分支**（如 `!pseInfo.pseEndogenous`）内致另一分支缺失；host 侧 `SyncAll` 依赖核同时驻留却未设 `schedule_mode`；同一 pipe 对同一地址的两次访问之间只放了**产出方** flag（如 `MTE2→V`）而无**等待方**反向同步；开启确定性计算（dw 切 k）后 cube 空转而 set 过快。","manifest":"`racecheck`（MindStudio Sanitizer / mssanitizer）报 `Potential WAW hazard` / `Potential RAW hazard`（GM 或 UB），且**典型输出含 `Write: xxx.h:56 (PIPE_MTE2)` / `Read: xxx.h:61 (PIPE_MTE2)` 成对地址与行号**；精度**偶现**失败（批跑通过率轮换、新进程**首次**调用易触发、后续调用因残留正确数据掩盖竞态）；输出**整段为 0**或错值；`WaitFlag` **永久等待 / 同步卡死 / 超时 `aic error`**；`VerifyResult` 通过但存在隐患（两 AIV 冗余写同址、结果逐字节一致掩盖 WAW）；同一输入多次运行结果不同。**关键识别特征：缺陷「复现性差」，越并发越不稳定，但一旦命中 racecheck 一行地址级报告即可直接定位。**","mapping":"每个 `SetFlag<HardEvent::X>(id)` 是否在**同一路径**有匹配 `WaitFlag<HardEvent::X>(id)`（次数与分支都配平）；`WaitFlag` 所在分支是否可能**没有**对应的 `SetFlag`（注意条件分支包裹）；`AllocEventID<…>` 是否与 `ReleaseEventID<…>` 成对，且**申请不在循环体内**（每迭代申请=泄漏）；事件 ID 常量定义是否**两两互异**、是否 `id % N` 而 N 小于实际 buffer 数；同一 buffer / 地址上的两次访问之间，是否放了**以该 pipe 为等待方**的 set/wait 或 `PipeBarrier<PIPE_该pipe>`（只有产出方 flag 不构成保护）；`CrossCoreSetFlag/CrossCoreWaitFlag` 的 mode 与 flagId 是否让等待方感知**全部**参与核（双 AIV 的 AIV0/AIV1 都要覆盖）；`SyncAll` 出现处 host 侧是否有 `SetScheduleMode(1)`；反向同步是否缺失（循环复用固定 UB buffer 时，MTE2 覆盖前是否等到 V 读完）。","signatures_text":"`SetFlag<\\s*(AscendC::)?HardEvent::`；`WaitFlag<\\s*(AscendC::)?HardEvent::`；`CrossCoreSetFlag`；`CrossCoreWaitFlag`；`AllocEventID`；`ReleaseEventID`；`PipeBarrier<\\s*PIPE_(V|MTE2|MTE3|S|MTE1|FIX)>`；`HardEvent::\\s*(V_MTE2|V_MTE3|MTE2_V|MTE3_V|S_V|V_S|MTE3_S|S_MTE3)`；`SyncAll\\s*<`；`SetScheduleMode\\s*\\(\\s*1\\s*\\)`。**配对完整性检查（本模式核心方法）**：本模式的判别性**不在单条指纹**，而在「原语配对」——应把每个 `SetFlag`/`WaitFlag`/`CrossCore*`/`AllocEventID` 视为**只能成对出现**的原语，扫描**孤儿原语**（无配对的 set、无来源的 wait、只申请不释放的 event）而非扫错误行，详见 `scripts/scan_sync.py` 与本模式 skill 第 3 节。","keywords_text":"`双缓冲|double\\s*buffer`（切换处是否有切换同步）；`核间同步|核内同步`；`同步缺失|同步不完整|漏同步|漏插`；`事件 ?ID|event ?id|flagId|flag_id`（常量定义是否重复/越界）；`buffer\\s*复用|复用.*UB|固定.*buffer`（复用点是否有反向同步）；`racing|race\\s*condition|竞态|竞争`；`WAW|RAW|hazard`；`SetScheduleMode|schedule_mode`；`workspace.*清零|清零.*workspace`（双核同址写）。","intercept":"① **racecheck 常态化（最高优先级）**——用 mssanitizer `racecheck` 对新增/改动 kernel 做 WAW/RAW 检测并**以零告警为门禁**；本模式绝大多数实证都是 racecheck 一行地址级报告直接暴露的，这是「最深一类 bug」目前唯一有效的自动化抓手；**⚠️ 生效前提（v6.49）**：racecheck / synccheck **只对以 `--cce-enable-sanitizer` 重编译过的内核生效**；未重编译时日志逐 kernel 打印 `No active sanitizer tool on kernel ...` + `racecheck|synccheck is not supported on the kernel that without '--cce-enable-sanitizer' compiler option, thus it's temporarily ignored`，紧接着仍打印 `Sanitizer finished on kernel .... No error detected.`——这是**假绿**，不得作为「零告警门禁」证据（A2 910B2 + CANN 9.3.0 实测：官方 example 二进制直接跑 racecheck/synccheck 全部未激活）。`memcheck` 不受此限（二进制级可用），所以「memcheck 有结论」不能推出「racecheck 有结论」，二者必须分别看激活状态；② **同步原语配平断言**——静态统计每个事件域的 `SetFlag`/`WaitFlag` 次数与分支路径，set≠wait 即告警；③ **事件 ID 池审计**——`AllocEventID` 是否成对 `ReleaseEventID`、申请是否在循环体内、常量是否两两互异，池容量（如 8）内不得越界；④ **跨核覆盖用例**——双 AIV / 多核共享 workspace 场景必须单独成类，不能只跑单核；⑤ **批跑轮换 + 新进程首调**——竞态在「单跑首次」与「批跑轮换」下暴露最充分，单次随机通过不代表无缺陷；⑥ **自动同步勿随意关闭**——确认性能优化（如关闭自动同步）不引入未补齐的手写同步。","evidence_text":"**子型①（配对失衡）**：ops-transformer **#5611**（closed）QSFA 开 sfa 场景 `setflag` 与 `waitflag` **未配平**；ops-nn **#385**（closed）qbmm `quant_batch_matmul_v3_*_basic.h` 核间硬同步信号在 `round_=1/2` 场景**个数不匹配**，且 kfc 模板在 spk 场景卡死；ops-nn **#1606**（closed）B 矩阵 `SetFlag` **用错 event ID** → `quant_batch_matmul_v4/op_kernel/quant_batch_matmul_v4_perblock.h:281` 的 `CopyInBL1` **永久等待**；ops-transformer **#5477**（closed）`zeroBuf` 被 VECTOR 与 MTE3 共享，`SetFlag/WaitFlag<HardEvent::V_MTE3>` 被**放在 `DataCopyPad` 之后**（放错位置），MTE3 搬运可能先于 VECTOR 执行（`mc2/mega_moe/op_kernel/arch22/mega_moe_kernel_a2_bf16.hpp`）；ops-nn **#647**（closed）conv3d_backprop_filter_v2 开启确定性计算后 cube 核无计算而 `CrossCoreSetFlag` 过快，**flag counter 超出上限**。**子型②（跨流水同步遗漏/用错边）**：ops-nn **#5960**（closed）`group_norm_swish` 的 `CastMeanAndRstd` 在标量写与 vector 读之间缺 `S_V` 硬事件同步（`norm/group_norm_swish/op_kernel/arch35/group_norm_swish_base.h`），修复补 `SetFlag/WaitFlag<HardEvent::S_V>`（PR !10683）；ops-nn **#5513**（closed）conv3d_backprop_filter_v2 在 Ascend950 一核双 AIV 下 `ClearWorkspace` 清同一块 GM workspace 无 AIV 间同步，racecheck 检出 **28 条 GM WAW**（`conv3d_backprop_filter_v2.h:316`；`conv3d_dw_v2_basic_block.h:125,236`，偏移不含 `GetSubBlockIdx()`）；ops-nn **#3802**（closed）`conv3d_v2` 两处 PIPE 同步缺失——`conv3d_sub_api.h:56/61`（`InitConstValue` 与 `DataCopy` 同 L1 地址）缺 `PipeBarrier<PIPE_MTE2>` 致 WAW，`quant_conv3d_common_func.h:298/341`（`Cast` 与 `TransDataTo5HD` 同 UB）缺 `PipeBarrier<PIPE_V>` 致 RAW（修复 PR #6896）；ops-transformer **#5836**（closed）FlashAttentionScore 内源 PSE 路径 `eventIdPseDropVToMte2B` 的申请/Set/Wait/Release 全部被 `!this->pseInfo.pseEndogenous` 包裹，内源路径 V→MTE2 同步缺失（`op_kernel/arch22/flash_attention_score_bn2gs1s2_b.h` 的 `ProcessVec1`）；ops-math **#3604**（closed）RadixTopK WS 变体 `radix_top_k_ws.h` 的 `HandleLastRoundBoundary` 中，V 写 `tileTopK` 后 MTE3 读同一 UB，原代码用 `SToMTE3Sync`（`PipeBarrier<PIPE_V>` 只保证 V 内部、`SToMTE3Sync` 只覆盖 S→MTE3，**两者都覆盖不到 V→MTE3**）致 k 配额错乱；ops-math **#2868**（closed）STFT 在 MTE3 写 splitWindow workspace 与 Cube matmul 读之间**无同步**（`stft_generalized.h` 等三文件），首次调用读未写入数据 → **输出帧为 0**，后续调用被残留数据掩盖，故「偶现」——补 `HardEvent::MTE3_S` 后批跑 50/50 全 PASS；asc-devkit **#1762**（closed）matmul_gelu 样例 `xUB` 被 tile 循环反复复用，两次 `DataCopyPad` 之间只有 `MTE2_V` 产出方 flag、缺 **V→MTE2 反向同步**，racecheck 报 UB WAW（`mmad_gelu.asc:594` 写 / `:619` 后补同步，修复后 racecheck 1→0）；asc-devkit **#1131**（closed）`atan_common_impl.h` 第 164 行 `Min` 与第 169 行 `Adds` 之间需要同步；ops-transformer **#5712 / #5740**（closed）compressor/quant_compressor `pipe_v` 同步缺失与 UB→UB 拷贝后原地反量化缺 `PipeBarrier<PIPE_V>`；ops-transformer **#4085**（closed）grouped_matmul_swiglu_quant_v2 `TQue<QuePosition::VECIN,1>` 的 `EnQue` 只带 `MTE2_V` 同步、**不具备 VV 同步能力**；ops-transformer **#6123**（open）fused_infer_attention_score noquant 路径同块 UB 的 V 链（拷入/FlashUpdate → LastDivNew 原地除 → 就地 Cast）全走 `PIPE_V` 但中间缺 `PipeBarrier<PIPE_V>`，RAW 无保护致输出偶发错值（关联 PR #13801）。**零迭代变体（v2.19 增补，现网 26-05，PR #5966）**：ops-transformer `FlashAttentionScoreGrad` 的 `SFTS1Times == 0` 分支——同步后置条件只装在**循环体内**，零次迭代时 `WaitEvent(SYNC_C1_V1_FLAG)` 一次都不执行，而循环之前已下发 MM1 的 cube 侧工作，下游拿到未就绪的 vec 结果。修复在 `flash_attention_score_grad_s1s2_bn2.h:3147-3151` 的零迭代提前返回前补**两次** `WaitEvent`（对应 MM1 两笔在飞工作）。**与子型①/②的区别**：不是配对缺失（非零路径完全配平），而是**控制流覆盖**——「Set/Wait 总数配平」这一判据在此形态下失效。**子型③（事件 ID 冲突/越界/泄漏）**：ops-transformer **#3798**（closed）chunk_gated_delta_rule 的 `chunk_gated_delta_rule_utils.h` 第 32-33 行 `FIX_MTE2_EVENT` 与 `S_MTE3_EVENT` **共用 ID 6**，信号互相覆盖（关联 PR #8802）；ops-transformer **#2555**（closed）A5 SFA/QSFA 核间同步 ID 计算 `id % 11` 但 buffer 数 **超过 11** 致 ID 重复；ops-transformer **#6123**（open）`AllocEventID<MTE2_V>` 在 S2 循环内**每迭代申请且从不释放**，事件池仅 8 个，累计越界后 ID 直送 set/wait，长序列 MLA+attenMask 挂死或算错。**子型④（跨核覆盖不全）**：asc-devkit **#1723**（closed）matmul_s4 样例两个 AIV 都执行 `CrossCoreSetFlag<4, PIPE_MTE3>(8)`、AIC 只 `CrossCoreWaitFlag<4, PIPE_MTE2>(8)`，**mode 4 flagId 8 只覆盖 AIV0**，AIV1 的写未被 AIC 感知，racecheck 报 **1 条 WAW + 513 条 RAW**（`matmul_s4.asc:102-107/135/158`）；hccl **#797**（open）AIV TwoShot 少核路径（`numBlocks < 2*rankSize`）写远端 CCL buffer 前只对首次 AIV 操作执行 `BarrierForFirstOP`，缺远端 buffer 可复用就绪握手。**子型⑤（同步与调度约束缺失）**：ops-nn **#3937**（closed）add_layer_norm_quant 在 arch35 动态量化 full-load rowsPerCore==1 场景用 `SyncAll` 合并各核 outScale，但 host 侧 `add_layer_norm_quant_tiling_arch35.cpp` 未 `SetScheduleMode(1)`，无法保证所有核同时驻留（修复 PR #7200）；ops-transformer **#598**（closed）涉及核间同步的算子必须设置 `schedule_mode` 为 1，防双流并发卡死。 "// ❌ 按「一维不用连续化」跳过辅助输入\n// ✅ 每个辅助输入都过 TensorContiguousProcess（aclnn_quant_matmul_v5.cpp:1003-1019）\nCHECK_RET(TensorContiguousProcess(x1, transposeX1, executor), ACLNN_ERR_INNER_NULLPTR);\nif (x1Scale != nullptr) {\n    if (IsMicroScaling(...)) { CHECK_RET(MxScaleContiguousProcess(x1Scale, executor), ...); }\n    else { CHECK_RET(TensorContiguousProcess(x1Scale, tempTransposeValue, executor), ...); }\n}\n...  // x2Scale / bias / x2Offset / yScale 逐个处理","repro":"对 scale / offset / per-token scale **分别**做「等值非连续 view」单变量实验（同一份数据，只改变 stride 不改数值），contiguous 版作对照；原始切片路径 `64 → [16:32] → [:16]`；断言数值一致且返回码正常。","evidence":"ops-nn issue #1516（`aclnnQuantMatmul` 未对输入 Tensor 做 contiguous 导致切片输入报错，issue 给出 origin shape=64、n=16 的报错现场）。修复后形态锚：`matmul/quant_batch_matmul_v4/op_host/op_api/aclnn_quant_matmul_v5.cpp:1003-1019`（@ops-nn HEAD `b27fda2`，2026-11-05 本地核验）。**注意**：`bias`、`x2Offset` 无条件走 `TensorContiguousProcess`，而 `x1Scale`/`x2Scale`/`yScale` 还要先判 `IsMicroScaling` 分流到 `MxScaleContiguousProcess`——**两条分支的连续化语义不同，只覆盖其中一条仍是缺陷**。\n### 语料基线与深挖起手式\n- 语料基线：ops-cv 全量 issue（2026-10-17，1 250 条中 232 条 bug-report）本簇 **52 条**，受理 32 条——20 条「已拒绝」说明契约边界尚未固化，属流程层缺口。\n- 深挖起手式：`python3 scripts/scan_fp.py --only FP-B11 --format json <目标文件>` —— 扫描「aclnn 接口 × `CheckShape` 内是否出现 `rank`/`GetDimNum`/`size()`/`IsFinite`/`INT32_MAX`」，只有一致性比较而无上述任一者即 HIGH 候选。","issues":["#1516"],"skill":"fpb11-validation-review","criteria":{"locators":[{"file":"aclnn_quant_matmul_v5.cpp","lines":"1003-1019"},{"file":"matmul/quant_batch_matmul_v4/op_host/op_api/aclnn_quant_matmul_v5.cpp","lines":"1003-1019"},{"file":"scripts/scan_fp.py","lines":""}],"check":["列出全部辅助输入（scale / offset / zeroPoint / bias / per-token / per-channel / yScale）；","逐个确认是否有连续化调用，**不要因为是 rank-1 就豁免**；","grep `GetDimNum() == 1` 附近的「跳过连续化」分支——这往往是豁免假设的落点；","**v4 与 v5 要分别查**（本案 v4 漏处理、v5 把「一维」误当无需连续化，是同一缺陷的两个变体）；","连续化产物必须真正被下游消费，算了不用同样无效。"]},"anchors":[{"file":"matmul/quant_batch_matmul_v4/op_host/op_api/aclnn_quant_matmul_v5.cpp","lines":"1003-1019", tle":"同步四件套被条件分支独占，另一路径整体失同步（作用域错配） —— ops-transformer #5836（FlashAttentionScore）","subtype":null,"trigger":"`FlashAttentionScore` 走 `arch22` 模板，`ProcessVec1` 内 `pseEndogenous`（内源 PSE）与外源 PSE 两条路径**复用同一 UB buffer**，PSE 丢弃 / 搬运走 V→MTE2 同步。","root":"`op_kernel/arch22/flash_attention_score_bn2gs1s2_b.h` 的 `ProcessVec1` 中，`eventIdPseDropVToMte2B` 的 `AllocEventID` / `SetFlag` / `WaitFlag` / `ReleaseEventID` **四件套全部被 `!this->pseInfo.pseEndogenous` 包裹**——外源路径有这条 V→MTE2 边，内源路径走 `PseSlopeCopyIn` 时**整体丢失**该边。四件套各一次、ID 相同、方向正确、**完全配平**，配对完整性检查全部放行。","fix":"","code":"// ❌ 四件套全在分支内 —— 另一分支复用同一 buffer 却无等价同步\nif (!this->pseInfo.pseEndogenous) {\n    int32_t e = AllocEventID<HardEvent::V_MTE2>();\n    SetFlag<HardEvent::V_MTE2>(e);\n    // ... MTE2 搬运 ...\n    WaitFlag<HardEvent::V_MTE2>(e);\n    ReleaseEventID<HardEvent::V_MTE2>(e);\n}\n// ✅ 把同步边提到分支外（两条路径都要）或为内源路径补一套等价四件套\nint32_t e = AllocEventID<HardEvent::V_MTE2>();\nif (!this->pseInfo.pseEndogenous) { /* 外源路径 */ } else { /* 内源路径：PseSlopeCopyIn */ }\nSetFlag<HardEvent::V_MTE2>(e); /* ... 搬运 ... */ WaitFlag<HardEvent::V_MTE2>(e);\nReleaseEventID<HardEvent::V_MTE2>(e);","repro":"构造 `pseEndogenous=true`（内源 PSE）的 FlashAttentionScore 用例跑 racecheck，观察 `ProcessVec1` 处 UB/GM 的 `RAW`/`WAW`；再与 `pseEndogenous=false` 对比告警数量差异。","evidence":"#5836（closed）；`op_kernel/arch22/flash_attention_score_bn2gs1s2_b.h` 的 `ProcessVec1`（`eventIdPseDropVToMte2B`）。","issues":["#5836"],"skill":"fpg02-sync-review","criteria":{"locators":[{"file":"op_kernel/arch22/flash_attention_score_bn2gs1s2_b.h","lines":""}],"check":["对每个同步四件套求**共同最内层块**，判断是否为 `if/else` / 三元 / 模板分支；","在分支**外**搜同一 buffer / 同一地址的访问点（`DataCopy` / `PseSlopeCopyIn` / `Duplicate` 等）；","若有访问而该路径无等价同步 → 子型","成立；","注意别把它记成子型","——","是「边不存在」，","是「边存在但管不到」。"]},"anchors":[],"paired":[{"a":"SetFlag<HardEvent::V_MTE2>","b":"WaitFlag<HardEvent::V_MTE2>","kind":"event","source":"case"},{"a":"AllocEventID<HardEvent::X>","b":"ReleaseEventID<HardEvent::X>","kind":"event_id","source":"case"}]},{"id":"FP-G02-C12","fp":"FP-G02","title":"同 pipe 同址漏 PipeBarrier（「同管线天然安全」的误读） —— ops-transformer #12772 / #12555 / #13398（stage1PingBuf）","subtype":null,"trigger":"attention 类 kernel 用 `stage1PingBuf` 这类**固定复用** buffer，`ProcessVec1()` 的前序 PSE / `Muls` / `AttenMask` 写，与 `SoftMaxCompute()` 内 `Duplicate()` / `SoftmaxFlashV2()` 读**交替**发生在同一 `PIPE_V` 上。","root":"同一 `PIPE_V` 上对**同一 UB 地址**的两次访问之间**既无 `PipeBarrier<PIPE_V>` 也无事件边**——被「`PipeBarrier` 只保证同管线内部顺序 ⇒ 同管线天然安全」这句**反向误读**放过；实际指令队列下写与读可能乱序，构成 `WAW` / `RAW`。","fix":"","code":"// ❌ 同 PIPE_V 同址，两条访问之间无任何 barrier（被误认为「同管线天然安全」）\nMuls(stage1PingBuf, ...);                 // 写\nSoftmaxFlashV2(stage1PingBuf, ...);       // 读 —— 可能乱序\n// ✅ 同 pipe 同址也必须显式串行\nMuls(stage1PingBuf, ...);\nPipeBarrier<PIPE_V>();\nSoftmaxFlashV2(stage1PingBuf, ...);","repro":"跑该 attention 模板 racecheck，观察 `stage1PingBuf` 处 `WAW`/`RAW`；补 `PipeBarrier<PIPE_V>()` 后对比告警是否归零。","evidence":"#12772 / #12555 / #13398（三例同机理，均为 `ProcessVec1` 前序写与 `SoftMaxCompute` 内读写重叠，补 `PipeBarrier<PIPE_V>()` 修复）。\n### 语料基线与深挖起手式","issues":["#12555","#12772","#13398"],"skill":"fpg02-sync-review","criteria":{"locators":[{"file":"scripts/scan_fp.py","lines":""},{"file":"scripts/scan_sync.py","lines":""},{"file":"scripts/scan_sync_scope.py","lines":""}],"check":["列同一 `PIPE_*` 上命中**同一 buffer 名 / 同一地址表达式**的两次访问；","核两者之间有无 `PipeBarrier<PIPE_该管线>` 或事件边；","无 → 候选 `WAW`/`RAW`，**禁止以「同管线」为由豁免**；","固定复用 buffer（`stage1PingBuf` 一类）优先审。"]},"anchors":[],"paired":[{"a":"（同管线两次内存访问）","b":"PipeBarrier<PIPE_V>","kind":"same_pipe_barrier","source":"case"},{"a":"（同管线两次内存访问）","b":"PipeBarrier<PIPE_该管线>","kind":"same_pipe_barrier","source":"case"}]},{"id":"FP-G02-C13","fp":"FP-G02","title":"零迭代分支绕过循环体内的同步等待（zero-trip）—— 26-05（FlashAttentionScoreGrad）","subtype":null,"trigger":"`SFTS1Times`（S1 方向 SFT 迭代数）算出来为 **0**。此时 `for (SFTLoopS1 = 0; SFTLoopS1 < rp.SFTS1Times; ...)` 一次都不进，循环体内为 MM1 结果准备的 `WaitEvent(SYNC_C1_V1_FLAG)` 全部跳过，但**循环之前已经下发了 MM1 的 cube 侧工作**，后置条件不成立：下游拿到的 vec 结果是陈旧/未就绪的。","root":"同步后置条件只装在**循环体内**，而循环可能零次执行。健全的写法要求「无论循环执行几次（含 0 次），出循环时 post-condition 都成立」。这属于**控制流覆盖**缺陷，不是配对缺失——`Set`/`Wait` 数量在非零路径上完全配平。","fix":"","code":"// ❌ 只在循环体内 Wait：Times==0 时一次都不执行\n// ✅ 零迭代提前返回前，补齐与非零路径等价的后置等待（:3147-3151）\nif (rp.SFTS1Times == 0) {\n    AscendC::WaitEvent(SYNC_C1_V1_FLAG);\n    AscendC::WaitEvent(SYNC_C1_V1_FLAG);   // 两次对应 MM1 的两笔在飞工作\n    return;\n}\nfor (uint32_t SFTLoopS1 = 0; SFTLoopS1 < rp.SFTS1Times; SFTLoopS1++) { ... }","repro":"`SFTS1Times = 0` 与 `= 1` 对照；记录实际 wait 次数与模板名；配时序压力（重复执行 + 输出毒化）与梯度数值对拍。**只断言「不崩溃」不够**，零迭代漏同步的典型表现是偶发错值而非崩溃。","evidence":"现网 26-05（ops-transformer-dev PR #5966；该单无关联 issue，仅 PR）。修复后形态锚：`attention/flash_attention_score_grad/op_kernel/arch22/flash_attention_score_grad_s1s2_bn2.h:3147-3151`（@ops-transformer HEAD `d5c0683`，2026-11-05 本地核验）。同文件 `:3131` 与 `:3153` 是 `SFTS1Times` 的两个赋值来源（SAB 分支 / 普通分支），`:3159` 才是被绕过的循环——**零迭代路径与主路径的赋值来源不同，容易只测其中一条**。","issues":["#5966"],"skill":"fpg02-sync-review","criteria":{"locators":[{"file":"attention/flash_attention_score_grad/op_kernel/arch22/flash_attention_score_grad_s1s2_bn2.h","lines":"3147-3151"}],"check":["枚举所有 `for` / `while` 循环内的 `SetFlag`/`WaitFlag`/`WaitEvent`/`WaitIterateAll`；","逐循环问「**迭代数能否为 0**」（`(x + unit - 1) / unit` 中 `x == 0`、`realSize` 为 0、尾块被整除后余数为 0）；","若能为 0，检查循环前是否已发出异步工作、以及零次路径上是否有等价等待；","**等待次数要与在飞工作量对应**（本案两次 Wait 对应 MM1 两笔，只补一次同样错）。"]},"anchors":[{"file":"attention/flash_attention_score_grad/op_kernel/arch22/flash_attention_score_grad_s1s2_bn2.h","lines":"3147-3151","commit":"d5c0683","repo":"ops-transformer","note":"`if (rp.SFTS1Times == 0) { AscendC::WaitEvent(SYNC_C1_V1_FLAG); AscendC::WaitEvent(SYNC_C1_V1_FLAG); return; }`——**修复后形态**：零迭代提前返回前补齐两笔后置等待。判据：① 循环上界能否为 0；② 循环前是否已下达异步工作；③ 零次路径是否有**等价且等量**的等待（本案两次对应 MM1 两笔，只补一次同样错）。同文件 `:3131`/`:3153` 是 `SFTS1Times` 的两个赋值来源，`:3159` 才是被绕过的循环。","issue":"#5966"}],"paired":[{"a":"SetFlag<HardEvent::X>","b":"WaitFlag<HardEvent::X>","kind":"event","source":"case"}]}],"triage":{"version":"5.4","quick_index":[{"words":"卡死 / 不动 / 没有输出 / 超时 {"fp":"FP-C03","symptom":"bf16 与 fp16 性能差异异常","first":"对照测试；查 Cast DAG 冗余"},{"fp":"FP-C05","symptom":"开确定性开关性能骤降","first":"确定性开关性能对照；查串行化"},{"fp":"FP-C04","symptom":"同芯片不同板型（B2 vs B3）性能差异","first":"板型矩阵对比；查频率/带宽假设"},{"fp":"FP-C06","symptom":"新代际（A5）性能不升反降","first":"跨代基线对比；查新代际路径"}]}]},{"id":"T6","title":"内存 / 资源","intro":"结果对、能跑完，但占用高或 OOM。先分清**峰值超基线**与**双路径（aclnn vs aclop）差异**。","groups":[{"title":"内存占用","rows":[{"fp":"FP-D01","symptom":"OOM / 峰值内存超基线 / 显存过度占用","first":"profiler 峰值内存；workspace 申请量推导"},{"fp":"FP-D02","symptom":"aclnn 比 aclop 内存高 / 内存占用偏高","first":"aclnn/aclop 双路径内存对比"}]}]},{"id":"T7","title":"编译 / 交付 / 文档 / 测试资产","intro":"代码可能没错，但**声明面、测试面或交付面**出了问题：测试全绿却线上异常、文档说支持却没适配、迁移后丢了拦截。","groups":[{"title":"测试资产与交付面","rows":[{"fp":"FP-A19","symptom":"测试全绿而线上特定 shape 异常 / 同 shape 跨平台表现不同","first":"三表：tiling 模板 × 阈值 × 用例"},{"fp":"FP-E01","symptom":"golden 失配 / 精度验证静默失效","first":"golden 来源与命名；看是否与实现同改"},{"fp":"FP-F03","symptom":"支持矩阵与注册不符 / 文档整体复制兄弟算子","first":"README 支持表与 AddConfig 差集"},{"fp":"FP-B05","symptom":"部分算子崩溃、部分正常（文件级参差）","first":"CheckNotNull / CheckParams 横向比对"},{"fp":"FP-B03","symptom":"迁移 / 重构后应拦截未拦截","first":"迁移 diff 的拦截点前后比对"}]}]}]},"l3":{"note":"oracle 失效模式（L3）：该观测手段**本身**会在什么情形下给出错误结论。来源为 aclnn-bug-hunt 实测踩坑清单（references/pitfalls/）的判据失效条目，只记编号与一句话判据，全文留在上游。按 oracle 类别组织而非按模式——失效机理属于观测手段本身，与被测模式无关。","source":"aclnn-bug-hunt/references/pitfalls/（编号可 grep 到原文）","source_repo":"gitcode.com/liuhanwen8/aclnn-bug-hunt","by_oracle":{"golden-utol":[{"id":"K91","fail":"假 FAIL","rule":"inf==inf 被判超容差；溢出类用例整批假 FAIL"},{"id":"K171","fail":"假 FAIL","rule":"容差必须按 dtype 与 mode 分级，一套 fp32 阈值不能判所有"},{"id":"K249","fail":"假 FAIL","rule":"逐元素相对误差判矩阵乘，小 shape 下必然成批假 FAIL"},{"id":"K334","fail":"假 FAIL","rule":"FAIL 先做 e_norm/ulp 归一再看绝对误差；fp16 小值相对误差放大是常态"},{"id":"K395","fail":"假 FAIL","rule":"NaN/Inf 用例 judge 必须写 equal_nan=true，否则整条假 FAIL"},{"id":"K471","fail":"假 FAIL","rule":"有定义域约束的算子（acosh/asin/sqrt/log）判据须全档带 equal_nan=true"},{"id":"K501","fail":"假 FAIL","rule":"
