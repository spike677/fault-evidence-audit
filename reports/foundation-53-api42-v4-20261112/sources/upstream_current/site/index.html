崩溃面与错误面互斥","statement":"置空任一必选参数，进程不得以 SIGSEGV/rc=139 退出，只能是返回错误码。","kill":"校验晚于解引用时先崩后校验；返回码再「正确」也掩盖不了崩溃。","how":"子进程隔离跑每个参数位置 × 两段式阶段，检查退出码与是否产生 core。"},{"id":"B04-S2","name":"错误码与参数位置不相干性","statement":"所有必选参数置空后应返回同一族错误码（161001）；若不同参数返回不同错误码，说明校验路径不一致。","kill":"部分参数走 CheckParams、部分靠解引用时崩溃或返回内部错误，分布会不均匀。","how":"逐参数置空，统计错误码直方图；出现 >1 种即标记待核。"}]},"body":{"extras":[{"k":"子型","v":"① **必选入参未拦截**（原主干，`nullptr` 透传下游解引用）；② **可选输出反向依赖**（output-mask 允许缺省的输出被兄弟输出路径读取 shape/view/元信息）。两型方向相反，须分别过检视清单。"},{"k":"控制变量（v6.30）","v":"**必须固定**——只把**一个**必选入参置为 `nullptr`，其余入参全部合法且非空；每个入参单独跑一次，不合并 ｜ **允许变动**——被置空的入参 ｜ **多变量同变的典型误判**——一次把多个入参同时置空 → 只能知道「有人没判空」，不知道是哪一个，也无法定位到具体校验函数；实测首版判出 181/399 = 45% found，真机 26 次逐个注入后 26/26 都返回 161001"}],"meta_info":"类别 功能/兼容 ｜ 风险 高（S2×O3=6）｜ 状态 活跃 ｜ 来源 四仓 issue 检索 + 源码静态扫描（2026-09-12）；v2.18 增补子型②（现网修复复盘 26-02，2026-11-05）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"aclnn 两段式接口（GetWorkspaceSize / Execute）对必选入参（输入 tensor、scalar、属性数组、属性字符串）未做 `nullptr` 拦截即向下透传，下游解引用空地址。**三类成因**：① **必选入参**未拦截——适配层由模板脚本生成导致校验宏漏插；多接口共享的公共校验函数内直接解引用（如 `strcmp`），入口仅校验了部分参数；校验位置晚于首次解引用；tiling/infershape 层 `GetData()` 返回值未判空。② **可选输出**（`outputMask` / `aclBoolArray` 门控的反向输出）——由 output-mask 允许缺省的输出指针为 `nullptr`，但某条计算路径仍按「所有输出都会请求」的假设去读它的 shape、建 view 或反推另一侧梯度（v2.18 增补，实证 26-02）。②与本卡 ①的**方向相反**：① 是「该拦没拦」，② 是「该跳没跳」。 ③ **可选输入省略后解引用（v6.33）**：资料把某输入标为 OPTIONAL，实现也在 `GetOptionalInputShape()` 返回 `nullptr` 时未判空就调 `->GetStorageShape()` / 参与偏移计算；与 ② 的区别是对象从「可选输出」换成「可选输入」。","conditions":"① 任一必选入参传 `nullptr`；GetWorkspaceSize 或 Execute 阶段任一阶段；尤其易发于共享校验函数被多入口复用的算子族。② 只请求部分输出（如 backward 只算 dw 不算 dx），被省略的那一路输出为 `nullptr`，而兄弟输出路径读取了它的 shape/view。","manifest":"**SIGSEGV（rc=139，必现）**；或算子侧未拦截透传给 GE/tiling 后 coredump；或返回非 161001 的错误码（如 561103）——后者易被误判为「已校验」而漏提缺陷。","mapping":"`GetWorkspaceSize` 入口的参数解引用点（`strcmp`/`GetDataType`/`ToFloat` 等）是否前置了 `OP_CHECK_NULL`；多入口共享的公共校验函数（如 `CheckFusedOpType`）内部是否自校验，而非依赖各入口分别校验；`CheckParams` 中 `CHECK_RET(..., ACLNN_ERR_PARAM_NULLPTR)` 是否覆盖全部必选参数；tiling/infershape 中 `GetData()` 返回值、属性字符串指针是否判空；校验顺序（是否存在「先用后校验」）。**可选输出（成因②）额外查**：每个 `outputTensor.*` 解引用点是否位于 `if ((*outputMask)[i])` 之内；是否存在「本路径只算 dw，却读 dx 的 `GetViewShape()` / 用 dx 作 `ViewWithShape` 源」这类**跨角色反向依赖**；`OpExecute` 中所有输出后处理（Cast/ViewCopy/Reshape）是否逐个被 mask 门控，而非只门控赋值处。","intercept":"`nullptr` 探针用例覆盖「算子 × 入参位置 × 两段式阶段」全矩阵；判读 rc=139（崩溃）/ 1（断言 FAIL）= 缺陷存在，期望返回 `161001`（`ACLNN_ERR_PARAM_NULLPTR`）；特别针对共享校验函数的算子族，须逐个入口独立置空验证（不可只测其中一个入口）；gdb 取栈定位解引用点。**可选输出（成因②）额外测**：对每个支持 output-mask 的接口跑「仅请求输出 i」的单输出组合（n 个输出至少 n 次调用，不得只测全请求基线）；backward 类接口必须有「只算 dx」「只算 dw」「全算」三档对照，并逐档验证未请求的输出不被触碰且已请求输出数值正确。","evidence_text":"ops-nn #5531 / #5532 `aclnnFusedQuantMatmulWeightNz` 与 `aclnnFusedQuantMatmul` 共享 `CheckFusedOpType`，入口仅 `OP_CHECK_NULL(x1/x2)`，`fusedOpType=nullptr` 触发 SIGSEGV（gdb 栈 `strcmp → aclnnFusedQuantMatmulGetWorkspaceSizeCommonProcess`），期望 161001 实测 rc=139；#5372 / #5373 同根因另有两次记录（**同一根因四连发**）；#4784 fqmm x1/x2 空指针**校验过晚** Segmentation Fault；#4586 wqbmm 在空指针校验**前**通过 x1 调用函数致 coredump；#5644 `biasSizes=nullptr` 未拦截透传 GE 致 coredump（环境 **950**）；#5329 foreach 系列缺少 tensor list 空指针校验；#3383 aclnn_add_rms_norm_quant_v2 缺校验；#4555 aclnnBatchNorm 空 input + nullptr saveMean/saveInvstd 触发 core dump；#4697 GRU 传 nullptr coredump；#1293 aclnnIndexCopy 部分空指针未校验致多线程报错。另：ops-cv #912/#842/#294/#491/#295（Upsample 系列 `outputSize` 数组、GridSampler3D）、#852（NMS）、#221（IouV2 **先使用 attrs 后检验**）；ops-math #2776（`aclnn_logdet.cpp:165`）等 `【缺陷报告】空指针解引用` 批量审计 #2762–#2777、#864（exp/sqrt 缺校验 coredump）、#2501（aclnnArange 预期 161001 实测 561103）；ops-transformer #4516/#4375/#4216/#4728（grouped_matmul 系列、BSAG、FAG 的 `layout` 类属性字符串）。补充变体：ops-nn #5705（closed）convolution_forward `CheckDisContinuousStride` 校验命中后仅 `OP_LOGE` **缺 return**，防御形同虚设，后续按 `dims` 访问 vector 越界 UB——「校验写了但未生效」与「未校验」同族，审查时须核对校验命中后的控制流。**成因② 实证（v2.18 增补，来源现网修复复盘 26-02）**：ops-nn PR #1001 `aclnnConvolutionBackward`——只求 dw 时 dx 输出为 `nullptr`，dw 专用路径却读取 `gradInput` 的 shape 并用它创建视图，触发 **core dump**；修复改为完全使用 `gradWeight`，并把各输出后处理收进 `(*outputMask)[i]` 门控。修复后形态锚点：`conv/convolution_backward/op_api/aclnn_convolution_backward.cpp:911-935`（`OutputViewProcess` 内 gradInput/gradWeight/gradBias 逐个 `if ((*outputMask)[i])` 包裹，@ops-nn HEAD b27fda2）。**判据要点**：本案不是「忘记判空」，而是「按错误所有权假设读取了另一路输出的元信息」——所以 `CheckNotNull` 覆盖再全也拦不住。 **2026-11 批次（v6.33 反哺）**：本簇 25 条；代表 ops-transformer#6539（可选输入/输出省略 SIGSEGV）、ops-nn#7095（AdaLayerNormBackward weightOptional/biasOptional 空指针）、ops-transformer#6651（attenMask nullptr SIGSEGV）。","related_text":"[FP-B03](FP-B03.md)（迁移场景丢失的防御逻辑中常含空指针拦截）、[FP-B01](FP-B01.md)（方向相反：B01 是该拦不拦）、[FP-A04](../FP-A/FP-A04.md)（未拦截若未崩溃则演变为静默错误结果）、[FP-B05](FP-B05.md)。"},"caseCount":5},{"id":"FP-B05","name":"入参校验覆盖度参差（同仓内文件级）","file":"patterns/FP-B/FP-B05.md","cat":"compatibility","catZh":"功能/兼容","s":2,"o":1,"level":"低","score":2,"depth":"宽浅","status":"active","trigger":"CheckNotNull|CheckParams|aclnn","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["aclnn源码"],"enabled":true,"evidence":["四仓静态扫描: 990个 aclnn_*.cpp 中 194 个无 CheckNotNull 骨架","ops-transformer 136/236(57.6%) 为唯一大面积缺失仓","ops-nn 30/356, ops-math 28/351, ops-cv 0/47"],"tocEvidence":"静态扫描","signatures":["CheckNotNull|CheckParams"],"keywords":["文件缺少 CheckNotNull/CheckNull 骨架","缺少 CheckParams 聚合校验入口"],"absence":[{"must":"CheckNotNull","files":"op_api/aclnn_.*\\.cpp$","level":"high","note":"aclnn 接口文件应有判空骨架；缺失即 FP-B05 文件级候选"},{"must":"CheckParams","files":"op_api/aclnn_.*\\.cpp$","level":"info","note":"聚合入口缺失：校验顺序与完整性无从保证"}],"broad":[],"logSig":[],"symptoms":["部分算子崩溃、部分正常","缺陷呈文件级参差"],"detectors":["CheckNotNull 骨架静态扫描"],"related":["FP-B04","FP-B03"],"subtypes":[],"waiver":"定位型：文件级校验骨架核查，真正判据在 absence 规则（缺 CheckNotNull），存在型签名只用来列文件","detect":{"axes":["input-validity","contract"],"oracle":["error-code"],"signal":"null-input","lines":["static-absence","error-scenario"],"min_cases":2,"constructor":"按「仓内无骨架文件清单」定向补探针用例，而非全量随机抽检；横向比对同仓有/无 CheckNotNull 骨架的两类文件。","judge":"同仓内各算子对 nullptr 的拦截行为一致，不呈文件级参差。","kill":"若无 CheckNotNull 骨架的文件内算子任一必选入参置空即崩溃，而有骨架文件同操作正常。","sourced":{"constructor":"测试拦截建议","judge":"典型表现","kill":"故障机理"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（error-code），无静态形态判据","priority":6},"secondary":null,"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 低（S2×O1=2）｜ 状态 活跃 ｜ 来源 四仓源码静态扫描（2026-09-12）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码 ｜ 触发 CheckNotNull|CheckParams|aclnn ｜ 默认启用 true","mechanism":"同一仓内 aclnn 接口文件的校验完备度严重不均——部分文件具备统一的 `CheckNotNull` 骨架 + `CheckParams` 聚合入口，另一部分**完全没有**，其入参校验仅依赖零散 `OP_CHECK_NULL` 散点，无聚合入口则校验完整性与顺序皆无从保证。","conditions":"新增算子未对齐仓内既有校验范式；算子由不同开发者/不同时期合入；仓内缺乏生成模板或范式约束。","manifest":"同一仓内部分算子对 `nullptr` 具备完整拦截，另一部分任一必选入参置空即崩溃——**缺陷分布呈文件级参差**，单点抽检易漏。落于无骨架文件内的算子即落入 FP-B04。","mapping":"文件是否存在 `CheckNotNull` 函数骨架与 `CheckParams` 聚合入口；校验宏是否聚合调用而非散点；仓内校验范式一致性（可作跨文件横向比对）。","signatures_text":"静态扫描——逐 aclnn 实现文件检查 `CheckNotNull` / `CheckNull` 骨架存在性；统计「无骨架文件」占比定位短板仓。","intercept":"按「仓内无骨架文件清单」定向补探针用例，而非全量随机抽检；新增算子合入时强制对齐仓内校验范式（建议纳入 CI 静态检查）。","evidence_text":"四仓 master 分支静态扫描（990 个 `op_api/aclnn_*.cpp`）——**ops-transformer 236 个文件中 136 个（57.6%）无 `CheckNotNull` 骨架**，为四仓唯一大面积缺失者；ops-nn 356 个中 30 个（8.4%）、ops-math 351 个中 28 个（8.0%）属零散遗漏；**ops-cv 47 个文件 0 缺失**，可作正向参照。","related_text":"[FP-B04](FP-B04.md)（无骨架文件内的算子即 B04 的受害者）、[FP-B03](FP-B03.md)（跨仓迁移易致范式参差）。"},"caseCount":0},{"id":"FP-B06","name":"空 tensor（numel==0）输入分支处理缺失","file":"patterns/FP-B/FP-B06.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":2,"level":"高","score":6,"depth":"深度","status":"active","trigger":"必须触发","triggerZh":"必须触发","repos":["All"],"sides":["Host","Tiling","Kernel"],"carriers":["aclnn源码","Tiling源码","Kernel源码"],"enabled":true,"evidence":["ops-nn#5149 与 PR #9197: aclnnInplaceMaskedScatterGetWorkspaceSize 原有 selfRef/mask 判空但漏 source, 修复新增 !IsRegbase() && source->IsEmpty() 早退(仅 gate arch22)","ops-nn 2026-04-29 issue: masked_scatter updates 元素不足致内存越界/读取 NAN(A3)","四仓 aclnn 空 tensor 静态扫描 2026-09-14: 1040 接口 / PARTIAL 141 / HIGH 461 / 有 kernel 感知 88 / 全覆盖 328","ops-transformer#4531(open, InplacePartialRotaryMulGrad): no-op 提前返回排在 CheckRotaryModeShapeRelation 之前, sliceLength_==0 或输入为空即直接返回 GRAPH_SUCCESS, 越界 partial_slice=[9,9] 与负起点 [-1,0] 被放行","ops-cv#928(open, UpsampleNearestExact2d): 空 Tensor 快速路径绕过参数校验","ops-cv#935(open, BoundingBoxEncode): 空输入快速路径绕过 means/stds 校验","ops-nn #7060（2026-10-21）：ConvTbcBackward 用无条件 OP_CHECK(self->Size() != 0) 拒绝空输入，与资料四处「支持空 Tensor」声明相反，A2 与 950 行为一致","ops-nn #7055（2026-10-21）：AddLayerNormGrad 空张量 (M=0,H>0) 返回 561002 失败，而同算子正向 aclnnAddLayerNorm 已支持空张量"],"tocEvidence":"1 issue+四仓扫描(1040 接口)","signatures":["IsEmpty\\(\\)","!Ops::NN::AclnnUtil::IsRegbase\\(\\)\\s*&&\\s*\\w+->IsEmpty\\(\\)","SetGlobalBuffer\\([^)]*totalUpdatesNum","\\*workspaceSize\\s*=\\s*0[\\s\\S]{0,120}?return ACLNN_SUCCESS"],"keywords":["l0op::Contiguous 调用点前缺 IsEmpty 判空"],"absence":[{"must":"IsEmpty|GetShapeSize\\(\\)\\s*==\\s*0|Numel\\(\\)\\s*==\\s*0","files":"op_api/aclnn_.*\\.cpp$","level":"info","note":"aclnn 接口未见空 tensor 分支（IsEmpty / shapeSize==0）；文件级粗筛，需人工确认是否走其他路径"}],"broad":[],"logSig":[],"symptoms":["第一段接口报错","NaN","读越界","含 0 维 shape 的输入","含 0 维 shape","空 tensor","合法空 tensor 被拒（161002/561002）"],"detectors":["空 tensor 探针矩阵","aclnn_empty_tensor_audit.py"],"related":["FP-B04","FP-B05","FP-A04","FP-A19","FP-E01"],"subtypes":[{"id":"B06-1","name":"判空覆盖不全（同一接口只对部分输入调 IsEmpty()）","evidence":"ops-nn#5149/PR #9197（masked_scatter 漏 source）"},{"id":"B06-2","name":"完全未判空（空 tensor 被继续 Contiguous/Cast/算子构建）","evidence":"四仓静态扫描 HIGH 461 / PARTIAL 141（2026-09-14）"},{"id":"B06-3","name":"平台分支不对称（arch22 与 regbase 只 gate 一侧）","evidence":"ops-nn#5149（修复仅 gate !IsRegbase()）"},{"id":"B06-4","name":"快速路径前置于校验（no-op/空输入早退排在参数校验之前，非法组合随空态一并放行）","evidence":"ops-transformer#4531; ops-cv#928; ops-cv#935"},{"id":"B06-5","name":"空态被过严校验拒绝（合法空 tensor 被无条件 Size()!=0 / IsEmpty() 直接判非法）","evidence":"ops-nn#7060; ops-nn#7055"}],"waiver":"","detect":{"axes":["shape","input-validity"],"oracle":["golden-canary","error-code"],"signal":"canary","lines":["valid-fuzz","error-scenario"],"min_cases":4,"constructor":"空 tensor 探针矩阵=「接口 × 输入位置 × 空形态（0 维标量 / 含 0 维 shape / 正常）」；优先覆盖「已写判空但漏了一个输入」的接口；空用例须同时跑 regbase 与非 regbase。","judge":"合法空输入输出等价 no-op；非法组合明确报错而非静默 SUCCESS；以 PyTorch CPU 参考为准。","kill":"若判空只覆盖部分输入，则该输入置空时第一段报错或读越界，而同接口其他输入置空正常。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（error-code/golden-canary），无静态形态判据","priority":18},"secondary":{"kind":"invariant","why":"空 tensor 分支问题：返回码可能正确但输出未写/平台不对称，数值判据对空输出无从下手。","relations":[{"id":"B06-S1","name":"零元素输出确定性","statement":"numel==0 时输出 tensor 必须存在且其属性（shape/dtype/format）与声明一致；不得是未初始化指针。","kill":"早退路径直接 return 而不写输出，会导致下游读到脏指针。","how":"构造各维为 0 的 shape，检查输出 tensor 元数据与可读性。"},{"id":"B06-X1","name":"平台对称","statement":"同一空输入在 A2/A3/A5 各平台的行为（返回码 + 输出元数据）必须一致。","kill":"某平台走了不同早退路径，会出现平台间不对称。","how":"跨平台矩阵跑同一组空 shape，比对返回码与输出元数据。"}]},"body":{"extras":[{"k":"控制变量（v6.30）","v":"**必须固定**——**只置空 ≥2 维的数据张量**，1 维参数（`gamma` / `scale` / `weight`）保持原值；置空后重算与其它张量的维度依赖并确认仍成立 ｜ **允许变动**——被置空的那一个数据张量 ｜ **多变量同变的典型误判**——1 维参数 `gamma=[8]` 也一起置空 → 与 `x` 末维不再匹配，报 561002；看起来正是「该支持却报错」，改回「只置空数据张量」后不报错——561002 完全是输入改坏造成的（差点提上去的假候选）"}],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O2=6）｜ 状态 活跃 ｜ 来源 ops-nn PR #9197 / issue #5149 + 四仓 aclnn 接口静态扫描（2026-09-14）+ ops-transformer#4531 / ops-cv#928/#935（快速路径前置，v6.1）","applicability_text":"仓 All ｜ 侧别 Host,Tiling,Kernel ｜ 载体 aclnn源码,Tiling源码,Kernel源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"aclnn 两段式接口对「空 tensor（numel==0，即 shape 含 0 维）」这一**语义可能合法的输入形态**缺少分支处理，五种子形态：① **判空覆盖不全**——同一接口只对部分输入调 `IsEmpty()`（典型：`selfRef`/`mask` 判了、`source`/`updates` 类第二输入漏判）；② **完全未判空**——空 tensor 被当正常输入继续 `l0op::Contiguous` / `Cast` / 算子构建（部分实现已有 `if (source->IsEmpty()) sourceContiguous = source;` 之类半程保护，但仅跳过连续化，仍把 0 元素 buffer 交给算子）；③ **平台分支不对称**——`!Ops::NN::AclnnUtil::IsRegbase()`（arch22 / A2A3）与 regbase（arch35 / 950）各有一套实现与 kernel，修复常只 gate 一侧；④ **快速路径前置于校验**（v6.1 显式化）——接口内**确有空输入 / no-op 早退分支**，但位置排在参数校验**之前**（或校验被写在该早退之后），于是**非法组合随空态一并被放行**：`InplacePartialRotaryMulGrad` 的 no-op 提前返回排在 `CheckRotaryModeShapeRelation` 之前，零长度但越界的 `partial_slice=[9,9]` 与负起点 `[-1,0]` 都返回 `GRAPH_SUCCESS`（#4531）；`UpsampleNearestExact2d` 与 `BoundingBoxEncode` 的空输入快速路径同样绕过参数校验（#928、#935）。**⑤ 空态被过严校验拒绝（v6.13 新增）**——与 ①~④ 方向相反：接口对空 tensor 做**无条件** `Size() != 0` / `IsEmpty() → 报错` 判断，把**资料明确支持的空输入**直接判为非法（`aclnnConvTbcBackward` 的 `OP_CHECK(self->Size() != 0, ... return ACLNN_ERR_PARAM_INVALID)` 不在任何 SoC 分支内，A2/950 一致与资料四处「支持空 Tensor」相反，#7060；`aclnnAddLayerNormGrad` 空张量 `(M=0,H>0)` 返回 561002，而同算子正向 `aclnnAddLayerNorm` 已支持，#7055）。判据是**以资料/对标的空态语义为准**：该支持却拒绝 → 本子型；该拒绝却放行 → ①~④。与 ①②③ 的本质区别是**分支存在而顺序错**——只查「分支是否存在」的静态扫描（含本节 `absence_signatures` 规则）**查不出这一类**，须按「早退块是否在校验之后」逐接口人工核。空输入进入 arch22 算子后，tiling/kernel 未适配 0 元素：kernel `Init()` 用**由 mask/shape 推导的元素数**（而非该 tensor 自身元素数）去 `SetGlobalBuffer`，等于把 0 字节分配注册成非 0 长度；source 元素数不足时更会读到分配外地址（越界/NaN）。","conditions":"任一输入（尤其可选输入/第二输入：masked_scatter 的 `source`、Dropout 的 `mask`、量化类的 `scales`/`zeroPoints`/`smoothScale`）numel==0；平台为 A2/A3（非 regbase）；同算子 tiling/kernel 未对 0 元素早退。语义上「空输入是否合法」须以 PyTorch 为准（如 masked_scatter 中 `source` 为空**仅当 mask 无 true 元素时合法**，此时应为 no-op 而非报错）。","manifest":"**PyTorch CPU/CUDA 同用例 PASS、NPU 侧第一段接口报错或执行失败**（合法空输入被误拦截）；或判空早退把**非法**组合（mask 有 true 而 source 空）静默吞成 SUCCESS，掩盖参数错误；或内核读越界 / 读出 NaN；或图模式下 shape/dtype 推导异常。特征信号：失败用例的输入里必有一个含 0 维的 shape。","mapping":"`op_api/aclnn_*.cpp` 的 `GetWorkspaceSize` 内逐参数核对——每个 `const aclTensor*`（输入）与 `aclTensor*`（inplace 张量如 `selfRef`）是否都有 `->IsEmpty()` 判断，判空后是否 `*workspaceSize = 0; uniqueExecutor.ReleaseTo(executor); return ACLNN_SUCCESS;` 早退；空 tensor 是否只跳过 `Contiguous` 却仍透传给 `l0op::Xxx`；`!Ops::NN::AclnnUtil::IsRegbase()` 两侧是否各自有空 tensor 策略（含 `ProcessBroadcast` 这类 regbase 专用分支）；arch22 `op_host/*_tiling.cpp` 是否对 0 元素校验/早退；kernel `Init()` 中 `SetGlobalBuffer(tensor, 长度)` 的长度是否取自该 tensor 自身元素数；`docs/aclnn*.md` 的元素数约束（如「source 元素数量需要大于等于 mask 中元素为 true 的数量」）与代码判空行为是否自洽。","signatures_text":"静态扫描「aclnn 接口 × 每个输入参数 × 是否有 `IsEmpty()`」——接口内 `IsEmpty()` 覆盖的输入数 < 输入张量个数 ⇒ **判空遗漏（PARTIAL）**；接口与同算子 host/kernel 层均无 `IsEmpty|EmptyTensor|GetShapeSize()==0` 关键字 ⇒ **全链路无感知（HIGH）**。四仓基线（2026-09-14，1040 个 aclnn 接口）：**PARTIAL 141 / HIGH 461 / 有 kernel 感知 88 / 全覆盖 328**；其中 ops-transformer 全覆盖仅 8/250，ops-math 有 182 个 HIGH。工具：一次性审计脚本（**未收录本仓**，故不能直接当 CI 静态门禁）产出上列四仓基线；本仓用 `python3 scripts/scan_fp.py --only FP-B06 --format json <目录>` 出候选，再按本节判据逐接口核 `IsEmpty()` 覆盖率。","intercept":"空 tensor 探针矩阵 =「接口 × 输入位置 × 空形态（0 维标量 / 含 0 维 shape / 正常）」；期望值以 PyTorch CPU 参考实现为准（合法空输入 → 输出等价于 no-op；非法组合 → 明确报错而非静默 SUCCESS）；**优先覆盖「已写判空但漏了一个输入」的接口**（作者已具备空 tensor 意识，遗漏概率最高）；空用例须同时跑 regbase 与非 regbase 平台（修复常只 gate 一侧）；「mask 无 true + source 空」这类合法组合必须显式建例（PyTorch 侧全 PASS 而 NPU 曾失败）；建议把上述静态扫描纳入 CI，新增判空遗漏即失败。","evidence_text":"ops-nn **PR #9197 / issue #5149**（2026-08-25 合入 master）——`index/masked_scatter/op_api/aclnn_masked_scatter.cpp` 的 `aclnnInplaceMaskedScatterGetWorkspaceSize` 原有 `if (selfRef->IsEmpty() || mask->IsEmpty())` 早退但**漏了 `source`**，修复新增 `if (!Ops::NN::AclnnUtil::IsRegbase() && source->IsEmpty()) { *workspaceSize = 0; uniqueExecutor.ReleaseTo(executor); return ACLNN_SUCCESS; }`（仅 gate arch22，950 走 `ProcessBroadcast` 自带保护）；issue 复现组合 `target=(4,8), mask=(4,1) 或 (4,8), mask_true=0, source=(0,8)` 在 PyTorch CPU/CUDA 四组全 PASS 而 **910b（A2）侧失败**。同仓 2026-04-29 issue「masked_scatter 当 updates 元素不够时存在内存访问越界或读取 NAN（A3）」为同源风险的另一侧（元素数不足而非恰为 0）。该修复的两点不足已记录：**未覆盖非 inplace 的 `aclnnMaskedScatter`**、**未沉淀 ST 用例**（现有 200 条 ST 用例无 0 维 shape，PR「测试」仅贴 PyTorch 参考输出）。 **v6.1 补（快速路径前置子型 ④）**：**ops-transformer#4531**（open，InplacePartialRotaryMulGrad）为支持空切片与空 Tensor 新增 no-op 提前返回，`CheckAttr` 在 `CheckRotaryModeShapeRelation` **之前**判 `sliceLength_ == 0` 或输入 Tensor 为空即直接 `return ge::GRAPH_SUCCESS`，致零长度但越界的 `partial_slice=[9,9]`、含负起点的 `[-1,0]` 被接受（反而**未命中**设备侧越界，因走的是 no-op 分支）；**ops-cv#928**（open，UpsampleNearestExact2d）空 Tensor 快速路径绕过参数校验；**ops-cv#935**（open，BoundingBoxEncode）空输入快速路径绕过 `means`/`stds` 校验。三条共同点：**空态分支本身有，但校验被它挡在了后面**。\n\n  **v6.13 补（子型 ⑤ 过严拒绝，2026-10-21）**：`ops-nn` **#7060**（`ConvTbcBackward`）——`op_api/convtbc_backward_checker.cpp:172-176` 用无条件 `OP_CHECK(inputTensor_.self->Size() != 0, ... return ACLNN_ERR_PARAM_INVALID)` 拒绝空输入，而资料四处声明 `self`/`input`/`weight`/`gradInput`/`gradWeight`/`gradBias` 支持空 Tensor，约束表还明确「支持 N、C、L 维度大于等于 0」；该检查不在任何 SoC 分支内，950 与 A2 行为一致。`ops-nn` **#7055**（`AddLayerNormGrad`）——空张量 `(M=0,H>0)` 返回 561002 失败，而正向 `aclnnAddLayerNorm` 已支持同形态空张量。**注意方向**：本子型不是「没写判空」，而是「判空写反了」——修法是按资料语义放行空态并走 no-op/零输出路径，不要直接删掉检查（否则 ①~④ 的放行问题会回来）。","related_text":"[FP-B04](FP-B04.md)（相邻但不同：B04 是 `nullptr` 指针缺失，本条是 numel==0 的**语义分支**缺失，两者可共现于同一 `CheckParams`）、[FP-B05](FP-B05.md)（同源——文件级校验范差不齐）、[FP-A04](../FP-A/FP-A04.md)（未拦截的空输入可能演变为静默结果/精度故障）、[FP-A19](../FP-A/FP-A19.md)（arch22 与 regbase 属两条路径，多路径覆盖盲区同样适用）、[FP-E01](../FP-E/FP-E01.md)（golden/UT 未覆盖空输入时同样会出现「与错误实现共错」）。"},"caseCount":5},{"id":"FP-B07","name":"索引/偏移计算错误致越界","file":"patterns/FP-B/FP-B07.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"必须触发","triggerZh":"必须触发","repos":["All"],"sides":["Tiling","Kernel","Host"],"carriers":["Tiling源码","Kernel源码","aclnn源码"],"enabled":true,"evidence":["ops-nn#1029 EmbeddingDenseGradV2 idx 越界导致 aic 问题","ops-nn#1182 同算子 idxOffset 翻转致 indices 取值越界(同根因两连发)","ops-nn#1359 MatMulUnAlignedSingleCoreSplitK 模板 DataCopy 指令读越界","ops-nn#1608 32B DataCopy 越界","ops-nn#1483 cubeMathType 数组越界 coredump","四仓缺陷类语料 2026-09-14: 该机理命中 125 条","2026-11 批次：本簇 31 条；代表 ops-transformer#6571（slotMapping 上界）、#6576（blockId 越界）、#6543/#6605（groupList 负值）、ops-cv#1437（4*C*(H*W-1) 超 int32）","mssanitizer memcheck 误报判据（v6.49）: 官方 example aclnnMlaProlog 报 OOB 1024B/128B 与 512B/64B，地址恰为 kvCache/krCache 张量基址；基址后移 4096B 后告警同步平移至 base+0x1000，前置 4KB/后置 1MB 守卫区零改动 => 工具边界记账偏差，非越界；aclnnMsaIndexScore 88 条 64B 告警按 scoreStride*4=1088B 步长落逐行行首，40 用例 1MB 后置守卫区 guard_bad 全 0","索引越界判据补充（v6.60）：A2 实测 index_select/embedding/gather/take 传 -1 或 ==size 的索引时，两段接口均返回 0（第一段不拦），执行期在 AICore 抛 507035（vector core exception），而非 161002 参数错误。判定要点：`docs/aclnnTake.md:96` 只把「不支持负索引，取值 0~self.shape[dim]」写成**前置条件**，161002 清单（:163-174）不含索引越界 ⇒ 按 G2 口径属**未定义行为，不报缺陷**；只有当资料把「索引越界」写进错误码表（如 B11-7 的错误码族错位）或给出了越界语义时，才构成可报缺陷。对照：torch.take(-1) 在 CPU 按负数环绕返回末元素（PyTorch 未文档化负数语义），NPU 直接 AICore 异常，属 torch_npu 适配层差异，不落在 aclnn 契约内。"],"tocEvidence":"5 issue+四仓扫描(125 条)","signatures":["int32_t[^\\n]{0,40}(idx|Idx|offset|Offset|addr|Addr)","idxOffset|startOffset|offsetIndex|coefArr","CeilDiv\\([^;]{0,60}(idx|offset)",{"re":"DataCopy(Pad)?\\([^;]{0,60}(offset|Offset)","files":"op_kernel"},"GetShapeSize\\(\\)\\s*[<>]=?\\s*INT32_MAX","cubeMathType\\s*\\[",{"re":"SetGlobalBuffer\\s*\\([^;]{0,80}\\*","files":"op_kernel"},"(int32_t|uint32_t)\\s+\\w*(?i:gmBias|gm_bias|blockOffset|block_offset|progress)"],"keywords":["\\w*[Ss]tride\\w*","SetGlobalBuffer"],"absence":[],"broad":["int32_t[^\\n]{0,40}(idx|Idx|offset|Offset|addr|Addr)"],"logSig":[],"symptoms":["aic error","coredump","结果错位","非对齐尾块","地址未对齐","未对齐"],"detectors":["mssanitizer","边界值/非对齐尾块探针","scripts/scan_uint64_mul.py（类型感知，B07-6）"],"related":["FP-A18","FP-A04","FP-B04","FP-B06","FP-D01","FP-E01","FP-B08"],"subtypes":[{"id":"B07-1","name":"整型宽度不足（int32 承载元素数/地址，元素数 > 2^31 即溢出）"},{"id":"B07-2","name":"符号/方向翻转（idxOffset / startOffset 正负号或方向取反）"},{"id":"B07-3","name":"边界条件写错（>= / > 混用、末块漏 1、CeilDiv/FloorDiv 取整方向错）"},{"id":"B07-4","name":"对齐与分核偏移（32B 对齐、多核分核偏移叠加未对齐）"},{"id":"B07-5","name":"检查次序颠倒（先算偏移后校验维度值，非法值先参与运算）"},{"id":"B07-6","name":"GM 偏移/长度 32 位计算域溢出（合法大 shape 下线性位置达 2^32 回绕；声明为 int64 但右侧乘法仍在 32 位域）","sig":["SetGlobalBuffer\\s*\\([^;]{0,60}\\*[^;]{0,60}\\*","(int32_t|uint32_t)\\s+\\w*(gmBias|gm_bias|blockOffset|block_offset|progress)"]},{"id":"B07-7","name":"分组/列表索引负值未校验（groupList/indices < 0 直接参与寻址）","evidence":"ops-transformer#6543/#6605"}],"waiver":"定位型：8 条指纹覆盖 int32 承载 / 偏移 / 对齐等六个成因，候选须逐一验算；最宽的 int32 承载指纹已降为 broad","detect":{"axes":["shape","memory","boundary"],"oracle":["sanitizer-memcheck"],"signal":"memory","lines":["memory"],"min_cases":4,"constructor":"四类探针：元素数跨 2^31 / indices 取边界负值重复 / 非对齐尾块（末维 31/32/33、尾块非整除）/ 分核数=1、2、实际核数±1；大 shape 需与 tiling 阈值两侧成对构造。","judge":"mssanitizer 无越界告警；不出现 aic error / coredump / 数值错位三类症状（避免只报「精度不一致」）。","kill":"若 int32 承载元素数/地址或偏移符号方向翻转，则元素数跨 2^31 时越界，或尾块数值错位。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"M01 边界比较反向：0/10（比较方向属语义层，静态不可判）","priority":27},"secondary":{"kind":"invariant","why":"索引/偏移越界的后果是被踩区域，单看输出值可能完全正确（踩的是 padding）。","relations":[{"id":"B07-S1","name":"边界哨兵","statement":"输出与相邻 buffer 的哨兵区必须不被修改。","kill":"越界写落在相邻 tensor 上，输出本身可能正确。","how":"多 tensor 连续分配，首尾填哨兵，执行后全量扫描。"},{"id":"B07-M1","name":"尺寸阶梯单调","statement":"shape 在 2^k ± 1 阶梯上变化时，输出应连续变化，不得在某个尺寸突然劣化。","kill":"尾块/对齐边界算错会在特定 size 处出现阶跃。","how":"取 63/64/65、127/128/129 等阶梯，比较相邻点输出差异幅度。"}]},"body":{"extras":[{"k":"机器辅助（成因⑥，v6.12）","v":"`python3 scripts/scan_uint64_mul.py <仓根> [--json out.json] [--baseline b.json]`——**类型感知**检测器：解析 `struct` 字段 / 局部变量 / 函数形参 / `constexpr` 常量的声明类型，只对「左值 64 位 + 右侧乘法操作数全 ≤32 位」报 HIGH，类型未知单列 UNKNOWN；退出码 1 = 存在未豁免 HIGH。实测四仓 10,389 个 kernel 文件：ops-transformer 722 / ops-nn 117 / ops-math 35 / ops-cv 13 条 HIGH，人工复核确认 22 处；并据此**回退 9 处误判**（`numCol`、`outputLastDimValue_` 在部分算子里是 `uint64_t`/`int64_t`，乘法已提升）。局限：不做值域分析、混合 64 位加数的表达式（`a*b*c + 2*xBaseOffset`）可能漏报，HIGH 仍须按本卡判定标准复核。"},{"k":"专属检视方法（成因⑥；v2.17 新增，来源 `cann/cannbot-skills` `ascendc-code-review` 红线条例 9）","v":"① **枚举**所有 GM 起始地址、GM 下标、GM 搬运长度表达式——`SetGlobalBuffer((__gm__ T*)ptr + expr, size)`（**第二个 size 参数同样要查**）、`GlobalTensor[expr]` / `xGm[gmBias]` / `yGm[progress]`、`CopyIn(gmBias)` / `CopyOut(progress)` / `DataCopy*(gm[expr], ...)`，以及名称含 `gmBias` / `gm_bias` / `offset` / `progress` / `blockOffset` 与 stride 类变量（`\\w*[Ss]tride\\w*`）的表达式；② 对每个表达式**同时看声明类型与右侧计算域**：若存在 `blockIdx` / `indexOuter` / `i_o` / `mIdx` 与 `blockFactor` / `rowFactor` / `numCol` / `tiling->n` / stride 等多因子相乘，**必须在第一次乘法之前**显式提升到 `int64_t` / `uint64_t`；③ **不能只看最终变量类型**——`uint64_t gmBias = i_o * rowFactor * numCol;` 中右侧操作数全为 32 位时仍先回绕后赋值，**判 FAIL**；④ **反推最大可能值**：若合法 shape 或 tiling 可使线性元素位置达到或超过 `2^32`，且乘法前未进入 64 位计算域 → **FAIL**；无法确认上界但表达式用于 GM 偏移且全为 32 位操作数 → 至少 **SUSPICIOUS**。"},{"k":"控制变量（v6.30）","v":"**必须固定**——shape / dtype / 属性固定，只把**一处** index / offset 推到边界值（最后一个合法值、第一个越界值）；每次只动一个下标 ｜ **允许变动**——单个索引 / 偏移值 ｜ **多变量同变的典型误判**——同时改 shape 与索引 → 越界位置说不清是 shape 算错还是索引算错；实测 40 个抽样里索引边界注入只对 7 个生效（其余无整型输入），按「全支持」统计会虚高"},{"k":"检测工具误报判据（v6.49，守卫区复核强制）","v":"`mssanitizer --tool memcheck` 报 `WARNING: out of bounds of size N at 0xADDR on GM when writing data` 时**不得直接作缺陷证据**，必须先用「前置 + 后置守卫区 canary」复核。A2(910B2) + CANN 9.3.0 实测两例误报：① 官方 example `aclnnMlaProlog`（nq / pq 两个用例）报 1024B/128B 与 512B/64B 两条，地址**恰好等于 `kvCache` / `krCache` 的张量基址**；把张量基址后移 4096B 重跑，告警地址同步后移到 `base+0x1000`，而前置 4KB 与后置 1MB 守卫区（预填 0x7F）**零改动** ⇒ 工具在张量首址上的边界记账偏差，不是写越界。② `aclnnMsaIndexScore` 报 88 条 64B 告警，地址以 `scoreStride*4 = 1088B` 为步长落在**逐行行首**；40 个用例各加 1MB 后置守卫区 → 全部 `guard_bad = 0`。判据三条：告警地址是否随张量基址平移、步长是否等于行 stride、守卫区是否被改动；三条同时成立即判**工具误报**，不得提交 issue。**反向纪律**：也不能只看关键词 `illegal` 就判「全绿」——`out of bounds` 是独立消息类（`ERROR: illegal read/write of size` 之外的另一族），漏看会把真越界当无异常。"}],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 四仓 issue 全量语料对照（2026-09-14，缺陷类命中 125 条，已关闭 108）","applicability_text":"仓 All ｜ 侧别 Tiling,Kernel,Host ｜ 载体 Tiling源码,Kernel源码,aclnn源码 ｜ 触发 必须触发 ｜ 默认启用 true","mechanism":"索引/偏移量在 host（tiling / infershape / aclnn）或 kernel 内计算错误，导致越界读/写或取到错误数据。**七种**典型成因：① **整型宽度不足**——用 `int32_t` 承载元素数/地址（元素数 > 2^31 即溢出，单核偏移相乘更易溢出）；② **符号/方向翻转**——`idxOffset`、`startOffset` 等正负号或方向取反；③ **边界条件写错**——`>=`/`>` 混用、末块/尾块偏移计算漏 1、`CeilDiv/FloorDiv` 取整方向错；④ **对齐与分核偏移**——`DataCopy/DataCopyPad` 的 32B 对齐、多核分核偏移叠加未对齐；⑤ **检查次序颠倒**——先按连续性/对齐算偏移，后做维度值校验，非法值先参与偏移运算；⑥ **GM 偏移 / 长度 32 位计算域溢出（v2.17 增补）**——合法大 shape 下线性元素位置达 **`2^32`**（**uint32 域回绕**，与成因① 的 int32 溢出是不同档位），或 GM 起始地址 / 下标 / 搬运长度 / `SetGlobalBuffer` 的 **size 参数**中 **≥2 个 32 位因子相乘**。**隐蔽特征是最终变量已声明为 `int64_t` / `uint64_t`，但右侧乘法仍全在 32 位域完成**——赋值时回绕已发生，再提升也无效。表现常为**后段输出全 0 的静默错误**（无 `aic error`、无 coredump），与成因① 的 aic error 型不同（实证 ops-nn #4494）。 ⑦ **分组/列表索引负值未校验（v6.33）**：`groupList` / `indices` / `slot` 等分组或索引值取负时未拦截，直接参与前缀和/寻址，导致 AI Core 越界（507015）或静默错位；与 ② 的区别是 ② 是偏移算式符号翻转，本条是**入参值域本身为负**。\n```cpp\n// ❌ 错误 1：最终变量是 int64_t / uint64_t，但右侧操作数全是 uint32_t —— 先回绕再赋值\nint64_t offset = batchIdx * numHeads * seqLen * headDim;\nuint64_t gmBias = i_o * rowFactor * numCol;\nxGm.SetGlobalBuffer((__gm__ T*)x + blockIdx_ * blockFactor * numCol, rowWork * numCol);\n// ❌ 错误 2：GM 偏移 / 搬运长度变量直接用 32 位类型承载\nuint32_t gmBias = i_o * rowFactor * numCol;\nint32_t blockOffset = mIdx * numCol;\n// ✅ 正确：第一次乘法前显式提升到 64 位计算域\nint64_t offset = static_cast<int64_t>(batchIdx) * numHeads * seqLen * headDim;\nuint64_t gmBias = static_cast<uint64_t>(i_o) * rowFactor * numCol;\nxGm.SetGlobalBuffer((__gm__ T*)x + static_cast<uint64_t>(blockIdx_) * blockFactor * numCol,\n                    static_cast<uint64_t>(rowWork) * numCol);\n```","conditions":"大 shape（元素数跨 2^31、单核偏移超 int32）；indices/offsets 取**边界值、负值、重复值**；末维/尾块非对齐（如 31/32/33）；分核数与 shape 不整除；模板分支（全载/切分/单核）切换处的偏移语义不同；dav3510x 等多平台分支的检查次序差异；**合法大 shape 且 GM 偏移链路存在多因子乘法**（batch×heads×seqLen×headDim 量级可达数十 GB，见成因⑥）。","manifest":"`aic error` / `AIC Error` 报错；coredump；结果**错位**（部分位置取到相邻元素）而非整体偏差；偶发性（依赖分核与 shape，同一算子部分 case 才复现）；有时先被当成\"部分用例精度不对\"，掩盖越界根因。","mapping":"地址/偏移变量的**声明类型**（`int32_t` vs `int64_t`）与元素数上界是否匹配；`idxOffset`/`startOffset`/`coefArr`/`*Stride` 的符号与方向；索引算式中的 `+1/-1`、除法与取模的取整方向；`DataCopy`/`DataCopyPad` 的 blockLen 与 32B 对齐；`GetShapeSize()` 与 `INT32_MAX` 比较处是否已溢出（比较本身在溢出之后即无效）；host 侧 shape 各维相乘是否可能超 int32；连续性/对齐检查与维度值检查的**先后次序**；`cubeMathType` 等枚举数组下标取值。","signatures_text":"`int32_t[^\\n]{0,40}(idx|Idx|offset|Offset|addr|Addr)`；`idxOffset|startOffset|offsetIndex|coefArr`；`CeilDiv\\([^;]{0,60}(idx|offset)`；`DataCopy(Pad)?\\([^;]{0,60}(offset|Offset)`；`GetShapeSize\\(\\)\\s*[<>]=?\\s*INT32_MAX`；`cubeMathType\\s*\\[`；**成因⑥ 增补（v2.17）**：`SetGlobalBuffer\\s*\\([^;]{0,80}\\*`（GM 偏移含乘法）；`(int32_t|uint32_t)\\s+\\w*(?i:gmBias|gm_bias|blockOffset|block_offset|progress)`（GM 偏移变量落在 32 位域）；**成因⑥ 类型感知检测器（v6.12）**：`scripts/scan_uint64_mul.py`——正则签名只能覆盖 `SetGlobalBuffer(...*...)` 这类形状，普通赋值形态（`uint64_t x = a * b * c;`）需类型推断，见下条。","keywords_text":"不是缺陷候选**）**：`\\w*[Ss]tride\\w*`（stride 类变量参与偏移计算，如 `blockTablesStride` / `srcStride` / `strideW`——⚠️ **高频词，正常代码里大量出现，按 v2.15 判据不得作判别性指纹**，只作定位提示）；`SetGlobalBuffer`（**对照锚点**：命中 = 存在 GM 偏移注册点，真正要看的是其第二个 size 参数的**计算域**）。","intercept":"构造四类探针——「元素数跨 2^31」「indices 取边界/负值/重复」「非对齐尾块（末维 31/32/33，尾块非整除）」「分核数 = 1 / 2 / 实际核数 ± 1」；对索引敏感算子跑 `mssanitizer`（内存越界检测）而非只比数值；比对时同时看「是否 aic error / 是否 coredump / 数值是否错位」三类症状，避免只报\"精度不一致\"；大 shape 用例需与 tiling 阈值（分核/全载切换点）两侧成对构造。","evidence_text":"ops-nn **#1029** `EmbeddingDenseGradV2` idx 越界导致 aic 问题；**#1182** 同算子 `idxOffset` **翻转**导致 indices 取值越界致 aic（**同根因两连发**）；**#1359** `MatMulUnAlignedSingleCoreSplitKKernelGmToL1` 模板 `DataCopy` 指令读越界；**#1608** 32B `DataCopy` 越界；**#1483** `cubeMathType` 数组越界引发 coredump；另有 #1928 index_fill 数据量超 int32 触发地址越界风险（与 FP-A18 交叠）。语料统计（2026-09-14，四仓缺陷类）：该机理命中 **125 条**。**成因⑥ 实证增补（v2.17）**：ops-nn **#4494**（910B2）`rms_norm` 在**合法大 shape** 下从元素位置 `4294969344`（紧贴 `2^32`）附近开始输出**全 0**——**无 `aic error`、无 coredump、无其他报错**，是成因⑥ 的**静默型**表现（与该卡主症状「aic error / 结果错位」不同，须并看 FP-A04）；修复把 `blockIdx_ * blockFactor * numCol`、`gmBias`、`CopyIn/CopyOut` 的 GM 偏移链路改为 `uint64_t` 并在乘法前显式 `static_cast<uint64_t>`。该案例由 `cann/cannbot-skills` `ops/ascendc-code-review` 红线条例 9 收录，本库 v2.17 据此补录。 **现网复盘增补（v2.19）**：ops-transformer PR **#69068**（现网 25-09，`ScatterAddWithSort`）——UB 容量比较用 `>` 而非 `>=`，`updatesAlign * inputSize` **恰好等于** `max_ub` 时漏入降级分支，scratch 预留不执行致越界；修复后 `scatter_add_with_sorted_tiling.cpp:219` 改 `>=`。ops-transformer PR **#2466**（现网 26-03，`FlashAttentionScore`）——BMM2 搬运因子固定 `ndNum = 2`，奇数尾块只剩 1 个 ND 单元时仍按 2 搬运，同时 `blockCount`/`cacheSize` 一并按 2 记账；修复后 `flash_attention_score_s1s2_bn2gs1_sab.h:2353` 改为 `ndNum = aColNum - curK == 1 ? 1 : 2`。**注**：两条均为仅 PR 无 issue 的现网单，PR 号在此登记以固定溯源。 **2026-11 批次（v6.33 反哺）**：本簇 31 条；代表 ops-transformer#6571（slotMapping 上界）、#6576（blockId 越界）、#6543/#6605（groupList 负值）、ops-cv#1437（4*C*(H*W-1) 超 int32）。","related_text":"[FP-A18](../FP-A/FP-A18.md)（int32 边界值转 float 舍入——本条是**整型承载与符号语义**，同一 int32 主题的两个面）、[FP-A04](../FP-A/FP-A04.md)（越界取值错误常表现为\"静默精度不对\"）、[FP-B04](FP-B04.md)（越界写常伴随空指针/未校验的指针基线）、[FP-B06](FP-B06.md)（空/0 元素输入是索引越界的极端输入形态）、[FP-D01](../FP-D/FP-D01.md)（workspace/偏移申请不足同源）、[FP-E01](../FP-E/FP-E01.md)（只比数值不看 aic error 会漏判此类）、**[FP-A04](../FP-A/FP-A04.md)（成因⑥ 的静默型表现：后段输出全 0 而无任何报错，落在 A04「不报错地输出部分结果」上——只按本条主症状（aic error / 错位）去比对会整体漏判）**、[FP-B08](FP-B08.md)（节点级配置未参与派发致模板/分支选错，错误分支的索引/偏移假设不成立时可表现为本型越界）。"},"caseCount":8},{"id":"FP-B08","name":"节点级配置未参与派发决策（属性在某一跳被丢弃：fallback 回调 / 前端插件 / fusion pass）","file":"patterns/FP-B/FP-B08.md","cat":"compatibility","catZh":"功能/兼容","s":2,"o":3,"level":"高","score":6,"depth":"深度","status":"active","trigger":"GetAttrPointer|ParseOpToGraph|fallback|AddNode","triggerZh":"签名","repos":["canndev"],"sides":["Host"],"carriers":["IR与图配置"],"enabled":true,"evidence":["canndev#1790(closed, 载体①fallback回调): MM 算子经 GE aclnn fallback 回调执行时, fallback 未读取 MatMulV3 节点 opImplMode 属性, HF32 判定仅依赖全局 allow_hf32, 致节点级 HF32 未参与 cubeMathType 生成; 影响 GE 图模式走 aclnn fallback 的 MatMulV3 场景, 可能带来性能下降或精度差异, 直接 aclnn 调用路径不受影响; 复现 ge图设置matmul节点传入opImplMode为0x40; 环境 A2/A3/A5","修复 PR #82099(master) + #82101(9.2.0-beta.1 回合), ops/built-in/op_fallback/fallback_common_2stages.cpp +44/-4: 新增 OpImplMode 位枚举(ENABLE_HF32=0x40), 新增 IsMatMulV3Hf32Enabled(), GetMatmulPrecisionMode() 由只看全局改为节点级 OR 全局, 补 GetAllowHf32() 空指针防护","canndev#1647(open, 载体②前端插件): ReduceSum 算子 Onnx 插件未正确处理 noop_with_empty_axes 属性 - ONNX13 之后 reduceSum 获取到该属性后没有往下传递, 路径 ops/built-in/framework/onnx_plugin/reduce_sum_plugin.cc 函数 ParseOpToGraphReduceSum13, 现象属性未透传到 GE 的 OP 上(Ascend910C/CANN8.5)","canndev#1639(closed, 载体③fusion pass): Fix ExtendConvTranspose A16W8 group - A16W8 量化模式下 fusion pass 未获取 conv2dtranspose 算子的 groups 属性, 创建 rearrange 算子时未将 groups 设置到新节点, 导致 ATC 编译失败","canndev#1771(open, 同族关联) code canndev 仓 issue 检索（2026-09-16）","applicability_text":"仓 canndev ｜ 侧别 Host ｜ 载体 IR与图配置 ｜ 触发 GetAttrPointer|ParseOpToGraph|fallback|AddNode ｜ 默认启用 true","mechanism":"**图模式**下算子经 **aclnn fallback 回调**执行时，回调实现只读取**全局配置**（如 `allow_hf32`、`precision_mode`）来决定派发/执行模式，**未读取节点携带的节点级属性**（如 `opImplMode`、`enable_hf32`、`groups`），导致节点级配置**不参与**执行模式决策。① 节点级开启了某模式而全局未开 → **节点配置被静默忽略**，走默认路径；② 反向：全局开了而节点显式关闭 → 仍按全局开执行（无节点级否决权）；③ 与「直接 aclnn 调用路径」表现不一致——**aclnn 直调正常，图模式 fallback 异常**，这是本型最典型的定位特征。根因多为回调实现按 `GetNodeType()` 分支处理时只覆盖部分算子（如仅 `MatMulV3`），或**属性按位置索引取值**（`GetAttrPointer<T>(3)`）而属性顺序变更后静默取错。**同一机理在三个不同载体上均有实证，且修复时机不同（2026-09-16 逐分支实测）**：① **fallback 回调**（#1790）—— 9.1.0 起修复；② **ONNX 插件解析函数**——新增前端属性未纳入解析透传清单（#1647）—— 9.1.0 起修复；③ **图 fusion pass**——新建节点时未把源节点属性拷到新节点（#1639）—— **9.1.0-beta.2 起修复（早于 ①②）**。三者共性是**「属性在某一跳被丢弃」**，而非读取逻辑本身错误。**注意版本矩阵不可统一按「9.1.0 前都带 bug」构造**：载体③在 `9.1.0-beta.2` / `9.1.0-beta.3` 上已修复。","conditions":"**四元组同时成立**——① 走 **GE 图模式**（非 aclnn 直调）；② 该算子**经由 aclnn fallback 回调**执行；③ 节点上**设置了节点级配置属性**（且与全局配置不一致）；④ 该算子的回调分支**已被实现**但未读取该属性。**aclnn 直调路径不触发**。**载体泛化**：任一「属性需跨越一跳传递」的环节——图模式 fallback 回调、前端（ONNX/TF）插件解析、图 fusion pass 新建节点——只要该跳**未显式透传属性**，即可能触发；**前端框架版本升级新增属性**（如 ONNX13+ 引入 `noop_with_empty_axes`）是高频触发场景。","manifest":"节点级配置**未生效但无任何报错**——执行模式不符合预期；**可能表现为性能下降或精度差异**（取决于配置项语义）；图模式与 aclnn 直调**结果/性能不一致**；全局配置能生效、节点级配置不生效；无 error 日志（属性读取失败时仅 `OP_LOGE` 后 `return false`，静默降级）。","mapping":"① fallback 回调中决定派发模式的函数（如 `GetMatmulPrecisionMode`）是否**既读全局也读节点属性**，最终判定是否为二者的**合理组合**（OR 还是 AND，是否与语义一致）；② `GetNodeType()` 分支是否**覆盖全部会走该回调的算子**（当前仅 `MatMulV3`，`BatchMatMulV3` 等同族是否遗漏）；③ **属性取值方式**——`attrs->GetAttrPointer<T>(N)` **按位置索引**取值是高危写法（属性顺序变更即静默取错），应改为按属性名获取或加索引常量与 proto 定义的一致性校验；④ 属性读取失败（`attrs == nullptr` / 指针为空）时是**静默降级 return false** 还是上报，降级是否会导致\"节点配置被忽略\"；⑤ 全局配置指针（如 `GetAllowHf32()` 返回 `nullptr`）是否有**空指针校验**（原实现直接 `strcmp` 会崩）；⑥ **前端插件解析函数**（如 ONNX 的 `ParseOpToGraph*`）是否把**新版本新增的属性**纳入解析与透传清单（新增属性易被漏掉，旧属性仍正常）；⑦ **fusion pass 新建/替换节点**时，是否把**源节点的全部相关属性**拷贝到新节点（漏拷属性会导致下游编译或执行期行为异常）。","signatures_text":"`GetAttrPointer\\s*<[^>]+>\\s*\\(\\s*\\d+\\s*\\)`（**按数字索引取属性**）；`strcmp\\s*\\(\\s*\\w*[Nn]odeType\\s*,\\s*\"` （节点类型硬编码分支）；`strcmp\\s*\\(\\s*\\w*[Aa]llow_?[Hh]f32`；含 `_hf32|Hf32|HF32` 的布尔判定函数中**是否出现 `attrs`/`GetAttr` 调用**（若整函数无 `GetAttr`，即为「只看全局」嫌疑）；`GetAttrPointer` 失败分支为 `return false;` 且无 `OP_LOGE`；**`ParseOpToGraph[A-Za-z0-9]+` 函数内**：属性名清单与目标算子 proto 中声明的属性集做**差集扫描**（差集非空即漏透传）；**fusion pass** 中「**属性读端与写端不在同一函数**」的断链形态——若存在 `SetInt(<新节点 opDesc>, <ATTR>, <局部变量>)` 而**找不到**同名的 `GetInt(<源节点 desc>, <ATTR>, <同一变量>)`（或反向），即为嫌疑点；**变量名可作跨函数关联线索**（#1639 中读端在 `CheckConv2dTransposeDescInfo()`、写端在 `CreateRearrangeOp()`，两侧变量名均为 `attrGroups`）。⚠️ 仅扫 `AddNode`/`CreateNode` 前后若干行**会漏判**——#1639 的读、写分落两个函数且都不紧邻 `AddNode`。","intercept":"① **节点级 × 全局级交叉矩阵**——对每个可配节点属性构造 `{节点开, 全局关} / {节点关, 全局开} / {双开} / {双关}` 四组，**断言四组行为两两可区分**；② **图模式 vs aclnn 直调对拍**——同一 shape/dtype 分别走 GE 图（经 fallback）与 aclnn 直调，比对**执行模式（可由 profiler 的 kernel 类型/耗时反查）与数值结果**是否一致；③ 对按位置索引取属性的写法，补一条「**属性顺序变更后单测**」或静态门禁，比对 `GetAttrPointer<T>(N)` 的 N 与 proto 定义中属性声明顺序；④ 节点级配置生效性纳入**泛化用例矩阵**（不要只测全局开关）。","evidence_text":"canndev **#1790**（closed）「MM 算子通过 GE aclnn fallback 回调执行时，HF32 属性没有正确传递到底层」——现象：MM fallback 回调**未读取 MatMulV3 节点携带的 `opImplMode` 属性**，HF32 判断仍只依赖全局 `allow_hf32`，导致**节点级 HF32 配置未参与 `cubeMathType` 的生成**；影响：GE 图模式下走 aclnn fallback 的 MatMulV3 场景中 HF32 未按节点配置生效，**可能带来性能下降或精度差异**，**直接 aclnn 调用路径不受影响**；复现：`ge 图设置 matmul 节点传入 opImplMode 为 0x40`；环境：A2/A3/A5；修复 PR **#82099**（master）+ **#82101**（`9.2.0-beta.1` 回合），改 `ops/built-in/op_fallback/fallback_common_2stages.cpp`（+44/−4）：新增 `OpImplMode` 位枚举（`ENABLE_HF32 = 0x40`）、新增 `IsMatMulV3Hf32Enabled()` 读节点 `opImplMode`、将 `GetMatmulPrecisionMode()` 由「只看全局」改为「**节点级 OR 全局**」并补 `GetAllowHf32()` 空指针防护。**同机理独立实证（2026-09-16 增补，O2→O3 依据）**：**#1647**（open）「ReduceSum 算子 Onnx 插件未正确处理 `noop_with_empty_axes` 属性」——ONNX13 之后 `reduceSum` 获取到 `noop_with_empty_axes` 属性后**没有把这个属性往下传递**，代码路径 `ops/built-in/framework/onnx_plugin/reduce_sum_plugin.cc` 函数 `ParseOpToGraphReduceSum13`；现象为属性未透传到 GE 的 OP 上（Ascend910C / CANN8.5）；**#1639**（closed）「Fix ExtendConvTranspose A16W8 group」——A16W8 量化模式下算子缺少对 `groups` 属性的正确处理：**fusion pass 未获取 conv2dtranspose 算子的 `groups` 属性**，且在**创建 rearrange 算子时未将 `groups` 正确设置到新节点**，导致 ATC 编译失败。载体路径 `ops/convolution/extend_conv_transpose/graph_plugin/fusion_pass/conv2d_transpose_fixpipe_fusion_pass.cc`（**注意在算子自有 `graph_plugin/` 下，不在 `ops/built-in/fusion_pass/`**）；修复提交 `1f65a691`（+7 行，2026-05-12，MR `!81593`），三处改动为「读 `GetInt(conv2dtransposeDesc_, GROUPS, attrGroups)` + 写 `SetInt(opDesc, GROUPS, attrGroups)` + 初始化 `attrGroups = 1`」，并引入 `InsertA16W8WeightFzTransferOp()`。**版本边界实测（2026-09-16）**：9.0.0 / 9.0.0-beta.2 / 9.1.0-beta.1 **带 bug**；**9.1.0-beta.2 起已修复**（beta.3 / 9.1.0 / 9.2.0 / master 同）。**#1647 版本边界实测**：9.0.0 / 9.0.0-beta.2 / 9.1.0-beta.1 / 9.1.0-beta.3 **带 bug**；9.1.0 / 9.2.0 / master **已修复**（修复提交 `cce77adb`，2026-06-01，MR `!81676`；⚠️ 该提交描述中关联的是 issue **#1674** 而非 #1647，两者关系待确认）。**#1771**（open，同族待查）「BatchMatMulV3 原型修改：将 attr `enable_hf32` 改为 `opImplMode`」——同族算子的**属性语义迁移**，属本型③「按位置索引取属性」的直接风险来源（原型改属性即触发顺序/语义变更）。","related_text":"[FP-B01](FP-B01.md)（**方向相反的镜像**：B01 是校验过严、把合法输入拦掉；本型是校验/派发读取不全，把**节点配置静默忽略**，二者同属\"配置面与判定面不一致\"）、[FP-B03](FP-B03.md)（跨仓迁移丢失防御逻辑——本型可视为\"迁移时丢失节点属性读取\"的特化）、[FP-A16](../FP-A/FP-A16.md)（**aclop 与 aclnn 编译阶段精度差异**——本型是\"图模式 fallback vs aclnn 直调\"的路径差异，同属多通路一致性族）、[FP-A20](../FP-A/FP-A20.md)（确定性等级未分级标注——同属\"配置粒度未正确传递/暴露\"）、[FP-F02](../FP-F/FP-F02.md)（属性读取失败仅 `OP_LOGE` 后静默 `return false`，属可观测性不足；#1660 的「降级分支误报 error」是其对称面）、[FP-F01](../FP-F/FP-F01.md)（#1639 的表现为 ATC 编译失败，与构建/产物类缺陷交叠）。"},"caseCount":4},{"id":"FP-B09","name":"动态 shape 标签未参与校验决策（`-2`/`-1` 被当真实维度）","file":"patterns/FP-B/FP-B09.md","cat":"compatibility","catZh":"功能/兼容","s":2,"o":3,"level":"高","score":6,"depth":"深度","status":"active","trigger":"UNKNOWN_RANK|UNKNOWN_SHAPE|GetShapeRange|GetDims","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["IR与图配置"],"enabled":true,"evidence":["canndev#1673(closed, AdaptiveAvgPool2dGrad): 输入动态 shape 为 -2 时 infershape1.0 把 -2 当成真实维度值参与校验导致报错; 复跑带动态标签为 -2 的用例即可复现; Ascend950/CANN9.1.0; 期望无校验报错且精度100%","canndev#1770(open, SparseSegmentSumGrad): 动态 shape 下第二三个输入若为 -2 会判断维度不为 1 从而导致 infershape 失败","canndev#1766(closed, RGB2YUV422): inferShape 对 UnknownRank 情况没有考虑, 同时 GetShapeRange 前没有 MakeUpRange, 应参考 YUV4442YUV422; 跑(-2)和(-1,-1,-1)场景必现; Ascend950/CANN9.1.0","canndev#1786(open, ProdVirialSeA): GEIR 通路运行动态 shape(-2 UNKNOWN_RANK / -1 UNKNOWN_SHAPE)时报错; ProdVirialSeAVerify 与 ProdVirialSeAInferShape 硬校验输入维度必须为2, 动态 shape 下 GetDims() 返回 {-2} 或 {-1} 致 size 不为2 直接报错; 修复范式: 校验前先判动态标签, 动态则跳过维度与值校验、nframes 设 -1、输出 shape 置 -1","canndev#1787(open, Yolo): YoloVerify 动态 shape 校验失败; 完全未知 (-2,) 时 GetDims() 返回 size=1 而访问 inputShape[1] 越界崩溃; 部分未知 (-1,-1,-1,-1) 时 channelNum=-1 致 channel 一致性校验失败; 修复: size==1 跳过维度校验, channelNum==-1 跳过一致性校验","canndev#1804(open, SparseApplyAdagradV2): 屏蔽 infershape1.0 使用子仓 infershape2.0; UT 以 {-2}/{-1,-1} 组合构造, 期望输出 {{-2},{-2}}; 揭示 infershape 1.0 与 2.0 双套实现不一致的结构性诱因","ops-cv#926(open, Yuv444ToYuv422): InferShape 拒绝动态未知 shape/(-1,-1,-1) 输入, 而动态 shape 是该接口文档允许的合法形态","ops-nn#6842(open, SoftplusGrad): 动态 Rank 下广播推导失败, 未在推导前前置动态标签判断","ops-nn#6723(open, FusedBiasLeakyReluGrad): 动态广播维被错误拒绝"],"tocEvidence":"6 issue（1 仓）","signatures":["GetShapeSize\\(\\)|GetDimNum\\(\\)","GetDims\\(\\)\\s*\\[","inputShape\\s*\\[\\s*[1-9]","GetShapeRange\\(\\)","UNKNOWN_SHAPE|UNKNOWN_RANK","(GetDim\\w*|GetShape\\w*|GetStorageDim\\w*)\\s*\\([^)]*\\)\\s*(==|!=)\\s*-(1|2)\\b","infershape1\\.0|InferShape2"],"keywords":[],"absence":[{"must":"MakeUpRange","when":"GetShapeRange\\s*\\(","files":"infershape","level":"info","note":"MakeUpRange 是修复态特征(存在即防护), 不作存在型签名; infershape 文件含 GetShapeRange 调用而无 MakeUpRange 即候选(#1766); 文件级粗筛, 调用点与补全顺序仍需人工确认"}],"broad":["GetShapeSize\\(\\)|GetDimNum\\(\\)"],"logSig":[],"symptoms":["infershape/verifier 编译期报错","维度不为 N / 维数不为 N","动态编译能跑 GEIR 报错"],"detectors":["动态 shape 最小集 {-2}/{-1}","动静一致性对拍"],"related":["FP-B01","FP-B02","FP-B07","FP-A19","FP-F03","FP-E01"],"subtypes":[{"id":"B09-1","name":"哨兵当实数用（-2/-1 参与维度数/取值/一致性校验致判非法）","evidence":"canndev#1673/#1770/#1786; ops-cv#926; ops-nn#6842/#6723（v6.1 扩仓：ops-* 仓同机理实证）"},{"id":"B09-2","name":"GetDims() 返回短向量后按下标越界访存致崩溃","evidence":"canndev#1787"},{"id":"B09-3","name":"取 shape range 前未 MakeUpRange","evidence":"canndev#1766"},{"id":"B09-4","name":"infershape 1.0 与 2.0 双套实现不一致（屏蔽旧版规避）","evidence":"canndev#1804/#1673"}],"waiver":"","detect":{"axes":["shape","input-validity"],"oracle":["error-code"],"signal":"legal-accept","lines":["valid-fuzz","error-scenario"],"min_cases":4,"constructor":"每个算子必配动态 shape 最小集 {-2} / {-1} / {-1,-1,-1} / {-1,-1,-1,-1}，断言不报错（只比精度的用例走不到比较步）；另加动静一致性对拍。","judge":"动态 shape 全部可编译可执行，不报 infershape/verifier 错误；动静结果一致。","kill":"若 -2/-1 被当真实维度参与校验，则动态最小集在 infershape/verifier 阶段报维度不为 N 的错。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"典型表现"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（error-code），无静态形态判据","priority":18},"secondary":{"kind":"invariant","why":"动态 shape 哨兵值（-1/-2）被当实数用，返回码可能正常但 shape 推导错。","relations":[{"id":"B09-S1","name":"哨兵不外泄","statement":"含 -1/-2 的输入，其哨兵值不得出现在任何输出的 shape/dim 中。","kill":"GetDims 未判哨兵直接参与运算，会把 -1 带进输出 shape。","how":"构造含哨兵输入，检查所有输出 tensor 的 dim 是否含负值。"},{"id":"B09-X1","name":"静态/动态一致","statement":"同一 shape 以静态指定与动态 range 指定两种方式输入，最终输出 shape 必须一致。","kill":"GetShapeRange 前未 MakeUpRange，动态路径会退化。","how":"同 shape 两路输入，比对输出 shape。"}]},"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 高（S2×O3=6）｜ 状态 活跃 ｜ 来源 gitcode canndev 仓 issue 检索（2026-09-16）+ ops-cv/ops-nn 仓同机理实证（v6.1 扩仓）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 IR与图配置 ｜ 触发 UNKNOWN_RANK|UNKNOWN_SHAPE|GetShapeRange|GetDims ｜ 默认启用 true","mechanism":"GE 的动态 shape 用**哨兵值**表达未知程度——`-1` = `UNKNOWN_SHAPE`（维数已知、某维长度未知）、`-2` = `UNKNOWN_RANK`（连维数都未知）。**校验/推导代码（infershape、verifier、tiling 入口）把这些哨兵值当成普通维度值直接参与运算**，于是「正确的动态 input」被判为非法。三种独立成因：① **哨兵当实数用**——`-2`/`-1` 参与「维度必须为 N」「各维必须相等」「维度数必须为 N」等判断必然为假，**infershape 直接返回失败**；② **短向量按下标访存**——`GetDims()` 对 `{-2}`（UNKNOWN_RANK）返回 **size=1** 的向量，而代码按静态假设访问 `inputShape[1]`、`inputShape[2]`，**越界读致崩溃**；③ **取 shape range 前未 `MakeUpRange`**——`GetShapeRange()` 返回的是「补全后」的上下界，未先 `MakeUpRange` 即取值会拿到不完整/错误区间，后续校验基于错误前提。**共同的修复范式**：**校验前先判动态标签，命中则跳过维数/取值/一致性校验并让输出相应置 `-1`**（#1786、#1787 的修复方案即为此），而非在原有静态校验上打补丁。","conditions":"**任一动态 shape 输入**——① 输入 tensor 带 `-2`（UNKNOWN_RANK）或 `-1`（UNKNOWN_SHAPE）标签；② 该输入的校验/推导路径**未在入口前置动态标签判断**；③ 算子为**新上库**或**刚同步配置**（#1673「新增 AdaptiveAvgPool2dGrad，同步修改 cann 仓原有配置」即此类：新算子易照抄静态校验骨架）。**静态 shape 输入不触发**，故常规静态用例全绿也测不出；**动态编译能过而静态编译失败**（或反向）是典型旁证。","manifest":"**infershape / verifier 阶段直接报错、编译期中断**，而非运行期结果错——报错信息多形如「维度不为 1」「维数不为 2」「shape 不合法」，**与真实原因（输入本就是合法动态 shape）完全不符**，最易把排查引向输入数据；`{-2}` 场景下可能**崩溃**而非有序报错（越界读）；同一算子**动态编译通路能跑、GEIR 通路报错**（#1786）；**精度无从谈起**（根本没跑起来），与「跑起来但精度不对」的 FP-A 族有本质区别。**关键识别特征：错误发生在图编译/推导阶段，且报错指向的「非法输入」实际合法。**","mapping":"① 每个 shape 校验分支前**是否先判动态标签**——检查 `GetShapeSize()`/`GetDimNum()`/`GetDims()` 结果参与判断前，有没有 `IsUnknownShape()` / `IsUnknownRank()` / 直接比对 `-1`/`-2` 的前置门；② **`GetDims()` 返回值是否先查 size 再按下标访存**——`GetDims()[i]`、`inputShape[i]` 等下标访问是否先校验 `size > i`（`{-2}` 只返回 size=1，`[1]` 即越界，这是**崩溃**而非报错的直接成因）；③ **`GetShapeRange()` 调用前是否 `MakeUpRange`**——取连续区间/对齐推导是否基于补全后的 range（#1766 明确点名此缺陷，并给出「参考 YUV4442YUV422」的可对照实现）；④ **输出 shape 是否随之置 `-1`**——动态分支下输出若仍按静态推导会给下游埋错（#1786 修复要求「输出 shape 相应设为 -1」）；⑤ **新上库算子的校验骨架是否为静态版复制**——新增算子/新增配置项的 review 需专门确认动态分支；⑥ **infershape 1.0 与 2.0 双套实现的一致性**——是否存在「1.0 有缺陷而 2.0 正常」或反之（#1804 直接**屏蔽 infershape1.0 改用子仓 infershape2.0** 规避，#1673 亦点名 「infershape1.0」），两套需**同输入同断言**对照。","signatures_text":"`GetShapeSize\\(\\)|GetDimNum\\(\\)` 与 `-1|-2|UNKNOWN_SHAPE|UNKNOWN_RANK` 比较前无 `IsUnknown` 前置判断；`GetDims\\(\\)\\s*\\[` （`GetDims()` 结果直接下标访问，高危）；`inputShape\\s*\\[\\s*[1-9]`（假定维数 ≥2 的硬下标）；`(GetDim\\w*|GetShape\\w*|GetStorageDim\\w*)\\s*\\([^)]*\\)\\s*(==|!=)\\s*-(1|2)\\b`（维度语境哨兵值直连比较——`GetDims()`/`GetShapeSize()` 等维度查询接口返回值直接与 `-1`/`-2` 比较，需人判是动态标签前置门还是哨兵当实数误用）；`GetShapeRange\\(\\)` 调用点前 200 行内无 `MakeUpRange`（`MakeUpRange` 为修复态特征、不作存在型签名，索引侧以缺失型规则 absence 承载：infershape 文件含 `GetShapeRange` 调用而无 `MakeUpRange` 即候选，文件级粗筛）；同一算子目录内 `_infershape_2\\.0|InferShape2|infershape1\\.0` 双实现并存。","intercept":"① **每个算子必配动态 shape 最小集**——`{-2}`（UNKNOWN_RANK）、`{-1}`、`{-1,-1,-1}`、`{-1,-1,-1,-1}` 四组，**断言不报错而非只断言精度**（此类缺陷是「跑不起来」，只比精度的用例根本走不到比较步）；② **动态用例进泛化矩阵与门禁**——新算子/新配置项合入时，动态用例与静态用例**同等必过**，不可标记为可选；③ **动静一致性对拍**——同语义输入分别走静态编译与动态编译，**两者都应成功且结果一致**（#1786 即「期望与动态编译一致」的思路）；④ 对 `GetDims()` 下标访问写法加**静态门禁**（要求前置 size 校验）；⑤ **专项覆盖「新上库算子」**——按 #1673 的模式，新增算子因照抄静态骨架而高发，review checklist 需含动态分支项。","evidence_text":"canndev 仓 6 条**同机理独立实证**（3 条 closed / 3 条 open，2026-05-30 ~ 2026-08-10，覆盖 6 个不同算子）：**#1673**（closed，AdaptiveAvgPool2dGrad）「当输入的动态 shape 为 `-2` 时，**infershape1.0 会把 `-2` 当成真实的维度值参与校验导致报错**」，复现「复跑带动态标签为 `-2` 的用例即可」，环境 Ascend950 / CANN9.1.0，期望「无校验报错，且精度为 100%」——**形态① 哨兵当实数用的教科书案例**；**#1770**（open，SparseSegmentSumGrad）「动态 shape 下第二、三个输入如果为 `-2` 会**判断维度不为 1，从而导致 infershape 失败**」——形态①，且体现「维度必须为 1」这类硬校验的高发；**#1766**（closed，RGB2YUV422）「inferShape 对 UnknownRank 情况没有考虑，同时 **`GetShapeRange` 前没有 `MakeUpRange`**，应该参考 YUV4442YUV422」，复现「跑 `(-2)` 和 `(-1,-1,-1)` 场景必现」，环境 Ascend950 / CANN9.1.0——**形态③ 的唯一实证，且附可对照的正确实现（YUV4442YUV422）**；**#1786**（open，ProdVirialSeA）「ProdVirialSeA 的 GEIR 通路在运行动态 shape 用例（`-2` UNKNOWN_RANK / `-1` UNKNOWN_SHAPE）时报错。`ProdVirialSeAVerify` 和 `ProdVirialSeAInferShape` **硬校验输入维度必须为 2**，动态 shape 下 `GetDims()` 返回 `{-2}` 或 `{-1}`，**size 不为 2，直接报错**」，并给出修复范式「**对每个输入的 shape 校验前先判断是否为动态 shape（UNKNOWN_RANK / UNKNOWN_SHAPE）**：动态 shape 时跳过维度和值校验，nframes 设为 -1，输出 shape 相应设为 -1；静态 shape 时保持原有校验逻辑不变」——**形态① 的完整闭环，含官方修复范式**；**#1787**（open，Yolo）「修复 Yolo 算子的 `YoloVerify` 函数在动态 shape 场景下校验失败的问题：**完全未知动态 shape `(-2,)`：`GetDims()` 返回 size=1，`inputShape[1]` 越界导致崩溃**；部分未知动态 shape `(-1,-1,-1,-1)`：channelNum=-1，channel 一致性校验失败」，修复「size==1 时跳过维度校验，channelNum 设为 -1；channelNum==-1 时跳过 channel 一致性校验」——**形态② 越界崩溃的唯一实证，同时是形态① 的叠加**；**#1804**（open，SparseApplyAdagradV2）「**屏蔽 infershape1.0，使用子仓的 infershape2.0**」，UT 参数明确以 `{-2}` / `{-1,-1}` 组合构造（`var({-2},{-2})` / `accum({-1,-1},{-1,-1})` / `lr({-2},{-2})`），期望输出 `{{-2},{-2}}`——**揭示「infershape 1.0 与 2.0 双套实现」这一结构性诱因，其\"屏蔽旧版\"的做法本身即是回避缺陷的旁证**。 **v6.1 扩仓补充（ops-* 三仓同机理独立实证，本条是 `applicability.repos` 由 `canndev` 放宽为 `All` 的直接依据）**：**ops-cv#926**（open，Yuv444ToYuv422）「InferShape 拒绝动态未知 shape / `(-1,-1,-1)` 输入」——动态 shape 恰是该接口文档允许的合法形态，属形态①哨兵当实数用；**ops-nn#6842**（open，SoftplusGrad）「动态 Rank 下广播推导失败」，未在推导前前置动态标签判断，属形态①；**ops-nn#6723**（open，FusedBiasLeakyReluGrad）「动态广播维被错误拒绝」，属形态①。三条**均不在 canndev 仓**，说明该机理是**框架级共性**（infershape 校验骨架被各算子各自照抄），故本条不再是单仓专属。","related_text":"[FP-B01](FP-B01.md)（**最易混淆项**：B01 是「校验过严误拦截**合法静态输入**」，本条是「校验未识别**动态标签**」——二者同属\"校验面与输入面不一致\"，但 B01 的输入是合法的静态值、本条是合法的动态哨兵值，**排查时须先确认输入到底是不是动态**）、[FP-B02](FP-B02.md)（tiling 未适配芯片核数——同属\"编译期前置校验/适配考虑不全\"，本条是**维数未知**未适配、B02 是**核数档位**未适配）、[FP-B07](FP-B07.md)（索引/偏移计算错误致越界——本条形态② 也是越界，但**根因是动态 shape 下维度数不确定**而非偏移算错，且发生时点在 host 校验期而非 kernel 期）、[FP-A19](../FP-A/FP-A19.md)（同算子多路径覆盖盲区——**本条的高发诱因与之同源**：动静双通路只测静态即得盲区，A19 是 tiling 多路径只测其一）、[FP-F03](../FP-F/FP-F03.md)（文档/声明面与实现面不一致——算子若声明支持动态 shape 而校验不接受，即两型的复合）、[FP-E01](../FP-E/FP-E01.md)（golden/UT 期望值失配——本条需靠「断言不报错」拦截，只比精度的 UT 天然漏检此类）。"},"caseCount":5},{"id":"FP-B10","name":"集合通信算子功能/兼容问题（通信域/拓扑/图模式契约/同族实现不对称）","file":"patterns/FP-B/FP-B10.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"Hccl|HCCL|AllReduce|AllGather|AllToAll|ReduceScatter","triggerZh":"签名","repos":["hccl"],"sides":["Host","Kernel"],"carriers":["Host源码","Kernel源码"],"enabled":true,"evidence":["cann/hccl#744(open, AllToAllV Mesh1D 模板把 subCommRanks_ 收缩为单层后仍按下标 [1] 取值, 越界读污染 templateRankSize_, 后续取模可能整数除零; 基线 27d0ea5a)","cann/hccl#749(open, HcomReduceScatterVInferShapeV2 在 recv_count/send_counts 非常量时将输入形状原样赋给输出并返回成功, 日志声称 shape first dim is unknown 但从未调用 outputShape->SetDim(0, ge::UNKNOWN_DIM))","cann/hccl#738(open, tuner_plugin/plugin.cpp::ParseMatchField 用 get<uint32_t/size_t/uint64_t>() 不拒窄
