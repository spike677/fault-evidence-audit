ses":4,"constructor":"非法输入六轴矩阵：rank × ListInt 长度 × 维度符号 × 属性量级 × 有限性 × dtype 组合；空数组/空 ListInt 单独建例；每算子补一组「InferShape 与 tiling 结论必须一致」的双阶段断言。","judge":"第一段接口即返回 161002（ACLNN_ERR_PARAM_INVALID），而非落到 561002；两阶段接受集合完全相同。","kill":"若契约校验缺失/写反/校验对象选错，则非法 shape 返回 0 或被接受，或落到内部错误 561002。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":3,"level":"D3","why":"仅动态 oracle（error-code），无静态形态判据","priority":27},"secondary":{"kind":"invariant","why":"参数契约校验缺失：非法输入被放行，返回码可能成功直到下游才炸。","relations":[{"id":"B11-S1","name":"非法输入必须被拒","statement":"rank 不匹配、长度不等、值域越界的输入，必须在第一段返回参数错误，不得进入执行。","kill":"缺少契约校验时非法输入会被放行，错误延迟到下板阶段。","how":"逐类构造非法输入，断言返回参数错误族错误码。"},{"id":"B11-S2","name":"前后段一致性","statement":"第一段（GetWorkspaceSize）与 InferShape 对同一输入的可接受性判断必须一致。","kill":"两段各写一套校验，会出现一段过一段不过。","how":"同一输入分别走两段，比对判决。"}]},"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 ops-cv 全量 issue 语料（2026-10-17，1 250 条中 232 条 bug-report，本簇 **52 条**，受理 32 条）+ ops-math#2820 前后段不对称实证（v6.1）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码,Tiling源码 ｜ 触发 InferShape|CheckShape|GetDimNum|IsFinite|GetAttrPointer ｜ 默认启用 true","mechanism":"第一段接口（`aclnnXxxGetWorkspaceSize`）与图模式 `InferShape` 的校验只覆盖\"**形状之间的一致性**\"（如 `grid[4]==3`、`inputC==gradOutputC`），不覆盖\"**单个参数自身的合法性**\"——rank 是否为契约值、`ListInt` 长度是否足/是否超、维度是否为正、属性是否落在 int32 可表达范围、`scale`/`sigma` 是否有限、dtype 组合是否被支持。五种子形态：① **未校验**（25/52）——完全没有对应检查；② **放行**（24/52）——有检查但条件写反或范围写宽（如只判 `< 0` 不判 `== 0`）；③ **校验对象选错**（3/52）——检查函数读了错误的张量（`CheckUplimit` 五个维度全取自 `gradOut`，`inputSize`/`gradInput` 从未参与）。**④ 前后段不对称**（v6.1 显式化）：同一契约在 op_api、InferShape、tiling 三处各写一遍且**不同步**，出现\"InferShape 放行、tiling 拒绝\"或反之。**⑥ 标量属性值域未校验**（v6.27）：前三类子型全部落在**张量**上——shape/rank/dtype/连续化。但 `aclnn` 签名里还有一类形参是**值传递标量**（`double eps` / `float scale` / `int64_t dim` / `bool keepdim`），它们同样来自调用方，同样能造出非法输入（`eps < 0` → 输出整块 NaN、`dim` 越界、`scale` 为 NaN），却常常**连一次比较都没有**。2026-11-06 实测 `aclnnLayerNorm` 的 `CheckParamsWithImplMode`只查 dtype / shape / meanOut/rstdOut 的 shape，**完全不看 `eps` 的值域**，`eps=-1` 一路进 kernel 后输出 100% NaN。同批扫描（`ops-nn` 408 个 `aclnn_*.cpp` / 480 个接口 / 501 个标量形参）：**336 个（67.1%）标量形参在所在文件里找不到任何比较**，其中 `eps`/`epsilon` 类 **31 个**。该子型的判据特征是**只看张量不看标量**——`CheckShape` / `CheckInputDtype` 写了一长串，但没有一行 `eps >= 0`。**⑤ 参数有限性未校验**（v6.13）：用 `<= std::numeric_limits<float>::min()`（即 `FLT_MIN`）代替 `> 0` 判正值——最小正正规数被误拒，而 **NaN / ±Inf 与任何值比较恒假**，直接绕过校验进入 kernel；或用 `if (scale > 0)` 分支承载合法性判断，非有限值落入\"未提供\"回退路径被静默接受。该子型的判据特征是**比较表达式对 NaN 恒为 false**，只做范围上下界检查而不调用 `isfinite` 即命中。 **⑦ 错误码族选错（v6.33）**：校验确实命中并返回了非 0，但把「参数非法」映射成**内部错误码**（`ACLNN_ERR_INNER_NULLPTR` / `561103`、`561002`、`361001`），而资料错误码表要求 `161001`/`161002`；调用方按返回码分类时会把参数错误当内部故障。判据：同一接口的其它非法分支返回正确族、唯独该分支返回内部码。 **⑧ 校验顺序倒置（v6.33）**：`GetOptionalInputShape()` / `->` 解引用排在能排除该状态的校验之前，执行到解引用时守卫尚未运行。 **⑨ 平台分支复用超集白名单（v6.41）**：按 `IsRegbase()` / SoC 分支裁剪校验时，非 RegBase 分支（A2/A3/310P）直接复用了 RegBase（950）的 dtype 白名单，而资料在 `npu=\"...\"` 分段里把该产品的支持集收得更窄；结果是「白名单包含、该 SoC 实际不支持」的 dtype 在第一段被放行，掉到执行段才以 561000/561002 失败。判据：同一 dtype 在资料的分产品段里写着「仅支持 X」，而代码白名单是跨产品并集且分支内无 SoC 判断。 **⑩ API dtype 白名单超出算子原型/kernel 注册面（v6.44）**：`op_api/aclnn_*.cpp` 的首段校验白名单包含某 dtype（如 `DT_DOUBLE`），但 `op_host/*_def.cpp` 的 `DataType` 列表与 `AICore().AddConfig` 从未注册该 dtype / 该 SoC，于是非法组合在第一段被放行、执行段掉进 `AiCpu` 回退并以设备异常（实测 `507018` `ACL_ERROR_RT_AICPU_EXCEPTION`）失败。与 ⑨ 的分界：⑨ 是**平台分支之间**复用超集，⑩ 是 **API 层白名单与算子原型注册面**之间不一致；判据是「API 支持列表 − def.cpp 注册集」非空且资料把该 dtype 写成支持。**⑩ 的前置排除（v6.47）**：判本子型前必须先排除 **AICPU 回退**——若 `op_api/<op>.cpp` 中存在该 dtype 的 `*AiCpu` 分支（如 `AddcdivAiCpu`），且交付包 `opp/built-in/op_impl/host_aicpu/libcpu_kernels.so` 中已注册该算子名，则 `def.cpp` 只注册 AICore 配置属**正常结构**（AICPU 内核另包交付），不构成缺陷。2026-11-07 实测：ops-math#4612/#4613/#4614/#4615 与 ops-nn#8384 五单均因漏做该排除而误判，已全部撤回（详见「实证案例」v6.47）。","conditions":"rank 与契约不符（rank-0 当 rank-1、ND 当 4-D）；`ListInt` 属性长度不足（如只传 1 个 `scales`）或超长（`output_size` 传 3 个）；维度 ≤ 0（零 batch、负 `pooled_h`）；属性超 int32（大 `stride`/`rate`/`pad`）；`scale`/`sigma` 为 NaN/Inf；dtype 组合不在支持矩阵内（`img` 与 `lut_table` 不一致）；可选输入与主输入的 batch/空间尺寸交叉不匹配；资料 `npu=\"...\"` 分段把某产品的 dtype 支持集收窄，而代码白名单是跨产品并集（B11-9）；API dtype 白名单含某 dtype，而 `op_host/*_def.cpp` 的 `DataType` 未注册该 dtype 或 `AddConfig` 未覆盖该 SoC（B11-10）。","manifest":"**第一段接口返回 `ACLNN_SUCCESS`，到 tiling 才以 561002（`ACLNN_ERR_INNER_TILING_ERROR`）失败**，真实原因（参数非法）被内部错误码掩盖；或非法 shape 被发布给下游（`ResizeNearestNeighborV2` 接受零输出尺寸并生成非法 shape）；或 tiling 越界读取属性数组（`output_size` 长度不足时读两元素/读短 `input_size`）；或直接 coredump（`aclnnUpsampleNearest3d` 空 `outputSize` 数组）。对照组特征：同一输入在 PyTorch 侧报 `RuntimeError`，而在 NPU 侧\"通过第一段、挂在第二段\"。","mapping":"`op_api/aclnn_*.cpp` 的 `CheckShape`/`CheckParams` 是否在\"一致性校验\"之外包含 **rank / 长度 / 值域 / 有限性** 四类检查；**且这四类必须对「值传递标量形参」也做一遍**（B11-6）——签名里的 `double eps` / `float scale` / `int64_t dim` 不是张量，不会被 `CheckShape` 覆盖；逐个标量形参在**整个文件**内检索 `<name> <值>` 形态的比较，零命中即候选（注意：只搜 `CheckParams` 函数体会漏掉委托给 helper 的写法，实测 `aclnnAddRmsNorm` 的 `epsilon >= 0.0` 在 `:198` 而 `CheckParams` 早已返回）；`op_host/*_infershape.cpp` 与 `op_host/**/*_tiling.cpp` 对同一输入的接受集合是否**完全相同**（不一致本身即缺陷）；检查函数实参是否与形参语义对应（`CheckUplimit` 类误用）；`GetOriginFormat` 与 `GetFormat` 是否在 format 校验中混用（图优化后 format 变化导致误判）；`docs/aclnn*.md` 的\"约束说明\"逐条与代码校验点比对，文档写了但代码没做即命中。","signatures_text":"静态扫描「aclnn 接口 × `CheckShape` 内是否出现 `rank`/`GetDimNum`/`size()`/`IsFinite`/`INT32_MAX` 关键词」——只有一致性比较而无上述任一者 ⇒ **契约校验缺失（HIGH）**；跨文件比对 `infershape.cpp` 与 `tiling.cpp` 的校验集合，出现「A 放行 / B 拒绝」⇒ **前后段不一致（PARTIAL）**；扫描 `static_cast<int32_t>(attr)` 前是否判范围 ⇒ 同时进 FP-B13。 **B11-6 签名（v6.27）**：`grep -nE \"^\\s*aclnnStatus\\s+aclnn\\w+GetWorkspaceSize\\s*\\(\" ` 抽出签名 → 取其中 `(double|float|int64_t|int32_t|bool)\\s+\\w+` 的形参名 → 逐名 `grep -nE \"\\b<name>\\s*[<>]=?\" <该 cpp>`，**零命中即候选**。实测基线（`ops-nn` @ `b27fda2`，408 文件 / 480 接口 / 501 标量形参）：无比较 **336（67.1%）**，`eps|epsilon` 类 **31 个**；对照组 `aclnnAddRmsNorm` 有 `epsilon >= 0.0`（`:198`），说明\"该有的地方确实有人写\"——这就不只是风格问题。 **B11-9 签名（v6.41）**：`grep -nE \"IsRegbase|GetSocVersion|SOC_VERSION\" op_api/aclnn_*.cpp` 定位平台分支 → 对每个分支提取实际传给 `OP_CHECK_DTYPE_NOT_SUPPORT` / `OP_CHECK_DTYPE_NOT_MATCH` 的列表常量 → 与 `docs/aclnn*.md` 中 `<!-- npu=\"...\" -->` 分段的「仅支持」项求差集，非空即候选；真机判据是「同 dtype 组合在第一段返回 0、第二段返回 561000/561002」。 **B11-10 签名（v6.44）**：对每个算子抽三份集合——`op_api/aclnn_*.cpp` 的 `*_DTYPE_SUPPORT_LIST*`、`op_host/*_def.cpp` 的 `DataType({...})` 并集、`AICore().AddConfig(\"...\")` 的 SoC 列表——再与资料 dtype 列求差集；「API 集合 − def 集合」非空且资料把该 dtype 写成支持 ⇒ 候选。真机判据是「该 dtype 两段返回 0、`aclrtSynchronizeStream` 返回 507018」。反向核对：若资料同样把该 dtype 写成不支持，则转 B11-9 或文档类，不按本子型提。","intercept":"非法输入矩阵按「rank × ListInt 长度 × 维度符号 × 属性量级 × 有限性 × dtype 组合」六轴建例，每例期望值为**第一段接口即返回 161002（`ACLNN_ERR_PARAM_INVALID`）**而非落到 561002；对每个算子补一组「InferShape 与 tiling 结论必须一致」的双阶段断言；空数组/空 ListInt 单独建例（曾致 coredump）；把\"文档约束说明 → 代码校验点\"的映射做成评审清单。 **B11-6 加测（v6.27）**：对每个含标量形参的接口建**标量三元组**用例——`合法值 / 越界值 / 边界值`（`eps`：`0.5 / -1 / 0`；`dim`：`0 / rank / -rank-1`；`scale`：`1.0 / NaN / 0`），断言越界必须返回 161002。**这类用例成本极低**（不需要构造大 shape、不占设备预算），却正是此前完全空着的一格——`eps=-1` 的用例在 480 个接口里一个都没有。 **B11-9 加测（v6.41）**：按资料分产品段的「仅支持」清单，逐 dtype 造「**所有相关张量同为该 dtype**」的用例（不是只造张量间不一致），断言第一段返回 161002；同时保留一组「不一致组合」作正对照，证明平台分支可达、校验函数确实被调用。 **B11-10 加测（v6.44）**：对「API 白名单 − def 注册集」非空的每个 dtype 造一组「全张量同 dtype」用例（含 out 与 value），断言两段与 `aclrtSynchronizeStream` 全 0；同时保留同 shape 的 fp16/bf16 对照，证明 shape 与调用链本身可用。若实测首段 0、同步 507018，即命中本子型。**B11-10 的两步排除（v6.47，缺一不可）**：① **跨卡复测**——同一二进制换卡重跑，任一健康卡返回 0/0/0 即判环境、不判缺陷（2026-11-07 实测 8 卡中 dev2/dev3 复现 507018、其余 6 卡正常）；② **抓日志**——`ASCEND_GLOBAL_LOG_LEVEL=1 ASCEND_SLOG_PRINT_TO_STDOUT=1` 重跑，日志出现 `soName=libcpu_kernels.so, funcName=RunCpuKernel, msg:open so failed` 即判环境（装载容器 so 失败与算子实现无关）；只有「全卡复现 + 日志显示 so 已装载、失败发生在 kernel 内部」才计命中。","evidence_text":"ops-cv 全量 issue 中 **52 条**同簇（20 已拒绝 / 20 进行中 / 12 已完成），代表：**#1017** `aclnnUpsampleNearestExact3dBackward` 上限检查误用 `gradOut`（`image/upsample_nearest_exact3d_grad/op_host/op_api/aclnn_upsample_nearest_exact3d_backward.cpp:139-168`，五个维度全取自 `gradOut`，放过 `inputSize`/`gradInput` 超 `INT32_MAX`）；**#1020** `ResizeLinear` InferShape 放行零 batch 而 arch35 tiling 拒绝（`image/resize_linear/op_host/resize_linear_infershape.cpp`）；**#1004** `UpsampleNearest3d` tiling 未校验 `output_size` 长度并越界读（`op_host/upsample_nearest3d_tiling.cpp`）；**#939** `UpsampleNearest` 同类（`:138-139`）；**#951** `aclnnRoiAlignV2` `spatialScale` 校验边界写错并接受非有限值（`objdetect/roi_align/op_host/op_api/aclnn_roi_align_v2.cpp`）。20 条\"已拒绝\"说明该契约边界尚未固化，属流程层缺口。 **v6.1 补（子型 ④ 前后段不对称的干净实证）**：**ops-math#2820**（open，DynamicPartition）——`InferShapeRange` 只读取 `num_partitions` 而不校验取值范围，`num_partitions=0` 返回 `GRAPH_SUCCESS` 并生成输出 shape range；而同算子 **Arch35 Tiling 已对同一属性返回失败**，issue 正文明确写「导致不同 Host 阶段的输入校验不一致」。该条把「一致性校验与自身合法性校验的边界」暴露得更清楚：**同一个契约项在两条 Host 通路上各判一次，结论必须相同，不同即命中本型**。 **v6.13 补（子型 ⑤ 有限性，均为 closed）**：**ops-cv#951**（closed，PR !1751 已合入，维护者明确\"确认的代码 bug\"）`aclnnRoiAlignV2` 的 `spatialScale` 校验写成 `<= std::numeric_limits<float>::min()`——`FLT_MIN` 被错误拒绝，`NaN`/`+Inf` 因比较恒假绕过并进入 kernel；**ops-cv#1101**（closed，\"修改内容已经合入\"）`UpsampleNearest1dBackward` 接受 `NaN` scale 并继续下发。**v6.27 补（子型 ⑥，标量值域）**：**ops-nn #8304**（2026-11-06）`aclnnLayerNorm` 接受 `eps < 0` → 输出整块 NaN；实证路径 `norm/layer_norm_v4/op_host/op_api/aclnn_layer_norm.cpp:308` 的 `CheckParamsWithImplMode` 只查 `CheckInputDtype` / `CheckOutputDtype` / `CheckShape` / `CheckMeanRstdOutputShape`（`:313-325`），**整个函数体没有一处涉及 `eps`**。同批扫描产出 **31 个 `eps|epsilon` 无比较**的接口（含 `AdaLayerNorm` / `AddLayerNormQuant` / `Logit` 等），可直接作为下一轮真机差分清单（每组三腿：合法 / 负值 / 0）。**反向排除（必读）**：#949/#953/#1092 三条同族报告被维护者复核为**不构成缺陷**（L2 入口已有 `isfinite`、非有限值回退等价于未提供 scale、前端保证图属性合法），已关闭且不作为本条证据——因此判本子型前必须先把「文档是否把有限性写成强制约束」与「回退路径是否等价于合法默认」两件事证伪，否则属误报。 **辅助输入切片未连续化（v2.19 增补，现网 26-04）**：ops-nn **#1516** `aclnnQuantMatmul` 把「rank==1 即连续」当豁免，`scale`/`offset`/`per-token scale` 以切片非连续 view 传入时跳过连续化，下游按 origin shape 读取致 n 不匹配（issue 给出 origin shape=64、切片后需 16 个的报错现场）。修复后 `aclnn_quant_matmul_v5.cpp:1003-1019` 对每个辅助输入逐个 `TensorContiguousProcess`，且区分 `MxScaleContiguousProcess` 微缩放分支。 **2026-11 批次（v6.33 反哺）**：本簇 135 条；代表 ops-math#4300（空指针 561103→161001）、ops-nn#7400（RmsNormQuant 前导维不一致 561103→161002）、ops-transformer#6714（MhcPost hRes 空指针 361001→161001）、ops-math#3881（out dtype 未校验）、ops-nn#7679（lambd dtype 未校验）。 **v6.34 补（B11-7 新实证）**：ops-transformer#7227（2026-11-07）`aclnnScatterPaKvCache` 的 `key=nullptr` 返回 561103，而资料要求 161001；根因是入口 `CHECK_RET(CheckNullptr(...) == ACLNN_SUCCESS, ACLNN_ERR_INNER_NULLPTR)` 覆盖了 `CheckNullptr` 内部的 161001。同族 `aclnn_gather_pa_kv_cache.cpp:461-463` 与 `aclnn_scatter_pa_kv_cache_with_k_scale.cpp:332-336` 均正确返回/透传 161001，属单点遗漏。 **v6.35 补（B11-7 再实证 + 横向扫描）**：ops-transformer#7228（2026-11-07）`aclnnNsaCompressWithCache` 的 `input=nullptr`/`weight=nullptr` 返回 561103，资料要求 161001；根因同为入口 `CHECK_RET(CheckNsaCompressWithCacheParam(...) == ACLNN_SUCCESS, ACLNN_ERR_INNER_NULLPTR)`（`aclnn_nsa_compress_with_cache.cpp:161-163`）覆盖了校验函数内部 `:56-61` 的 161001。同仓 `aclnn_flash_attention_score.cpp:1226-1228`、`aclnn_block_attn_res_prepare.cpp:274-276` 的同类包装均用 `ACLNN_ERR_PARAM_NULLPTR`，可作正向对照。对 `ops-transformer` 全仓做「校验函数名含 null/param 且被 `ACLNN_ERR_INNER_*` 包装」的正则扫描，共命中 3 处（含 #7227 的 Scatter 与 #7228 的 NsaCompressWithCache，另一处为 `nsa_selected_attention_infer.cpp:315-317`）；第 3 处经核对**不是缺陷**——该接口资料错误码表明确把空指针映射为 561103（`ACLNN_ERR_INNER_NULLPTR`），实测一致。这正是本型必须做的**反向核对**：同一代码形态不等于同一缺陷，判据是「该接口资料声明的应得码」，不是「兄弟接口怎么写」。该扫描可作为 B11-7 的**批量定位手法**：先按「外层错误码覆盖内层」筛点，再逐点核对**该接口自己的错误码表**，最后用同仓正确包装做单点对照。 **v6.36 补（B11-6 标量属性值域的新实证）**：ops-transformer#7231（2026-11-07）`aclnnNsaCompressWithCache` 的 `pageBlockSize` 传 0/256 时两段均返回 0，而资料参数说明写「只能是64或者128」、错误码表写 561002「page_block_size取值不是64或者128」；`nsa_compress_with_cache_tiling_general.cpp:118` 只读取赋值，`AnalyzeAttrs()` 里只校验 `compressBlockSize % 16`、`compressStride % 16`、`compressBlockSize < compressStride`、`actSeqLenType != 1`，全目录检索 `pageBlockSize ==/!=` 零命中，而同函数 `:207` 已有 `compressBlockSize > 64` 的值域检查 ⇒ 单点遗漏。**这条把 B11-6 的覆盖对象从「标量形参」扩到「int64_t 属性（attr）」**：`op_host/*_def.cpp` 的 `Attr(\"...\").Int()` 同样承载值域约束，且 host 侧拿得到，属于可拦未拦；扫法为「逐个 attr 名在 op_host 全目录检索比较表达式，零命中即候选」，再用资料错误码表定应得码。 **v6.41 补（B11-9 平台分支白名单）**：ops-nn#8379（2026-11-07）`aclnnAddRmsNormQuant` 在 Atlas A2（910B2）上传 `x1/x2/gamma/xOut=FLOAT32`，第一段返回 0、第二段返回 561000（`ACLNN_ERR_INNER`）；资料 `npu=\"A3,910b\"` 段写这四个张量「仅支持FLOAT16、BFLOAT16」，错误码表 161002 覆盖「数据类型不在支持范围」。根因：`norm/add_rms_norm_quant/op_host/op_api/aclnn_add_rms_norm_quant.cpp:48-49` 的 `REGBASE_DTYPE_SUPPORT_LIST_X_SCALE` 含 `DT_FLOAT`，`:146-151` 的非 RegBase 分支补了 `OP_CHECK_DTYPE_NOT_SAME(x1,x2/gamma/xOut)` 后直接 `return true`，没有按 SoC 收窄白名单，于是「四个张量同为 fp32」这种 dtype 一致但产品不支持的组合被放行。同文件正对照：`x2` 与 `x1` 不一致已返回 161002，说明缺的只是「同 dtype 但该 SoC 不支持」这一格；master `d1efef7c` 自编包上双侧复现（stock 9.2.0 同样 0/561000）。 **v6.42 补（B11-7 与子型 ① 放行的新实证）**：ops-nn#8380（2026-11-07）`aclnnDequantSituQuant` 在 A2 上，`x` 为 INT8 时 `weightScaleOptional=nullptr`、或 `quantTypeOptional=static` 时 `quantScaleOptional=nullptr`，第一段均返回 561002（`ACLNN_ERR_INNER_TILING_ERROR`），资料错误码表两条子项明确要求 161001；同接口 `x`/`yOut`/`yScaleOut` 空指针子项已正确返回 161001，属**条件必选输入**漏判。ops-nn#8381：同一接口 `x=int8[0,64]`、`yOut=int8[0,32]`、`yScaleOut=fp32[0]` 时两段均返回 0（资料参数表写「不支持空Tensor」、错误码表写空 tensor → 161002），而仅 `x` 为空、`yOut` 非空时改为 561002——同一种「空输入非法」在两种形态下给出 0 与 561002 两个不同结果。两条均在 master `d1efef7c` 自编包与 stock 9.2.0 上一致复现，G1 分别用 `--kind errcode`（对照 0/0、缺陷 561002）与 `--kind errcode-missing`（两组全 0）通过。 **v6.43 补（B11-7 的 shape 约束版本）**：ops-nn#8382（2026-11-07）`aclnnDequantSwigluQuant` 在 A2 上，四种违反 `npu=\"A3,910b\"` 约束的入参——`x=fp16[2,33]`（尾轴奇数）、`x=fp16[32]`（1 维）、static 下 `quantScale/quantOffset=[2]`、dynamic 下 `quantScale=[8]`（x 尾轴 32 应为 16）——第一段全部返回 561002，而资料错误码表把「参数维度不在支持范围」「shape 不满足约束」列为 161002（561002 只对应「输入张量内存大小超过上限」）。**判读补充**：error-scenario 把该类子项映射成 rank 变异（2 维→3 维）时该变异本身合法，会落 `ACCEPTED_UNREVIEWED`；必须按资料的逐条 shape 约束手工构造（尾轴奇偶、rank、mode 相关的 scale 长度）才能命中，且要用「合法基线 0/0」作正对照。 **v6.44 补（B11-10 API 白名单超出算子原型注册面）**：ops-math#4612（2026-11-07）`aclnnAddcdiv` 在 Atlas A2（910B2）上传 `self/tensor1/tensor2/value/out` 全 DOUBLE，资料 dtype 列（`docs/aclnnAddcdiv&aclnnInplaceAddcdiv.md` L115/L130/L145/L155/L170）列出 `DOUBLE`，`op_api/aclnn_addcdiv.cpp:42-43` 的 `DTYPE_SUPPORT_LIST_910B` 也含 `DT_DOUBLE`，首段返回 0；但 `op_api/addcdiv.cpp:36-37` 的 `AICORE_DTYPE_SUPPORT_LIST_910B` 只有 FLOAT/FLOAT16/BF16（DOUBLE 走 `:97` 的 `AddcdivAiCpu`），且 `op_host/addcdiv_def.cpp` 的 `DataType` 只注册 FLOAT16/BF16/FLOAT、`AddConfig` 只有 ascend950/960dt/960pr/350，A2 无 double kernel；实测 `aclrtSynchronizeStream` 返回 507018（`ACL_ERROR_RT_AICPU_EXCEPTION`）。同模式在 ops-math#4613（`aclnnAddcmul`，`aclnn_addcmul.cpp:44-46` 含 DOUBLE，`addcmul_def.cpp:24-48` 只注册 FLOAT16/BF16/FLOAT/INT32）复现，两单的对照组 bf16 均 0/0/0。**判读要点**：这类缺陷不是「资料少写」也不是「多分支白名单」，而是 **API 首段与算子原型/kernel 注册面两张清单从未对齐**；修复方向必须二选一（删资料+首段拒绝 161002，或补 def/kernel），只改其中一张清单会留下另一半不一致。 **v6.45 扩样**：同模式在 ops-math#4614（`aclnnDiv`）与 #4615（`aclnnGer`）上复现——Div 的 `op_api/aclnn_div.cpp:115-124` 两份 SoC 白名单都含 `DT_DOUBLE`、`div_def.cpp` 只注册 BF16/F16/F32/INT32/UINT8/INT8/COMPLEX32/COMPLEX64；Ger 的 `aclnn_ger.cpp:43-46` 非 RegBase 白名单含 `DT_DOUBLE`、`ger_def.cpp:24-34` 只注册 BF16/F16/F32；两算子 `AddConfig` 均无 910B，实测 fp32/bf16 对照 0/0/0、double `0/507018`。**扩样结论**：该子型在 ops-math 的二元 promote 类算子上成簇出现，扫法应作为新算子准入检查的一项（API 白名单与 def 注册集必须逐 dtype 求差集为空）；对照组选择须服从资料的产品级例外（如 Ger 在 A2 不支持 BF16，对照要用 fp32），否则会拿到 161002 的假基线。 **v6.46 跨仓扩样**：同一扫法在 ops-cv 命中 0 个、ops-nn 命中 2 个「有 PromoteType + 无 promote 白名单复核」候选；其中 `activation/leaky_relu_grad` 可验收——资料 `aclnnLeakyReluBackward.md` L91/L101/L131 的 gradOutput/self/out 均列 DOUBLE、A2 支持；master `d1efef7c` 的 `op_api/aclnn_leaky_relu_backward.cpp:34-35` 含 `DT_DOUBLE`，`op_host/leaky_relu_grad_def.cpp:24-34` 只注册 BF16/F16/F32 且 `AddConfig` 无 910B；实测 fp32 对照 0/0/0、double 首段 0 + 同步 507018（ops-nn#8384）。**跨仓结论**：该子型不是 ops-math 特有，凡「二元 promote + def 未注册 double + 非 910B AICore」的算子都可能命中；扫描时须同时验证「资料 dtype 列是否声明该 dtype」，本批 `log_softmax` 因 9.2.0 未提供 aclnn 头文件、无法建立真机基线而未验收。 **v6.47 纠错（必读）**：上述 v6.44–v6.46 五条实证（ops-math#4612/#4613/#4614/#4615、ops-nn#8384）于 2026-11-07 **全部撤回**——`507018` 的真正来源是**测试卡（dev2/dev3）的 AICPU 内核包不可用**：同一二进制在 dev0/1/4/5/6/7 上 double 全部 `0/0/0`（`aclnnSoftmax` fp64 作为独立旁证同样只在 dev2/dev3 失败），dev2 日志为 `soName=libcpu_kernels.so ... msg:open so failed`；且 `addcdiv.cpp:97` 的 `AddcdivAiCpu` 与交付包 `libcpu_kernels.so` 内的 `Addcdiv`/`Addcmul` 注册证明 AICPU 回退属设计路径。因此 B11-10 判据必须加「两步排除」（见「测试拦截建议」）：**跨卡复测 + 日志确认失败发生在 so 装载阶段**。五单已在正文顶部与标题标注撤回，`state` 需人工关闭。教训：**设备异常码不能单独作为「注册面缺失」的证据，必须与静态清单、交付包注册、健康卡行为三方对齐**。 **v6.48 补（子型 ⑪ 输出契约未校验：InferShape/透传覆写输出 shape，2026-11-08）**：本批在 ops-transformer 实测 6 例、ops-nn 1 例，把 B11 的覆盖对象从「输入契约」扩到「**输出契约**」——输出缓冲区尺寸同样由调用方声明，非法声明被放行后内核按**推导**尺寸写，后果从错误码问题升级为**设备侧写到声明区之外**。① `aclnnMoeTokenUnpermute`（ops-transformer#7239）：`moe_token_unpermute_infershape.cpp:34-38` 无条件 `SetDim(1, permuted[1])`，`out=[4,3]` 两段 0/0、写到声明区外 16 字节，反证 `out=[4,6]` 只写前 16 个；② `aclnnMoeTokenUnpermuteWithEp`（#7240，`:55-59` 同构，12 字节）；③ `aclnnMoeTokenUnpermuteGrad`（#7241，反向算子 `:86-90`，16 字节，踩的是梯度缓冲）；④ `aclnnMoeTokenPermuteGrad`（#7242，`:36-40`，8 字节）；⑤ `aclnnNormRopeConcat`（#7244）：第一段 `:52-57` **纯透传**、零校验，`queryOutput` 末维 6→5 时 0/0 且写穿 320 字节；同接口已实测 inner 对空指针（161001）与 dtype（161002）都校验，**独缺输出 shape**，而 `normQueryMean` 偏小为静默少写（不越界）；⑥ 错误码族形态（#7235、#7243）：只校验秩不校验维时缺口落到 `ViewCopy` 返回空、被 `CHECK_RET` 转成 561103，而 `aclnnMoeTokenUnpermuteWithRoutingMap.md:305-309` 明确把「输出的 shape」写进 161002。**判据与纪律**：ⓐ 找输出尺寸与触发条件**解耦**的形态（同形输出会被「输入空⇒输出也空」掩护）；ⓑ 定级分流——buffer 偏小用 canary 判「写到声明区之外」（内存安全），只判秩不判维用 `--kind errcode` 判「错误码族错位」；ⓒ 判重分流——同算子已有 msSanitizer 类「内核内部越界」关闭单时，须区分责任面（kernel vs aclnn/infershape），并在正文写明「即使前者已修本条仍复现」；ⓓ 修复落点按维护者口径放在**第一段接口进入委托分支前**，不宜只在 InferShape 内比对输出初值。**扫法**：`grep aclnnInner\\w*GetWorkspaceSize` 取委托清单；再按「出现 `aclnnInner` 且全文无 `CHECK_*`」筛纯透传清单（ops-transformer 命中 40+；这一步原用一次性脚本，**该脚本未收录本仓**，按此条件用 grep 复算）；`*infershape*.cpp` 搜 `*outShape = *inShape` 形态的整块赋值（命中 21 处）。**v6.54 增补（属性枚举直通型，2026-11-08）**：`aclnnFlashAttentionScoreV4`（ops-transformer#7245）的 `softmaxOutLayout` 资料只允许 `\"\"` / `\"same_as_input\"`（`docs/aclnnFlashAttentionScoreV4.md:639`，且 `:450`/`:460` 说明 `softmaxMax`/`softmaxSum` 的 shape 由它决定），但 `op_api/aclnn_flash_attention_score.cpp` 里该形参出现 13 次**全是声明与透传**，全文检索 `same_as_input` **0 命中**；A2 实测 `\"XYZ\"`、`\"SAME_AS_INPUT\"` 均两段 `0/0/0` 且正常出结果。只有 tiling 层 `flash_attention_score_tiling_general.cpp:1219-1220` 与 `flash_attention_score_tiling_regbase.cpp:233-235` 用 `strcmp`，其它值被静默当作空串（BNS8）。**判据：属性字符串在 op_api 层搜白名单字面量为 0、而 tiling/kernel 侧有 `strcmp` ⇒ 直通型枚举未校验**（与同文件 `inputLayout` 在 `:223-227` 的 else 拒绝作正向对照）；后果不是「少一个报错」，而是输出布局被静默换掉、下游按另一排布解析导致维度错位。","related_text":"[FP-B05](FP-B05.md)（相邻但不同：B05 是 **null 校验骨架的文件级参差**，本条是**语义校验缺失**且落点在 InferShape/tiling）、[FP-B04](FP-B04.md)（同为入口校验，但对象是空指针）、[FP-B06](FP-B06.md)（空 tensor 是 numel==0 的合法形态，本条覆盖的是**非法**形态）、[FP-B09](FP-B09.md)（动态 shape 哨兵被当真实维度，属本条的一个特例来源）、[FP-B13](FP-B13.md)（属性窄化是同簇的数值子型）、[FP-F03](../FP-F/FP-F03.md)（文档约束与代码校验不一致时双向命中）、[FP-E01](../FP-E/FP-E01.md)（非法输入矩阵缺失导致长期无人报）。"},"caseCount":5},{"id":"FP-B12","name":"空/退化输入早退路径未写非空输出（SUCCESS + 未初始化输出）","file":"patterns/FP-B/FP-B12.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"IsEmpty()","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["aclnn源码"],"enabled":true,"evidence":["ops-cv#1252 aclnnGridSampler3DBackward 空张量早退不填 inputGrad, 返回 SUCCESS 但输出为未初始化内存","ops-cv#1247 aclnnIm2colBackward 空 gradOutput 早退不写 out","ops-cv#1243 aclnnThreeInterpolateBackward n==0 早退不写 grad_y","ops-cv#1230 aclnnRoiPoolingGradWithArgMax roisN==0 早退不写 gradInputRef","ops-cv#1124 aclnnUpsampleBilinear2dAABackward 空 gradOutput 早退不填输出","ops-nn #7033（2026-10-21）：BatchNormBackward 空 tensor 早退不写 gradWeight/gradBias，返回 SUCCESS 但输出为未初始化内存","2026-11-06 五仓 25 案一轮：4 条 B12-3（#8239 bagSize/maxIndices、#7164 outputScale、#8246 gradWeight、#8249 amax），旧口径\"早退块是否写输出\"对四条全部误判 clean","2026-11 批次：本簇 66 条；代表 ops-cv#1432/#1431（空输入早退不写非空 out）、ops-math#7112（DequantSituQuant 剩余行未写）、ops-nn#7030（Softmax 空 tensor 跳过 dtype/dim 校验）、ops-transformer#6578（MoeGatingTopKSoftmaxV2 空 tensor 第一段放行）","ops-transformer#7237(2026-11-08) aclnnMoeFusedTopk 的 CheckShape 首行 if (x->IsEmpty()) return true 短路全部约束（:109-111），expertNum=0 时两段 0/0 且 y/indices 整块未写","ops-transformer#7238(2026-11-08) aclnnLightningIndexerKLLoss targetScore=[4,0,8] 时标量 loss 未写（资料只约束 B/K，未约束 S）","ops-nn#8387(2026-11-08) aclnnSoftmaxCrossEntropyWithLogits features=[N,0] 时逐样本 loss 未写，资料明文「features 支持空 Tensor」⇒ 合法输入；与 closed #1469/#1497 的关系是「对方只把拦截改成返回 SUCCESS、输出仍未写」=修复留下的另一半","aclnnEmbeddingBag 空 indices（offsets 决定输出 shape）早退返回 SUCCESS 但不写 output：1 bag 8/8、2 bag 16/16 canary 全保留（ops-nn#8389）；同族 aclnnEmbeddingDenseBackward 等价位置已用 ZerosLike+ViewCopy 写 0，属同一 index 族内「修一半」（v6.50）","判重与负控（v6.51）：aclnnMaxDim/MinDim 在 reduce 轴 size=0 时两段 0/0/0 且 out/indices 全 canary（A2 实测 2/2、6/6，keepdim 同样），与 ops-math#4528（open）真重复，不再提单；负控：aclnnGroupNorm（安装态 hxw=0 已写 mean=0/rstd=nan）、UpsampleNearest3d（显式 inputD>0 校验）、NLLLoss/NLLLoss2D（NLLLossEmptyTensorCompute）、Bincount（HandleEmptySelf）、TopK（indices 强制 INT64）、MaxDim out 偏小（161002 而非写穿）","重复边界（v6.52）：ops-math reduce 族空输入已被三条 open issue 覆盖，禁止再提单、直接引用——#3838（aclnnMax/Min/AminmaxAll/MaxDim/MinDim 空输入不写非空输出）、#4528（MaxDim/MinDim reduce 轴 size=0）、#4529（aclnnMax/Min/ArgMax/AminmaxAll reduce 轴 size=0，且与 amin/amax 的 161002 口径不一致）；A2 实测 aclnnMax 输入 [0]、out=[1] → 0/0/0 且 out 保持 0x7F7F7F7F（已含于 #3838）","守卫落点（v6.53）：aclnnMaxV2（aclnn_max_v2.cpp:157-160）与 aclnnAmax（aclnn_amax.cpp:141-145）在 CheckDimValid 内已有 GetDim(index)==0 → 161002，其后的 IsEmpty 早退在 reduce 轴 size=0 时不可达；aclnnAmin/Aminmax 同构。判定顺序：先查 CheckDimValid 有无 0 长度守卫，再看早退块；无守卫的 aclnnMax/Min/ArgMax/AminmaxAll/MaxDim/MinDim 归 #3838/#4528/#4529"],"tocEvidence":"ops-cv 语料 5 条","signatures":["IsEmpty\\(\\)[\\s\\S]{0,200}?return ACLNN_SUCCESS","\\*workspaceSize\\s*=\\s*0"],"keywords":["早退块内无 Duplicate/InitOutput 作用于输出","CheckShape 未拦空/非空交叉组合","输出元素覆盖率|canary 预填","out 预填魔数残留比例"],"absence":[{"func":"aclnn(?!\\w*WorkspaceSize)\\w+\\s*\\(","branch":"if\\s*\\([^)]*?(?<!!)IsEmpty\\(\\)[^)]*\\)","when":"return\\s+ACLNN_SUCCESS","must":"Duplicate|InitOutput|Memset|l0op::|ViewCopy","files":"op_api/aclnn_.*\\.cpp$","level":"high","note":"函数内分支级：第二阶段 API 的 if(...IsEmpty()...) 体内直接 return ACLNN_SUCCESS 但无输出写入；按签名含 workspaceSize 排除 Get*WorkspaceSize 辅助函数","exclude_sig":"workspaceSize"}],"broad":[],"logSig":[],"symptoms":["返回 0 但输出为 NaN/随机值","同用例重复执行结果不同","反向算子梯度为脏数据"],"detectors":["空输入×输出非空矩阵 + canary 魔数检查"],"related":["FP-B11","FP-B06","FP-B04","FP-A04","FP-A05","FP-E01","FP-A22"],"subtypes":[{"id":"B12-1","name":"早退块存在但不写任何非空输出（IsEmpty() → return ACLNN_SUCCESS）","evidence":"ops-cv#1252/#1247/#1243/#1230/#1124; ops-nn#7033"},{"id":"B12-2","name":"输出覆盖不全（返回 SUCCESS 但只写入部分元素，无早退；根因若为 dtype 分派则归 FP-A22）","evidence":"ops-math#3747"},{"id":"B12-3","name":"非空辅助输出被早退跳过（主输出本就为空，形状由其它入参/属性决定的输出未写）","evidence":"ops-nn#8239 bagSize/maxIndices; ops-transformer#7164 outputScale; ops-nn#8246 gradWeight; ops-nn#8249 amax; ops-transformer#7237/#7238; ops-nn#8387（判据收紧为「输出与触发空的维度解耦」）"},{"id":"B12-4","name":"早退分支排在参数校验之前（非法入参被旁路后返回 SUCCESS）","evidence":"ops-cv#1432/#1431"}],"waiver":"","detect":{"axes":["shape","content"],"oracle":["golden-canary"],"signal":"canary","lines":["memory","valid-fuzz"],"min_cases":4,"constructor":"「空输入 × 输出非空」矩阵：对每个反向算子把所有输入逐个置空（shape 含 0 维）；输出 buffer 预填魔数，跑后检查残留魔数比例。","judge":"返回码为 0 且非空输出的每个元素等于 0（PyTorch 语义）；魔数残留比例为 0。禁止只断言返回码。","kill":"若早退块 IsEmpty()->return ACLNN_SUCCESS 未写非空输出，则输出残留魔数而返回码为 0。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"},"note":""},"detectability":{"d":1,"level":"D1","why":"M07 早退不写输出：形态可判（absence 规则覆盖）","priority":9},"secondary":{"kind":"cross-path","why":"早退路径未写非空输出时，返回 SUCCESS 但输出未初始化——golden-canary 只看残留比例，若恰好「写了一半」可能蒙过。用双路径差分独立佐证。","relations":[{"id":"B12-X1","name":"双路径早退一致","statement":"同一早退场景（空/退化输入）经 aclnn 单算子与图模式两条路径，输出内容与元数据必须一致。","kill":"某条路径补了写回、另一条漏了，是 B12 最常见的形态（只修一侧）。","how":"矩阵化跑早退场景 × 两条路径，逐位比对输出与 shape/dtype。"},{"id":"B12-X2","name":"平台对称","statement":"同一早退场景在 A2/A3/A5 各平台的行为（返回码 + 输出是否被写）必须一致。","kill":"平台分支里早退实现不同，某平台不写输出。","how":"跨平台矩阵跑同一组空 shape，比对输出状态。"}]},"body":{"extras":[{"k":"控制变量（v6.30）","v":"**必须固定**——触发早退的空维只来自**一个**输入；其余输入保持非空；输出侧逐张量记录「shape 由谁决定」后逐个核对是否被写 ｜ **允许变动**——被置空的那一个输入 ｜ **多变量同变的典型误判**——主输出本来就该为空时，看「早退块内写没写输出」判不出问题——真正受害的是 shape 与空维无关的辅助输出（`*Scale` / `amax` / `rstd` / `gradWeight`）；旧口径对 4 条真缺陷全部判 clean"}],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 ops-cv 全量 issue 语料（2026-10-17，本簇 **5 条**，全部 `进行中`，全部为反向/梯度算子）+ 2026-10-21 补 B12-2 子型","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码 ｜ 触发 IsEmpty() ｜ 默认启用 true","mechanism":"接口**已有** `IsEmpty()` 判空分支（因此不属于 [FP-B06](FP-B06.md) 的\"分支缺失\"），但早退体只做 `*workspaceSize = 0; uniqueExecutor.ReleaseTo(executor); return ACLNN_SUCCESS;`，**不写任何输出张量**。而输出 shape 与输入强绑定，存在\"**输入为空、输出非空**\"的合法组合——尤其是反向算子：`gradOutput` 为空而正向输入（`input`/`grad_x`/`features`）非空时，梯度输出（`inputGrad`/`grad_y`）与之同形且非空。此时调用方拿到的是自己预分配的未初始化内存（NaN/随机值），却被当作合法梯度返回。**本型含四个子型（v6.13 起，v6.26 增 B12-3）**：**B12-1 早退不写任何非空输出**（上面的主形态，5 条 ops-cv 案例 + #7033）；**B12-2 输出覆盖不全**——**没有早退**，返回 `ACLNN_SUCCESS` 但只写入了部分元素（#3747 `uint32`/`int64` 约一半输出一个字节都没写，未写元素数恒为 `ceil(n/2)`）。**B12-3 非空辅助输出被早退跳过（v6.26）**——早退块**确实写了主输出**（或主输出本就该为空，写不写都\"对\"），但**形状由其它入参/属性决定、与触发早退的那个空维无关**的辅助输出（`*Scale` / `*Out` / `rstd` / `invRms` / `gradWeight` / `bagSize` / `maxIndices` / `amax` / `outputScale`）被整块跳过。**这是判据口径的关键升级**：旧口径只问\"早退块内写没写输出\"，遇到\"主输出本来就该为空\"的接口会直接判 clean，而真正受害的是辅助输出。正确问法是：**该输出的 shape 域是否与触发早退的空维无关？无关且非空 ⇒ 必查是否被写。**B12-2 只负责识别「返回成功但输出未写全」这一**结果面**；若根因是 dtype→执行模板映射错配，**机理归 [FP-A22](../FP-A/FP-A22.md)**，不要在本条重复定级。 **B12-4 早退旁路参数校验（v6.33）**：`IsEmpty()` 的 `return ACLNN_SUCCESS` 排在参数校验之前，**非法 dtype/shape 与空输入同时出现时被早退直接放行**，既不报错也不写输出；与 B12-1 的区别是「早退块本身也错了」——不是漏写，而是根本不该走到早退。","conditions":"至少一个输入 `numel==0`，且**至少一个输出非空**；以反向/梯度类算子为主（`*Backward`、`*Grad`）；正向算子若输入全空则输出也为空（no-op 成立，不触发）。典型组合：`gradOutput` 空 × `input` 非空；`grid` 空 × `input` 非空；`roisN==0` × `gradInput` 非空。","manifest":"**接口返回 `ACLNN_SUCCESS`（0），但输出内容为未初始化内存**——同一次运行重复调用结果不同、换机器结果不同、`mssanitizer`/canary 观察到未写区域；用 PyTorch 同类反向 API 对照时，无采样点/无 ROI 的梯度应为 **0**，而 NPU 侧返回随机值或 NaN，表现为\"loss 偶发 NaN\"\"梯度爆炸\"这类难以归因的现象。与 FP-A04 的区别：A04 是\"有结果但精度不对\"，本条是\"**结果从未被写入**\"。","mapping":"逐个 `aclnnXxxGetWorkspaceSize` 找 `IsEmpty()` 早退块，**先给每个输出标注 shape 域来源**（由哪些入参 / 属性决定），再检查 `return ACLNN_SUCCESS` **之前**是否遍历了所有 `aclTensor*` 输出：非空输出是否被 `l0op::Duplicate`/`InitOutput`/清零算子处理；判空条件是否**逐输入**（`gradOutput->IsEmpty() || input->IsEmpty() || grid->IsEmpty()` 三选一即早退时要特别小心）；`CheckShape` 是否拦截了\"空/非空交叉\"组合（多数没拦，因为形状一致性仍然成立）；文档 `docs/aclnn*.md` 若声明\"支持空 Tensor\"，则本节适用性直接成立。 **B12-3 加查（v6.26）**：对每个输出回答\"它的 shape 由谁决定\"——若 shape 只依赖 `attr` / 非空输入（典型 `outputScale` 恒 `[m]`、`amax` 强制 `[1]`、`gradWeight` 同 weight、`bagSize` 由 `offsets`+attr 决定），则**它与触发早退的那个空维无关，必须逐个确认早退块内是否写了它**；这类输出名可直接按 `*Scale|*Out\\b|rstd|invRms|gradWeight|gradBias|bagSize|maxIndices|amax|outputScale` 正则捞。","signatures_text":"静态扫描「函数体内存在 `IsEmpty()` 且其后 `return ACLNN_SUCCESS` 的早退块」× 「该函数签名中存在非 inplace 的 `aclTensor*` 输出」× 「早退块内无任何写输出调用（`Duplicate|InitOutput|Memset|l0op::` 作用于输出）」⇒ **候选命中**；再核对 `CheckShape` 是否已排除\"空输入 × 非空输出\"组合，未排除即成立。ops-cv 基线：5 个接口命中，全部为 `*Backward`。**B12-3 签名（v6.26）**：函数体内存在 `IsEmpty()` 早退 × 签名含 `*Scale|*Out|rstd|invRms|gradWeight|gradBias|bagSize|maxIndices|amax` 类输出 × 早退块内**未出现该输出名**（与 B12-1 的\"无任何写输出\"是不同判据：这里主输出可能已写）⇒ 候选。注意 `*Out\\b` 会误捞 `output`（`output` 本身常是主输出），落候选后必须人工看该输出是主输出还是辅助输出。 **initcheck 前置判据（v6.48）**：`mssanitizer --tool=initcheck` 要求 kernel 以 `--cce-enable-sanitizer` 重编译；未重编译时日志会**同时**出现 `No active sanitizer tool on kernel ...` 与大量 `ERROR: uninitialized read of size N`，后者**不得作为缺陷证据**（2026-11-08 实测：`mla_prolog`、`lightning_indexer_v2`、`inplace_partial_rotary_mul` 的官方 example 均命中该形态；同一二进制跑 `--tool=memcheck` 却是真检且 0 error）。判据：逐 kernel 检查是否出现 `initcheck is not supported ... temporarily ignored`，出现即判「不可判定」，必须先按 `--cce-enable-sanitizer` 重编内核再跑。","intercept":"建「空输入 × 输出非空」矩阵——对每个反向算子，把所有输入**逐个**置空（shape 含 0 维），断言两件事：① 返回码为 0；② **非空输出的每个元素等于 0**（PyTorch 语义：无贡献点的梯度为 0）。禁止只断言返回码——这正是 5 条 issue 长期未被发现的原因。建议在 ST 里加 canary：输出 buffer 预填魔数，跑后检查残留魔数比例。 **B12-3 加测（v6.26）**：断言范围必须覆盖**所有输出**而不只是主输出——`*Scale`/`amax`/`rstd`/`gradWeight` 等即使主输出为空也要逐个检查魔数残留；只断言主输出等于空/等于 0，正是 B12-3 长期漏检的直接原因。","evidence_text":"ops-cv 五连发（2026-09~10，均为 `进行中`）：**#1252** `aclnnGridSampler3DBackward`（`image/grid_sampler3_d_grad/op_host/op_api/aclnn_grid_sampler3d_backward.cpp:230-237`，`grid`/`gradOutput` 为空而 `inputGrad` 非空 → NaN 梯度）；**#1247** `aclnnIm2colBackward`（`image/col2im/op_api/aclnn_im2col_backward.cpp:245-250`）；**#1243** `aclnnThreeInterpolateBackward`（`op_host/op_api/aclnn_three_interpolate_backward.cpp:109-113`，`n==0` 早退不写 `grad_y`）；**#1230** `aclnnRoiPoolingGradWithArgMax`（`objdetect/roi_pooling_grad_with_arg_max/op_api/aclnn_roi_pooling_grad_with_arg_max.cpp:183-188`，`roisN==0` 时未写 `gradInputRef`）；**#1124** `aclnnUpsampleBilinear2dAABackward`（`op_host/op_api/aclnn_upsample_bilinear2d_aa_backward.cpp:204-208`）。五条分布在 image 与 objdetect 两个目录，说明不是单点疏忽而是**范式缺口**。 **2026-11 批次（v6.33 反哺）**：本簇 66 条；代表 ops-cv#1432/#1431（空输入早退不写非空 out）、ops-math#7112（DequantSituQuant 剩余行未写）、ops-nn#7030（Softmax 空 tensor 跳过 dtype/dim 校验）、ops-transformer#6578（MoeGatingTopKSoftmaxV2 空 tensor 第一段放行）。 **v6.48 补（非空输出与触发空的维度解耦；「修复留下的另一半」判读，2026-11-08）**：本轮把 B12-3 的判据从「存在早退」收紧为「**输出与触发空的维度是否解耦**」——同形输出必被「输入空⇒输出也空」掩护，只有标量/低维/attr 决定的输出才可能命中，因此选点先看输出 shape 是否含触发维度。实证：① `aclnnMoeFusedTopk`（ops-transformer#7237）`CheckShape` 首行 `if (x->IsEmpty()) { return true; }`（`:109-111`）把 `topK>0`/`topK<=expertNum`/`topN<=expertNum/groupNum` 全部短路，`expertNum=0` 时两段 0/0 且 `y`/`indices` 整块未写；② `aclnnLightningIndexerKLLoss`（#7238）`targetScore=[4,0,8]` 时**标量** `loss` 未写（资料只约束 B/K，未约束 S）；③ `aclnnSoftmaxCrossEntropyWithLogits`（ops-nn#8387）`features=[N,0]` 时逐样本 `loss` 未写，**资料明文「features 支持空 Tensor」⇒ 合法输入**；该单与 closed 的 #1469/#1497 关系是「对方只把**拦截报错**改成**返回 SUCCESS**、输出仍未写」，属**修复留下的另一半**，正文须写明「即使按 #1497 修完本条仍复现」。正向对照（修复范式）：`moe_token_unpermute_with_routing_map` 的早退对 4 个输出逐个 `ZerosLike + ViewCopy`，`mhc/block_attention_residuals_grad` 对 4 个梯度输出同样处理。**放大镜**：早退扫描（匹配 `if (...IsEmpty()...) { *workspaceSize = 0; ... return ACLNN_SUCCESS; }` 并解析所属函数签名，输出「形参在、早退条件不在」的张量；原脚本为一次性工具、**未收录本仓**）在 ops-transformer 命中 60 处，其中「只判一个输入」的四例里三例被判弱（`LightningIndexerGrad`/`NsaSelectedAttentionGrad`/`AttentionUpdate` 的输出与输入同形或已被 `goHd>0` 拦截），说明解耦判据能有效抑制假阳。 **v6.50 增补（家族内「修一半」）**：`aclnnEmbeddingBag`（ops-nn#8389）在 `indices` 为空、`offsets` 非空时 `index/embedding_bag/op_api/aclnn_embedding_bag.cpp:414-418` 直接 `return ACLNN_SUCCESS`，而 `output` 是 `(numBags, D)` 非空张量，实测 1 bag `8/8`、2 bag `16/16` 整块保持 canary；同族的 `aclnnEmbeddingDenseBackward` 在等价位置（`index/embedding_dense_grad_v2/op_api/aclnn_embedding_dense_backward.cpp:312-326`）已用 `ZerosLike + ViewCopy` 写 0 ⇒ 同一 index 族内并存两种写法，是「修复留下的另一半」的横向证据。判据补充：**`indices` 空、但 `offsets` 已决定输出形状时，输出与触发空的维度解耦**（不要因为「indices 空」就认为输出必为空）。 **v6.51 判重与负控（2026-11-08）**：① **已知未修的重复命中**——`aclnnMaxDim` / `aclnnMinDim` 在 reduce 轴 size=0 时两段 `0/0/0`、`out`/`indices` 全为 canary（A2 实测 2/2、6/6，keepdim=true 同样），与 **ops-math#4528（open）** 完全同机理 ⇒ **真重复一律不提**，后续扫到该形态直接引用 #4528，不再提单；该形态是「输出把触发空的维度归约掉」的教科书例子，选点时应优先识别。② **负控（判据不放行的已修样本）**——`aclnnGroupNorm`（experimental 分支 `:132-136` 无写输出，但安装态 CANN 9.3.0 实测 `hxw=0` 时 `mean=0 / rstd=nan` 已写出）、`aclnnUpsampleNearest3d`（`:112` 显式 `OP_CHECK(inputD>0 && inputH>0 && inputW>0 ...)`）、`aclnnNLLLoss`/`aclnnNLLLoss2D`（`NLLLossEmptyTensorCompute`）、`aclnnBincount`（`HandleEmptySelf`）、`aclnnTopK`（`indices` 强制 INT64）、`aclnnMaxDim` 的 `out` 偏小（返回 161002，不是静默写穿）。这些说明：**先看早退块，再看 CheckParams 是否已拦截，最后才上真机**，三步都不成立才立项。 **v6.52 重复边界（2026-11-08）**：ops-math 的 **reduce 族空输入**已被三条 open issue 全面覆盖，**禁止再提单、直接引用**：**#3838**（`aclnnMax`/`aclnnMin`/`aclnnAminmaxAll`/`aclnnMaxDim`/`aclnnMinDim` 空输入返回 SUCCESS 但不写非空输出）、**#4528**（MaxDim/MinDim 在 reduce 轴 size=0）、**#4529**（`aclnnMax`/`aclnnMin`/`aclnnArgMax`/`aclnnAminmaxAll` reduce 轴 size=0，且与 amin/amax 报 161002 的口径不一致）。A2 实测补充：`aclnnMax` 输入 `[0]`（0 元素）、`out=[1]` → 两段 `0/0/0`，`out` 保持 `0x7F7F7F7F`；该现象已含于 #3838。选点纪律：**该族只做交叉验证，不再新建 issue**；新增价值应转向未被这三单覆盖的接口族（如 loss 类的 `MseLoss`/`NLLLoss`——均已 `*EmptyTensorCompute` 写零，实测为负控）。 **v6.53 守卫落点（2026-11-08，回答「哪 6 个有守卫」）**：实测 `aclnnMaxV2`（`math/reduce_max/op_api/aclnn_max_v2.cpp:157-160`）与 `aclnnAmax`（`math/reduce_max/op_api/aclnn_amax.cpp:141-145`）在 `CheckDimValid` 内已有 `if (!isScalar && selfViewShape.GetDim(index) == 0) → ACLNN_ERR_PARAM_INVALID`，其后的 `IsEmpty()` 早退（`aclnn_max_v2.cpp:216-220`、`aclnn_amax.cpp:207-211`）在「reduce 轴 size=0」时**不可达**；`aclnnAmin`/`aclnnAminmax` 同构。因此该族的判定顺序是：**先查 `CheckDimValid` 有没有 0 长度守卫，再看早退块**——有守卫即负控，不要再提单；无守卫的入口（`aclnnMax`/`Min`/`ArgMax`/`AminmaxAll`/`MaxDim`/`MinDim`）归 #3838/#4528/#4529。\n\n  **v6.13 回填（2026-10-21）**：**ops-nn #7033** `aclnnBatchNormBackward`（空 tensor 早退不写 `gradWeight`/`gradBias`，返回 SUCCESS 但输出为未初始化内存）——B12-1 同型；**ops-math #3747** `aclnnTril`（`uint32`/`int64` 两段均返回 0，但后 `ceil(n/2)` 个元素未写、已写部分掩码也错）——B12-2 结果面，根因见 FP-A22。\n\n  **v6.26 回填（2026-11-06，B12-3 子型确立）**：CANN 五仓 25 案举一反三一轮，**4 条功能类 issue 全部是 B12-3**，且旧口径（\"早退块内是否写输出\"）对这 4 条**全部判 clean**——主输出本来就该为空，写着\"无输出\"是正常的：\n\n  | 单 | 接口 | 主输出（空，正确） | 真正受害的辅助输出 |\n  |---|---|---|---|\n  | ops-nn #8239 | `aclnnEmbeddingBag` | `output` | `bagSize` / `maxIndices`（形状由 `offsets`+attr 决定） |\n  | ops-transformer #7164 | `aclnnGroupedMatmulSwigluQuantV2` | `output`（n==0） | `outputScale`（恒 `[m]`，基线 256/256 写、变异 0/256） |\n  | ops-nn #8246 | `aclnnPreluBackward` | `gradInput`（batch=0） | `gradWeight`（形状 == weight，基线 8/8 写、变异 0/8） |\n  | ops-nn #8249 | `aclnnQuantMax` | `y`（空 x） | `amax`（强制 `[1]`，A5 双 device + 910C 三路复核） |\n\n  四条共同点：**辅助输出的 shape 全部由属性和非空输入决定，与导致早退的那个空维无关**。这正是 B12-3 的判据：先算输出的 shape 域，再看它是否被早退跳过。\n\n  **v6.38 回填（2026-11-07，新增「平台分支不对称」形态）**：ops-nn **#8374**（open）`aclnnGroupNormBackward` —— `N=0`（`gradOut`/`input` 空、`gamma=[C]` 非空）两段均返回 0、`workspaceSize=0`，而 `gradGammaOut`/`gradBetaOut`（`[C]` 非空，空集求和应为 0）保持预填哨兵 `123456`；910B2 上用 stock CANN 9.2.0 与 master `60ebedf76` 自编包双重复核一致。与 v6.26 四条的区别：本次**同一接口内部已有正确实现**——同文件 Regbase 分支（`:711-719`）对同一空输入走 `ComputeGroupNormBackwardEmptyInput` 并把 `dgamma`/`dbeta` 拷回，而非 Regbase 分支（`:691-696`）直接 `return ACLNN_SUCCESS`。**新判据**：当接口按 `IsRegbase()`/SOC 分支时，必须**逐分支**核对其空输入早退块，不能因为某一个分支写全了就判 clean；扫描手法是先筛多输出 `*Backward/*Grad` 接口（输出个数 ≥2），再对空输入早退块做「块内是否出现任一输出形参名」的差集。**影响面**：A2/A3/910 走非 Regbase 分支，950 走 Regbase 分支，因此该类缺陷会呈现「新平台正常、老平台静默脏读」的跨代差异（与 FP-A17 互为表里）。\n  **v6.40 回填（判据边界，2026-11-07）**：对四仓「多输出 + 资料声明支持空Tensor」的 90 个候选做批量核对后，补一条**排除规则**——若资料在空 Tensor 说明里明确写「空Tensor时直接返回」（如 `aclnnSwigluGroupGrad` 对 `gradY`/`x` 的说明），则「早退不写输出」属**已声明行为**，不构成缺陷；只有资料仅写「支持空Tensor」、且实现内部存在写输出的正确分支（如 `aclnnGroupNormBackward` 的 Regbase 分支）时，才成立。批量核对还必须先按资料「输入/输出」列剔除**签名非 const 但文档标为输入**的形参（`BatchNormElemt` 的 `mean`/`invstd`、`NLLLoss2dBackward` 的 `totalWeight`、`BatchNormElemtBackward` 的 `counter`），否则会把输入当输出误报。经此两轮过滤，本批可提点收敛为 #8374 一条。","related_text":"[FP-B11](FP-B11.md)（B12-3 是**输出侧**的遗漏，B11 是**输入侧**契约校验缺失；同一个 `IsEmpty()` 早退块可能两者都缺）、[FP-B06](FP-B06.md)（**互补**：B06 是\"没有判空分支\"，本条是\"有分支但早退不写输出\"；同一接口可能两代问题先后出现）、[FP-B04](FP-B04.md)（同为两段式接口契约）、[FP-A04](../FP-A/FP-A04.md)（未写输出最终会以\"精度异常/NaN\"暴露，须防止被误归因为精度问题）、[FP-A05](../FP-A/FP-A05.md)（脏数据/未初始化读的另一来源）、[FP-E01](../FP-E/FP-E01.md)（只断言返回码的 UT 会把该缺陷判成 PASS）、[FP-A22](../FP-A/FP-A22.md)（B12-2 的输出覆盖不全若由 dtype 分派映射错配导致，机理与定级归 A22）。"},"caseCount":5},{"id":"FP-B13","name":"host 侧 int64→int32 窄化/乘积溢出（参数值静默改变）","file":"patterns/FP-B/FP-B13.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"标准","status":"active","trigger":"static_cast<int32_t>","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["aclnn源码","Tiling源码"],"enabled":true,"evidence":["ops-cv#950 Dilation2DBackpropInput strides/rates/pads 窄化为 int32, 2^32+1 被当成 1","ops-cv#937 RoiAlignV2 超 int32 的 pooled size 窄化为错误 shape","ops-cv#995 ImageProjectiveTransform 极大 output_shape 乘积溢出后仍返回成功","ops-cv#1009 Crop offsets+size int64 溢出未防护","ops-cv#933 NMSWithMask rank-0 输入 size_t 下溢"],"tocEvidence":"ops-cv 语料 5 条","signatures":["static_cast<int32_t>\\(","int32_t\\s+\\w+\\s*=\\s*\\w+\\s*\\*\\s*\\w+","size_t\\s+\\w+\\s*=\\s*[^;]*size\\(\\)"],"keywords":["ListInt 属性直赋 int32_t","shape 乘积在 32 位域完成"],"absence":[],"broad":["static_cast<int32_t>\\("],"logSig":[],"symptoms":["2^31/2^32 附近才出错","输出 shape 与入参不一致","返回 SUCCESS 但参数被改写"],"detectors":["INT32_MAX±1 / 2^32+1 边界矩阵","static_cast<int32_t> 静态扫描"],"related":["FP-B07","FP-A12","FP-A18","FP-B11","FP-G01"],"subtypes":[],"waiver":"定位型：窄化点遍布 host 侧，须逐条比对源/目标位宽，非「命中即缺陷」","detect":{"axes":["boundary","shape"],"oracle":["error-code","golden-utol"],"signal":"error-code","lines":["error-scenario","valid-fuzz"],"min_cases":3,"constructor":"属性/维度边界矩阵：INT32_MAX-1 / INT32_MAX / INT32_MAX+1 / 2^32 / 2^32+1 / 2^63-1；乘积类额外构造 H=65536,W=65536（H*W=2^32）。","judge":"每例断言「第一段返回 161002（参数非法）或按 int64 语义正确推导」；绝不允许「返回 SUCCESS 且值被改写」。","kill":"若 attr/维度被 static_cast<int32_t> 窄化，则 2^32 附近返回 SUCCESS 但输出 shape 与入参不一致。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"}},"detectability":{"d":2,"level":"D2","why":"M05 窄化强转：static 6/10（部分场景签名可定位）","priority":18},"secondary":null,"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 ops-cv 全量 issue 语料（2026-10-17，本簇 **5 条**）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 aclnn源码,Tiling源码 ｜ 触发 static_cast<int32_t> ｜ 默认启用 true","mechanism":"proto 里属性/维度是 **int64 语义**（`ListInt`/`ListInt64`/shape），host 实现却用 `int32_t` 承接或在 32 位域完成乘积：`static_cast<int32_t>(attr)` 无范围判断，或 `H*W`、`offsets+size`、`totalPairs` 这类表达式的操作数全为 32 位。超界即回绕，**参数值被静默改写**（`2^32+1` 变成 `1`、`2^31` 变成负数），随后参与 shape 推导、约束判定与 tiling data 填充——参数、推导出的 shape、tiling 三者互相不一致。与 [FP-B07](FP-B07.md) 的区别：B07 错在**索引/偏移算式**（后果是越界读写），本条错在**参数值本身**（后果是形状/配置错误）；与 [FP-A12](../FP-A/FP-A12.md) 的区别：A12 是 int→float 的**精度**损失，本条是整型**回绕**。","conditions":"`ListInt` 属性值接近或超过 `INT32_MAX`（`stride`/`rate`/`pad`/`output_size`/`pooled_size`）；shape 维度乘积超 int32（`H*W`、`N*C*H*W`、`output_shape` 各维相乘）；`int64` 偏移相加（`offsets + size`）；`size_t` 在空/rank-0 输入下下溢（`rank-0` 取 `size()-1`）。CV 算子里这类\"极大属性\"多来自 fuzz/边界测试或图上的常量折叠结果，业务侧较少但**一旦发生就是静默错误**。","manifest":"**按文档/常规输入的对照组全 PASS，只有超大值输入出错**；错误表现为输出 shape 与调用方给的 `output_size` 不一致、tiling 参数被改成小值、或直接生成非法 shape；日志无报错、返回码为 SUCCESS。特征信号：问题只在 `2^31` / `2^32` 附近出现，且**改小值后现象消失**（与 FP-B11 的\"非法输入\"不同，这里是**合法但极大**的输入）。","mapping":"host 侧检索所有 `static_cast<int32_t>(`（尤其作用于 attr / `ListInt` 元素 / shape 维度）；`ListInt` 读取处是否直接赋给 `int32_t` 变量；shape 乘积链条（`H*W`、`D*H*W`、`N*C*H*W`）中是否有操作数为 `int32_t`；`offsets + size` 类相加是否先转 int64；`size_t` 与有符号数混用处的下溢（`rank-0` 输入）；tiling data 字段类型是否与 proto 声明的 int64 语义一致（int32 字段本身就是窄化点）。","signatures_text":"静态扫描 `(?:int32_t|int)\\s+\\w+\\s*=\\s*(?:static_cast<int32_t>\\()?[^;]*(?:attr|Attr|size|Size|shape|Shape|dim|Dim)` ⇒ 候选；再对每个候选反推可达上界（属性契约上限、shape 上限），可达 `INT32_MAX` 即成立。配套扫描：`\\([A-Za-z_]\\w*\\s*\\*\\s*[A-Za-z_]\\w*\\)\\s*\\*\\s*[A-Za-z_]\\w*` 形式的连续乘积。ops-cv 基线：**5 个算子**命中（`Dilation2DBackpropInput`、`RoiAlignV2`、`ImageProjectiveTransform`、`Crop`、`NMSWithMask`）。","intercept":"属性/维度边界矩阵 = `INT32_MAX-1 / INT32_MAX / INT32_MAX+1 / 2^32 / 2^32+1 / 2^63-1`，每例断言\"第一段接口返回 161002（参数非法）**或**按 int64 语义正确推导\"，绝不允许\"返回 SUCCESS 且值被改写\"；对乘积类参数额外构造 `H=65536, W=65536`（`H*W=2^32`）；把上述静态扫描纳入 CI，新增 `static_cast<int32_t>` 作用于 attr 即告警。","evidence_text":"ops-cv 五例：**#950** `Dilation2DBackpropInput` 将 `strides`/`rates`/`pads` 直接从 `int64_t` 转 `int32_t`，`2^32+1` 被当成 `1`，大 stride 使本应 1×1 的 VALID 输出被按 3×3 接受；**#937** `RoiAlignV2` Host InferShape 将超 int32 的正 `pooled_size` 窄化为错误 shape；**#995** `ImageProjectiveTransform` 极大 `output_shape` 乘积溢出后仍返回成功（`op_host/arch35/image_projective_transform_tiling.cpp`）；**#1009** `Crop` Host InferShape 未防护 `offsets + size` 的 int64 溢出；**#933** `NMSWithMask` Host InferShape 对 rank-0 输入执行 `size_t` 下溢（`experimental/image/nms_with_mask/op_host/nms_with_mask_infershape.cpp`）。","related_text":"[FP-B07](FP-B07.md)（同属\"整型宽度不足\"，但 B07 在 kernel/索引侧，本条在 host 参数侧）、[FP-A12](../FP-A/FP-A12.md)（int→float 精度损失，与整型回绕互补）、[FP-A18](../FP-A/FP-A18.md)（int32 边界转 float 后比较语义偏差，同一边界量的另一表现）、[FP-B11](FP-B11.md)（窄化常与\"未做值域校验\"共现，修复可一并落）、[FP-G01](../FP-G/FP-G01.md)（回绕后的巨大循环上界可能演变为挂死）。"},"caseCount":0},{"id":"FP-B14","name":"图模式（GEIR/aclGraph）通路与 aclnn 单算子通路未同步适配","file":"patterns/FP-B/FP-B14.md","cat":"compatibility","catZh":"功能/兼容","s":2,"o":3,"level":"高","score":6,"depth":"深度","status":"active","trigger":"图模式|GEIR|aclnnGraph|op_graph","triggerZh":"签名","repos":["All"],"sides":["Host"],"carriers":["IR与图配置","aclnn源码","Tiling源码"],"enabled":true,"evidence":["ops-nn#5201 swiglu_group_grad 图模式缺省 clamp_limit 被 proto 默认值 0 拒绝(tiling 要求 -1 或 >0, 仅图模式暴露)","ops-nn#5477 BNInferGrad format 校验过严(NC1HWC0 元数据被判非法)致 GEIR GRAPH_FAILED","ops-nn#5922/#6017 aclGraph 调用失败 / A5 图模式 Run graph failed","ops-math#3188 ArgMaxV2 需在 L0 传 dtype 属性否则 aclnngraph 编译失败; #3361 fillv2 geir 通路失败","ops-transformer#5736 qfa quant_mode=6 在 aclgraph 下 507011 AICore device fault","三仓全量 issue 语料 2026-10-17: 图模式相关 69 条(math 13 / nn 26 / transformer 30)"],"tocEvidence":"三仓 69 条","signatures":["REG_OP\\(","DefaultValue\\(","GetOptionalInputShape","IMPL_OP_INFERSHAPE"],"keywords":["proto 默认值与 tiling 接受域不一致","format 白名单缺图优化格式 NC1HWC0"],"absence":[],"broad":[],"logSig":[],"symptoms":["E40021","GRAPH_FAILED","Run graph failed","507011","aclnn 正常图模式失败"],"detectors":["图模式(ptgraph/aclGraph)冒烟 + 与 aclnn 结果对照"],"related":["FP-B08","FP-A16","FP-F01","FP-F03","FP-B11"],"subtypes":[],"waiver":"定位型：图模式双路径对比需成对取样，命中只说明「有图模式代码」","detect":{"axes":["sequence","attr"],"oracle":["golden-utol","error-code"],"signal":"sequence","lines":["precision","error-scenario"],"min_cases":2,"constructor":"每个算子至少一条图模式冒烟（ptgraph 或 aclGraph），断言「与 aclnn 结果一致 + 不抛 GRAPH_FAILED」；对新增 attr 补「proto 默认值 ∈ tiling 接受域」静态断言。","judge":"图模式与 aclnn 直调结果一致，不抛 GRAPH_FAILED / E40021 / 507011。","kill":"若图模式通路未同步适配，则 aclnn 正常而图模式报 GRAPH_FAILED 或结果与 aclnn 不一致。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"典型表现"}},"detectability":{"d":3,"level":"D3","why":"M06 默认属性改动：差分仅 2/10（阈值语义，形态不变）","priority":18},"secondary":{"kind":"cross-path","why":"图模式与单算子通路未同步适配，本质是两条通路契约差异，天然差分。","relations":[{"id":"B14-X1","name":"双通路契约一致","statement":"同一算子分别走 GEIR/aclGraph 与 aclnn 单算子，输出与错误面必须一致。","kill":"属性默认值、format 白名单只在一侧补齐，差分立即暴露。","how":"同输入两通路各跑一遍，比较输出与错误码；属性缺省场景单独成组。"}]},"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 高（S2×O3=6）｜ 状态 活跃 ｜ 来源 ops-math / ops-nn / ops-transformer 全量 issue 语料（2026-10-17，16 270 条中 3 011 条 bug-report，图模式相关 69 条）","applicability_text":"仓 All ｜ 侧别 Host ｜ 载体 IR与图配置,aclnn源码,Tiling源码 ｜ 触发 图模式|GEIR|aclnnGraph|op_graph ｜ 默认启用 true","mechanism":"同一算子有两条交付路径——**aclnn 单算子**（`op_api` → tiling → kernel）与**图模式**（`op_graph` proto → GE 推导 → tiling → kernel）。二者共享 tiling/kernel，但**入口契约各自维护**：op_graph 里 attr 的默认值、输入输出的 format 元数据、可选输入的缺省形态、L0 层 dtype 属性的下发、infershape 的注册与推导，都不经过 aclnn 的 `CheckShape`。当开发/测试只覆盖 aclnn 路径时，图模式会在三个不同阶段失败：**编译**（常量折叠/符号缺失，E40021）、**推导**（GRAPH_FAILED）、**执行**（Run graph failed / device fault），而同一算子的 aclnn 用例全部通过。","conditions":"① op_graph proto 的 attr 默认值与 tiling 的 `ParseAttrs` 校验范围不同步（如 proto 默认 0、tiling 只接受 -1 或 >0）；② 图模式输入携带 tiling 的 format 白名单未覆盖的元数据（`NC1HWC0` 等，常见于图优化插格式后）；③ 图编译需要 L0 显式传 dtype 属性，而 `def.cpp` 未声明；④ 可选输入在图模式下缺省；⑤ infershape 注册名错误或缺失；⑥ 图模式专用常量折叠路径未走通。","manifest":"**aclnn/TTK 直调用例全 PASS，图模式（ptgraph / aclGraph / GEIR）用例失败**；报错多为 `E40021`、`GRAPH_FAILED`、`Run graph failed`、`507011 AICore device fault`；或图模式结果与单算子不一致、图模式默认属性被拒。特征信号：问题只在 `torch.compile`/`graph` 模式复现，`torch_npu` eager 正常。","mapping":"`op_graph/*_proto.h` 的 `Attr(...).DefaultValue(...)` 与 `op_host/*_tiling*.cpp` 中 `ParseAttrs` 的合法值域逐项比对；`ValidateTensorDescs`/`CheckFormat` 的 format 白名单是否包含图优化常见格式；`op_host/*_def.cpp` 是否为 950/L0 声明了必需属性；`*_infershape.cpp` 的注册名与算子名一致；`docs/aclnn*.md` 与图模式 proto 的 attr 默认值是否一致。","signatures_text":"静态比对「proto attr 默认值 ⊄ tiling 接受值域」⇒ 候选；扫描 `GetOptionalInputShape` 与 `GetOptionalInputDesc` 误用；图模式用例缺失（仓内 `*_geir_*`/`*graph*` 测试目录存在但未覆盖该算子）。三仓基线：图模式相关 bug 69 条（math 13 / nn 26 / transformer 30）。","intercept":"每个算子至少一条图模式冒烟（ptgraph 或 aclGraph），断言\"与 aclnn 结果一致 + 不抛 GRAPH_FAILED\"；对新增 attr 补\"proto 默认值 ∈ tiling 接受域\"的静态断言；把 `*_geir_*` 用例纳入 CI 时同时校验**状态码语义**（GRAPH_FAILED 不能被收窄成 1/#2830 类问题）。","evidence_text":"ops-nn **#5201** `swiglu_group_grad` 图模式缺省 `clamp_limit` 被 proto 默认值 0 拒绝（tiling 在 #8844 后要求 -1 或 >0，proto 未同步，仅图模式暴露）；**#5477** `BNInferGrad` format 校验过严（`NC1HWC0` 元数据被判非法）致 GEIR `GRAPH_FAILED`；**#5922** `matmulEmuSplitWeight` aclGraph 调用失败；**#6017** `deformable_offsets_grad` A5 图模式 example `Run graph failed`；ops-math **#3188** `ArgMaxV2` 需在 L0 传 dtype 属性否则 aclnngraph 编译失败；**#2619** `reducesum/reducemean` geir 功能失败；**#3361** `fillv2` geir 通路失败；ops-transformer **#5736** `qfa quant_mode=6` 在 aclgraph 下报 507011 AICore device fault。","related_text":"[FP-B08](FP-B08.md)（相邻：B08 是**属性在 pass 链路中被丢弃**——fallback 回调/前端插件/fusion pass；本条是**入口契约不同步**——proto 默认值/format 白名单/dtype 属性，两者可共现但修复落点不同）、[FP-A16](../FP-A/FP-A16.md)（aclop 与 aclnn 的**精度**双路径差异，本条是**功能**双路径失败）、[FP-F01](../FP-F/FP-F01.md)（图编译符号缺失/链接失败属构建面，不归本条）、[FP-F03](../FP-F/FP-F03.md)（proto 与文档/实现三方不一致时双向命中）、[FP-B11](FP-B11.md)（图模式同样需要参数契约校验，但本条特指**两条路径契约不同步**）。"},"caseCount":4},{"id":"FP-B15","name":"定长容器容量无校验（入参索引 + 越界写 + 静默截断）","file":"patterns/FP-B/FP-B15.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"标准","status":"active","trigger":"\\[256\\]|MAX_TENSOR_NUM|tensorElements|listSize|groupNum","triggerZh":"签名","repos":["All"],"sides":["Host","Tiling"],"carriers":["Tiling源码","Host源码"],"enabled":true,"evidence":["ops-nn#8254(aclnnForeachExpm1 缺 tensorNum>256 校验: host 结构体越界写约 2048B + kernel fault 507035 + n>=258 尾部静默错值, n=258/300/512 分别 2/86/510 处)","ops-nn foreach 族静态扫描(2026-11-06 @9.3.0-beta.1): foreach_expm1 与 foreach_neg 有 int64_t tensorElements[256] 但 op_host 全目录无 MAX_TENSOR 校验; foreach_atan/cos/erf/exp 等有 MAX_TENSOR_NUM=256 拦截","对照组 foreach_atan/op_host/arch35/foreach_atan_tiling.cpp:32 定义 MAX_TENSOR_NUM=256, :79 OP_CHECK_IF(tensorNum > MAX_TENSOR_NUM) —— 同族已有护栏而 expm1/neg 没有","TensorList（B15）空列表与长度不一致的判据（v6.62）：① `aclnnAddN` 传空 TensorList（size=0，数组有效或为 nullptr）在 9.3.0 发布包上**第一段 SIGSEGV**（exit 139），而资料 `math/add_n/docs/aclnnAddN.md:84` 明确「支持空 TensorList，此时输出为空 Tensor」；但 master 已在 `5fd45b14d`（fix(add_n): ... 修复空TensorList段错误(issue #3652)）补上 `tensors->Size()==0` 早退（`aclnn_add_n.cpp:169-173`）⇒ **G4 不满足，不提**；判据：发布包崩溃先查 `git log -S` 是否已在 master 修复，已修只记录。对照：`tensors=nullptr` → 161001、单 tensor 列表 → 0 并正常执行。② `aclnnForeachAddList`（alpha 为必选，传 nullptr 时所有用例都退化为 161001，构造基线必须先给 alpha）：长度为 2 的对照组 → 0（ws=512）；`x2` 长度 1<2、3>2、`out` 长度 1<2 均 **161002**；`out=nullptr` → 161001；三列表均空 → 0（无元素可算）。⇒ Foreach 族对「列表长度不一致」双向都拦截，是 TensorList 的正例。③ 他人已提的 doc 缺口（不重复）：`ops-nn#8275` / `#8279` 指出 `aclnnForeachAddcdivScalarList`、`aclnnForeachMulList` 的 TensorList 元素个数上限 256 资料未披露。"],"tocEvidence":"ops-nn#8254 + foreach 族 7 处静态命中","signatures":["int64_t\\s+\\w+\\s*\\[\\s*(?:128|256)\\s*\\]","MAX_TENSOR_NUM"],"keywords":["定长数组 Type name[N] 的索引来自入参 tensorNum / listSize / groupNum","同族兄弟有 OP_CHECK_IF(x > N) 而本算子没有","constexpr MAX_* 定义了却未用于任何比较","kernel 侧直接用未截断的 tensorCount 索引同一数组"],"absence":[],"broad":[],"logSig":[],"symptoms":["列表长度超过 256 后返回 SUCCESS 但尾部结果静默错","n 再大时 sync 507035 Aicore kernel fault 或 coredump","同族接口一个报错一个放行"],"detectors":["定长数组 x 入参索引 x 无上界校验 三件套静态扫描","族内兄弟对拍（有数组/有校验 的交叉表）"],"related":["FP-B11","FP-B07","FP-B13","FP-G01","FP-F03"],"subtypes":[],"waiver":"","detect":{"axes":["shape","attr"],"oracle":["error-code","golden-canary"],"signal":"canary","lines":["valid-fuzz","static-absence"],"min_cases":5,"constructor":"容量扫描矩阵：对每个含变长列表入参的接口，列表长度取 1 / N-1 / N / N+1 / 2N（N=实现内部定长容量，如 256）；每个输出 buffer 预填魔数，逐点记录两段返回码、sync 返回码与各输出的魔数残留比例。","judge":"超上限必须明确报错（161002 或等价）；未超上限时每个元素的结果与单元素调用逐个一致。禁止只断言返回码。","kill":"若填充循环上界来自入参且无 OP_CHECK_IF(x > N)，则 n>N 时返回码仍为 0 而尾部数据缺失；n 再大触发 kernel fault（只有 sync 非 0）。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"故障机理"}},"detectability":{"d":2,"level":"D2","why":"有存在型形态判据（定长数组 + 入参索引 + 无校验 + 兄弟对拍），但越界后果需动态确认","priority":18},"secondary":{"kind":"cross-path","why":"容量越界的三条后果里，「尾部静默丢弃」与「kernel fault」在不同平台/不同通路表现不同（实测 A5 是 507035 fault、910C 是静默不写）。单看返回码两边都是 0，必须靠双通路对拍才能定位到「容器容量」这个根因，而不是误判成精度问题。","relations":[{"id":"B15-X1","name":"双通路容量一致","statement":"同一列表长度 n（超过容量 N）在 aclnn 单算子与图模式两条路径上的行为必须一致：要么都拒绝，要么都正确算完。","kill":"只修一条路径的容量校验是常见形态；两条路径对同一 n 给出不同结论即证明校验缺失而非「设计如此」。","how":"n ∈ {N-1, N, N+1} × 两条路径矩阵，比对返回码 + 输出内容 + sync 返回码。"},{"id":"B15-X2","name":"族内兄弟对拍","statement":"同一族的接口（如 foreach_*）对同一 n 的处理必须一致：兄弟报错的，本接口也必须报错。","kill":"族内只有少数接口缺 OP_CHECK_IF(x > N) 时，本接口 n>N 仍返回 0 即暴露「漏拦截」；这条不依赖任何外部契约。","how":"族内逐个接口跑 n=N+1，统计「报错 / 返回 0」的分布；返回 0 的那批即候选。"}]},"body":{"extras":[],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 ops-nn/ops-math/ops-transformer 三仓语料静态扫描（2026-11-06，CANN 五仓 25 案 x 1370 aclnn 接口一轮，定长容器族命中 **foreach 7 处以上**）+ 实证 ops-nn#8254","applicability_text":"仓 All ｜ 侧别 Host,Tiling ｜ 载体 Tiling源码,Host源码 ｜ 触发 \\[256\\]|MAX_TENSOR_NUM|tensorElements|listSize|groupNum ｜ 默认启用 true","mechanism":"host/tiling 侧用**定长数组**承载「由入参决定的变长集合」——tiling data 结构体里写死 `int64_t tensorElements[256]`，填充与消费各用一次循环下标 `for (i = 0; i < tensorNum; i++)`，而 `tensorNum`（`GetInstanceNum()` / `listSize` / `groupNum` / `tensorCount`）**来自调用方，全程无上界校验**。三条后果**同时**存在且互相遮蔽：① **host 结构体越界写**（`n=512` 时约 2048 字节）；② **kernel 侧用同一个未截断的 `tensorCount` 索引同一数组**，越界读后 fault（`sync 507035`）；③ **超出容量的尾部张量被静默丢弃**——接口两段都返回 0，前 256 个张量算对、后面全错。与 [FP-B07](FP-B07.md) 的区别：B07 错在**索引算式本身**（下标算错），本条**下标表达式没错**，错在**容器容量与入参上界之间没有约束**；与 [FP-B11](FP-B11.md) 的区别：B11 是「单个参数自身合法性」未校验（rank/长度/值域），本条特指**容器容量**这一类，且其静态形态（`Type name[N]` + 入参索引）可被机器一次扫清。","conditions":"① 存在 `Type name[N]` 或 `constexpr int MAX_... = N` 的定长数组/常量；② 其索引来自入参（`tensorNum` / `listSize` / `groupNum` / `tensorCount`）；③ **同族兄弟实现有 `OP_CHECK_IF(x > N)` 而本算子没有**——第 ③ 条是零成本强证据，不需要论证 N 的合理性即可定缺陷。","manifest":"**小规模输入全对、大规模输入静默错**；`n` 恰好越过容量时接口返回 `ACLNN_SUCCESS`（两段都 0）但尾部数据缺失或错值；`n` 再大一些则出现 `507035 Aicore kernel fault` 或进程 coredump；错误现场与 shape/dtype 无关，**只与「集合元素个数」有关**，因此常规用例矩阵（按 shape/dtype 铺）几乎不可能覆盖到。特征信号：把同一接口的列表长度从 `N-1` 逐级加到 `N+1`、`2N`，返回码仍为 0 而结果开始不一致。","mapping":"`op_kernel/**/*_tiling_data.h` 里所有 `T name[N] = {0}`（N ≥ 32 的一律可疑）；`op_host/**/*tiling*.cpp` 里对该数组的填充循环，其上界变量来自哪里（`GetInstanceNum()` / `GetDynamicInputShape` 的 count / attr `groupNum`）；同一文件内是否已定义 `MAX_*` 常量却**未用于校验**（定义了不用 = 作者知道有上限但漏了拦截）；kernel 侧消费同一数组时用的是 `tensorCount` 还是 `min(tensorCount, N)`；`op_api/aclnn_*.cpp` 的 `aclCreateTensorList` 长度与 tiling 侧读到的 instance num 是否可能不一致。","signatures_text":"静态扫描三件套——① `[A-Za-z_][\\w:<>]*\\s+\\w+\\[\\s*(\\d{2,})\\s*\\]\\s*(?:=|;)` 命中定长数组（记录 N）；② 同目录/同目录族内 `for\\s*\\([^;]*<\\s*(\\w+)` 中该变量出现在数组下标位置；③ `grep -c \"OP_CHECK_IF|ACLNN_CHECK\" <op>/op_host` 与 ① 的 N 比对——数组存在而**整个 op_host 无任何「> MAX」形态校验** ⇒ 候选。**兄弟对拍**（最强）：同族目录逐个统计「有 256 数组 / 有 MAX 校验」，只有少数接口缺校验时，缺的那批即高置信候选。实测命令与结果见 [cases/false-upper-bounds.md](../../cases/false-upper-bounds.md) 第三节。ops-nn foreach 族基线：`foreach_atan` 等有 `MAX_TENSOR_NUM=256` 校验，`foreach_expm1`、`foreach_neg` **无**。","intercept":"新增「**容量/上限线**」——对每个含 `TensorList` / 变长列表入参的接口，按 `1 / N-1 / N / N+1 / 2N`（N = 实现内部容量）扫描列表长度，断言两件事：① 超上限**必须**明确报错（161002 或等价错误码）；② 未超上限时**每个元素**的结果都与单元素调用一致（对 `foreach` 族可用 `torch._foreach_*` 逐元素对照）。**禁止只断言返回码**——本型的核心特征正是「返回 0 但尾部静默错」。同时把上述三件套静态扫描纳入 CI，新增定长数组而未加校验即告警。","evidence_text":"**ops-nn #8254**（2026-11-06，P1，可论证 P0）`aclnnForeachExpm1`：tiling 在 `foreach_expm1/op_host/arch35/foreach_expm1_tiling_arch35.cpp:79` 执行 `tiling->tensorElements[i] = numel;`，数组定义在 `foreach_expm1/op_kernel/arch35/foreach_expm1_tiling_data.h:25` 的 `int64_t tensorElements[256] = {0};`，而整份 `op_host/` 中**不存在任何 `256` / `MAX_TENSOR` 字样的校验**（`grep -rn \"256\\|MAX_TENSOR\" foreach_expm1/op_host/` 零命中）。实测后果三条：n=257 时 `rc=0` 但 `sync=507035` + kernel fault；n=258/300/512 分别有 2/86/510 处静默错误；910C 独立复现为**静默不写**（跨平台表现不同，但都不是报错）。host 侧结构体越界写约 2048 字节。**对照组**：同族 `foreach_atan/op_host/arch35/foreach_atan_tiling.cpp:32` 定义 `constexpr int32_t MAX_TENSOR_NUM = 256;` 并在 `:74` 有 `OP_CHECK_IF(tensorNum > MAX_TENSOR_NUM, OP_LOGE(context, \"tensorNum should be less than or equal to 256\"), return ge::GRAPH_FAILED);`——**同族已有护栏而本算子没有**，是本型最干净的判据形态。**族内交叉核对（2026-11-06，`ops-nn` @ `b27fda2`）**：`foreach/` 下**有 `tensorElements[256]` 的接口共 19 个**，逐个比对 `op_host` 是否含 `MAX_TENSOR_NUM` 校验 ⇒ **18 个有、仅 `foreach_expm1` 没有**（含 `foreach_neg`，它在 `op_host/arch35/foreach_neg_tiling.cpp:32` 定义 `MAX_TENSOR_NUM_FOREACH_NEG`、`:60` 拦截）。**这是一次自我更正**：本轮早期基于 `9.3.0-beta.1` 快照曾把 `foreach_neg` 列为同型新候选，在正式检出 `b27fda2` 上复核后**该结论不成立**（快照间已修）——`not-found ≠ 没有`，跨快照下结论前必须回到正式检出重核（同库 K1358 的教训）。","related_text":"[FP-B11](FP-B11.md)（**相邻但不同**：B11 是单个参数的合法性（rank/长度/值域/有限性），本条是**容器容量与入参上界之间缺约束**；两者常共现，修复可一并落）、[FP-B07](FP-B07.md)（B07 是下标算式算错，本条下标算式正确、容量不足）、[FP-B13](FP-B13.md)（同属「数值承载不够」，B13 是整型宽度不足，本条是数组长度不足）、[FP-G01](../FP-G/FP-G01.md)（越界后的巨大循环上界可能演变为挂死）、[FP-F03](../FP-F/FP-F03.md)（同一上限若文档也未披露，双向命中 F03-7）。"},"caseCount":0},{"id":"FP-B16","name":"出参 stride 未参与寻址（非连续 view 被按连续布局回写，前 numel 个正确其后全旧值）","file":"patterns/FP-B/FP-B16.md","cat":"compatibility","catZh":"功能/兼容","s":3,"o":3,"level":"高","score":9,"depth":"深度","status":"active","trigger":"AutoContiguous","triggerZh":"关键词","repos":["ops-nn"],"sides":["Host"],"carriers":["aclnn源码","Host源码"],"enabled":true,"evidence":["cann/ops-nn#8663(open) 7 接口同族出参非连续静默错值: RmsNorm/GemmaRmsNorm/RmsNormGrad/AddLayerNormGrad/MaskedSoftmaxWithRelPosBias/ExpandIntoJaggedPermute/TopKTopPSample, 错位倍率恰等于 stride","cann/ops-nn#8674(open) aclnnAddRmsNormCast 4 出参 y1/y2/rstd/x 全错 16/32; 4/4 声明 AutoContiguous 却不生效","cann/ops-nn#8675(open) aclnnInplaceAddRmsNorm rstd 4/8; 同调用 x1Ref 128/128 正确(内部对照)","cann/ops-nn#8677/#8679/#8680/#8681(open) aclnnForeach{Minimum,Add,Sub,Pow}ScalarList 各 out 12/24 未写","cann/ops-nn#8682(open) aclnnGroupNormSwish 3 出参全错 y 12/24; 物理前 24 与基线 24/24 相同","cann/ops-nn#8686/#8687(open) aclnnSwiGlu 16/32, aclnnSwiGluGrad 32/64","cann/ops-nn#8688/#8689(open) aclnnSituGlu 16/32, aclnnSituGluGrad 32/64","cann/ops-nn#8693(open) aclnnDequantBias y 5120/10240 未写","cann/ops-nn#8698(open) aclnnDynamicBlockQuant y 64/128 + scale 8/16","cann/ops-nn#8699(open) aclnnSwiGluQuant out 24/48 + scaleOut 1/3","cann/ops-nn#8701(open) aclnnDequantSwigluQuant yOut 64/128 + scaleOut 4/8; 资料 9 参数非连续列全填 x","cann/ops-nn#8702(open) aclnnCrossEntropyLoss logProbOut 20/40; 资料 4 出参该列全为 - 未标注","cann/ops-nn#8704(open) aclnnDeepNormGrad 4 出参 dx/dgx/dbeta/dgamma 全错各一半未写; 物理前 32 与基线 32/32","cann/ops-nn#8706(open) aclnnGroupNormSwishGrad 3 出参全错 dx 128/256; 物理 256/256","阴性对照: aclnnScatterList list 出参 2/2 声明 AutoContiguous 实测 60/60 正确(有声明不等于必失效)","相邻形态单列: cann/ops-nn#8691(open) aclnnClippedSwiglu 为基线缺陷(出参全连续、官方示例原样 out[1] 整行未写 16/32), 不属 stride 问题","规模口径: 2026-11-12 实测 ACLNNTYPE aclnn 族 69 接口, 本条命中 25(36%); aclnn_exclude 族抽样 15 全部正常","A2-910B3 CANN 9.2.0 与 A3 CANN 9.3.0 双版本逐位一致；判据 max_offset < numel(storage) 且连续基线哨兵为 0"],"tocEvidence":"19 issue / 25 接口（ops-nn ACLNNTYPE aclnn 族实测）","signatures":[],"keywords":["AutoContiguous|ViewCopy|GetStrides","非连续|non-contiguous|storageShape","出参 stride|output stride","哨兵预填|canary|未写残留","ACLNNTYPE\\s+aclnn\\b","aclCreateTensor\\([^;]{0,200}strides"],"absence":[],"broad":[],"logSig":[],"symptoms":["恰好一半(或 1/stride比)出参元素为预填值","物理 dump 前 numel 个正确、其后全旧值","返回 0/0 无任何告警且跨版本逐位一致","同算子 in-out 出参非连续时却完全正确"],"detectors":["出参传带空洞 stride 的合法 view(先自检 max_offset < numel(storage))","出参预填哨兵并统计残留数量与位置分布","物理内存 dump 前 numel 个 vs 连续基线逐元素对拍","连续基线哨兵必须为 0(排除构造错与模式性不输出)"],"related":["FP-B12","FP-A22","FP-B07","FP-B05","FP-B11","FP-B04","FP-E01","FP-A05"],"subtypes":[{"id":"B16-1","name":"该算对却没算对（资料非连续列标 √ / 填 x 跟随输入 / 填 - 未标注，实现既不算对也不拒绝）","evidence":"ops-nn#8663(7接口) #8682 #8687 #8689 #8701 #8702 #8706"},{"id":"B16-2","name":"该拒绝却未拒绝（资料标 ×，首段应返回 161002 却返回 0 并产出错值）","evidence":"ops-nn#8686 #8687 #8688 #8689 #8693 #8698 #8699 #8704"},{"id":"B16-3","name":"出参声明了 AutoContiguous 却不生效（op_host/*_def.cpp 的声明未落到回写路径）","evidence":"ops-nn#8674 4/4 #8675 6/6 #8677~#8681 1/1；反例 ScatterList 2/2 声明且实测正确"}],"waiver":"","detect":{"axes":["shape","content"],"oracle":["golden-canary"],"signal":"canary","lines":["memory","valid-fuzz"],"min_cases":4,"constructor":"出参传带空洞 stride 的合法 view（view=[B,H]、stride={H*2,2}、storage=[B,H*2]；或中间维空洞 stride={64,8,2}、storage=[8,8,8]），先断言 max_offset = Σ(shape[i]-1)*stride[i] < numel(storage) 才算合法；出参 buffer 预填哨兵（FLOAT -777000 / FP16 0xFBFF / INT8 -128）；同时跑一条出参全连续的基线。一次只改一个出参的 stride，多出参同改无法定位失效路径。","judge":"连续基线的哨兵必须为 0——非 0 说明构造错，或该出参在当前 attr/mode 下本就不输出（如 quantMode=\"static\" 的 scaleOut、资料明示\"暂不支持\"的 zloss）；非连续用例须按 stride 读回后与基线逐元素一致才算通过。禁止只断言返回码。","kill":"若出参 stride 未参与寻址，算子会把 numel(view) 个正确结果写到 storage 基址起的连续位置；按 stride 读回时 1/stride比 的偏移落在未写区、读到哨兵；物理 dump 显示前 numel(view) 个与基线全等、其后全哨兵。","sourced":{"constructor":"测试拦截建议","judge":"测试拦截建议","kill":"源码审查映射点"},"note":"子型②（资料非连续列标 ×）的期望是「首段返回 161002」，此时 judge 改为断言返回码非 0；与 FP-B12 的区别：B12 只到「没写」这个结果面，本条须做物理 dump 才能把「没写」升级为「写错位置」。"},"detectability":{"d":2,"level":"D2","why":"签名仅覆盖子型③(声明 AutoContiguous 的出参)；子型①②须人工按「无 op_api + 出参无 stride 处理」圈候选后实测，物理 dump 判据可自动比对但需人工搭台","priority":18},"secondary":{"kind":"cross-path","why":"主判据是「出参预填哨兵 + 按 stride 读回」——它依赖**按 stride 读**这一步本身写对，一旦读回逻辑把 stride 用错（或构造时 stride 与 storage 记反），会把正确的算子判成缺陷。第二判据换成**布局差分**：同一份输入、同一份语义结果，分别用「连续出参」和「非连续出参」两条布局跑，把非连续结果按 view 语义摊平后与连续基线的逻辑顺序**逐位比对**。两者的失效机制完全分离——主判据怕构造错，本判据怕语义摊平错；且本判据**不需要知道 stride 是否被算子使用**，只看「同一批逻辑值是否出现在同一批逻辑位置」。","relations":[{"id":"B16-X1","name":"连续/非连续双布局差分","statement":"同一输入分别用连续出参与非连续出参（view/stride/storage 带空洞）各跑一次；非连续结果**按 view 索引摊平**后，必须与连续基线逐位（FP32）或按混合容差一致。两条路径的返回码都应为 0。","kill":"若算子忽略出参 stride，非连续路径会把结果连续写到 storage 基址，摊平后只有前 numel(view) 个吻合，其余是哨兵；而连续路径完全正确——同一算子两条布局给出不同逻辑结果，即为缺陷，**无需预填哨兵**也能判定。","how":"同一进程内先后跑两次（先连续后非连续），用同一份输入 buffer；摊平公式 out_logical[i] = storage[Σ idx_k * stride_k]，与基线 out_logical 逐元素比；报告「不一致元素数 / numel(view)」——恒等于 1/stride比 即本条特征。"},{"id":"B16-I1","name":"写入位置集合不变量","statement":"出参每次调用**实际被写过的物理位置**，必须恰好等于 view 覆盖的位置集合 { Σ idx_k * stride_k | 0 <= idx_k < view.shape[k] }，且该集合之外一个字节都不许变。这是与数值无关的结构性性质：不管算子算出什么值，位置集合都必须对。","kill":"忽略 stride 时，被写位置集合退化为连续区间 [0, numel(view))，与 view 覆盖集合的差集非空（典型恰为一半）——集合不等即缺陷，不依赖任何 golden 值。","how":"出参 buffer 预填哨兵 → 跑算子 → 扫描全 storage 标记「值已变化」的物理下标 → 与按 stride 生成的期望下标集合做对称差；差集为空才算通过。**这一条同时能区分 B07**：B07 会写到 view 集合之外（越界），本条只写到集合内的错误子集。"}]},"body":{"extras":[{"k":"子型","v":"① **该算对却没算对**（资料非连续列标 `√` / 填 `x` 即「跟随某输入」/ 填 `-` 未标注，实现既不算对也不拒绝）；② **该拒绝却未拒绝**（资料非连续列标 `×`，测试首段应返回 `161002` 却返回 0）；③ **声明了 `AutoContiguous` 却不生效**（`op_host/*_def.cpp` 的出参 `Output().AutoContiguous()` 未落到框架回写路径）。"},{"k":"控制变量（v6.30）","v":"**必须固定**——shape / dtype / 属性 / 数值全部不变，仅出参的 stride 与 storageShape 变化 ｜ **允许变动**——单个出参的 stride（一次只测一个出参，多出参同时改则无法定位是哪一路失效）｜ **多变量同变的典型误判**——把\"出参非连续\"和\"入参非连续\"同时改，会把入参侧的 `AutoContiguous` 生效误当成出参也生效；实测 `cross_entropy_loss` / `deep_norm_grad` 的 `AutoContiguous` **全部只作用在入参**，出参一路完全没有。"}],"meta_info":"类别 功能/兼容 ｜ 风险 高（S3×O3=9）｜ 状态 活跃 ｜ 来源 `cann/ops-nn` 2026-11-12 定向实测（19 issue / 25 接口，A2-910B3 CANN 9.2.0 与 A3 CANN 9.3.0 双版本逐位一致 + 物理内存 dump 实证）；v6.64 建条","applicability_text":"仓 ops-nn ｜ 侧别 Host ｜ 载体 aclnn源码,Host源码 ｜ 触发 AutoContiguous ｜ 默认启用 true","mechanism":"aclnn 出参张量的 **stride 从未参与寻址**。kernel 按自己的 tiling 假设出参是行主序连续布局，把**完全正确的 `view.numel()` 个结果**依次写到 `storage` 基址起的连续位置；调用方传进来的 `aclCreateTensor(..., strides, storageShape)` 里的 `strides` 与 `storageShape` 在**整个回写链路上被丢弃**（既没有 `IsContiguous()` 拦一道，也没有 ViewCopy 回写视图）。因此 `view` 与 `storage` 之间存在**任何空洞**时（`stride[i] != 连续 stride`），按 stride 读回就有一半偏移落在未写区，读到调用方预填的旧值/哨兵。**它不越界**——严格满足 `max_offset < numel(storage)`，因此 memcheck/越界检测全绿、无 aic error、无 coredump，返回码为 0；**结果也不\"差一点\"**——已写部分与连续基线**逐位相同**。这是「**值算对了，位置写错了**」，只能靠「出参预填哨兵 + 按 stride 读回对拍」暴露，任何只断言返回码或只比对连续出参的用例都会判 PASS。注意与「没算全」的区别：本条**算出的结果数量是对的**（等于 `view.numel()`），缺的是**落位**。","conditions":"出参以带空洞 stride 的 view 传入（典型：末维切片 `stride = {H*2, 2}` 而 `storage = [B, H*2]`，或中间维空洞 `stride = {64,8,2}`）；且该算子的 `ACLNNTYPE` 为 `aclnn`（**op_api 由 op def 自动生成、`op_host/op_api/` 目录不存在**），出参回写路径由框架 autogen 完成而非手写。反过来说：`ACLNNTYPE aclnn_exclude` 的算子走另一条通路，本轮抽样 15 个**全部正常**。**连续出参永远测不出来**——必须构造 `view.numel() < numel(storage)` 的合法视图。","manifest":"① **恰好一半（或 `1/stride比` 的比例）出参元素为预填值**——`y1Out` 16/32、`out` 12/24、`yOut` 64/128、`logProbOut` 20/40；② **物理 dump 显示\"前 numel 个正确、其后全旧值\"**——这是本条的**决定性判据**（如 `[8,8,4]` 出参 `stride={64,8,2}`、`storage=[8,8,8]`：物理 `[0..255]` 是 256 个完整正确结果、`[256..511]` 全是哨兵 `-777000`）；③ **返回码 `0/0`、无任何告警**，跨版本跨硬件**逐位一致**；④ **对照失效**：同一接口的 in-out 出参（如 `InplaceAddRmsNorm` 的 `x1Ref`）非连续时**完全正确 128/128**，只有常规出参（`rstd`）失效——说明缺陷局限在出参回写这一路，不是整个算子不支持非连续。","mapping":"① 先确认 `op_host/` 下**是否存在 `op_api/` 目录**——不存在即意味着出参回写完全交给 autogen，是本条的高危前提（`ACLNNTYPE aclnn` 算子大多如此）；② 查 `op_host/*_def.cpp` 的 `Output(...)` 链尾是否声明 `.AutoContiguous()`：**声明了却不生效**是本条最强的\"实现声称支持\"证据（`add_rms_norm_cast` 4/4、`inplace_add_rms_norm` 6/6、`foreach_*` 1/1、`scatter_list` 2/2 均有声明；但 `GroupNormSwish` 的 `y`/`mean` **无声明也照样失效**，故\"有声明\"是加分项而非必要条件）；③ 查是否有任何 `GetStrides` / `GetStorageShape` / `IsContiguous()` 出现在**出参**相关路径上——**只在入参出现、出参从不出现**即命中（实测 `cross_entropy_loss` 6 处 `AutoContiguous` 全在 `input`/`target`/`weight`）；④ 核对资料 `docs/aclnn*.md` 参数表里每个出参的**非连续Tensor 列**取值，据此判子型（`√`/张量名/`-` → 子型①；`×` → 子型②）；⑤ 同算子同族的其他出参是否复制了同一模式（`DeepNormGrad` 4 个出参、`GroupNormSwishGrad` 3 个出参**全部同时失效**）。","signatures_text":"**无判别性指纹**。2026-11-12 用 `scripts/sig_yield.py` 在真实 `ops-nn`（12363 文件）实测：候选正则 `\\.Output\\([^;]{0,200}\\.AutoContiguous\\(\\)` **命中 0 次**——因为真实代码里 `Output(\"x\")` 与其 `.AutoContiguous()` **跨行书写**（如 `norm/add_rms_norm_cast/op_host/add_rms_norm_cast_def.cpp:95-98`），单行正则无法表达属主关系；而放宽到单行 `AutoContiguous\\(\\)` 则全仓 **2085 次**，属超量。故本条**不设签名**，全部降级为审查关键词与人工核查命令（与 FP-A22 的处理一致）。","keywords_text":"`出参 stride|output stride|ViewCopy|AutoContiguous`；`非连续|non-contiguous|storageShape`；`哨兵预填|canary|未写残留`；`aclCreateTensor.*strides`。","intercept":"① **出参一律传带空洞 stride 的合法 view**（`stride = {H*2, 2}`、`storage = [B, H*2]`、`view = [B, H]`），并**先自检合法性**：断言 `max_offset = Σ(shape[i]-1)*stride[i] < numel(storage)`——不满足则是构造错误，不是缺陷；② **出参 buffer 预填哨兵**（FLOAT 用 `-777000`，FP16 用 `0xFBFF`，INT8 用 `-128`），跑后统计残留数量与**位置分布**：残留为连续区间（如 `[16..31]`）即\"整块未写\"，比只报总数更有诊断力；③ **必须同时跑连续基线并断言基线哨兵为 0**——基线不干净时（`quantMode=\"static\"` 下 `scaleOut` 不输出、`CrossEntropyLoss` 的 `zloss`/`lseForZloss` 资料明示\"暂不支持\"）不得据此判缺陷；④ **物理内存 dump 定根因**：直接读 `storage` 前 `numel(view)` 个元素，与连续基线的 `numel(view)` 个逻辑值逐元素比对，**全部相同即坐实\"值对位置错\"**——这一步是从\"一半没写\"升级到\"stride 未参与寻址\"的关键，仅凭残留计数无法区分\"没算\"与\"写错位置\"；⑤ **in-out 出参做内部对照**（同一次调用里测一个 in-out 出参），能排除\"整个算子不支持非连续\"。","evidence_text":"`cann/ops-nn` 19 个 issue / 25 个接口（全部 open，A2/9.2.0 与 A3/9.3.0 逐位一致）：**#8663**（7 接口同族：`RmsNorm`/`GemmaRmsNorm`/`RmsNormGrad`/`AddLayerNormGrad`/`MaskedSoftmaxWithRelPosBias`/`ExpandIntoJaggedPermute`/`TopKTopPSample`，错位倍率恰等于 stride）；**#8674** `AddRmsNormCast`（4 出参 `y1`/`y2`/`rstd`/`x` 全错，16/32；4/4 声明 `AutoContiguous` 却不生效）；**#8675** `InplaceAddRmsNorm`（`rstd` 4/8，**同调用 `x1Ref` 128/128 正确**）；**#8677/#8679/#8680/#8681** `Foreach{Minimum,Add,Sub,Pow}ScalarList`（各 12/24）；**#8682** `GroupNormSwish`（3 出参全错，`y` 12/24，物理前 24 与基线 **24/24 相同**）；**#8686/#8687** `SwiGlu`/`SwiGluGrad`（16/32、32/64）；**#8688/#8689** `SituGlu`/`SituGluGrad`（16/32、32/64）；**#8693** `DequantBias`（`y` 5120/10240）；**#8698** `DynamicBlockQuant`（`y` 64/128 + `scale` 8/16）；**#8699** `SwiGluQuant`（`out` 24/48 + `scaleOut` 1/3）；**#8701** `DequantSwigluQuant`（`yOut` 64/128 + `scaleOut` 4/8，资料 9 参数非连续列全填 `x`）；**#8702** `CrossEntropyLoss`（`logProbOut` 20/40，资料 4 出参该列全为 `-` 未标注）；**#8704** `DeepNormGrad`（**4 出参全错**，物理前 32 与基线 32/32）；**#8706** `GroupNormSwishGrad`（**3 出参全错**，`dx` 128/256、物理 256/256）。**同批相邻形态单列**：**#8691** `ClippedSwiglu` 为**基线缺陷**（出参全连续、官方示例原样即复现 `out[1]` 整行未写 16/32），指向 kernel 第 0 维偏移未参与寻址，**不属 stride 问题**，勿混入本条。**阴性对照**：`ScatterList`（list 出参 2/2 声明 `AutoContiguous`，实测 60/60 完全正确）——证明\"有声明\"不等于\"必失效\"，落候选后仍须实测。**规模口径**：2026-11-12 实测 `ACLNNTYPE aclnn` 族 69 个接口，本条命中 25 个（36%）；`aclnn_exclude` 族抽样 15 个**全部正常**。","related_text":"[FP-B12](FP-B12.md)（B12-2 是\"返回 SUCCESS 但输出未写全\"的**结果面**；本条给出其中一类**确定的根因**——出参 stride 未参与寻址。若 dump 出\"前 numel 个正确其后全旧值\"则归本条，勿在 B12 重复定级）、[FP-A22](../FP-A/FP-A22.md)（A22 子型③\"分派后输出覆盖不全\"是 **dtype 派发表错**，换个 dtype 即变；本条**与 dtype 无关**，只随出参 stride 变化）、[FP-B07](FP-B07.md)（B07 是**偏移算式算错致越界**，有 aic error / memcheck 告警；本条 `max_offset < numel(storage)`，**从不越界**，两者靠\"memcheck 是否干净 + 是否有报错\"即可一刀分开）、[FP-B05](FP-B05.md)（B05 只管**入参**校验且限定 `op_api/*.cpp`；本条的 19 个算子**全都没有 `op_api` 目录**）、[FP-B11](FP-B11.md)（子型②\"该拒未拒\"与 B11 的契约校验缺失同面，但 B11 的对象是 shape/rank/attr **取值**，本条的对象是 **stride 布局**）、[FP-B04](FP-B04.md)（B04 收录的 `CheckDisContinuousStride` 是**该检查自身缺 `return`**，方向相反：本条是**根本没有这道检查**）、[FP-E01](../FP-E/FP-E01.md)（只断言返回码 / 只测连续出参的 UT 会把本条长期判 PASS）、[FP-A05](../FP-A/FP-A05.md)（出参残留旧值在端到端表现为\"精度异常/脏数据\"，须防止被误归因为数值精度问题）。"},"caseCount":5},{"id":"FP-C01","name":"算子端到端耗时占比高且单次调用耗时高（含 host 侧循环上界写错致重复调度子型）","file":"patterns/FP-C/FP-C01.md","cat":"performance","catZh":"性能","s":2,"o":3,"level":"高","score":6,"depth":"深度","status":"active","trigger":"loopTimes|tileNum|foreach|for\\(","triggerZh":"签名","repos":["All"],"sides":["All"],"carriers":["Tiling源码","Kernel源码","构建配置与日志"],"enabled":true,"evidence":["ops-nn#5277(smallkernel 模板 fix_m 冗余致性能问题)","ops-nn#3988(16in32out mm 接口性能劣化严重)","ops-nn#3151(QBMM pertile LocalTensor 初始化致劣化)","ops-nn#2231/#1197/#4960(dynamic_mx_quant/DequantSwigluQuant 950/mm hf32 性能劣化)","ops-transformer#2402(950 DispatchV2 性能问题)","ops-math#1228(AICPU RealDiv complex 性能差)","团队笔记①(catlass tests/optest/kernels/83_ascend950_hstu_infer/CMakeLists.txt: foreach(_SRC ${_HSTU_950_SOURCES}) 循环体内已不引用 _SRC 且 _SRC_NAME 定义后未使用, 外层循环退化为把同一批 compile definitions/include dirs 重复设置 N 次 x2, 属未完成重构遗留 - 构建期冗余, 见内部 PR 检视记录（2026-09-11）)","团队笔记②(ops-nn/activation/swi_glu/op_host/swi_glu_tiling.cpp:367 命中 F5/无退出条件循环, 待人工确认是否空转, 同构锚 #5032 AdjustCVTiling 死循环 - 见 内部同类问题追溯记录（2026-09-07）)"],"tocEvidence":"多 issue（3 仓）+ 2 团队笔记","signatures":["for\\s*\\([^;]{0,60}(tileNum|loopTimes|usedCoreNum)[^;]{0,60}(<=|<)","foreach\\s*\\([^)]{0,60}\\)\\s*\\{[^}]{0,200}\\}","GetShapeSize\\(\\)\\s*[<>]=?\\s*[A-Za-z_]"],"keywords":["冗余初始化/冗余指令","重复搬运未合并","可合并循环未合并"],"absence":[],"broad":[],"logSig":[],"symptoms":["端到端性能瓶颈","耗时变长但精度全对","跨版本耗时回归","耗时呈非整数倍台阶","相比基线劣化 >5%","性能劣化度超预期","新版本反而慢"],"detectors":["profiler kernel_details 聚合","跨版本耗时比值 >1.15 看护","版本 × 耗时趋势表 + 二分 commit 定位","基线四要素（shape/dtype/芯片/编译选项）可比性校验"],"related":["FP-C02","FP-C05","FP-C06","FP-A07","FP-F01","FP-E02"],"subtypes":[{"id":"C01-1","name":"实现层冗余（kernel 模板内冗余初始化/冗余指令/未合并搬运）","evidence":"ops-nn#5277/#3988/#3151/#2231/#1197/#4960 等"},{"id":"C01-2","name":"调度层膨胀（host 循环上界或派发条件算错致多下发/空转）","evidence":"catlass HSTU-950 CMakeLists foreach 循环变量被摘除（O1，无 issue 实证）"},{"id":"C01-3","name":"变更引入的版本基线回归（相对自身基线劣化，非维度对比）","evidence":"测试集失败语料 88 条（2026-09-19，编号待核）；O1 不升档"}],"waiver":"","detect":{"axes":["perf","shape"],"oracle":["perf-baseline"],"signal":"perf","lines":["none"],"min_cases":2,"constructor":"profiler kernel_details 聚合；跨版本耗时比值 >1.15 看护；先校验基线四要素（shape/dtype/芯片/编译选项）可比性。","judge":"跨版本耗时比值 ≤1.15；无整数倍台阶式劣化。","kill":"若 host 循环上界或派发条件算错致重复调度，则耗时呈非整数倍台阶而精度全对。","sourced":{"constructor":"测试拦截建议+detectors","judge":"detectors","kill":"子型划分"}},"detectability":{"d":3,"level":"D3","why":"M03 循环上界：0/10（需知理论迭代次数）","priority":18},"secondary":{"kind":"invariant","why":"性能问题的静态判据只能看代码形态，量化劣化必须靠基线差分；且需排除「重复调度」这类结构性浪费。","relations":[{"id":"C01-S1","name":"下发次数守恒","statement":"单次调用对应的 kernel 下发次数必须有上界，且与理论值一致（不得因循环上界写错而重复调度）。","kill":"host 侧循环上界写错会导致同一 kernel 被下发 N 倍，耗时线性放大但单次耗时正常。","how":"profiler 统计 kernel 下发次数，与理论值比对。"},{"id":"C01-X1","name":"形状缩放律","statement":"耗时随规模缩放应符合声明的复杂度（线性/平方），偏离即异常。","kill":"实现层冗余或调度膨胀会破坏缩放律。","how":"取 4 档规模，拟合耗时-规模曲线，检查指数。"}]},"body":{"extras":[],"meta_info":"类别 性能 ｜ 风险 高（S2×O3=6，2026-10-02 复评：子型① 8 条独立 issue 实证（3 仓），O2→O3）｜ 状态 活跃 ｜ 来源 团队笔记（+ 测试集失败语料 2026-09-19 增补子型 ③）","applicability_text":"仓 All ｜ 侧别 All ｜ 载体 Tiling源码,Kernel源码,构建配置与日志 ｜ 触发 loopTimes|tileNum|foreach|for\\( ｜ 默认启用 true","mechanism":"存在冗余计算、重复搬运、可合并的循环/分支未合并。**两条独立子路径（2026-09-16 增补子型 ②）**：① **实现层冗余**——kernel 模板内冗余初始化/冗余指令/未合并搬运；② **调度层膨胀**——host 侧（tiling / infershape / aclnn / 工程构建脚本）循环上界或派发条件计算错误，致**下发迭代次数、blockDim、tileNum、核间屏障或重复配置次数多于实需**，kernel 被重复调用或空转，而**单次计算逻辑完全正确**（与 FP-A07 的区别：A07 走错分支致结果错，本条结果对、只是白干）。**③ 变更引入的版本基线回归（v2.16 增补）**——绝对耗时未超标、结构上也未必是\"冗余\"，但**某次变更把原本合格的表现推坏**：新增冗余计算或同步、tiling/分核阈值漂移使原最优点被跨过、dtype 或派发路径变化、模板实例化规模放大、新增确定性/原子约束。**判据是「与自身上一版本或基线对比出现劣化」，而非与其它维度（dtype / 板型 / 代际）对比**——这是与子型 ①②（结构性冗余）及 C02~C06（维度对比型）的本质区别，后者的绝对值可能一直\"合格\"，只有基线对比才暴露。","conditions":"网络中高频调用路径上的算子；**子型 ②** 额外需同时满足：该循环上界处于「小 shape 不显、大 shape 放大」的区间（如 `n` 与 `n±1` 在小 n 下耗时差不可测），且该算子位于端到端热点路径（劣化被放大才可观测）；构建期子型需为增量构建或模板规模大的仓（重复配置开销随模板/源文件数线性放大）。**子型 ③** 额外需满足：存在**可比基线**（同一 shape / dtype / 芯片 / 编译选项四要素一致），且劣化由**一次变更**划界（可用二分 commit 定位首次劣化点）。","manifest":"端到端性能瓶颈。**子型 ②**：**精度全对、功能全对、无报错、无 coredump，仅耗时变长**——这正是其长期漏检的根本原因；表现为同 shape 跨版本耗时回归（新版本反而慢）、或耗时随 shape 阶跃处出现「非整数倍」异常台阶（如 `n` 翻倍但耗时不翻倍，说明多出的迭代命中了空转/重复路径）。**子型 ③**：同一 shape 跨版本耗时比值劣化（常见阈值 5%~15%），而**精度 / 功能 / 报错全部正常**；劣化随 shape 放大或呈阶跃；**单看新版本的绝对值可能仍落在\"合格\"区间**，只有与基线对比才暴露——这与子型 ② 的\"非整数倍台阶\"可区分（后者台阶出现在 shape 轴，前者出现在版本轴）。","mapping":"冗余计算、重复搬运、可合并的循环/分支。**子型 ② 增补映射点**：① host 侧 `for` 上界表达式与 `GetShapeSize()` / `CeilDiv(...)` / `blockDim` 三者的**乘积自洽性**（审查 `<=` vs `<`、`+1` 与 `-1`、上界是否用错变量或未做 `min()` 截断）；② tiling 中 `tileNum`、`usedCoreNum`、`loopTimes` 的推导是否可能大于「形状所需最小迭代数」；③ 核间循环（核数 × 单核循环）的**双重计数**——分核数已按 shape 缩小后，单核循环仍按全量上界执行；④ `foreach`/`for` 循环体内是否**未使用**循环变量（循环退化为「同一批配置重复设置 N 次」，见实证 ③）；⑤ 变更 diff 中 host 侧循环边界与 kernel 侧 `loopTimes` 消费点是否**成对更新**（只改一侧必错）。**子型 ③ 增补映射点**：⑥ 变更 diff 中是否**新增**了循环 / 同步 / 类型转换 / 边界判断（尤其本可省略的 `Cast`、`SyncAll`、逐元素回退）；⑦ tiling 阈值常量（如分核阈值、`2048`/`4096` 类魔数）是否被改动，使原最优点被跨过；⑧ 是否把向量化 / 合并搬运改成分步执行或用更窄的 dtype 承载累加；⑨ 模板实例化数量是否随改动放大（可用编译产物 size / 编译耗时做旁证）；⑩ 是否新增确定性或原子操作约束（与 FP-C05 交叠，需与此前版本对照确认是\"新引入\"还是\"一直如此\"）。","intercept":"① **同 shape 跨版本 / 跨分支耗时比值看护（比值 >1.15 告警）—— 对子型 ①②③ 一律适用**：本卡各类缺陷都可能只表现为版本间回归、而不表现为绝对值超标（这是子型 ③ 的**唯一**暴露途径）；profiler 基线看护（算子级耗时占比阈值告警）保留为兜底。**子型 ② 增补拦截**：② 对 host 侧循环边界改动，构造「**上界 ±1 两侧**」的 shape 探针对（如阈值 2048 取 2047/2048/2049），断言两侧耗时不出现阶跃；③ 回归用例必须包含「精度 pass + 耗时对比」双判据——只跑精度永远拦不住本条；④ 该缺陷类型**静态扫描与 UT 均无法覆盖**（`for(i=0;i<n;i++)` 与 `for(i=0;i<n+1;i++)` 语法同为合法），只能靠性能基线差分，**不可依赖代码审查兜底**。**子型 ③ 增补拦截**：⑤ **变更级性能看护**——每次合入的候选版本与上一基线做同 shape 对拍，比值劣化超阈值即**阻断合入**（把回归拦在合入点，而非等端到端回归才发现）；⑥ 对已知热点算子维护「版本 × 耗时」趋势表，劣化后先用**二分 commit** 定位首次劣化点（比回归发生后再查的成本低一个数量级）；⑦ 基线必须记录 **shape / dtype / 芯片 / 编译选项**四要素，缺一项即不可比（否则会把环境差异误判成性能回归）。","evidence_text":"ops-nn #5277 smallkernel 模板 `fix_m` 冗余导致性能问题；#3988 16in32out 场景 mm 接口性能劣化严重；#3151 QBMM pertile `LocalTensor` 初始化导致的性能劣化；#2231 dynamic_mx_quant 原场景性能劣化；#1197 DequantSwigluQuant 在 950 上部分 case 性能劣化；#4960 mm 的 hf32 场景性能劣化；ops-transformer #2402 950 Dispatch PU 标杆比较，失败率 100% 属口径分歧；② **阈值紧贴 1 ulp 理论下界**——single_bm 阈值（fp16 1.125×2⁻¹¹、bf16 1.015625×2⁻⁸）落在 1 ulp 相对误差带内，任何孤立 1 ulp 舍入翻转几乎必然判 FAIL；③ **相对误差判据缺绝对误差地板**——近零/相消输出点上累加顺序差被放大 60 倍以上，golden==native 时容差为 0，任何 NPU 实现结构性不可通过；④ **双标杆比例分母退化**——基准侧误差恰为 0 时比例分母取固定下限 2⁻¹⁴，RMS 判据退化为与数值量纲无关的绝对误差要求，极端值域下必然失败；⑤ **中间计算精度口径未声明**——文档公式不规定乘加中间精度，「fp32 中间累加+出口单次舍入」与「逐步落回窄类型」两条合法路径的系统性 1 ULP 分歧无裁定依据，同机制在 fp16/fp32 上低于阈值而漏报、仅在 bf16 上超阈而误报。","conditions":"ATK/TTK 批量精度测试；含 cubeMathType 降精度属性、近零相消输出、极端值域（±1e30）、窄类型（bf16）多步累加的算子；阈值按「1 ulp × 1.125」类口径设定。","manifest":"同 shape 同 dtype 换 cubeMathType 即大面积翻转 PASS/FAIL；失败误差恒为 1 ulp 量级且无放大；rmse 比值远大于 mare/mere 比值（分母塌陷指纹）；失败与 NPU 实现质量无关（换任何合法实现都 FAIL）。","mapping":"判据分母（native/golden 误差为 0 时的退化路径）与绝对误差地板；阈值与 1 ulp 带的相对位置；降精度模式与标杆精度是否同侧；文档是否声明中间计算精度口径。","intercept":"判据增加与量纲无关性解耦的绝对误差地板（近零兜底不得复用 golden 自身误差为分母）；降精度模式用同精度标杆或按口径豁免；阈值设定对 1 ulp 翻转留裕度（≥1 ulp 上界而非带内）；文档显式声明中间精度口径后再定判据；建立「rmse/mare 比值失衡 = 判据缺陷指纹」的自动识别。","evidence_text":"cann-bench #59（closed）MERE/MARE 近零相消结构性不可通过——golden（CPU fp32）与候选（NPU fp32）对 fp64 真值误差同量级（3.99e-5 vs 5.14e-5），仅因 golden 近零点相对误差放大 60 倍判 FAIL，且 golden==native 时容差为 0 无地板；ops-nn #5657 AdaptiveAvgPool3d fp32 ±1e30 用例基准侧误差为 0 时比例分母退化至 2⁻¹⁴，1 ulp（7.56e22）必然超阈，同族通过/失败的分界是基准误差是否为 0 而非 NPU 误差幅度；ops-nn #5692 AvgPool2d 阈值恰落 1 ulp 带内（fp16 约 78%、bf16 约 97% 取值位置必然超阈），65/88 例失败均为 1 ulp 翻转；ops-nn #5694 Baddbmm 降精度模式与全精度标杆误比 257/1000（cmt=2 100% FAIL；同 shape bf16 对照 cmt=0 与标杆逐位一致而 cmt=1/2 23/28 超阈）；ops-nn #5675 AvgPool2dBackward 文档声明 A2 HF32 实际 fp16 分支因前置 cast 不可达（实现与声明不符同框暴露）；ops-transformer #5071 MoeTokenUnpermuteWithEp「fp32 累加+单次舍入」vs 参考逐步落 bf16 系统性 1 ULP，bf16 用例 72.6% FAIL 而 fp16/fp32 同机制漏报（1 ULP 低于阈值）；ops-transformer #5045 MoeFinalizeRouting bf16 中间精度口径文档未声明，299/331（90.3%）FAIL 且 K=1 无累加项也失败。","related_text":"[FP-E01](FP-E01.md)（golden 本身错 vs 判据设计错，常叠加）、[FP-A20](../FP-A/FP-A20.md)（确定性等级描述不足属同一「口径未声明」家族的确定性面）、[FP-A02](../FP-A/FP-A02.md)（累加顺序差是本型误报的物理来源）、[FP-B01](../FP-B/FP-B01.md)（声明面与实现面不符在精度口径上的呈现）。"},"caseCount":0},{"id":"FP-F01","name":
